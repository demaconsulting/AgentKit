---
# Software System Requirements for AgentKit Core
#
# These requirements describe the externally visible behavior of the library
# from the perspective of its consumers, without specifying implementation details.

sections:
  - title: AgentKitCore Requirements
    requirements:
      - id: AgentKitCore-PathContainment-NormalizedLocation
        title: >-
          The library shall judge path access by the normalized absolute location of the requested
          path, making a relative path absolute against the working directory and collapsing
          relative segments before deciding containment.
        tags: [system, security]
        justification: |
          A path carrying parent segments can name a location outside a permitted one while still
          reading as contained, so the decision must be made on the normalized location rather
          than on the requested string. A relative path is made absolute against the working
          directory first, so that the same normalization and the same containment decision apply
          whether the agent wrote a bare file name or a fully qualified one. Containment is a
          decision about paths only: a symbolic link, junction or mount is neither followed nor
          detected, so a path that leaves a permitted location through one is judged as it is
          spelled.
        children:
          - AgentKitCore-RealPathResolver-Normalization
          - AgentKitCore-RealPathResolver-NonExistentPath
          - AgentKitCore-RealPathResolver-RejectInvalidPath
          - AgentKitCore-PathRule-RootNormalizedAtConstruction
          - AgentKitCore-PathPolicy-DenyEscapedPath
          - AgentKitCore-PathPolicy-RealPathReported
          - AgentKitCore-PathPolicy-RelativePathAgainstWorkingDirectory
        tests:
          - AgentKitCore_SystemPathContainment_RelativeEscape_IsDenied

      - id: AgentKitCore-PathAccess-WorkspaceBase
        title: >-
          The library shall interpret a relative path a model supplies against a single working
          directory the host configures, rather than against the location the host process happens
          to be running from, and shall keep that working directory orthogonal to the locations it
          grants.
        tags: [system]
        justification: |
          A model states the paths a person states: it asks for a file by name, not by absolute
          location. Measuring that name from the process working directory refuses every
          legitimate request while presenting, from the outside, as a containment decision — an
          agent observed nine consecutive refusals of an existing file before abandoning its
          task. Addressing and permission are separate ideas: the working directory says where a
          bare name resolves, and a grant says where the agent may go, so the working directory
          may be granted, granted read-only, or granted nothing, and a tool reports a result in
          the dialect of the request that produced it.
        children:
          - AgentKitCore-PathPolicy-RelativePathAgainstWorkingDirectory
          - AgentKitCore-PathPolicy-OrthogonalWorkingDirectory
          - AgentKitCore-PathPolicy-OmittedPathMeansWorkingDirectory
          - AgentKitCore-PathPolicy-LastSegmentAlias
          - AgentKitCore-PathPolicy-AliasIsFallback
          - AgentKitCore-PathPolicy-DialectMirroring
          - AgentKitCore-PathPolicy-DiscoveryLocations
        tests:
          - AgentKitCore_SystemPathPolicy_RelativePathFromModel_ResolvesAgainstWorkingDirectory

      - id: AgentKitCore-PathContainment-EnumerationFiltered
        title: >-
          The library shall apply the same containment decision to directory enumeration as to
          direct path access, so a file whose location a read would refuse is never listed.
        tags: [system, security]
        justification: |
          Recursive directory enumeration provided by the operating system surfaces every file
          beneath a directory. A listing that advertises a file the policy would refuse discloses
          its existence and invites the agent to request it, so enumeration must reach the same
          conclusion as direct access rather than applying a weaker check of its own.
        children:
          - AgentKitCore-PathPolicy-EnumerationFiltered
        tests:
          - AgentKitCore_SystemPathContainment_Enumeration_ListsOnlyPermittedFiles

      - id: AgentKitCore-PathAccess-IndependentReadWrite
        title: >-
          The library shall permit read access and write access to be expressed independently as
          grants, each either unrestricted or confined to a location, each carrying an access
          level that is permission only, and each with its own denied patterns.
        tags: [system]
        justification: |
          A development assistant is commonly expected to read widely across a machine while
          writing only into one working directory. Expressing this as grants — a read-only grant
          over one location and a read-write grant over another — keeps the access level as
          permission only, orthogonal to addressing, so a read is permitted by any grant and a
          write only by a read-write one. Collapsing read and write into a single setting would
          force operators to choose between an assistant that cannot see enough context and one
          that can modify more than intended.
        children:
          - AgentKitCore-PathRule-AccessLevel
          - AgentKitCore-PathRule-Unrestricted
          - AgentKitCore-PathRule-Rooted
          - AgentKitCore-PathRule-DenyPatterns
          - AgentKitCore-PathRule-RejectInvalidRule
          - AgentKitCore-PathPolicy-GrantPermissionModel
        tests:
          - AgentKitCore_SystemPathPolicy_ReadWideWriteNarrow_AllowsReadDeniesWrite

      - id: AgentKitCore-PathAccess-DenialNotException
        title: >-
          The library shall report a refused path access as a returned denial rather than by
          throwing an exception.
        tags: [system]
        justification: |
          An exception raised while a model is calling a tool ends the agent's turn and strands
          it with no way to continue. A returned denial lets the model read the reason and choose
          a permitted path instead, which turns a refusal into a recoverable step rather than a
          failed session.
        children:
          - AgentKitCore-PathPolicy-DenialResult
          - AgentKitCore-PathPolicy-UnresolvablePathDenied
        tests:
          - AgentKitCore_SystemPathPolicy_DeniedPath_ReturnsDenialWithoutThrowing

      - id: AgentKitCore-PathAccess-DenialDisclosure
        title: >-
          The library shall state in a denial the request it received, the location it interpreted
          a relative request as, and the permitted locations with their access levels, so a
          confined model learns where it may work instead of guessing.
        tags: [system]
        justification: |
          A denial that only refuses is useless to the agent receiving it: told nothing but "no",
          a model re-submits variations of the same path until it abandons the task. The earlier
          rule that redacted host locations from a denial is deliberately dropped, because telling
          a confined model the truthful map of where it may work is worth more than concealing
          paths it is already confined to. A denial therefore echoes the request, states the
          interpretation when and only when a relative request was interpreted so a silent
          wrong-target cannot pass unnoticed, and enumerates the permitted locations with their
          levels. Each grant contributes its own description to that enumeration. A denial states
          facts and prescribes no remedy.
        children:
          - AgentKitCore-PathPolicy-DenialDisclosesAndEnumerates
          - AgentKitCore-PathRule-Describe
        tests:
          - AgentKitCore_SystemPathPolicy_DenialMessage_DisclosesPermittedLocations
          - AgentKitCore_SystemPathPolicy_DenialMessage_StatesHowToRecover

      - id: AgentKitCore-PathAccess-GuardedConstruction
        title: >-
          The library shall not permit a path access policy to exist without a working directory,
          and shall reject a null grant collection or a null grant within it.
        tags: [system, security]
        justification: |
          A policy that could be created without a working directory would fall back to a
          process-global value any code can change and every agent shares, silently anchoring
          relative paths where no caller asked. Requiring the working directory at creation, and
          rejecting a malformed grant set, makes an incoherent policy unrepresentable. An empty
          grant set is not incoherent — it is a fully-confined policy that permits nothing.
        children:
          - AgentKitCore-PathPolicy-WorkingDirectoryRequired
          - AgentKitCore-PathPolicy-GrantsValidated
        tests:
          - AgentKitCore_SystemPathPolicy_ConstructionWithoutWorkingDirectory_IsRejected

      - id: AgentKitCore-ToolLimits-BudgetCeilings
        title: >-
          The library shall define ceilings on the bytes a tool may read, the characters a tool
          result may return to the model, the bytes of binary content a tool may return, and how
          deep a chain of delegated agents may run, and shall carry those ceilings with the access
          policy so that every tool observes the same budget.
        tags: [system]
        justification: |
          A tool that returns an unbounded amount of text exhausts the model's context window in
          the middle of a task, and the failure presents as the agent forgetting its instructions
          rather than as an error anyone can see. An agent that delegates without bound spends the
          host's money and time the same way, and just as invisibly. Carrying every ceiling with
          the access policy means every pack a host attaches observes one budget rather than each
          inventing its own.
        children:
          - AgentKitCore-ToolLimits-Defaults
          - AgentKitCore-ToolLimits-Customization
          - AgentKitCore-ToolLimits-RejectNegative
          - AgentKitCore-ToolLimits-DelegationDepth
          - AgentKitCore-PathPolicy-CarriesLimits
        tests:
          - AgentKitCore_SystemToolLimits_PolicyCarriesDefaultLimits_ExposesPublishedValues

      - id: AgentKitCore-ToolResult-ContentPreserved
        title: >-
          The library shall deliver text, binary content, and a caption accompanied by an image
          to the runtime in the form the tool produced them, and shall deliver any other tool
          result as serialized JSON.
        tags: [system, security]
        justification: |
          Without this, a returned image is flattened to a data URI string, the provider never
          recognizes it as an image, and the model states that it can see the image and then
          fabricates a description of it. The failure is silent and the output is confidently
          wrong, which is worse than an error a caller could detect and handle. Preserving
          everything indiscriminately is not the remedy: a tool returning ordinary structured
          data was then handed to the provider as a raw object it reported back by its
          compiler-generated type name and could not read. Only the shapes a provider recognizes
          are preserved; everything else is serialized as it would have been.
        children:
          - AgentKitCore-ToolResult-Text
          - AgentKitCore-ToolResult-Binary
          - AgentKitCore-ToolResult-Image
          - AgentKitCore-ToolResult-Structured
          - AgentKitCore-GuardedToolFactory-SelectiveMarshalling
        tests:
          - AgentKitCore_SystemGuardedTool_ImageResult_ReachesRuntimeAsContent

      - id: AgentKitCore-ImageDelivery-ProviderIndependent
        title: >-
          The library shall be able to deliver an image a tool returned to a provider whose tool
          response channel does not carry images, by placing that image on a user message in the
          conversation.
        tags: [system]
        justification: |
          Providers differ in where they accept images, and the difference is silent. One
          delivers an image from a tool result to the model; another preserves the same content
          through the framework and discards it at the wire because its interface accepts images
          on messages but not in tool responses — after which the model describes an image it
          never received. A control exchange placing the same bytes on a user message was
          described correctly by the same model, so the limitation is one of channel rather than
          capability. A host must therefore be able to make image delivery independent of which
          provider it chose.
        children:
          - AgentKitCore-ImagePromotingChatClient-PromoteImages
          - AgentKitCore-ImagePromotingChatClient-AnnouncesAttachment
          - AgentKitCore-ImagePromotingChatClient-TextResultUnchanged
          - AgentKitCore-ImagePromotingChatClient-MessageOrderPreserved
          - AgentKitCore-ImagePromotingChatClient-StreamingAndNonStreaming
          - AgentKitCore-ImagePromotingChatClient-RequiresInnerClient
        tests:
          - AgentKitCore_SystemImagePromotion_ToolImageResult_ReachesTheProviderOnAUserMessage

      - id: AgentKitCore-ToolResult-RefusalIsAResult
        title: >-
          The library shall express a refused tool operation as a returned tool result that names
          the reason and, where another tool is more appropriate, directs the model to it, and
          shall add no host detail of its own to that result.
        tags: [system]
        justification: |
          An exception raised at a tool call ends the agent's turn; a returned refusal lets the
          model read the reason and choose a permitted alternative. The redirect exists because an
          agent told only "no" will retry the same tool, while an agent told which tool to use
          instead makes progress. Refusal text reaches a transcript that leaves the process, so
          the library contributes nothing to it beyond a fixed reason and the caller's own words.
        children:
          - AgentKitCore-ToolResult-Denied
          - AgentKitCore-ToolResult-DenialRedirect
          - AgentKitCore-ToolResult-DenialReasonRequired
          - AgentKitCore-ToolResult-DenialComposedOnlyOfSuppliedText
        tests:
          - AgentKitCore_SystemGuardedTool_DeniedPath_ReturnsDenialResultNotException

      - id: AgentKitCore-ToolNaming-FamilyPrefix
        title: >-
          The library shall require every tool name to carry a family prefix separated from the
          remainder by an underscore, and shall reject a name that would collide with the bare
          file access tool names published by the Agent Framework.
        tags: [system]
        justification: |
          The Agent Framework's own file access provider registers the bare names "read", "write"
          and "delete". An application combining both libraries would present the model with two
          tools of the same name, and which one is invoked is undefined. A family prefix makes
          that collision impossible rather than merely unlikely.
        children:
          - AgentKitCore-ToolName-Compose
          - AgentKitCore-ToolName-FamilyPrefixRequired
          - AgentKitCore-ToolName-ReservedNamesRejected
          - AgentKitCore-ToolName-CharacterSet
          - AgentKitCore-ToolName-RejectMissingName
          - AgentKitCore-GuardedToolFactory-NameValidated
        tests:
          - AgentKitCore_SystemToolNaming_BareFileAccessName_IsRejected

      - id: AgentKitCore-GuardedConstruction-OnlySupportedPath
        title: >-
          The library shall provide a single supported way to construct a tool, which applies the
          result-delivery guard and the naming rules to every tool without the tool author being
          able to omit or replace them.
        tags: [system, security]
        justification: |
          A guard a tool author can forget is a guard that will be forgotten, and the guard's
          absence produces no error to notice. Making construction the only path means the safety
          properties are widened deliberately or not at all.
        children:
          - AgentKitCore-GuardedToolFactory-GuardAlwaysApplied
          - AgentKitCore-GuardedToolFactory-DescriptionRequired
          - AgentKitCore-GuardedToolFactory-RejectMissingDelegate
        tests:
          - AgentKitCore_SystemGuardedTool_ConstructedTool_CarriesValidatedNameAndDescription

      - id: AgentKitCore-ToolPacks-CapabilityGatedRegistration
        title: >-
          The library shall register a pack's tools only when the host provides every capability
          the pack requires, and shall not create that pack's tools at all otherwise.
        tags: [system, security]
        justification: |
          Where a host lacks a capability, a dependent tool that is registered and then refuses on
          use has already cost the agent a turn, and a model told only that a tool refused will
          reason its way around the refusal rather than abandoning the approach. Withholding
          registration entirely means the model never sees a capability it cannot use, so there is
          nothing to work around. Not creating the tools at all, rather than creating and
          discarding them, is what makes that property impossible to get wrong.
        children:
          - AgentKitCore-ToolPack-NoCapabilityRequired
          - AgentKitCore-ToolPack-CapabilitiesAreFlags
          - AgentKitCore-ToolPack-DeclaredCapabilities
          - AgentKitCore-ToolPackBuilder-CapabilityGating
          - AgentKitCore-ToolPackBuilder-DefaultCapabilitiesNone
          - AgentKitCore-ToolPackBuilder-CapabilityDeclarationReplaced
        tests:
          - AgentKitCore_SystemToolPacks_HostWithoutCapability_PackContributesNoTools

      - id: AgentKitCore-ToolPacks-Composition
        title: >-
          The library shall compose the tools of several packs into one ordered tool list governed
          by a single access policy, and shall not permit a composition to exist without that
          policy.
        tags: [system]
        justification: |
          An application attaches capabilities to an agent by attaching packs, and a pack that
          costs one line is a pack an author will use correctly. Composition is also where the
          single access policy is applied: every pack receives the same policy, so an author
          cannot widen one pack's reach by configuring it separately.
        children:
          - AgentKitCore-ToolPack-Contract
          - AgentKitCore-ToolPackBuilder-Composition
          - AgentKitCore-ToolPackBuilder-RequiresPolicy
          - AgentKitCore-ToolPackBuilder-RepeatableBuild
          - AgentKitCore-ToolPackBuilder-MalformedPackRejected
        tests:
          - AgentKitCore_SystemToolPacks_CapableHost_ReceivesEveryAttachedTool

      - id: AgentKitCore-ToolPacks-FamilyPrefixOwnership
        title: >-
          The library shall require each pack to own a family prefix no other pack claims, and
          shall require every tool a pack publishes to carry that prefix.
        tags: [system]
        justification: |
          Two packs publishing the same family prefix present the model with tools whose names do
          not distinguish them, and which one is invoked is undefined. Detecting that where the
          application composed its packs is far better than discovering it from a model's behavior
          in production.
        children:
          - AgentKitCore-ToolPackBuilder-PrefixCollision
          - AgentKitCore-ToolPackBuilder-PrefixAgreement
        tests:
          - AgentKitCore_SystemToolPacks_CollidingFamilyPrefixes_AreRejected

      - id: AgentKitCore-ToolCurrency-AIFunctionAbstractions
        title: >-
          The library shall present each tool to the runtime as a Microsoft.Extensions.AI
          AIFunction, delivering its results through that abstraction's content hierarchy and
          result-marshalling control.
        tags: [system]
        justification: |
          A guarded tool is handed to a provider as a Microsoft.Extensions.AI AIFunction, built
          through that library's function factory, and its results reach the model through the
          AIContent hierarchy and the factory's result-marshalling control rather than as
          serialized JSON. This externally visible behavior is what lets one tool be offered to
          the GitHub Copilot SDK, the Microsoft Agent Framework, and any IChatClient alike. The
          requirement records the repository's reliance on that off-the-shelf abstraction and
          links its OTS requirements to the system root; see OTS Integration Design
          (docs/design/ots.md).
        children:
          - AgentKit-OTS-MicrosoftExtensionsAIAbstractions-FunctionFactory
          - AgentKit-OTS-MicrosoftExtensionsAIAbstractions-Content
          - AgentKit-OTS-MicrosoftExtensionsAIAbstractions-MarshalResult
        tests:
          - AgentKitCore_SystemGuardedTool_ImageResult_ReachesRuntimeAsContent

      - id: AgentKitCore-Session-LongRunningConversation
        title: >-
          The library shall provide an agent session that accepts messages, returns the provider's
          answers, and continues to function after the conversation exceeds the provider's context
          window.
        tags: [system]
        justification: |
          A guarded tool set is of no use to an agent that cannot run long enough to use it. Without a
          session lifecycle that survives a full context window, a long-running agent is impossible,
          and a kit of agent tools cannot fulfil the purpose it was built for. The session is the unit
          an application programs against: it accepts a message, returns an answer, and remains usable
          turn after turn regardless of how much conversation has accumulated behind it.
        children:
          - AgentKitCore-AgentSession-SessionContract
          - AgentKitCore-CompactingAgentSession-AnswersTurns
          - AgentKitCore-CompactingAgentSession-RejectsBlankMessage
          - AgentKitCore-CompactingAgentSession-DisposesProviderSession
          - AgentKitCore-CompactingAgentSession-ReleasesProviderSessionItCannotAdopt
          - AgentKitCore-AgentSession-RejectsMalformedTurnReport
          - AgentKitCore-AgentSessionOptions-CarriesConfiguration
        tests:
          - AgentKitSessions_LongConversation_RotatesRepeatedlyAndKeepsAnswering

      - id: AgentKitCore-Compaction-ByRotation
        title: >-
          The library shall reduce a full context by consolidating older history, creating a fresh
          provider session seeded with the preserved content, and only then disposing the session it
          replaced.
        tags: [system]
        justification: |
          Two provider shapes must behave identically: one re-sends the whole history on every turn,
          the other keeps it server-side. Editing history in place works only for the first, and there
          is no supported way to retract a turn from the second. Rotation - replace the session, seed
          the replacement - is the only reduction mechanism both support, so it is the one the library
          implements. Disposing the session it replaces is part of the mechanism: for a provider
          holding the conversation server-side, disposal is what actually discards it. It happens last,
          once the replacement exists and has been adopted, so a failure anywhere earlier leaves the
          session still able to answer.
        children:
          - AgentKitCore-RotationEngine-ConsolidatesIntoTierOne
          - AgentKitCore-ContextLayout-SeedsMostStableFirst
          - AgentKitCore-ProviderSession-AdapterInterface
          - AgentKitCore-CompactingAgentSession-RotatesAtThreshold
          - AgentKitCore-ContextLayout-Immutable
          - AgentKitCore-RotationEngine-Deterministic
          - AgentKitCore-ProviderSession-RecordsWhatATurnProduced
          - AgentKitCore-ProviderSession-RejectsMalformedSeedOrTurn
        tests:
          - AgentKitSessions_LongConversation_RotatesRepeatedlyAndKeepsAnswering

      - id: AgentKitCore-Compaction-TieredRetention
        title: >-
          The library shall retain context as a round-robin structure - the most recent turns
          verbatim, and behind them a fixed number of tiers each a ring of a fixed number of
          consolidated slots - consolidating a given turn once per tier and only at rotation.
        tags: [system]
        justification: |
          A single rolling summary is a downward ratchet: each pass re-summarizes the previous summary,
          so detail is lost repeatedly rather than once, and measured recall collapses after a handful
          of rotations. A round-robin structure decays resolution with age by construction and nothing
          is weighed: a turn is consolidated into a tier-one slot, then into a coarser tier only when
          the finer one fills - once per tier, three times in its whole life. Aging only at rotation,
          and consolidating a full tier batch-then-clear as peers, is what keeps the context strictly
          append-only between rotations, which preserves a provider's prompt cache.
        children:
          - AgentKitCore-AgentSessionOptions-VerbatimTurns
          - AgentKitCore-ContextLayout-TierModel
          - AgentKitCore-RotationEngine-ConsolidatesFullTiers
          - AgentKitCore-RotationEngine-ConsolidatesOncePerTier
          - AgentKitCore-AgentSessionOptions-RejectsMalformedConfiguration
          - AgentKitCore-SessionTranscript-SplitsAtTurnBoundary
        tests:
          - AgentKitSessions_AfterManyRotations_EarlyDetailIsStillCarriedInContext

      - id: AgentKitCore-Compaction-BoundedByConstruction
        title: >-
          The library shall answer a context that fills again quickly by compacting harder, and at its
          tersest by discarding its oldest consolidated material - or its oldest verbatim turn when no
          consolidated material remains - deciding all of it by counts of turns and slots rather than
          by judging a context it has not yet sent.
        tags: [system]
        justification: |
          An arrangement configured in counts cannot be bounded in tokens in advance, because a
          summarizer's output lands at its natural length rather than a size it was asked for.
          Measuring what a rotation has just built is no better: nothing has been sent, so no
          provider has counted it, and the library counts nothing of its own - the provider session
          is the only source of a token figure, and it answers only for what it already holds. What
          the session has instead is a count it already keeps - how many turns passed before the
          window filled again. A window that refills within k turns of a rotation is answered one
          compaction level terser; at the tersest level there is nowhere further to go, so the
          oldest slot of the coarsest tier holding one is discarded, which is the ring of rule four
          brought forward because the context is filling faster than the ring's own schedule empties
          it; m quiet turns relax the level again, with m greater than k so the two cannot both
          hold. Where consolidation never succeeds at all there is no slot to discard, so the same
          move falls through to the oldest verbatim turn - never the newest, which the session must
          still be able to answer - and that fall-through is what makes the bound hold rather than
          merely usually hold. A token figure is read for one purpose only, noticing that the window
          is filling, and everything structural is a count.
        children:
          - AgentKitCore-CompactingAgentSession-AdaptsLevelUnderPressure
          - AgentKitCore-CompactingAgentSession-BoundsTheContextWhenConsolidationNeverSucceeds
          - AgentKitCore-AgentSessionOptions-RejectsMalformedConfiguration
        tests:
          - AgentKitSessions_LongConversation_RotatesRepeatedlyAndKeepsAnswering
          - CompactingAgentSession_TightWindow_EscalatesToHighAndReportsDroppedMaterial
          - CompactingAgentSession_DivergentTokenizer_KeepsAnsweringAndTerminates
          - CompactingAgentSession_DivergentTokenizer_RotatesMoreOftenAndEscalatesHigher
          - CompactingAgentSession_AfterAQuietStretch_RelaxesTheCompactionLevel

      - id: AgentKitCore-Compaction-OutOfSessionSummarizer
        title: >-
          The library shall consolidate history through an injected summarizer called outside the live
          session, receiving the material as a body of peers to reduce.
        tags: [system]
        justification: |
          Asking a live session to summarize itself spends that session's own context on the summary
          and triggers the provider's built-in compactor, which defeats the purpose. The library keeps
          its own transcript and hands the material to a separate, stateless call. Under batch-then-clear
          consolidation the pieces of material are peers - there is no previous record being folded into
          - and the summarizer is free to collapse repetition across them, which is what makes a
          consolidation buy room. Injecting the summarizer is what lets the whole engine be exercised
          deterministically without a model.
        children:
          - AgentKitCore-Summarizer-InjectedContract
          - AgentKitCore-Summarizer-ConsolidationPrompt
          - AgentKitCore-SessionTranscript-KeptOutOfSession
          - AgentKitCore-SessionTranscript-RendersLabeledMaterial
          - AgentKitCore-Summarizer-RejectsMalformedRequest
          - AgentKitCore-RotationEngine-RejectsMalformedConsolidation
          - AgentKitCore-RotationEngine-NormalizesBlankRecords
        tests:
          - AgentKitSessions_AfterManyRotations_EarlyDetailIsStillCarriedInContext

      - id: AgentKitCore-Compaction-ToolPairsIndivisible
        title: >-
          The library shall never separate a tool call from its result when deciding what remains
          verbatim.
        tags: [system, reliability]
        justification: |
          A boundary falling between a call and its result leaves the seeded history beginning with a
          result whose call is gone. Some providers reject that outright, and a model presented with it
          cannot tell what was asked. Because the unit of the verbatim tail and of every boundary is a
          whole turn - the message, the answer and all intervening tool traffic - a call and its result
          cannot be separated, which retires the earlier design's rule that had to snap a boundary.
        children:
          - AgentKitCore-SessionTranscript-KeepsToolTrafficWithItsTurn
          - AgentKitCore-SessionTranscript-PairedEntries
        tests:
          - SessionTranscript_AppendTurn_GroupsEntriesAsOneTurn

      - id: AgentKitCore-Compaction-SaturationDetection
        title: >-
          The library shall report how hard it is compacting - the compaction level - and whether a
          rotation had to drop history outright, rather than rotating repeatedly and silently for no
          gain.
        tags: [system, reliability]
        justification: |
          An agent whose context holds no redundancy left will keep crossing the rotation threshold,
          spending summarizer tokens and buying nothing, and without a signal that failure is invisible.
          The compaction level is that signal: it climbs as the session shortens its verbatim tail and
          asks for a terser summary, and it is reported on every turn. Dropped material is the honest
          signal that history was discarded rather than reduced - because the tersest level was already
          in force when the window filled again and the oldest slot went in the bin, or because a
          consolidation came back with nothing and its material had to stay where it was. Deciding
          what to do about it - warn, stop, split the task, start fresh - depends on what the
          application is for and is deliberately left to the application.
        children:
          - AgentKitCore-RotationEngine-MovesAtLeastOneTurn
          - AgentKitCore-AgentSession-ReportsCompaction
        tests:
          - CompactingAgentSession_TightWindow_EscalatesToHighAndReportsDroppedMaterial

      - id: AgentKitCore-ContextUsage-ProviderNeutral
        title: >-
          The library shall take how full the context is, and out of how much, from the provider
          session itself, and shall never mix a figure from one source into a comparison with
          another.
        tags: [system]
        justification: |
          Providers disagree about what they will reveal: a GitHub Copilot session reports current and
          limit token counts, an Ollama client publishes the context length it was loaded with, and a
          provider reached through an IChatClient reports neither. The adapter is the only place that
          can answer honestly for its own provider, so the adapter is what answers - reading the
          figures from a native API, holding a window it was told once where the provider was
          configured, or estimating and owning that choice. The engine itself performs no token
          arithmetic at all, so there is nothing of its own for a provider's figure to be mixed with,
          which is a stronger guarantee than recording where each figure came from and trusting that
          two origins are never compared. Carrying a second copy of the window beside the session gave
          one fact two sources and the engine a rule for choosing between them, and a rule for
          choosing between two numbers is a rule that will one day choose the wrong one. One source is
          also what keeps every comparison in one currency: the window, the overhead credited against
          it and the conversation measured against the threshold all come back together from the same
          reading, so nothing is ever subtracted from a figure counted by somebody else.
        children:
          - AgentKitCore-ContextUsage-UsageShape
          - AgentKitCore-ContextUsage-DefaultsToAllConversation
          - AgentKitCore-CompactingAgentSession-TakesTheWindowFromTheProvider
          - AgentKitCore-ProviderSession-AnswersForItsOwnWindow
          - AgentKitCore-ContextUsage-ReportsOverFullHonestly
          - AgentKitCore-ContextUsage-RejectsMeaninglessFigures
        tests:
          - AgentKitSessions_WindowComesFromTheProvider_NarrowCompactsWhereWideDoesNot

      - id: AgentKitCore-Verification-WithoutALiveModel
        title: >-
          The library shall provide an in-memory provider session so that a session's full lifecycle,
          including rotation, can be exercised without contacting a provider.
        tags: [system]
        justification: |
          The promise this system makes - that a long-running agent keeps the detail that matters - is
          only believable if it can be demonstrated, and a demonstration that needs a live model is
          neither deterministic nor repeatable in a build. An application author writing a summarizer,
          choosing a verbatim tail length, or acting on the reported compaction level needs the same
          ability, so the in-memory session is shipped rather than confined to this library's own tests.
        children:
          - AgentKitCore-InMemoryProviderSession-ContactsNothing
          - AgentKitCore-InMemoryProviderSession-RecordsRotationEvidence
          - AgentKitCore-InMemoryProviderSession-AnswersForItsOwnWindow
          - AgentKitCore-InMemoryProviderSession-RefusesMalformedUse
        tests:
          - AgentKitSessions_LongConversation_RotatesRepeatedlyAndKeepsAnswering

      - id: AgentKitCore-Session-BuiltOnExtensionsAi
        title: >-
          The library shall express the tools a session carries as Microsoft.Extensions.AI AIFunction
          instances.
        tags: [system]
        justification: |
          The session carries the tool set an application already composed, and AgentKit's tool currency
          throughout is the AIFunction abstraction that Microsoft.Extensions.AI.Abstractions publishes.
          Using the same currency here means a session accepts exactly what a tool pack produces, with
          no conversion layer between them. The requirement records the repository's reliance on that
          off-the-shelf abstraction and links its OTS requirements to the system root; see OTS
          Integration Design (docs/design/ots.md).
        children:
          - AgentKit-OTS-MicrosoftExtensionsAIAbstractions-FunctionFactory
        tests:
          - AgentKitSessions_LongConversation_RotatesRepeatedlyAndKeepsAnswering
