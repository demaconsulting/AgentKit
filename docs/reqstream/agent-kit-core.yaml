---
# Software System Requirements for AgentKit Core
#
# These requirements describe the externally visible behavior of the library
# from the perspective of its consumers, without specifying implementation details.

sections:
  - title: Library API
    requirements:
      - id: AgentKitCore-Lib-Greeting
        title: The library shall generate a greeting string when given a name.
        tags: [system]
        justification: |
          Provides a simple demonstration of library functionality following
          .NET library best practices for DEMA Consulting libraries.
        children:
          - AgentKitCore-Demo-Greeting
        tests:
          - AgentKitCore_SystemIntegration_DefaultConstruction_ReturnsExpectedGreeting
          - AgentKitCore_SystemCustomization_CustomPrefix_ReturnsExpectedGreeting

      - id: AgentKitCore-Lib-GreetingFormat
        title: The library shall return a greeting string in the format "{prefix}, {name}!".
        tags: [system]
        justification: |
          The format is the core observable contract of the library: callers depend on this
          specific structure in documentation examples and integration code.
        children:
          - AgentKitCore-Demo-Greeting
        tests:
          - AgentKitCore_SystemIntegration_DefaultConstruction_ReturnsExpectedGreeting
          - AgentKitCore_SystemCustomization_CustomPrefix_ReturnsExpectedGreeting

      - id: AgentKitCore-Lib-DefaultPrefix
        title: The library shall use "Hello" as the default greeting prefix.
        tags: [system]
        justification: |
          Callers constructing the library without a prefix argument need a predictable default
          greeting to rely on in documentation and examples.
        children:
          - AgentKitCore-Demo-DefaultPrefix
        tests:
          - AgentKitCore_SystemIntegration_DefaultConstruction_ReturnsExpectedGreeting

      - id: AgentKitCore-Lib-CustomPrefix
        title: The library shall support a customizable greeting prefix.
        tags: [system]
        justification: |
          Consumers may need to produce greetings with a prefix other than the
          default, so the library must allow the prefix to be specified at
          construction time.
        children:
          - AgentKitCore-Demo-AcceptCustomPrefix
          - AgentKitCore-Demo-Prefix
        tests:
          - AgentKitCore_SystemCustomization_CustomPrefix_ReturnsExpectedGreeting

      - id: AgentKitCore-Lib-Prefix
        title: The library shall expose the configured greeting prefix via a read-only property.
        tags: [system]
        justification: |
          Callers may need to inspect the prefix configured at construction time without
          re-specifying it or relying on the greeting output format to infer it.
        children:
          - AgentKitCore-Demo-Prefix
        tests:
          - AgentKitCore_SystemIntegration_CustomPrefix_ExposesPrefix

      - id: AgentKitCore-Lib-ValidationNull-DemoMethod
        title: The library shall reject a null name argument to DemoMethod with ArgumentNullException.
        tags: [system]
        justification: |
          Passing null to DemoMethod is a programming error. Throwing ArgumentNullException
          immediately surfaces the mistake to callers and prevents obscure failures deeper in
          the call stack.
        children:
          - AgentKitCore-Demo-ValidationNull-DemoMethod
        tests:
          - AgentKitCore_SystemValidation_DemoMethodNullInput_ThrowsArgumentNullException

      - id: AgentKitCore-Lib-ValidationNull-Constructor
        title: The library shall reject a null prefix argument to the constructor with ArgumentNullException.
        tags: [system]
        justification: |
          Passing null to the constructor is a programming error. Throwing ArgumentNullException
          immediately surfaces the mistake and prevents invalid instances from being created.
        children:
          - AgentKitCore-Demo-ValidationNull-Constructor
        tests:
          - AgentKitCore_SystemValidation_ConstructorNullPrefix_ThrowsArgumentNullException

      - id: AgentKitCore-Lib-ValidationEmpty-DemoMethod
        title: The library shall reject an empty-string name argument to DemoMethod with ArgumentException.
        tags: [system]
        justification: |
          Passing an empty string to DemoMethod is a programming error. Throwing ArgumentException
          immediately surfaces the mistake and prevents malformed output such as "Hello, !".
        children:
          - AgentKitCore-Demo-ValidationEmpty-DemoMethod
        tests:
          - AgentKitCore_SystemValidation_DemoMethodEmptyInput_ThrowsArgumentException

      - id: AgentKitCore-Lib-ValidationEmpty-Constructor
        title: The library shall reject an empty-string prefix argument to the constructor with ArgumentException.
        tags: [system]
        justification: |
          Passing an empty string to the constructor is a programming error. Throwing ArgumentException
          immediately surfaces the mistake and prevents malformed output such as ", World!".
        children:
          - AgentKitCore-Demo-ValidationEmpty-Constructor
        tests:
          - AgentKitCore_SystemValidation_ConstructorEmptyPrefix_ThrowsArgumentException

  - title: AgentKitCore Requirements
    requirements:
      - id: AgentKitCore-PathContainment-ResolveLinks
        title: >-
          The library shall judge path access by the real file system location of the requested
          path, with symbolic links and directory junctions resolved at every path component.
        tags: [system, security]
        justification: |
          A path string that looks contained within a permitted location can still reach outside
          it when a reparse point sits anywhere along the path. Judging access on the requested
          string rather than on the location it actually reaches would let an agent read or write
          outside the location its operator granted, which is the primary threat this library
          exists to control.
        children:
          - AgentKitCore-RealPathResolver-ComponentWalk
          - AgentKitCore-RealPathResolver-LinkTarget
          - AgentKitCore-RealPathResolver-Normalization
          - AgentKitCore-RealPathResolver-NonExistentPath
          - AgentKitCore-RealPathResolver-RejectInvalidPath
          - AgentKitCore-PathRule-RootResolvedAtConstruction
          - AgentKitCore-PathPolicy-DenyEscapedPath
          - AgentKitCore-PathPolicy-RealPathReported
        tests:
          - AgentKitCore_SystemPathContainment_FileBeneathDirectoryLink_IsDenied

      - id: AgentKitCore-PathContainment-EnumerationFiltered
        title: >-
          The library shall apply the same containment decision to directory enumeration as to
          direct path access, so a file reachable only by leaving a permitted location is never
          listed.
        tags: [system, security]
        justification: |
          Recursive directory enumeration provided by the operating system follows links out of
          a permitted location. A listing that advertises such a file discloses its existence and
          invites the agent to request it, so enumeration must reach the same conclusion as direct
          access rather than applying a weaker check of its own.
        children:
          - AgentKitCore-PathPolicy-EnumerationFiltered
        tests:
          - AgentKitCore_SystemPathContainment_EnumerationAcrossLink_ExcludesEscapedFile

      - id: AgentKitCore-PathAccess-IndependentReadWrite
        title: >-
          The library shall permit read access and write access to be expressed independently,
          each either unrestricted or confined to a location, and each with its own denied
          patterns.
        tags: [system]
        justification: |
          A development assistant is commonly expected to read widely across a machine while
          writing only into one working directory. Collapsing read and write into a single setting
          would force operators to choose between an assistant that cannot see enough context and
          one that can modify more than intended.
        children:
          - AgentKitCore-PathRule-Unrestricted
          - AgentKitCore-PathRule-Rooted
          - AgentKitCore-PathRule-DenyPatterns
          - AgentKitCore-PathRule-RejectInvalidRule
          - AgentKitCore-PathPolicy-IndependentRules
        tests:
          - AgentKitCore_SystemPathPolicy_ReadWideWriteNarrow_AllowsReadDeniesWrite

      - id: AgentKitCore-PathAccess-DenialNotException
        title: >-
          The library shall report a refused path access as a returned denial rather than by
          throwing an exception.
        tags: [system]
        justification: |
          An exception raised while a model is calling a tool ends the agent's turn and strands
          it with no way to continue. A returned denial lets the model read the reason and choose
          a permitted path instead, which turns a refusal into a recoverable step rather than a
          failed session.
        children:
          - AgentKitCore-PathPolicy-DenialResult
          - AgentKitCore-PathPolicy-UnresolvablePathDenied
        tests:
          - AgentKitCore_SystemPathPolicy_DeniedPath_ReturnsDenialWithoutThrowing

      - id: AgentKitCore-PathAccess-DenialRedaction
        title: >-
          The library shall exclude the requested path and other host detail from denial messages.
        tags: [system, security]
        justification: |
          A denial message is returned to the model and becomes part of a transcript that leaves
          the process, often to a third-party provider. Including absolute paths would disclose
          the host's directory layout, user names and project structure to that provider.
        children:
          - AgentKitCore-PathPolicy-DenialMessageRedacted
        tests:
          - AgentKitCore_SystemPathPolicy_DenialMessage_ContainsNoHostPaths

      - id: AgentKitCore-PathAccess-GuardedConstruction
        title: >-
          The library shall not permit a path access policy to exist without both a read rule and
          a write rule.
        tags: [system, security]
        justification: |
          A policy that can be created without its rules invites a caller to construct one
          and forget to restrict it, producing an agent with unbounded file access that looks
          governed. Requiring both rules at creation makes an unguarded policy unrepresentable.
        children:
          - AgentKitCore-PathPolicy-RequiredRules
        tests:
          - AgentKitCore_SystemPathPolicy_ConstructionWithoutRules_IsRejected

      - id: AgentKitCore-ToolLimits-BudgetCeilings
        title: >-
          The library shall define ceilings on the bytes a tool may read, the characters a tool
          result may return to the model, the bytes of binary content a tool may return, and the
          attachments a tool may add in one turn, and shall carry those ceilings with the access
          policy so that every tool observes the same budget.
        tags: [system]
        justification: |
          A tool that returns an unbounded amount of text exhausts the model's context window in
          the middle of a task, and the failure presents as the agent forgetting its instructions
          rather than as an error anyone can see. Carrying the ceilings with the access policy
          means every pack a host attaches observes one budget rather than each inventing its own.
        children:
          - AgentKitCore-ToolLimits-Defaults
          - AgentKitCore-ToolLimits-Customization
          - AgentKitCore-ToolLimits-RejectNegative
          - AgentKitCore-PathPolicy-CarriesLimits
        tests:
          - AgentKitCore_SystemToolLimits_PolicyCarriesDefaultLimits_ExposesPublishedValues

      - id: AgentKitCore-ToolResult-ContentPreserved
        title: >-
          The library shall deliver a tool result to the runtime in the form the tool produced it
          — text, binary content, or a caption accompanied by an image — rather than as
          serialized JSON.
        tags: [system, security]
        justification: |
          Without this, a returned image is flattened to a data URI string, the provider never
          recognizes it as an image, and the model states that it can see the image and then
          fabricates a description of it. The failure is silent and the output is confidently
          wrong, which is worse than an error a caller could detect and handle.
        children:
          - AgentKitCore-ToolResult-Text
          - AgentKitCore-ToolResult-Binary
          - AgentKitCore-ToolResult-Image
          - AgentKitCore-GuardedToolFactory-ResultPassthrough
        tests:
          - AgentKitCore_SystemGuardedTool_ImageResult_ReachesRuntimeAsContent

      - id: AgentKitCore-ToolResult-RefusalIsAResult
        title: >-
          The library shall express a refused tool operation as a returned tool result that names
          the reason and, where another tool is more appropriate, directs the model to it, and
          shall add no host detail of its own to that result.
        tags: [system]
        justification: |
          An exception raised at a tool call ends the agent's turn; a returned refusal lets the
          model read the reason and choose a permitted alternative. The redirect exists because an
          agent told only "no" will retry the same tool, while an agent told which tool to use
          instead makes progress. Refusal text reaches a transcript that leaves the process, so
          the library contributes nothing to it beyond a fixed reason and the caller's own words.
        children:
          - AgentKitCore-ToolResult-Denied
          - AgentKitCore-ToolResult-DenialRedirect
          - AgentKitCore-ToolResult-DenialReasonRequired
          - AgentKitCore-ToolResult-DenialComposedOnlyOfSuppliedText
        tests:
          - AgentKitCore_SystemGuardedTool_DeniedPath_ReturnsDenialResultNotException

      - id: AgentKitCore-ToolNaming-FamilyPrefix
        title: >-
          The library shall require every tool name to carry a family prefix separated from the
          remainder by an underscore, and shall reject a name that would collide with the bare
          file access tool names published by the Agent Framework.
        tags: [system]
        justification: |
          The Agent Framework's own file access provider registers the bare names "read", "write"
          and "delete". An application combining both libraries would present the model with two
          tools of the same name, and which one is invoked is undefined. A family prefix makes
          that collision impossible rather than merely unlikely.
        children:
          - AgentKitCore-ToolName-Compose
          - AgentKitCore-ToolName-FamilyPrefixRequired
          - AgentKitCore-ToolName-ReservedNamesRejected
          - AgentKitCore-ToolName-CharacterSet
          - AgentKitCore-ToolName-RejectMissingName
          - AgentKitCore-GuardedToolFactory-NameValidated
        tests:
          - AgentKitCore_SystemToolNaming_BareFileAccessName_IsRejected

      - id: AgentKitCore-GuardedConstruction-OnlySupportedPath
        title: >-
          The library shall provide a single supported way to construct a tool, which applies the
          result-delivery guard and the naming rules to every tool without the tool author being
          able to omit or replace them.
        tags: [system, security]
        justification: |
          A guard a tool author can forget is a guard that will be forgotten, and the guard's
          absence produces no error to notice. Making construction the only path means the safety
          properties are widened deliberately or not at all.
        children:
          - AgentKitCore-GuardedToolFactory-GuardAlwaysApplied
          - AgentKitCore-GuardedToolFactory-DescriptionRequired
          - AgentKitCore-GuardedToolFactory-RejectMissingDelegate
        tests:
          - AgentKitCore_SystemGuardedTool_ConstructedTool_CarriesValidatedNameAndDescription
