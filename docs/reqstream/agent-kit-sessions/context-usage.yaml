---
# Software Unit Requirements for ContextUsage
#
# These requirements describe the design-level behavior of the ContextUsage unit.

sections:
  - title: AgentKitSessions Requirements
    sections:
      - title: ContextUsage Requirements
        requirements:
          - id: AgentKitSessions-ContextUsage-UsageShape
            title: >-
              The unit shall reduce both provider families to one usage shape carrying the used tokens,
              the window, the conversation split and the origin that records whether the provider
              reported the figure or this library estimated it.
            justification: |
              Providers disagree about what they will reveal, so both shapes are reduced to one figure.
              The origin is not decoration: a provider-reported figure counts framing this library
              never sees and is preferred whenever offered, and recording which road a figure came down
              is what lets an application tell a measurement from a derivation instead of treating them
              as interchangeable.
            tests:
              - ContextUsage_FromProvider_CarriesSplitAndOrigin
              - ContextUsage_FromEstimate_MarksEstimated

          - id: AgentKitSessions-ContextUsage-DefaultsToAllConversation
            title: >-
              The unit shall treat the whole of the usage as conversation when a provider reports only
              totals, crediting no overhead.
            justification: |
              An adapter that receives only totals is not made to invent a split. Treating the whole as
              conversation credits the session with no overhead allowance, which rotates strictly
              earlier than a correct split would and so cannot let the session run past the provider's
              own compactor. Estimating the split here would mix this library's character ratio into a
              provider's measurement, which is the one thing this shape exists to prevent.
            tests:
              - ContextUsage_FromProvider_NoSplit_TreatsAllAsConversation

          - id: AgentKitSessions-ContextUsage-ReportsOverFullHonestly
            title: >-
              The unit shall report free tokens floored at zero and a used fraction that is not
              clamped, so an over-full window is visible.
            justification: |
              A window that is over-full has no negative amount of room, so free tokens are floored at
              zero; but the over-full condition itself is exactly what an application most needs to see,
              so the used fraction is left unclamped and may exceed one.
            tests:
              - ContextUsage_DerivedFigures_AreHonest

          - id: AgentKitSessions-ContextUsage-RejectsMeaninglessFigures
            title: >-
              The unit shall reject a conversation larger than the total, a non-positive window, and an
              undefined origin.
            justification: |
              A conversation larger than everything occupied is not a condition any accounting can
              produce and would make the overhead negative, enlarging the effective window a threshold
              is taken from. An undefined origin is a cast integer that would silently select a
              different code path. Each is refused where the adapter's arithmetic defect was written.
            tests:
              - ContextUsage_Construct_MeaninglessFigures_Throws

          - id: AgentKitSessions-ContextUsage-OptionalReportingContract
            title: >-
              The unit shall define an optional reporting interface a provider session implements only
              when it can report its own usage, returning nothing until it can.
            justification: |
              Requiring every provider session to report usage would force an adapter for a provider
              that reports nothing to invent a number, which is indistinguishable from a real one at the
              point it is consumed. Keeping the capability in its own interface lets an adapter say "I do
              not know" by not implementing it, and lets the session ask once with a type test and fall
              back to its own estimate.
            tests:
              - InMemoryProviderSession_Usage_SimulatesBothShapes
              - CompactingAgentSession_Usage_PrefersProviderReport
