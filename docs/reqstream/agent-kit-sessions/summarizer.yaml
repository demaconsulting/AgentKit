---
# Software Unit Requirements for Summarizer
#
# These requirements describe the design-level behavior of the Summarizer unit.

sections:
  - title: AgentKitSessions Requirements
    sections:
      - title: Summarizer Requirements
        requirements:
          - id: AgentKitSessions-Summarizer-InjectedContract
            title: >-
              The consolidation contract shall be an injected, stateless call receiving the previous
              record, the new material and the target tier, and returning the consolidated record.
            justification: |
              Injecting the summarizer is what lets a test supply a deterministic fake and get a
              rotation engine that is a pure function of its inputs, while production supplies an
              implementation backed by a model; nothing in the engine knows or cares which it has.
              The material arrives as an argument precisely so that consolidation does not happen
              inside the live session being compacted - asking a session to summarize itself spends
              that session's own context on the summary and provokes the provider's built-in
              compactor.
            tests:
              - ConsolidationRequest_IsDegradation_TrueWhenNoPreviousRecord
              - RotationEngine_RotateAsync_SecondRotation_CarriesThePreviousRecordForward

          - id: AgentKitSessions-Summarizer-RejectsMalformedRequest
            title: >-
              A consolidation request shall reject tier zero as a target, blank material, and a
              non-positive tier budget.
            justification: |
              Tier zero is verbatim history by definition, so a request to consolidate into it could
              only be a defect in the engine. Blank material would spend a model round trip to say
              nothing. A tier that could hold nothing is not a tier. Each is refused where it was
              constructed rather than discovered from a record that makes no sense.
            tests:
              - ConsolidationRequest_Construct_TierZero_Throws
              - ConsolidationRequest_Construct_BlankMaterial_Throws
              - ConsolidationRequest_Construct_NonPositiveBudget_Throws

          - id: AgentKitSessions-Summarizer-ConsolidationPrompt
            title: >-
              The library shall publish a default consolidation prompt that asks for specificity and
              content - paths, values, decisions and their reasons, constraints, errors and their
              resolutions, and outstanding work - names no target size, and composes a request with
              the previous record placed before the new material.
            justification: |
              Asking a model to hit a token budget does not work: in the compaction spike that
              preceded this package, consolidations asked for between 9,870 and 19,741 tokens
              returned 1,665 and 4,259 tokens (n = 2 requests, recorded in that spike). A model
              cannot count its own output. The prompt therefore names categories of information that
              must survive and lets length follow from how much the material contains, with the
              engine measuring the result itself. Publishing the prompt rather than burying it lets
              an application read exactly what its summarizer is being asked to do and replace it
              with wording suited to its own domain. The previous record comes first because that is
              the order the ratchet reads in: carry this forward, then fold this in.
            tests:
              - ConsolidationPrompt_Instruction_NamesNoTargetSize
              - ConsolidationPrompt_Instruction_AsksForSpecificContent
              - ConsolidationPrompt_Compose_PlacesThePreviousRecordBeforeTheNewMaterial
              - ConsolidationPrompt_Compose_Degradation_StatesThereIsNoPreviousRecord
              - ConsolidationPrompt_Compose_AlwaysCarriesTheInstruction
              - ConsolidationPrompt_Compose_NullRequest_Throws
