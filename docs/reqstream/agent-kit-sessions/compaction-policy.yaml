---
# Software Unit Requirements for CompactionPolicy
#
# These requirements describe the design-level behavior of the CompactionPolicy unit.

sections:
  - title: AgentKitSessions Requirements
    sections:
      - title: CompactionPolicy Requirements
        requirements:
          - id: AgentKitSessions-CompactionPolicy-VerbatimTurns
            title: >-
              The policy shall carry the one control an application configures, the maximum number of
              recent turns kept verbatim, as a positive count.
            justification: |
              Compaction is configured in counts, not tokens. The round-robin structure keeps a fixed
              number of recent turns verbatim and, behind them, a fixed number of tiers each holding a
              fixed number of consolidated slots. The counts that give the structure its shape are
              internal constants, because an application has no basis for choosing them and no symptom
              telling it a choice was wrong. The only number an author can reason about is how much
              recent history to keep untouched, so that is the one control the policy carries.
            tests:
              - CompactionPolicy_Default_CarriesThePublishedVerbatimTurns
              - CompactionPolicy_Construct_SetsVerbatimTurns

          - id: AgentKitSessions-CompactionPolicy-ValidatedDefaults
            title: >-
              The policy shall provide a validated default verbatim tail length and a shared default
              instance.
            justification: |
              This follows the convention the rest of AgentKit's option types already establish, so an
              author who has configured tool limits or memory options needs to learn nothing new. The
              default of twenty recent turns is a maximum rather than a quota - a session under
              pressure keeps fewer - and is a starting point suited to an ordinary conversational
              agent. A single shared default instance lets a caller establish by reference that no host
              configuration was applied.
            tests:
              - CompactionPolicy_Default_IsShared

          - id: AgentKitSessions-CompactionPolicy-RejectsUnworkableConfiguration
            title: >-
              The policy shall reject a verbatim tail length that is not positive.
            justification: |
              A tail of zero turns would keep no recent history verbatim and would rotate everything
              the moment it arrived, which is not a session an application could reason about. A
              rejected value is a defect in the host's configuration code rather than a runtime
              condition a model can provoke, so it is surfaced rather than clamped.
            tests:
              - CompactionPolicy_Construct_NonPositive_Throws
