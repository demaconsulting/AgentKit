---
# Software Unit Requirements for CompactingAgentSession
#
# These requirements describe the design-level behavior of the CompactingAgentSession unit.

sections:
  - title: AgentKitSessions Requirements
    sections:
      - title: CompactingAgentSession Requirements
        requirements:
          - id: AgentKitSessions-CompactingAgentSession-AnswersTurns
            title: >-
              The session shall record each outgoing message and everything the turn produced,
              including the answer, in its own transcript once the provider has accepted the turn,
              and return the provider's answer.
            justification: |
              The transcript is recorded here, out of session, because that is what allows
              consolidation to be a separate stateless call rather than a request to the live session
              to summarize itself. Recording everything the turn produced records the answer too,
              because a provider turn's entries end with it: a tool-using turn whose answer was left
              out would put the tool traffic in the transcript but not the conclusion drawn from it,
              and an agent that uses tools on nearly every turn would then be seeded, after every
              rotation, from a history holding almost none of its own output. Nothing is recorded
              until the provider has accepted the turn: a provider may honor cancellation or fail
              before taking it, and a message recorded ahead of that would be a turn no provider ever
              saw - one that would nonetheless survive in the transcript, be consolidated at the next
              rotation, and be seeded into the replacement session as though it had happened.
            tests:
              - CompactingAgentSession_CreateAsync_SeedsOneEmptyProviderSession
              - CompactingAgentSession_SendAsync_BelowThreshold_AnswersWithoutRotating
              - CompactingAgentSession_SendAsync_ProviderRejectsTheTurn_RecordsNoGhostEntry
              - CompactingAgentSession_SendAsync_ToolUsingTurnRotates_SeedsTheAnswerIntoTheReplacement

          - id: AgentKitSessions-CompactingAgentSession-RotatesAtThreshold
            title: >-
              The session shall rotate once the conversation tokens reach the threshold derived from
              the window its usage figure was measured against, consolidating the layout, creating a
              replacement provider session seeded from the result, adopting it together with the
              layout and the counters in one step, and only then disposing the session it replaced.
            justification: |
              Comparing conversation tokens - usage with the fixed overhead removed - rather than raw
              usage is what makes the comparison mean the same thing whether the figure came from the
              provider or from the library's own estimate. The window the threshold comes from is
              chosen the same way and for the same reason: the guarantee rotation exists to deliver
              is that the provider's own compactor never fires, and that is a claim about the window
              the provider actually has. A host that configured a larger window than the provider
              reports would otherwise be allowed far past the provider's own threshold, and one that
              configured a smaller window would rotate early, spending summarizer tokens and prompt
              cache for nothing. The configured window governs only the provider family that reports
              no window of its own, which is exactly the family the estimate was measured against.
              The ordering is deliberate: consolidate,
              create, adopt, then dispose. A summarizer failure therefore leaves the session exactly
              as it was, still able to answer, rather than leaving it with no provider session at
              all. Adopting the replacement before the disposal, in a step with nothing to suspend
              on, is what makes the transition exception-safe: updating the state after awaiting the
              disposal would let an adapter whose disposal fails leave the session pointing at the
              replacement while its layout and counters still described the session it replaced, so
              the next turn would append to - and might rotate - the wrong transcript. For the same
              reason a failed disposal is not reported as a rotation failure: by then the rotation
              has succeeded and the session is coherent against its replacement, and reporting a
              failure would tell the caller the opposite while repairing nothing.
              Compaction happens after the answer is produced, so a caller never waits on a
              summarizer before receiving the answer to a question the session could already answer.
            tests:
              - CompactingAgentSession_SendAsync_AboveThreshold_RotatesIntoAFreshSeededSession
              - CompactingAgentSession_SendAsync_ProviderReportsASmallerWindow_RotatesAgainstTheReportedOne
              - CompactingAgentSession_SendAsync_ReplacedProviderFailsToDispose_StaysCoherent

          - id: AgentKitSessions-CompactingAgentSession-RefusesUnusableReportedWindow
            title: >-
              The session shall refuse a provider-reported context window smaller than the layout's
              construction bound, releasing the live provider session before reporting the failure,
              both when the session is created and after every turn.
            justification: |
              The construction bound is the most a layout can ever occupy: the fixed overhead, every
              tier budget, and the framing each seeded tier record carries. A reported window below
              it cannot hold a freshly rotated context, so rotation cannot make progress. Left
              unchecked, the threshold derived from the reported window is crossed on nearly every
              turn while the rotation still splits tier zero at the policy's budget, so each rotation
              hands back a layout still over the reported window and re-seeds it - a thrash loop
              spending a summarizer call and a provider session per turn without ever converging.
              Failing is preferred to adapting. Shrinking the tier budgets to fit would silently
              discard the compaction policy the host configured and would have to re-consolidate
              records already written against larger budgets, which an immutable layout exists to
              prevent; ignoring the reported window would reinstate the defect the reported-window
              override removes, letting the session run past the provider's own compactor. The
              configured window is already refused for exactly this condition at options
              construction, so failing here keeps one rule - a window that cannot hold the bound is
              refused - and differs only in when the figure becomes knowable. The check runs after
              every turn as well as at creation, because a provider may only begin reporting, or
              report a smaller window, once it has answered something. The live provider is released
              first because the session is being abandoned mid-life and the caller has no handle to
              dispose; a failure to release is swallowed rather than allowed to replace the
              configuration error the caller can act on.
            tests:
              - CompactingAgentSession_CreateAsync_ProviderWindowBelowTheBound_ReleasesAndThrows
              - CompactingAgentSession_SendAsync_ProviderReportsAWindowBelowTheBound_ReleasesAndThrows

          - id: AgentKitSessions-CompactingAgentSession-PrefersProviderUsage
            title: >-
              The session shall use a provider's own account of its window when the provider reports
              one, and its own estimate against the configured window otherwise.
            justification: |
              A provider's own figures count framing this library never sees, so they are the better
              measurement whenever they are offered. Making the preference a single decision in one
              place, rather than scattering it across the call sites that need a usage figure, is
              what keeps the two provider families on one code path.
            tests:
              - CompactingAgentSession_SendAsync_ProviderReportsUsage_PrefersTheProviderFigures
              - CompactingAgentSession_SendAsync_ProviderReportsNothing_UsesItsOwnEstimate

          - id: AgentKitSessions-CompactingAgentSession-RejectsBlankMessage
            title: >-
              The session shall reject a blank message and a missing configuration or provider
              factory.
            justification: |
              A blank turn spends context to say nothing and is a defect in the calling application
              rather than something to forward to a provider. A missing configuration or factory is
              refused where the host wrote it rather than at the first conversation.
            tests:
              - CompactingAgentSession_SendAsync_BlankMessage_Throws
              - CompactingAgentSession_CreateAsync_NullArguments_Throw

          - id: AgentKitSessions-CompactingAgentSession-DisposesProviderSession
            title: >-
              The session shall release the live provider session on disposal, report a failed
              release while leaving it retryable by disposing again, permit repeated disposal once
              released, and refuse further turns once disposed.
            justification: |
              For some providers the live session is server-side state that keeps being billed for
              until released. Sessions replaced by earlier rotations were already disposed at the
              moment they were replaced, so disposing the session releases everything it still holds.
              A failed release is reported, unlike the same failure during a rotation, because a
              caller that asked for the session to be released is entitled to learn that it was not.
              Because it is reported, it must also stay retryable: the session is marked disposed
              from the first call and refuses further turns either way, but the provider counts as
              released only once its own disposal has completed, so a later call tries again instead
              of returning as though the release had happened. Marking it released before awaiting
              the release would turn a transient provider failure into a permanent leak. Repeated
              disposal after a successful release is permitted because a disposal pattern that threw
              on a second call would make defensive cleanup harder than leaving the resource open.
            tests:
              - CompactingAgentSession_DisposeAsync_ReleasesTheLiveProviderSession
              - CompactingAgentSession_DisposeAsync_FirstReleaseFails_RetriesAndReleases
