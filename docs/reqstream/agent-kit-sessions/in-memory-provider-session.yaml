---
# Software Unit Requirements for InMemoryProviderSession
#
# These requirements describe the design-level behavior of the InMemoryProviderSession unit.

sections:
  - title: AgentKitSessions Requirements
    sections:
      - title: InMemoryProviderSession Requirements
        requirements:
          - id: AgentKitSessions-InMemoryProviderSession-ContactsNothing
            title: >-
              The in-memory provider session shall hold its seeded history, answer from a supplied
              responder, and contact no provider and no network.
            justification: |
              The system's promise is only believable if it can be exercised end to end without a
              live model, and a demonstration needing one is neither deterministic nor repeatable in
              a build. It is shipped rather than confined to this library's own tests because an
              application author writing a summarizer, choosing tier budgets, or deciding what to do
              about a saturation signal needs exactly the same ability.
            tests:
              - InMemoryProviderSession_Construct_StartsHoldingTheSeededHistory
              - InMemoryProviderSession_SendAsync_RecordsTheMessageAndTheTurn
              - InMemoryProviderSessionFactory_DefaultResponder_Answers

          - id: AgentKitSessions-InMemoryProviderSession-SimulatesBothProviderShapes
            title: >-
              The in-memory provider session shall be able either to report its own context usage or
              to report nothing, so both provider families are reachable without a live model.
            justification: |
              Real providers differ: one reports current and limit figures and one reports neither.
              Both engine paths - preferring the provider's account, and falling back to the
              library's own estimate - must be reachable in a test, or one of them ships unexercised.
              When reporting, the figures are computed from this session's own history and fixed
              overhead and marked as provider-supplied, because from the engine's point of view that
              is exactly what they are.
            tests:
              - InMemoryProviderSession_CurrentUsage_ReportsProviderOriginAndGrows
              - InMemoryProviderSession_CurrentUsage_WhenNotReporting_IsNull

          - id: AgentKitSessions-InMemoryProviderSession-RecordsRotationEvidence
            title: >-
              The in-memory provider session shall make its disposal observable and refuse further
              turns once disposed, and its factory shall record every session it created, including
              when several are created concurrently.
            justification: |
              Rotation creates a replacement session and disposes its predecessor, and both halves
              have to be observable for that behavior to be verifiable at all. Against a real
              provider a leaked session holds a server-side conversation open and keeps being billed
              for, so a rotation that failed to dispose one must be detectable rather than merely
              suspected. The factory is required to be safe for concurrent use because an
              application may run several sessions against one factory, and an unsynchronized record
              can lose a session or be observed halfway through an addition.
            tests:
              - InMemoryProviderSession_DisposeAsync_MarksDisposedAndRefusesFurtherTurns
              - InMemoryProviderSessionFactory_CreateAsync_RecordsEverySessionItMakes
              - InMemoryProviderSessionFactory_CreateAsync_ConcurrentCreations_RecordsEveryOne
              - CompactingAgentSession_SendAsync_AboveThreshold_RotatesIntoAFreshSeededSession
