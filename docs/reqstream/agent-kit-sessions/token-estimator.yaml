---
# Software Unit Requirements for TokenEstimator
#
# These requirements describe the design-level behavior of the TokenEstimator unit.

sections:
  - title: AgentKitSessions Requirements
    sections:
      - title: TokenEstimator Requirements
        requirements:
          - id: AgentKitSessions-TokenEstimator-DeterministicEstimate
            title: >-
              The unit shall estimate the token cost of text by a deterministic character ratio,
              rounding up so present content is never charged zero and treating absent content as zero.
            justification: |
              The estimator is the fallback used when a provider reports no usage and when the session
              sizes a seed it has not yet sent. A real tokenizer is provider- and model-specific and
              would make behavior non-deterministic across upgrades; a cheap, stable ratio is
              deterministic, which is what lets the rotation engine be unit-tested without a model.
              Rounding up keeps an unbounded number of short entries from accumulating as free.
            tests:
              - TokenEstimator_EstimateTokens_AbsentContent_IsZero
              - TokenEstimator_EstimateTokens_RoundsUp

          - id: AgentKitSessions-TokenEstimator-ChargesEntryFraming
            title: >-
              The unit shall charge each transcript entry a flat per-entry framing allowance beyond the
              characters it carries.
            justification: |
              Every entry a provider receives is framed - a role marker, message delimiters, and for a
              tool call or result an identifier - and that framing is charged to the window even when
              the entry's text is short. An estimator that counted only characters would under-count a
              long run of small entries, which is exactly the shape a tool-using agent produces.
            tests:
              - TokenEstimator_EstimateEntryTokens_IncludesFraming

          - id: AgentKitSessions-TokenEstimator-EstimatesToolDeclarations
            title: >-
              The unit shall estimate the fixed overhead of tool declarations from each tool's name,
              description and schema plus a per-tool structural allowance, and shall reject a null
              declaration.
            justification: |
              Tool declarations are sent with every request and are fixed overhead subtracted before
              any percentage is applied, so under-counting them would inflate the effective window and
              delay rotation. A null declaration cannot be estimated and is refused rather than
              dereferenced.
            tests:
              - TokenEstimator_EstimateToolDeclarations_None_IsZero
              - TokenEstimator_EstimateToolDeclarations_ChargesEachTool
              - TokenEstimator_EstimateToolDeclarations_NullEntry_Throws
