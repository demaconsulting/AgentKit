---
# Software Unit Requirements for AgentSessionOptions
#
# These requirements describe the design-level behavior of the AgentSessionOptions unit.

sections:
  - title: AgentKitSessions Requirements
    sections:
      - title: AgentSessionOptions Requirements
        requirements:
          - id: AgentKitSessions-AgentSessionOptions-CarriesConfiguration
            title: >-
              The options shall carry what an application configured - the summarizer, the
              instructions, the tools and the compaction policy - and shall require only the
              summarizer, defaulting the rest.
            justification: |
              The options are the one place an application states what its session is. Only the
              summarizer is required, because compaction cannot happen without one and defaulting it
              would give a session that silently never compacts; everything else defaults. The
              provider's context window is deliberately not among them: it is a fact about the
              provider, so it belongs where the provider is constructed, and a second copy here gave
              one fact two sources and the session a rule for deciding which to believe.
            tests:
              - AgentSessionOptions_Construct_CarriesConfiguration
              - AgentSessionOptions_Construct_Defaults

          - id: AgentKitSessions-AgentSessionOptions-MeasuresFixedOverhead
            title: >-
              The options shall measure the fixed overhead the context carries - the system prompt and
              the tool declarations - once, when they are constructed.
            justification: |
              The system prompt and tool declarations are present on every turn and are never
              consolidated, so the engine's own account of the context has to carry them as a standing
              cost rather than discover them turn by turn. Measuring them once, where the tools are
              stated, is also what makes the measurement match what a rotation seeds: the declarations
              are copied into storage the options own, so a caller that added a tool afterwards cannot
              change what is sent without changing what was counted. The measurement is this library's
              character-ratio estimate and is applied only to what the application supplied, never to
              a figure a provider reported.
            tests:
              - AgentSessionOptions_Construct_MeasuresFixedOverhead

          - id: AgentKitSessions-AgentSessionOptions-RejectsMalformedConfiguration
            title: >-
              The options shall reject a null summarizer and a null tool declaration.
            justification: |
              Each is a defect in the host's configuration code, surfaced where the application wrote
              it. A null summarizer would give a session that never compacts, and a null declaration
              cannot be measured. What the options do not do is predict, in advance and in a currency
              they cannot measure, whether an arrangement will settle: the structure answers pressure
              with counts and reports how hard it is working, rather than refusing a configuration
              before a session has sent anything.
            tests:
              - AgentSessionOptions_Construct_NullSummarizer_Throws
              - AgentSessionOptions_Construct_NullTool_Throws
