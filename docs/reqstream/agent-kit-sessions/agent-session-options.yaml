---
# Software Unit Requirements for AgentSessionOptions
#
# These requirements describe the design-level behavior of the AgentSessionOptions unit.

sections:
  - title: AgentKitSessions Requirements
    sections:
      - title: AgentSessionOptions Requirements
        requirements:
          - id: AgentKitSessions-AgentSessionOptions-CarriesConfiguration
            title: >-
              The options shall carry the summarizer, the system instructions, the tools, the
              provider window size and the compaction policy, requiring only the summarizer,
              defaulting the rest, and copying the supplied tools into storage the options own.
            justification: |
              These five are everything the engine needs and nothing it does not. The summarizer is
              required because compaction cannot happen without one and defaulting it would give an
              application a session that silently never compacts - the exact failure this package
              exists to prevent. Everything else has a defensible default, so a session can be
              configured in one line and refined later. The tools are copied because the declaration
              tokens are measured once at construction: a caller able to add or remove a tool
              afterwards would change what every future rotation seeds without changing the effective
              window or the threshold derived from it.
            tests:
              - AgentSessionOptions_Construct_Defaults_CarryThePublishedWindowAndPolicy
              - AgentSessionOptions_Construct_NullSummarizer_Throws
              - AgentSessionOptions_Construct_CopiesTheSuppliedTools

          - id: AgentKitSessions-AgentSessionOptions-MeasuresFixedOverhead
            title: >-
              The options shall measure the system prompt and the tool declarations as fixed
              overhead, subtract it from the provider window before applying the rotation threshold,
              and refuse a configuration whose derived threshold is below one token.
            justification: |
              Tool declarations are sent with every request and are never consolidated; for a
              realistic tool set they run to thousands of tokens. Applying the rotation percentage to
              the raw window instead would make the rotation point drift with how many tools an
              application attached: attach more tools and the agent silently gets less conversation
              before rotating, with nothing in the configuration saying so. A derived threshold below
              one token is refused rather than clamped, because truncation can otherwise produce
              zero, and a threshold of zero is satisfied by a conversation of no tokens at all - so
              the session would be willing to rotate a context holding nothing, spending summarizer
              work and a fresh provider session on material that does not exist. Refusing states the
              defect where the application wrote it, instead of substituting a figure the host did
              not choose.
            tests:
              - AgentSessionOptions_Construct_SubtractsFixedOverheadBeforeTheThreshold
              - AgentSessionOptions_Construct_SubTokenThreshold_IsRefused

          - id: AgentKitSessions-AgentSessionOptions-AssertsTheBound
            title: >-
              The options shall refuse a configuration whose window is consumed by the fixed
              overhead, and one whose effective window is too small for a rotated context to land
              below the rotation threshold.
            justification: |
              Holding the conversation within the tier budgets and their seeded framing is only what
              makes a rotated context fit the window; landing below the rotation threshold is what
              makes the session converge. A window between the two satisfies the first and fails the
              second: the session rotates, the rotated layout is still at or above the threshold, and
              it rotates again on the next turn, forever, raising no saturation signal because each
              consolidation reduces normally. A session whose overhead consumed the window would have
              no room for a conversation at all. Both are defects in the composing application,
              refused where the application wrote them rather than discovered from a session that
              never settles. The figures compared are this library's estimates, so the refusal is as
              approximate as they are; it excludes the arrangements that cannot work rather than
              proving that the rest will. The refusal states the window the configuration would have
              needed, and that figure must be computable for every policy a policy constructor
              accepts - including one whose rotated context would occupy exactly the largest
              representable token count, and one whose rotation fraction is so small that the window
              it implies is not representable at all, where the requirement saturates rather than
              being reported as a defect in the arithmetic that computes it or counted up to a token
              at a time. The overhead the refusal is measured against is accumulated in a wider type
              than a token count and rejected before it is narrowed, at the point it becomes
              computable, so no later site inherits a figure that wrapped.
            tests:
              - AgentSessionOptions_Construct_WindowSmallerThanTierBudgets_Throws
              - AgentSessionOptions_Construct_OverheadConsumesTheWindow_Throws
              - AgentSessionOptions_Construct_WindowBelowTheConvergencePoint_IsRefused
              - AgentSessionOptions_Construct_PolicyBoundAtTheLargestTokenCount_ReportsTheWindowItWouldNeed
              - AgentSessionOptions_Construct_RotationFractionNoWindowSatisfies_ReportsTheSaturatedRequirement

          - id: AgentKitSessions-AgentSessionOptions-RejectsMalformedConfiguration
            title: >-
              The options shall reject a non-positive provider window and a null tool.
            justification: |
              A non-positive window leaves nothing to rotate within. A null tool cannot have its
              declaration estimated, and skipping it would understate the fixed overhead and delay
              rotation past the point it was meant to fire - a quiet miscalculation rather than a
              visible failure.
            tests:
              - AgentSessionOptions_Construct_NonPositiveWindow_Throws
              - AgentSessionOptions_Construct_NullTool_Throws
