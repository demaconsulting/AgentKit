---
# Software Unit Requirements for AgentSessionOptions
#
# These requirements describe the design-level behavior of the AgentSessionOptions unit.

sections:
  - title: AgentKitSessions Requirements
    sections:
      - title: AgentSessionOptions Requirements
        requirements:
          - id: AgentKitSessions-AgentSessionOptions-CarriesConfiguration
            title: >-
              The options shall carry what an application configured - the summarizer, the
              instructions, the tools, the provider window and the compaction policy - and shall derive
              the effective window and rotation threshold from it.
            justification: |
              The options are the one place an application states what its session is. Only the
              summarizer is required, because compaction cannot happen without one and defaulting it
              would give a session that silently never compacts; everything else defaults. The
              effective window and rotation threshold are derived once so that every later comparison
              uses the same figures.
            tests:
              - AgentSessionOptions_Construct_CarriesConfiguration
              - AgentSessionOptions_Construct_Defaults

          - id: AgentKitSessions-AgentSessionOptions-MeasuresFixedOverhead
            title: >-
              The options shall measure the fixed overhead of the system prompt and tool declarations
              and subtract it from the provider window before the rotation percentage is applied.
            justification: |
              The system prompt and tool declarations are present on every turn and are never
              consolidated, so applying a percentage to the raw window would make the rotation point
              drift with how many tools an application attached. The measurement is the character-ratio
              estimate, applied only to the configured window and never to a figure a provider
              reported.
            tests:
              - AgentSessionOptions_Construct_MeasuresFixedOverhead

          - id: AgentKitSessions-AgentSessionOptions-DerivesRotationThreshold
            title: >-
              The options shall derive the estimated rotation threshold from the effective window and
              the internal rotation fraction, never below one token.
            justification: |
              When a provider reports no window of its own, the estimated conversation size is compared
              against this threshold, so both sides of the comparison are estimates and neither is
              corrupted by the other's currency. The floor of one token keeps a fraction too small to
              survive truncation from meaning "rotate a conversation holding nothing". What the options
              do not do is predict, in advance and in a currency they cannot measure, whether the
              arrangement will settle: the round-robin structure escalates and drops until the context
              fits, and reports how hard it is working, rather than refusing a window before a session
              starts.
            tests:
              - AgentSessionOptions_Construct_CarriesConfiguration
              - AgentSessionOptions_Construct_MeasuresFixedOverhead

          - id: AgentKitSessions-AgentSessionOptions-RejectsMalformedConfiguration
            title: >-
              The options shall reject a null summarizer, a non-positive provider window, a null tool
              declaration, and an overhead that leaves no room for conversation.
            justification: |
              Each is a defect in the host's configuration code, surfaced where the application wrote
              it. A null summarizer would give a session that never compacts; a non-positive window is
              meaningless; a null declaration cannot be estimated; and an overhead that consumes the
              whole window leaves nothing for the conversation.
            tests:
              - AgentSessionOptions_Construct_NullSummarizer_Throws
              - AgentSessionOptions_Construct_UnworkableWindow_Throws
              - AgentSessionOptions_Construct_NullTool_Throws
