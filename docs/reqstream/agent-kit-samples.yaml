---
# Software System Requirements for AgentKit Samples
#
# The samples are demonstration applications delivered as source in the repository rather than as a
# published package. They are still locally-developed software with their own test projects, so
# their requirements are demonstration requirements: what each sample must prove to a reader, rather
# than a library capability. Each system requirement decomposes into the unit requirements of one
# sample and is evidenced by that sample's own tests.

sections:
  - title: AgentKitSamples Requirements
    requirements:
      - id: AgentKitSamples-Consumption-DemonstratesAttachingShippedTools
        title: >-
          The samples shall demonstrate to a reader how an application attaches AgentKit's shipped
          tool packs to an agent under a policy that grants a workspace to read and a separate
          location to write.
        tags: [system]
        justification: |
          The first question a reader brings to AgentKit is how to consume it: how a policy, its
          grants, and the composed tool set fit together, and how the safety model an application
          buys — containment, asymmetric read and write grants, and the relative-versus-absolute
          path dialect — is expressed in the instructions the application hands its agent. The
          document-assistant sample answers that question, so it exists to make the consumption path
          observable rather than to add a library capability. This requirement decomposes into that
          sample's demonstrations.
        children:
          - AgentKitSamples-DocumentAssistant-InstructionsNameBothGrantedLocations
          - AgentKitSamples-DocumentAssistant-InstructionsReflectReadOnlyGrant
          - AgentKitSamples-DocumentAssistant-InstructionsAreBuiltPerRun
          - AgentKitSamples-DocumentAssistant-InstructionsStateNoShellOrWeb
          - AgentKitSamples-DocumentAssistant-InstructionsKeepDiscoveryAndRefusalGuidance
          - AgentKitSamples-DocumentAssistant-InstructionsKeepPathDialectGuidance
        tests:
          - AgentComposition_BuildInstructions_WritableWorkspace_NamesBothLocationsWithAccess

      - id: AgentKitSamples-CrossTurn-DemonstratesWorkAcrossTurns
        title: >-
          The samples shall demonstrate to a reader how an agent plans, remembers, and delegates
          safely across turns, drawing on the todo, memory, and agent tool families over a read-only
          corpus and a separate writable notes location.
        tags: [system]
        justification: |
          The second question a reader brings to AgentKit is how an agent works across turns rather
          than within one: how it writes a plan down before it acts, files a finding with the
          document it came from, refuses a contradicting restatement, delegates a task to a
          contained child that shares none of its plan or record, and answers a later question from
          memory alone. The research-assistant sample answers that question and supplies its own
          offline embedding backend so a reader can run it with nothing installed. This requirement
          decomposes into that sample's demonstrations.
        children:
          - AgentKitSamples-ResearchAssistant-InstructionsNameGrantedLocations
          - AgentKitSamples-ResearchAssistant-InstructionsAppendPublishedGuidance
          - AgentKitSamples-ResearchAssistant-InstructionsRequireProvenanceOnRevision
          - AgentKitSamples-ResearchAssistant-InstructionsWarnRecallHasNoFloor
          - AgentKitSamples-ResearchAssistant-InstructionsRequireASubjectOnlyDescriptor
          - AgentKitSamples-ResearchAssistant-InstructionsRequireConclusionsWrittenToNotes
          - AgentKitSamples-ResearchAssistant-InstructionsRequirePlanBeforeWork
          - AgentKitSamples-ResearchAssistant-InstructionsDescribeDelegationTruthfully
          - AgentKitSamples-ResearchAssistant-ComposesTheThreeCrossTurnFamilies
          - AgentKitSamples-ResearchAssistant-GatesDelegationOnTheHostGrant
          - AgentKitSamples-ResearchAssistant-ContainsDelegatedChild
          - AgentKitSamples-ResearchAssistant-RecallTurnCarriesMemoryOnly
          - AgentKitSamples-ResearchAssistant-RecallTurnSharesTheFiledStore
          - AgentKitSamples-ResearchAssistant-SuppliesTheEmbeddingBackend
          - AgentKitSamples-ResearchAssistant-CommandLineRequiresCorpus
          - AgentKitSamples-ResearchAssistant-CommandLineRejectsUnknownInput
          - AgentKitSamples-ResearchAssistant-CommandLineDefaultsToAnOfflineRun
          - AgentKitSamples-ResearchAssistant-CommandLineAccumulatesPrompts
          - AgentKitSamples-ResearchAssistant-CommandLineKeepsRecallQuestionApart
          - AgentKitSamples-ResearchAssistant-CommandLineResolvesCredentialWithoutPrinting
          - AgentKitSamples-ResearchAssistant-CommandLineDescribesTheRunHonestly
          - AgentKitSamples-ResearchAssistant-DescriptorPhrasingDecidesConflictDetection
          - AgentKitSamples-ResearchAssistant-OfflineEmbeddingsAreStableAndUnit
          - AgentKitSamples-ResearchAssistant-OfflineEmbeddingsRankByWordingNotMeaning
        tests:
          - AgentComposition_BuildTools_DelegationEnabled_ComposesPlanningMemoryAndDelegation

      - id: AgentKitSamples-Extension-DemonstratesAuthoringCustomTools
        title: >-
          The samples shall demonstrate to a reader how an application author writes their own
          guarded tools and publishes them as packs that compose alongside a shipped pack.
        tags: [system]
        justification: |
          The third question a reader brings to AgentKit is how to extend it: how an author writes a
          tool of their own that goes through the same guarded construction path and pack contract
          as a shipped tool, whether the tool takes a path and so consults the policy or takes none
          and so does not. The custom-tools sample answers that question with two author-written
          packs composed on the same builder as a shipped pack. This requirement decomposes into
          that sample's demonstrations.
        children:
          - AgentKitSamples-CustomTools-ComposesCustomPacksAlongsideShippedPack
          - AgentKitSamples-CustomTools-PathTakingToolReturnsStructuredCounts
          - AgentKitSamples-CustomTools-PathTakingToolRefusesEscape
          - AgentKitSamples-CustomTools-PathTakingToolAnswersDiscovery
          - AgentKitSamples-CustomTools-NoPathToolReturnsStructuredResult
          - AgentKitSamples-CustomTools-InstructionsNameWorkspaceAndCustomTools
        tests:
          - AgentComposition_BuildTools_ComposesCustomPacksWithShippedPack
