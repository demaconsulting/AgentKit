---
# Software System Requirements for AgentKit ChatClient Agents
#
# These requirements describe the externally visible behavior of the library
# from the perspective of its consumers, without specifying implementation details.

sections:
  - title: AgentKitAgentsChatClient Requirements
    requirements:
      - id: AgentKitAgentsChatClient-AgentConstruction-FromChatClientAndTools
        title: >-
          The library shall build a Microsoft Agent Framework agent from any Microsoft.Extensions.AI
          chat client and a supplied tool list, carrying the supplied instructions and name.
        tags: [system]
        justification: |
          A provider reached through an IChatClient carries no tools of its own, so supplying an
          application's tools is the whole of what an adapter must do to turn a chat client into a
          usable agent. Naming the agent and giving it instructions are the two other things a host
          expects to pass through, so the adapter accepts both and forwards them to the framework's
          own agent type rather than reinventing an agent of its own.
        children:
          - AgentKitAgentsChatClient-ChatClientAgentFactory-BuildsAgent
          - AgentKitAgentsChatClient-ChatClientAgentFactory-RejectsNullClient
          - AgentKitAgentsChatClient-ChatClientAgentFactory-RejectsInvalidToolList
        tests:
          - AgentKitAgentsChatClient_Create_BuildsAgentCarryingSuppliedName

      - id: AgentKitAgentsChatClient-ImagePromotion-AlwaysInstalled
        title: >-
          The library shall install the image-promoting decorator on every agent and every provider
          session it builds, beneath the function-invocation loop, and shall provide no option to omit
          it.
        tags: [system, security]
        justification: |
          A provider reached through an IChatClient preserves an image a tool returns all the way
          through the framework and then drops it at the wire, after which the model describes an
          image it never received and nothing reports an error. Forgetting to install the decorator
          therefore breaks images silently. This library exists to make that omission impossible: it
          wraps the supplied client in the image-promoting decorator unconditionally, beneath the
          loop where a tool-returned image exists to be promoted, and exposes no parameter to
          disable it. A caller cannot forget what a caller cannot turn off. A session is exposed to
          the same silent drop as an agent, so both paths carry the decorator; a guarantee that held
          on only one of them would fail exactly where a long conversation made it matter most.
        children:
          - AgentKitAgentsChatClient-ChatClientAgentFactory-DecoratorAlwaysInstalled
          - AgentKitAgentsChatClient-ChatClientProviderSessionFactory-PromotesToolReturnedImages
        tests:
          - AgentKitAgentsChatClient_Create_InstallsImagePromotingDecoratorOnTheAgent
          - AgentKitAgentsChatClient_ImagePromotion_ToolReturnedImage_ReachesProviderOnUserMessage

      - id: AgentKitAgentsChatClient-BuiltOnAgentFramework
        title: >-
          The library shall present the agent it builds as a Microsoft.Agents.AI AIAgent
          constructed through the framework's ChatClientAgent.
        tags: [system]
        justification: |
          The library does not implement an agent runtime; it adapts a chat client to the one
          Microsoft Agent Framework supplies, so the agent it returns is the framework's own
          AIAgent built through ChatClientAgent. The requirement records the repository's reliance
          on that off-the-shelf abstraction and links its OTS requirements to the system root; see
          OTS Integration Design (docs/design/ots.md).
        children:
          - AgentKit-OTS-MicrosoftAgentsAI-Agent
          - AgentKit-OTS-MicrosoftAgentsAI-ChatClientAgent
        tests:
          - AgentKitAgentsChatClient_Create_BuildsAgentCarryingSuppliedName

      - id: AgentKitAgentsChatClient-SessionAdapter-CarriesACoreSession
        title: >-
          The library shall carry an AgentKit Core session over any Microsoft.Extensions.AI chat
          client, seeding each session from the instructions, tools and history the session engine
          supplies and resending the accumulated conversation on every turn.
        tags: [system]
        justification: |
          Ollama, OpenAI and AI Foundry all reach this library as a chat client, and none of them
          keeps the conversation: every turn sends the whole message list again. One adapter
          therefore serves the entire stateless family, and writing it once means the mapping
          between this library's transcript entries and chat messages - the part most likely to rot,
          because tool-calling shapes differ between providers - exists in a single place. Without
          it an application would have to write that mapping itself before Core's compacting session
          could run against the provider it already chose.
        children:
          - AgentKitAgentsChatClient-ChatClientProviderSession-SeedsAMessageList
          - AgentKitAgentsChatClient-ChatClientProviderSession-SendsTheWholeConversationEachTurn
          - AgentKitAgentsChatClient-ChatClientProviderSession-RecordsToolTraffic
          - AgentKitAgentsChatClient-ChatClientProviderSession-ReleasesWithoutDisposingTheClient
          - AgentKitAgentsChatClient-ChatClientProviderSession-RejectsInvalidArguments
          - AgentKitAgentsChatClient-ChatClientProviderSessionFactory-CreatesSessionsCarryingItsClientAndWindow
          - AgentKitAgentsChatClient-ChatClientProviderSessionFactory-OwnsTheSessionPipeline
          - AgentKitAgentsChatClient-ChatClientProviderSessionFactory-SeedsTheCreatedSession
          - AgentKitAgentsChatClient-ChatClientProviderSessionFactory-RejectsInvalidArguments
          - AgentKit-OTS-MicrosoftAgentsAI-FunctionInvokingChatClient
        tests:
          - AgentKitAgentsChatClient_Session_AnswersAndReportsTheProvidersOccupancy
          - AgentKitAgentsChatClient_Session_RotatesOnTheProvidersUsage_AndSeedsTheReplacement

      - id: AgentKitAgentsChatClient-SessionAdapter-OccupancyFromTheProvider
        title: >-
          The library shall answer for the context window with the size of the last prompt the
          provider was sent, taken against the window supplied where the provider was configured,
          shall report a session that has sent nothing as occupying nothing, and shall refuse a
          provider that reports no usage.
        tags: [system]
        justification: |
          The session engine holds no token arithmetic: it asks the provider session how full it is
          and out of how much, and believes the answer. This adapter is where that answer comes from,
          so it must come from the provider rather than from an estimate - and it must be the
          conversation's size rather than a total. A tool-using turn is several requests, and the
          response the tool-calling layer returns reports usage summed across all of them; read as
          occupancy that figure would have a tool-using agent, which is every agent this library
          exists for, believe its window was full on its first turn, rotate on every turn after it,
          and eventually discard history to reclaim room it never occupied. The prompt of the last
          request is the conversation. The window is supplied at construction because a chat client
          publishes none, while one layer down it is nearly always readable - Ollama reports the
          loaded model's context length - or known, a hosted model's window being a published
          property of the model the application chose. A provider answering without reporting usage
          is refused rather than estimated around, because estimating would mean guessing forever at
          the single fact the whole arrangement turns on.
        children:
          - AgentKitAgentsChatClient-ChatClientProviderSession-ReportsProviderUsage
          - AgentKitAgentsChatClient-ChatClientProviderSession-ZeroBeforeTheFirstTurn
          - AgentKitAgentsChatClient-ChatClientProviderSession-RefusesUnreportedUsage
          - AgentKitAgentsChatClient-PromptSizeRecordingChatClient-RecordsEachRequestsPrompt
          - AgentKitAgentsChatClient-PromptSizeRecordingChatClient-ReportsNothingUntilOneIsReported
          - AgentKitAgentsChatClient-PromptSizeRecordingChatClient-RecordsStreamedUsage
        tests:
          - AgentKitAgentsChatClient_Session_AnswersAndReportsTheProvidersOccupancy
          - AgentKitAgentsChatClient_Session_RotatesOnTheProvidersUsage_AndSeedsTheReplacement

      - id: AgentKitAgentsChatClient-Consolidation-ThroughASeparateChatClient
        title: >-
          The library shall consolidate session history through a chat client of the application's
          choosing, out of the session being compacted, using the consolidation prompt AgentKit Core
          publishes.
        tags: [system]
        justification: |
          Compaction cannot happen without a summarizer, and the mechanism is this library's to
          guarantee rather than every application's to write. Consolidation runs through a client the
          application chooses and deliberately separate from the one carrying the conversation: a
          consolidation sent through the live session would consume the very context it exists to
          reclaim, which was measured on a real backend and is why the contract takes a summarizer at
          all rather than reducing in place. A smaller and cheaper model is usually the right choice,
          because consolidation is summarization rather than reasoning.
        children:
          - AgentKitAgentsChatClient-ChatClientSummarizer-SendsTheConsolidationPrompt
          - AgentKitAgentsChatClient-ChatClientSummarizer-CarriesNoToolsOrHistory
          - AgentKitAgentsChatClient-ChatClientSummarizer-EmptyAnswerIsAnEmptyRecord
          - AgentKitAgentsChatClient-ChatClientSummarizer-RejectsInvalidArguments
        tests:
          - AgentKitAgentsChatClient_Session_RotatesOnTheProvidersUsage_AndSeedsTheReplacement
