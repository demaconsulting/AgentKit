---
# Software Unit Requirements for ChatClientProviderSessionFactory
#
# These requirements describe the design-level behavior of the ChatClientProviderSessionFactory unit.

sections:
  - title: AgentKitAgentsChatClient Requirements
    sections:
      - title: ChatClientProviderSessionFactory Requirements
        requirements:
          - id: AgentKitAgentsChatClient-ChatClientProviderSessionFactory-CreatesSessionsCarryingItsClientAndWindow
            title: >-
              The factory shall create a chat-client provider session carrying the client and the
              window it holds, once at the start of a conversation and again at every rotation.
            justification: |
              An application states its provider once, where it configures it, and a rotating session
              must not ask for either fact again. Holding the client and the window here is what lets
              the compaction engine ask one question - how full, out of how much - and believe the
              answer, because every session the engine is handed answers against the same window over
              the same client. Each call yields a fresh session, because that is what a rotation
              needs: a new conversation over the provider the application already chose.
            tests:
              - ChatClientProviderSessionFactory_CreateAsync_CreatesSessionCarryingItsClientAndWindow
              - ChatClientProviderSessionFactory_CreateAsync_EachCall_ReturnsADistinctSessionOverTheSameClient

          - id: AgentKitAgentsChatClient-ChatClientProviderSessionFactory-OwnsTheSessionPipeline
            title: >-
              The factory shall build the pipeline each session runs on from the client it was given
              - the prompt-size recorder directly around that client, and tool invocation above it -
              and shall build one per session.
            justification: |
              Both placements decide whether the session is correct, and an application composing
              them itself would sometimes compose something that looks right and is wrong with no
              error to notice. Tool invocation must sit above, because a session seeds its tools into
              every request and a bare client will emit tool calls that nothing answers. The recorder
              must sit underneath, because a turn that calls tools makes several requests and the
              response the tool-calling layer finally returns carries usage summed across all of
              them - read as occupancy, that would have a tool-using agent believe its window was
              full on its first turn. Underneath, each request is seen separately and the last one is
              the conversation. The pipeline is built per session because the figure it records
              belongs to one conversation: shared, it would hand a replacement the figure that
              provoked the rotation, and two sessions run at once would overwrite each other's
              reading, which the concurrency this contract promises does not allow.
            tests:
              - ChatClientProviderSessionFactory_CreateAsync_SeededTool_IsInvokedAndItsResultReachesTheTranscript
              - ChatClientProviderSessionFactory_CreateAsync_ToolUsingTurn_ReportsTheLastRequestsPromptNotTheSum
              - ChatClientProviderSessionFactory_CreateAsync_AfterAnEarlierSessionSpoke_TheReplacementOccupiesNothing

          - id: AgentKitAgentsChatClient-ChatClientProviderSessionFactory-SeedsTheCreatedSession
            title: >-
              The factory shall create the session already holding the seeded instructions, tools and
              history.
            justification: |
              A replacement session must continue the conversation rather than start one, so the seed
              the rotation produced has to reach the session before its first message does. The
              factory therefore passes the seed straight through rather than creating an empty
              session an engine would have to replay into.
            tests:
              - ChatClientProviderSessionFactory_CreateAsync_PassesTheSeedToTheSession

          - id: AgentKitAgentsChatClient-ChatClientProviderSessionFactory-RejectsInvalidArguments
            title: >-
              The factory shall reject a missing client, a window that is not positive, a missing
              seed, and a canceled creation.
            justification: |
              A missing client or a window that is not positive is a defect in the application's
              provider configuration, refused where that configuration was written rather than at the
              first conversation it breaks - and refused here rather than in the session, because
              this is the only place an application can supply either. A canceled creation yields no
              session, so a canceled rotation leaves nothing unowned for the engine to release.
            tests:
              - ChatClientProviderSessionFactory_Constructor_NullClient_Throws
              - ChatClientProviderSessionFactory_Constructor_NonPositiveWindow_Throws
              - ChatClientProviderSessionFactory_CreateAsync_NullSeed_Throws
              - ChatClientProviderSessionFactory_CreateAsync_Canceled_Throws

          - id: AgentKitAgentsChatClient-ChatClientProviderSessionFactory-PromotesToolReturnedImages
            title: >-
              The factory shall install image promotion in every session pipeline it builds.
            justification: |
              A provider whose tool-result channel cannot carry an image drops one at the wire and
              answers anyway, describing an image it never received, with nothing in the exchange
              reporting an error. A session is as exposed to that as an agent is, so the decorator is
              installed here unconditionally for the same reason the agent factory installs it: a
              guarantee an application can forget is not a guarantee. It sits beneath the
              function-invocation loop, where it can observe the tool result it has to promote, and
              above the recorder, so the occupancy read includes any message it promoted.
            tests:
              - ChatClientProviderSessionFactory_CreateAsync_ToolReturningAnImage_PromotesItOntoAUserMessage
