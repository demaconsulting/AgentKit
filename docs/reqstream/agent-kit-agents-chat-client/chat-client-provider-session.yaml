---
# Software Unit Requirements for ChatClientProviderSession
#
# These requirements describe the design-level behavior of the ChatClientProviderSession unit.

sections:
  - title: AgentKitAgentsChatClient Requirements
    sections:
      - title: ChatClientProviderSession Requirements
        requirements:
          - id: AgentKitAgentsChatClient-ChatClientProviderSession-SeedsAMessageList
            title: >-
              The unit shall turn a provider session seed into a message list carrying the
              instructions as a leading system message, the seeded history in order, and the seeded
              tools as tools rather than as conversation.
            justification: |
              A provider reached through a chat client keeps no conversation, so seeding a session is
              starting a message list and nothing more. The instructions lead because that is where a
              provider expects to find them, and the history follows in the order the compaction
              engine produced it - most stable first - so the provider reads the conversation the
              engine believes it holds. Tools are carried as request options because providers accept
              capability separately from conversation, which is also why they are accounted for as
              fixed overhead rather than as history. A seed carrying no instructions contributes no
              system message, rather than an empty one a provider would have to interpret.
            tests:
              - ChatClientProviderSession_Send_Seed_ProducesInstructionsHistoryAndToolsInOrder
              - ChatClientProviderSession_Send_SeedWithoutInstructions_SendsNoSystemMessage

          - id: AgentKitAgentsChatClient-ChatClientProviderSession-SendsTheWholeConversationEachTurn
            title: >-
              The unit shall accumulate the conversation itself and send the whole of it on every
              turn, appending everything the provider produced.
            justification: |
              Ollama, OpenAI and AI Foundry all reach this library as a chat client and none of them
              holds the conversation: every turn sends the whole message list again. The session is
              therefore the only thing that remembers the exchange, so it appends both what it sent
              and everything that came back, and the next turn sends again a history the provider has
              already seen. A session that sent only the new message would present the provider with
              an isolated turn and lose the conversation the compaction engine exists to preserve.
            tests:
              - ChatClientProviderSession_Send_SecondTurn_SendsTheWholeConversationAgain

          - id: AgentKitAgentsChatClient-ChatClientProviderSession-ReportsProviderUsage
            title: >-
              The unit shall report the provider's own count of the input it last answered, taken
              against the window supplied at construction, and shall report a provider that has
              overrun that window as full.
            justification: |
              The input tokens a provider counted for the request it just answered are exactly the
              occupancy a rotation decision needs, and they are the only figure in the provider's own
              currency. The window cannot come from the same place - a chat client publishes no
              context window - so it is supplied once where the provider is configured and reported
              beside the count thereafter. A provider that has already overrun its own window is
              reported as full rather than beyond it: the usage shape refuses a figure larger than the
              window, and being at the limit is both the truthful reading and the one that rotates.
            tests:
              - ChatClientProviderSession_CurrentUsage_AfterTurn_ReportsTheProvidersInputTokens
              - ChatClientProviderSession_CurrentUsage_ProviderOverrunsTheWindow_ReportsFull

          - id: AgentKitAgentsChatClient-ChatClientProviderSession-ZeroBeforeTheFirstTurn
            title: >-
              The unit shall report occupying nothing before its first turn, including immediately
              after a rotation has seeded it.
            justification: |
              A stateless provider receives the conversation with the request, so a session that has
              made no request occupies nothing of the provider's window however much it holds. That
              is not a special case for a new conversation: it is the state every replacement session
              is created in, holding a seed the provider has not seen yet. Reporting the seed's size
              instead would charge the provider for something it was never sent, and would have the
              engine rotate a session that has not yet spoken.
            tests:
              - ChatClientProviderSession_CurrentUsage_BeforeFirstTurn_IsZero

          - id: AgentKitAgentsChatClient-ChatClientProviderSession-RefusesUnreportedUsage
            title: >-
              The unit shall refuse a turn whose answer reported no token usage, with a message
              naming the missing fact and what the application can do about it.
            justification: |
              Knowing when the window is filling is the one thing this library needs a token count
              for, so estimating an absent figure would mean guessing forever at the single fact the
              whole arrangement turns on. Every provider reached this way reports usage - Ollama
              returns its prompt evaluation count and the hosted services report usage with every
              response - so an absent figure means something is wrong that the application can see and
              fix. Saying so, and naming the remedy, is more use than a number nobody can trust.
            tests:
              - ChatClientProviderSession_Send_ProviderReportsNoUsage_Throws

          - id: AgentKitAgentsChatClient-ChatClientProviderSession-RecordsToolTraffic
            title: >-
              The unit shall record a turn's tool calls and results as paired transcript entries
              carrying the provider's own call identifier, and shall record an answer delivered
              alongside a tool call exactly once.
            justification: |
              The transcript is what a rotation consolidates, so a tool call has to be recorded
              beside the result that answered it, under the identifier the provider paired them with,
              for the pair to survive consolidation together. A provider may deliver its answer on the
              same message as a call it is making; recording that message's text as an assistant entry
              there, when the turn's answer is recorded as the final entry anyway, would show the model
              saying the same thing twice and bill the conversation for it twice.
            tests:
              - ChatClientProviderSession_Send_ToolCallAndResult_AreRecordedAsAPairCarryingTheCallId
              - ChatClientProviderSession_Send_AnswerAlongsideAToolCall_IsNotRecordedTwice
              - ChatClientProviderSession_Send_ToolCallWithoutArguments_RecordsTheBareCall

          - id: AgentKitAgentsChatClient-ChatClientProviderSession-ReleasesWithoutDisposingTheClient
            title: >-
              The unit shall forget its conversation on release, mark itself spent, refuse later
              turns, and leave the supplied chat client undisposed.
            justification: |
              The provider holds nothing to release, so releasing a session is forgetting the
              conversation it accumulated and refusing to take another turn - a released session must
              not quietly start a fresh conversation against the provider. The client is deliberately
              left alone: it was supplied by the application, is shared by every session a rotation
              creates, and outlives all of them, so a session that disposed it would make the first
              rotation the last. Releasing twice is permitted, because a rotation and a disposal may
              both reach the same session.
            tests:
              - ChatClientProviderSession_Dispose_MarksReleasedAndRejectsLaterTurns
              - ChatClientProviderSession_Dispose_DoesNotDisposeTheSuppliedClient
              - ChatClientProviderSession_Dispose_Twice_IsPermitted

          - id: AgentKitAgentsChatClient-ChatClientProviderSession-RejectsInvalidArguments
            title: >-
              The unit shall reject a missing client, a missing seed, a window that is not positive,
              a missing message, and a canceled turn, sending nothing when it refuses.
            justification: |
              Each is a defect in the composing application rather than a provider condition, so each
              is refused where the application wrote it rather than discovered at the first
              conversation. A window that is not positive is refused because every occupancy reading
              is taken against it. A canceled turn is refused before anything is sent, so cancellation
              costs no call and leaves no message the provider saw but the transcript does not record.
            tests:
              - ChatClientProviderSession_Constructor_NullClient_Throws
              - ChatClientProviderSession_Constructor_NullSeed_Throws
              - ChatClientProviderSession_Constructor_NonPositiveWindow_Throws
              - ChatClientProviderSession_Send_NullMessage_Throws
              - ChatClientProviderSession_Send_Canceled_ThrowsAndSendsNothing
