---
# Product-level capability requirements for AgentKit.
#
# These state what AgentKit delivers to an application author, above any one package. A
# provider adapter's requirements describe mechanism — how a session is seeded, where an
# allow-list comes from, which channel a record travels on — and a mechanism is only worth
# having because of a capability it delivers. Each capability here names the mechanisms
# beneath it as children, including the OTS requirements the capability rests on, so
# `dotnet reqstream --requirements requirements.yaml --enforce` reports an adapter or OTS
# requirement that contributes to no capability.
#
# This file belongs to no system: it sits above all four. It is included from
# requirements.yaml alongside docs/reqstream/quality.yaml, and is reviewed in the
# repository-level Decomposition review-set for the same reason.
sections:
  - title: AgentKit Product Requirements
    requirements:
      - id: AgentKit-Provider-GitHubCopilot
        title: >-
          AgentKit shall build and run a guarded agent on the GitHub Copilot runtime, and shall
          carry a conversation on it that outlives the runtime's context window.
        tags: [system]
        justification: |
          An application author who has chosen GitHub Copilot as the runtime should get what
          AgentKit promises on any provider: an agent that can use only the tools the application
          granted it, and a conversation that does not end when the window fills. Neither comes
          from the runtime. Copilot arrives as a complete agent runtime carrying its own tools, and
          it compacts its own sessions on its own schedule. Supporting Copilot therefore means
          taking both of those back, and this is where that support is promised and shown to work
          end to end. Everything linked beneath it is how.

          The offline scenarios linked here reach the library rather than the runtime, so the "on the
          GitHub Copilot runtime" half of the promise is carried by the opt-in live suite recorded with
          the capability's verification — run by hand and weekly, outside the merge gate and the trace
          matrix.
        children:
          - AgentKitAgentsCopilot-ToolSuppression-AllowListDerived
          - AgentKitAgentsCopilot-PermissionHandler-DefaultSafe
          - AgentKitAgentsCopilot-AgentConstruction-Validated
          - AgentKitAgentsCopilot-SessionAdapter-CarriesACoreSession
          - AgentKitAgentsCopilot-SessionAdapter-OccupancyFromTheRuntime
          - AgentKitAgentsCopilot-SelfCompaction-HeldClearOfRotation
          - AgentKitAgentsCopilot-Consolidation-OutOfSession
          - AgentKitAgentsCopilot-Agent-RunsConversations
          - AgentKitAgentsCopilot-ToolResults-DeliveredInline
          - AgentKitAgentsCopilot-RuntimeStartup-Diagnosable
          - AgentKitAgentsCopilot-ToolOutput-ReadersPublishedAndPermitted
          - AgentKitAgentsCopilot-Runtime-OwnedAndConfined
          - AgentKitAgentsCopilot-Runtime-InstalledCliByDefault
          - AgentKit-OTS-MicrosoftCopilotSDK-SessionOptions
          - AgentKit-OTS-MicrosoftCopilotSDK-PermissionRpc
          - AgentKit-OTS-MicrosoftCopilotSDK-SessionLifecycle
          - AgentKit-OTS-MicrosoftCopilotSDK-SessionEvents
          - AgentKit-OTS-MicrosoftCopilotSDK-McpAndPluginControl
          - AgentKit-OTS-MicrosoftCopilotSDK-EmptyModeSpawnedRuntime
          - AgentKit-OTS-MicrosoftAgentsAIAbstractions-AIAgent
        tests:
          - AgentKitAgentsCopilot_BuildSessionConfig_AvailableToolsDerivedFromSuppliedTools
          - AgentKitAgentsCopilot_Session_BuiltInToolRequest_IsRejectedOnTheSessionPath
          - AgentKitAgentsCopilot_Session_RotatesOnTheRuntimesUsage_AndSeedsTheReplacement
          - AgentKitAgentsCopilot_Agent_RunsAndStreamsOnTheRuntime

      - id: AgentKit-Provider-ChatClient
        title: >-
          AgentKit shall build and run a guarded agent on any Microsoft.Extensions.AI IChatClient
          provider, shall carry a conversation on it that outlives the provider's context window, and
          shall deliver what a tool returned to the model intact, including an image the provider
          would otherwise drop at the wire.
        tags: [system]
        justification: |
          Ollama, OpenAI and AI Foundry all reach an application as an IChatClient, so this is the
          capability that lets an author keep the provider already chosen and still get an AgentKit
          agent: the application's tools and nothing else, images that survive the wire, and a
          conversation that outlasts the window. A chat client holds no conversation and publishes
          no window, so an application that wanted this without AgentKit would have to write the
          transcript mapping and the compaction seam itself, once per provider.

          Content fidelity is a third promise rather than part of the first two. It is neither
          confinement nor window survival: a provider reached this way preserves a tool-returned
          image all the way through the framework and then drops it at the wire, after which the
          model describes an image it never received and nothing reports an error. Only this family
          needs the promise — the Copilot runtime delivers a tool's binary results itself — so it is
          stated here rather than at every capability.
        children:
          - AgentKitAgentsChatClient-AgentConstruction-FromChatClientAndTools
          - AgentKitAgentsChatClient-ImagePromotion-AlwaysInstalled
          - AgentKitAgentsChatClient-ImagePromotion-HostBuiltPipeline
          - AgentKitAgentsChatClient-ImagePromotion-NoImageBytesOnTheWire
          - AgentKitAgentsChatClient-ContextProvider-ToolsPerConversation
          - AgentKitAgentsChatClient-ContextProvider-RetentionSurvivesSessionSerialization
          - AgentKitAgentsChatClient-HistoryReducer-PlugsIntoTheAgentFramework
          - AgentKitAgentsChatClient-SessionAdapter-CarriesACoreSession
          - AgentKitAgentsChatClient-SessionAdapter-OccupancyFromTheProvider
          - AgentKitAgentsChatClient-Consolidation-ThroughASeparateChatClient
          - AgentKitAgentsChatClient-ToolOutput-DeliveredUnchanged
          - AgentKit-OTS-MicrosoftAgentsAI-Agent
          - AgentKit-OTS-MicrosoftAgentsAI-ChatClientAgent
        tests:
          - AgentKitAgentsChatClient_Create_BuildsAgentCarryingSuppliedName
          - AgentKitAgentsChatClient_Create_InstallsImagePromotingDecoratorOnTheAgent
          - AgentKitAgentsChatClient_Session_RotatesOnTheProvidersUsage_AndSeedsTheReplacement

      - id: AgentKit-Provider-Ollama
        title: >-
          AgentKit shall run a guarded agent on a model served by Ollama, and shall carry a
          conversation on it that outlives the context window that Ollama server actually enforces.
        tags: [system]
        justification: |
          An author running a model on their own Ollama server should get what AgentKit promises
          anywhere else: an agent that can use only the tools the application granted it, and a
          conversation that does not end when the window fills. Ollama reaches that author as an
          IChatClient, so the agent and the compacting session here are
          AgentKit-Provider-ChatClient's - there is no Ollama session, agent or summarizer, and
          shipping one would be a second implementation of what already works. This is stated as a
          capability of its own because that capability cannot keep the second half of its promise
          on Ollama unaided.

          A compacting session has to be told a window, because an IChatClient publishes none, and
          on Ollama the number that matters is the one the running instance is using, which is not
          the one the model file advertises. Ollama decides an instance's context length when it
          loads the model, and the gap between the two is large and in the dangerous direction: a
          live server published 262,144 tokens for a model it was observed running at 65,536, then
          8,192, then 4,096 within a single session. A session sized against the published figure
          keeps going until the server has already discarded the start of the conversation, and
          nothing downstream reports an error or can detect it afterwards.

          What AgentKit adds for Ollama is therefore twofold, and the second half is what makes the
          promise honest. The window is read from the running instance rather than from the model
          file, so nothing that describes only what the file could support is ever reported. And an
          application that wants a particular window can ask for one: the size it states rides on
          every request the conversation sends, which is what decides the instance Ollama loads. The
          figure the session accounts against is then the figure the instance is running, by
          construction rather than by hope, and where nothing was stated and nothing is loaded the
          answer is a conservative assumption named as one.

          Confinement and rotation are demonstrated on the IChatClient family by
          AgentKit-Provider-ChatClient's own scenario, cited below because Ollama is a member of
          that family and nothing about that half is Ollama-specific. The scenarios that belong to
          this capability are the one that reads the enforced window back out of a payload captured
          verbatim from a live Ollama server, and the one that reads the requested size back off
          the body an Ollama request was sent with - both over HTTP, through the real Ollama
          client, against a server the test starts on loopback. The precedence those figures feed
          is exercised directly, on hand-built loaded-model values.
        children:
          - AgentKitAgentsOllama-ContextWindow-PrecedenceOfReportedFigures
          - AgentKitAgentsOllama-ContextWindow-ConservativeFallbackNamedAsAssumed
          - AgentKitAgentsOllama-ContextWindow-ChosenSizeIsAskedOfTheServer
          - AgentKit-OTS-OllamaSharp-Queries
        tests:
          - AgentKitAgentsOllama_ContextWindow_ReportsTheEnforcedWindowAndNamesItsSource
          - AgentKitAgentsOllama_ContextSizing_EveryRequestAsksTheServerForTheStatedWindow
          - OllamaContextWindow_ReadAsync_ModelLoaded_ReportsTheLengthTheServerEnforces
          - AgentKitAgentsChatClient_Session_RotatesOnTheProvidersUsage_AndSeedsTheReplacement
          - AgentKitAgentsChatClient_ImagePromotion_OverOllamaSharp_ToolMessageCarriesNoImageBytes

      - id: AgentKit-Tools-AnyAgentRuntime
        title: >-
          AgentKit's tools shall be usable as plain Microsoft.Extensions.AI functions in an agent
          runtime AgentKit did not build — a Microsoft Agent Framework chat-client agent or a raw
          IChatClient pipeline — with their result ceilings, per-conversation retention of large
          outputs, image delivery and history consolidation available there.
        tags: [system]
        justification: |
          An application author may already own the agent loop: an Agent Framework agent built by
          hand, or a chat-client pipeline with function invocation. AgentKit's tools are AIFunctions,
          so they run there unchanged, but the controls around them had been reachable only through
          AgentKit's own factories and sessions: a foreign tool beside them was unbounded, retention
          lived and died with one tool list and was lost when the runtime persisted a conversation,
          a tool-returned image never reached an Ollama model, and the consolidation prompt was
          usable only inside AgentKit's session engine. Each control must be available as a building
          block the author's own runtime accepts.
        children:
          - AgentKitCore-ForeignTools-BoundedByLimits
          - AgentKitCore-ToolOutput-PerConversationRetention
          - AgentKitCore-Compaction-HostOwnedHistoryReducer
          - AgentKitAgentsChatClient-ImagePromotion-HostBuiltPipeline
          - AgentKitAgentsChatClient-ContextProvider-ToolsPerConversation
          - AgentKitAgentsChatClient-ContextProvider-RetentionSurvivesSessionSerialization
          - AgentKitAgentsChatClient-HistoryReducer-PlugsIntoTheAgentFramework
        tests:
          - AgentKitCore_SystemForeignTool_GuardedOversizedResult_IsRefused
          - AgentKitCore_SystemToolOutput_RestoredRetention_AnswersAnEarlierReference
          - AgentKitAgentsChatClient_ContextProvider_ToolsReachTheProviderAndRun
          - AgentKitAgentsChatClient_ContextProvider_DeserializedSession_PagesAnEarlierOutput
          - AgentKitAgentsChatClient_ImagePromotion_BuilderExtension_PromotesBeneathFunctionInvocation
          - AgentKitAgentsChatClient_ChatReducer_InMemoryHistoryProvider_ReducesStoredHistory

      - id: AgentKit-ModelSelection
        title: >-
          An application shall be able to list the models GitHub Copilot and Ollama offer with their
          capabilities, filter them by the capabilities it requires, and start a session with
          settings validated against the selected model; an application on an IChatClient provider
          shall be able to validate settings against a model description it builds itself.
        tags: [system]
        justification: |
          The first application built on AgentKit offers its user a choice of model and shows only
          models that can see. It needs the provider's own list, described the same way whichever
          provider it is; a filter on capability; a choice of effort, tier and window the model
          actually accepts; and a check, when the session starts today, that what was chosen
          yesterday is still valid — and that the image tools are offered only because the chosen model
          can see. The description, filtering and validation are AgentKit Core's; reading each
          provider and applying the choice to it are the adapters'.

          The offline scenarios linked here run on captured or hand-built provider descriptions.
          The live listings, the per-tier limits the Copilot runtime reports, and the think and
          num_ctx values an Ollama server receives are recorded by the opt-in live suites.
        children:
          - AgentKitCore-ModelSelection-ListedAndFilteredByCapability
          - AgentKitCore-ModelSelection-ValidatedAtSessionStart
          - AgentKitCore-ModelSelection-HostCapabilitiesFromTheModel
          - AgentKitCore-ModelSelection-AppliedToEveryRequest
          - AgentKitAgentsChatClient-ModelSelection-AppliedToEveryRequest
          - AgentKitAgentsOllama-ModelCatalog-ListsWhatTheServerCanRun
          - AgentKitAgentsOllama-ModelSelection-RunsAsChosen
          - AgentKitAgentsCopilot-ModelCatalog-ListsTheServicesModels
          - AgentKitAgentsCopilot-ModelSelection-AppliedToEverySession
        tests:
          - AgentKitCore_SystemModelSelection_VisionOnlyApp_SelectsAndGatesTheImageFamily
          - AgentKitAgentsChatClient_ModelSelection_EveryRequestOfATurnCarriesTheSelection
          - AgentKitAgentsOllama_ModelSelection_ChosenModelRunsWithItsWindowAndEffort
          - AgentKitAgentsCopilot_ModelSelection_AgentRunsOnTheSelectedModelAndSettings
