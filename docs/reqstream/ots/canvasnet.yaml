---
# CanvasNet OTS Software Requirements
#
# Requirements for the CanvasNet imaging library functionality - the raster core and the Viewer that
# draws documents and diagrams - consumed by the AgentKitToolsVisual package.

sections:
  - title: OTS Software Requirements
    sections:
      - title: CanvasNet Requirements
        requirements:
          - id: AgentKit-OTS-CanvasNet-HeaderProbe
            title: >-
              CanvasNet shall report an image file's header-declared pixel dimensions without
              decoding its pixel data, including for a file whose declared dimensions exceed what
              it will decode.
            justification: |
              The image family states an image's pixel dimensions so that a model has a
              coordinate space in which to name a region, and it decides whether decoding an
              image is affordable before it allocates anything. Both depend on a reader that
              reports what a header declares and stops there — including for a file declaring
              dimensions no decoder would accept, since that is precisely the file the decision
              has to be made about. AgentKit's own tests that read a caption stating a real
              image's size, and that refuse an image declaring more pixels than the host's decode
              budget from a file carrying no pixel data at all, prove the header reader behaves
              as required.
            tags: [ots]
            tests:
              - ImageReadTool_Read_SupportedPng_CaptionStatesThePixelDimensions
              - ImageReadTool_Read_SupportedJpeg_CaptionStatesThePixelDimensions
              - ImageCropTool_Crop_HeaderDeclaringMorePixelsThanTheDecodeBudget_IsRefusedNamingTheBudget

          - id: AgentKit-OTS-CanvasNet-Decode
            title: >-
              CanvasNet shall decode PNG and JPEG files into an addressable pixel buffer,
              including a PNG whose pixels are stored as palette indices.
            justification: |
              The image family returns a region of an image, which requires the whole image to
              exist as addressable pixels first. Palette-indexed storage is called out because it
              is the format most easily mishandled — the file stores one index per pixel and the
              buffer must hold the RGBA those indices resolve to — and because it is the format a
              hostile caller would reach for, since it compresses best. AgentKit's own tests that
              take a region of a palette-indexed PNG and assert the resulting pixel is the
              palette's color rather than a raw index, and that take a region of a JPEG, prove
              the decoder behaves as required; the palette assertion would fail loudly if the
              capability regressed.
            tags: [ots]
            tests:
              - ImageCropTool_Crop_PalettizedPng_ReturnsCroppedImageContent
              - ImageCropTool_Crop_PermittedJpeg_ReturnsPngContent

          - id: AgentKit-OTS-CanvasNet-BoundedInflate
            title: >-
              CanvasNet shall reject PNG pixel data that would inflate beyond the size the file's
              header declares without inflating it.
            tags: [ots, security]
            justification: |
              The image family decides whether decoding an image is affordable from the
              dimensions its header declares, and refuses one that is not before any pixel data
              exists. That decision bounds what decoding costs only if the decoder never inflates
              more than those dimensions imply: compressed pixel data can declare a small image
              and still inflate to gigabytes, from a file well inside the binary ceiling, so a
              decoder that inflated the whole stream before checking its length would let a model
              exhaust a host's memory with an image every check before decoding had admitted.
              AgentKit's own test, which offers the crop tool a PNG declaring sixteen by sixteen
              pixels whose data inflates to half a gigabyte and asserts both the refusal and that
              decoding it allocated a small fraction of that size, proves the bound holds; it fails
              against the 0.1.0 release, which allocated over a gigabyte for that file.
            tests:
              - ImageCropTool_Crop_PngInflatingBeyondItsDeclaredSize_IsRefusedWithoutInflatingIt

          - id: AgentKit-OTS-CanvasNet-Crop
            title: >-
              CanvasNet shall produce an independent copy of a rectangular sub-region of a decoded
              image.
            justification: |
              Returning a region means copying it out of the decoded image, and the copy must be
              independent so that nothing the family does afterwards to either buffer can alter
              the other. AgentKit's round-trip test, which compares every channel of every pixel
              of a returned region against the source it came from, proves the sub-region copy
              addresses the right pixels and carries them intact.
            tags: [ots]
            tests:
              - ImageCropTool_Crop_ReturnedRegion_CarriesTheSourcePixelsExactly

          - id: AgentKit-OTS-CanvasNet-Encode
            title: >-
              CanvasNet shall encode a pixel buffer to a form that reproduces every pixel exactly
              when decoded again.
            justification: |
              The region a model receives is one it asked to examine closely, which is precisely
              the case in which a compression artifact is indistinguishable from the thing being
              examined. An encoder that altered any channel — including the alpha channel an
              encoder might quietly discard — would let a model read an artifact as content.
              AgentKit's round-trip test encodes, decodes and compares every channel of every
              pixel, which is the demonstrable form of that promise.
            tags: [ots]
            tests:
              - ImageCropTool_Crop_ReturnedRegion_CarriesTheSourcePixelsExactly

          - id: AgentKit-OTS-CanvasNet-DecodeFeasibility
            title: >-
              CanvasNet shall report, from an image file's header alone, whether decoding that
              file is expected to succeed.
            justification: |
              The crop tool must tell a model the difference between a file that is damaged and a
              file that is entirely well formed and merely uses a feature the decoder does not
              implement, because the two call for different actions and describing the second as
              damaged would be false. Establishing that difference after a failed decode means
              matching on an exception, and establishing it before the decode means AgentKit
              holding format knowledge of its own — the knowledge a consumer of a decoder should
              never carry. A header reader that reports decode feasibility removes both, and
              generalizes the refusal to any feature the decoder does not implement rather than
              the one this library happened to know how to detect. AgentKit's own test, which
              offers a complete, well-formed Adam7-interlaced PNG to the crop tool and asserts a
              refusal stating the file is well formed rather than undecodable, proves the report
              behaves as required.
            tags: [ots]
            tests:
              - ImageCropTool_Crop_Adam7InterlacedPng_IsRefusedNamingTheDimensions

          - id: AgentKit-OTS-CanvasNet-ViewerRender
            title: >-
              The CanvasNet Viewer shall draw a file given as bytes and a name — SVG, PDF,
              Mermaid, PlantUML, Vega-Lite, OpenSCAD or a raster image — to a picture of a requested
              width on a requested background, drawing the requested page of a document and
              reporting the page count.
            justification: |
              The view tool draws the files a provider cannot render, and every guarantee it makes
              about the picture — its size, its opaque background, the page it shows — rests on
              the Viewer drawing as asked. AgentKit's own tests draw each format, assert the
              background pixel, the requested width and the page of a multi-page document.
            tags: [ots]
            tests:
              - ImageViewTool_View_SupportedFile_ReturnsAPngPicture
              - VisualRenderer_RenderAsync_Svg_IsDrawnOnOpaqueWhite
              - VisualRenderer_RenderAsync_WidthBeyondTheLargestSide_IsReduced
              - VisualRenderer_RenderAsync_DocumentPage_IsDrawnWithThePageCount

          - id: AgentKit-OTS-CanvasNet-FileAccessPolicy
            title: >-
              CanvasNet shall consult a caller-supplied file-access policy for every file a
              rendered document references — pictures, includes and data files, at every level —
              judging the real path of the opened file, and draw none it refuses.
            justification: |
              The confinement of referenced files is AgentKit's policy, but it is enforced inside
              the library, which opens those files itself. AgentKit's own tests refuse a
              parent-folder escape, an absolute path, a link, a file URI and a deny-pattern match,
              for pictures and for included and data files, and observe that none is drawn.
            tags: [ots, security]
            tests:
              - VisualAccess_ToFileAccess_ParentFolderEscape_IsRefused
              - VisualAccess_ToFileAccess_LinkEscape_IsRefused
              - VisualAccess_ToFileAccess_DenyPatternInsideTheGrant_IsRefused
              - VisualAccess_ToFileAccess_IncludedFileOutside_IsRefused

          - id: AgentKit-OTS-CanvasNet-NoNetwork
            title: >-
              CanvasNet shall never fetch a network reference a rendered document makes.
            justification: |
              A render that fetched a URL would let a model-authored document reach other hosts.
              AgentKit's own tests point documents at a local listener and observe that it
              receives no request.
            tags: [ots, security]
            tests:
              - VisualAccess_ToFileAccess_NetworkReference_IsNeverFetched
              - AgentKitToolsVisual_Rendering_NetworkReferences_AreNeverFetched

          - id: AgentKit-OTS-CanvasNet-PixelBudget
            title: >-
              CanvasNet shall refuse a render whose pictures need more pixels than a caller-supplied
              budget, and an OpenSCAD model producing more triangles than a caller-supplied limit.
            justification: |
              The renderer passes the policy's pixel budget and the pack's triangle limit to the
              library, which is where the allocation happens. AgentKit's own tests render under a
              small budget and a small limit and observe the refusals.
            tags: [ots, security]
            tests:
              - VisualRenderer_RenderAsync_PictureOverThePixelBudget_FailsAsBudgetExceeded
              - VisualRenderer_RenderAsync_ModelOverTheTriangleLimit_IsRefused

          - id: AgentKit-OTS-CanvasNet-Cancellation
            title: >-
              CanvasNet shall stop a render when the cancellation token it was given is canceled.
            justification: |
              The render timeout is first a cancellation the library honors; the abandonment
              after a grace period is defense in depth behind it. AgentKit's own test renders a
              model far heavier than the timeout allows and observes the timeout outcome.
            tags: [ots]
            tests:
              - VisualRenderer_RenderAsync_RenderBeyondTheTimeout_FailsAsRenderTimeout

          - id: AgentKit-OTS-CanvasNet-Diagnostics
            title: >-
              CanvasNet shall report a source error with its location in the source, and a feature
              it does not draw as a note with a code, without failing the render.
            justification: |
              The error shaper's location and the notes in a caption both come from the library.
              AgentKit's own tests render a broken source of each format and a source using an
              unsupported construct, and observe the location and the note.
            tags: [ots]
            tests:
              - RenderErrorShaper_Shape_SyntaxError_StatesCodeLineColumnAndCaret
              - VisualRenderer_RenderAsync_UnsupportedFeature_IsReportedAsANote
