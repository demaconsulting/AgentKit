---
# Microsoft.Agents.AI.GitHub.Copilot OTS Software Requirements
#
# Requirements for the Microsoft.Agents.AI.GitHub.Copilot SDK functionality.

sections:
  - title: OTS Software Requirements
    sections:
      - title: Microsoft.Agents.AI.GitHub.Copilot Requirements
        requirements:
          - id: AgentKit-OTS-MicrosoftAgentsAIGitHubCopilot-SessionConfig
            title: >-
              Microsoft.Agents.AI.GitHub.Copilot shall provide a session configuration carrying the
              session's tools and an available-tools allow-list.
            justification: |
              The SDK defines SessionConfig, whose tools collection publishes an agent's tools and
              whose available-tools list is the allow-list that suppresses the runtime's built-in
              tools. The Copilot adapter derives the allow-list from the same collection it assigns
              as the tools. AgentKit's test that constructs the session configuration and observes
              the allow-list is derived from the published tools proves SessionConfig carries both as
              required.
            tags: [ots]
            tests:
              - AgentKitAgentsCopilot_BuildSessionConfig_AvailableToolsDerivedFromSuppliedTools
          - id: AgentKit-OTS-MicrosoftAgentsAIGitHubCopilot-AsAIAgent
            title: >-
              Microsoft.Agents.AI.GitHub.Copilot shall provide a session-config agent-construction
              path that builds an AIAgent from a CopilotClient without taking ownership of the
              client.
            justification: |
              The SDK exposes an agent-construction path that takes a session configuration and a
              client-ownership flag, and is the only path that carries the available-tools allow-list
              — the tool-list path would publish tools without suppressing the built-ins. The adapter
              uses it with ownership left to the host. The construction call itself reaches an
              authenticated Copilot CLI and so is out of automated scope; AgentKit's test that
              constructs the session configuration this path consumes provides the offline evidence
              that the allow-list-carrying configuration is built. See the Copilot adapter
              verification for the honest scope boundary.
            tags: [ots]
            tests:
              - AgentKitAgentsCopilot_BuildSessionConfig_AvailableToolsDerivedFromSuppliedTools
          - id: AgentKit-OTS-MicrosoftAgentsAIGitHubCopilot-PermissionRpc
            title: >-
              Microsoft.Agents.AI.GitHub.Copilot shall provide the permission-request and
              permission-decision RPC types a permission handler is expressed in.
            justification: |
              The SDK defines the permission-request hierarchy — including the custom-tool request
              carrying a tool name — and the permission-decision type with its approve and reject
              results. The adapter's default handler adjudicates a request by constructing a decision
              from these types. AgentKit's tests that build permission requests and assert the
              default handler approves a supplied tool while rejecting an unlisted or built-in request
              prove the RPC types behave as required.
            tags: [ots]
            tests:
              - AgentKitAgentsCopilot_DefaultPermissionHandler_SuppliedTool_IsApproved
              - AgentKitAgentsCopilot_DefaultPermissionHandler_UnlistedCustomTool_IsRejected
              - AgentKitAgentsCopilot_DefaultPermissionHandler_BuiltInTool_IsRejected
          - id: AgentKit-OTS-MicrosoftAgentsAIGitHubCopilot-SessionLifecycle
            title: >-
              Microsoft.Agents.AI.GitHub.Copilot shall provide a session lifecycle that creates a
              session from a configuration, sends one message and waits for the session to become
              idle under a caller-supplied deadline, and releases and deletes the session.
            justification: |
              The Copilot provider session is one AgentKit session over one of these runtime
              sessions: a rotation creates one from a configuration, each turn sends one message and
              waits, and releasing the AgentKit session releases and deletes the runtime's. The
              deadline matters as much as the operations: the SDK applies a sixty-second default when
              told none, so the adapter states an infinite one and governs the turn with the
              cancellation token the session contract already carries. The lifecycle calls themselves
              reach an authenticated Copilot CLI and so are out of automated scope; AgentKit's
              adapter reaches them through one internal seam, and the tests above that seam provide
              the offline evidence that the configuration handed to session creation is correct and
              that a session is released on every path. See the Copilot adapter verification for the
              honest scope boundary.
            tags: [ots]
            tests:
              - AgentKitAgentsCopilot_Session_AnswersAndReportsTheRuntimesOccupancy
              - AgentKitAgentsCopilot_Session_RotatesOnTheRuntimesUsage_AndSeedsTheReplacement
          - id: AgentKit-OTS-MicrosoftAgentsAIGitHubCopilot-SessionEvents
            title: >-
              Microsoft.Agents.AI.GitHub.Copilot shall dispatch session events reporting token usage
              against a limit, tool executions and their outcomes, session errors, and the runtime's
              own compaction and truncation, to a handler registered on the session configuration
              before the session is created.
            justification: |
              A Copilot turn reveals what it did through events rather than through a return value,
              so this is where the adapter's occupancy figure, its tool-traffic record and its
              detection of the runtime rewriting history all come from. Registering the handler on
              the configuration rather than on the session afterwards is what covers the very first
              turn, which the SDK documents and which AgentKit depends on. Every one of these event
              types is constructable, so AgentKit's tests drive the SDK's own event objects through
              the adapter's own matching, offline; what remains out of automated scope is whether a
              live runtime emits them when expected. What a live run did settle, against SDK 1.0.11,
              is that the runtime ignores the infinite-session enablement flag and honors only the
              background-compaction threshold: a session created with the flag set false still
              compacted once its threshold was crossed, and did not compact when it was not. AgentKit
              therefore relies on the threshold and on these announcements, not on the flag.
            tags: [ots]
            tests:
              - AgentKitAgentsCopilot_Session_AnswersAndReportsTheRuntimesOccupancy
              - AgentKitAgentsCopilot_Session_RuntimeCompactionIsHeldClearOfRotationOnEverySessionItBuilds
