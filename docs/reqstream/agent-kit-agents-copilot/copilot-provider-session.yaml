---
# Software Unit Requirements for CopilotProviderSession
#
# These requirements describe the design-level behavior of the CopilotProviderSession unit.

sections:
  - title: AgentKitAgentsCopilot Requirements
    sections:
      - title: CopilotProviderSession Requirements
        requirements:
          - id: AgentKitAgentsCopilot-CopilotProviderSession-SendsOneTurnPerMessage
            title: >-
              The session shall send each message as one turn on the Copilot session it holds and
              shall return the runtime's answer, recording that answer exactly once.
            justification: |
              Copilot holds the conversation itself, so a turn is one prompt rather than a replay of
              the whole history. The runtime delivers its final assistant message twice — as an event
              on the session's stream and as the value the turn returns — so a session that recorded
              both would show the model saying the same thing twice and would bill the conversation
              for it at every rotation. The answer is therefore recorded once, which the transcript's
              trailing-duplicate rule guarantees when the adapter supplies what led to the answer and
              the answer itself.
            tests:
              - CopilotProviderSession_Send_Answer_IsReturnedAndRecordedOnce

          - id: AgentKitAgentsCopilot-CopilotProviderSession-RecordsToolTraffic
            title: >-
              The session shall record each tool call and its result as a pair carrying the runtime's
              own call identifier, recording a failed tool's error as its result, and shall not record
              the tool traffic or messages of a nested agent the runtime ran on its behalf.
            justification: |
              A rotation consolidates whole turns, and pairing a call with its result by the runtime's
              own identifier is what keeps the two together through that. A tool that failed is
              recorded with the error it produced because the model saw that failure and reasoned from
              it, so a history showing the call succeeding would seed a future session with a
              conversation that did not happen. A nested agent's traffic is the opposite case: those
              messages were never part of this conversation and the model was never shown them as
              such, so recording them would seed a future session with a history it does not
              recognize.
            tests:
              - CopilotProviderSession_Send_ToolCallAndResult_AreRecordedAsAPairCarryingTheRuntimesCallId
              - CopilotProviderSession_Send_NestedAgentEvents_AreNotRecorded

          - id: AgentKitAgentsCopilot-CopilotProviderSession-ReportsTheRuntimesUsage
            title: >-
              The session shall report the occupancy, the limit and the conversation's share exactly
              as the Copilot runtime reported them, holding a figure outside the representable range
              to that range and holding a reported conversation larger than the reported total to the
              total, and shall credit the whole reading to the conversation when the runtime reports
              no split.
            justification: |
              Copilot reports both the occupancy and the limit, so the application is never asked for
              a window and nothing is estimated — this is the difference from the stateless adapter,
              and the reason the session engine can run on Copilot at all. The conversation's share is
              passed through rather than inferred, so every threshold comparison downstream is made in
              the runtime's own tokens. Reading usage is documented as unable to fail, so the
              narrowing from the runtime's wider counters is a clamp rather than a checked conversion,
              and a conversation reported larger than the total is held to it rather than refused: the
              alternative would be a reading that throws, which the contract forbids, or a negative
              overhead, which would enlarge the effective window and rotate later than the provider's
              own limit allows. Where the runtime reports no split, the whole reading is credited to
              the conversation, which allows no overhead at all and so rotates strictly earlier than a
              correct split would.
            tests:
              - CopilotProviderSession_CurrentUsage_AfterTurn_ReportsTheRuntimesOccupancyAndLimit
              - CopilotProviderSession_CurrentUsage_ConversationSplit_IsPassedThroughNotInferred
              - CopilotProviderSession_CurrentUsage_NoSplitReported_CreditsItAllToTheConversation
              - CopilotProviderSession_CurrentUsage_LongFiguresBeyondIntRange_AreClamped
              - CopilotProviderSession_CurrentUsage_ConversationBeyondTheTotal_IsHeldToIt

          - id: AgentKitAgentsCopilot-CopilotProviderSession-ZeroBeforeTheFirstTurn
            title: >-
              The session shall report no occupancy before the runtime has reported any, out of a
              placeholder window that cannot trigger a rotation.
            justification: |
              The session engine reads the usage at construction, before any turn and so before
              Copilot has said anything. A session that claimed to be full there would rotate
              immediately and forever, and a plausible-looking invented window would be mistaken for a
              measurement by anyone reading it. Reporting nothing occupied out of a placeholder is
              honest and cannot affect a decision: the rotation test compares the conversation against
              a threshold never below one token, and the conversation is zero until the runtime has
              reported.
            tests:
              - CopilotProviderSession_CurrentUsage_BeforeFirstTurn_OccupiesNothing

          - id: AgentKitAgentsCopilot-CopilotProviderSession-RefusesUnreportedUsage
            title: >-
              The session shall refuse a turn the runtime answered without reporting its token usage.
            justification: |
              Knowing when the window is filling is the one thing the session engine needs a token
              count for, and Copilot reports both figures itself with every turn. An absent reading
              therefore means something is wrong that an application can see and fix, and saying so is
              more use than a number nobody can trust. The refusal happens before anything is
              recorded, so a refused turn leaves the session exactly as it was.

              The question is asked of each turn, not of the session. The reading is kept between
              turns so occupancy does not go blank, so a session-wide check would pass on a previous
              turn's figure - and a runtime that quietly stopped reporting would leave occupancy
              frozen while its conversation kept growing, with the engine rotating later and later
              against a number that had stopped moving.
            tests:
              - CopilotProviderSession_Send_NoUsageReported_Throws
              - CopilotProviderSession_Send_UsageReportedThenOmitted_RefusesTheLaterTurn

          - id: AgentKitAgentsCopilot-CopilotProviderSession-RefusesARewrittenHistory
            title: >-
              The session shall refuse a turn once the Copilot runtime has compacted or truncated the
              session's history itself, naming that cause.
            justification: |
              Every session the engine drives is created with the runtime's own compaction threshold
              raised clear of the engine's rotation point, so the engine always acts first. That is a
              margin rather than a guarantee, and the runtime's last-resort behavior is deliberately
              left in place, so a rewrite remains possible: a runtime that rewrote the history anyway
              has left the engine's transcript describing a conversation the provider no longer holds,
              and every occupancy figure afterwards is about that vanished conversation. Refusing
              turns a silent divergence into a diagnosable failure, which is the convention this
              library already follows where it cannot know something it needs. It is also what makes
              it safe to carry a rotation's record on the conversation channel, where the runtime
              could in principle discard it: the discarding is announced, so it is refused rather than
              silently absorbed.

              The refusal is raised before a turn is sent as well as after one returns: detecting the
              first rewrite is unavoidably after the fact, but a later turn that reached the runtime
              would let the model run the application's tools, with their side effects, against a
              conversation the engine no longer describes - and a host retrying the failure would do
              it again each time. This is the same latch, and the same rule, as a turn the runtime
              processed that the session could not record.
            tests:
              - CopilotProviderSession_Send_ProviderCompactedOrTruncated_RefusesTheTurn
              - CopilotProviderSession_Send_AfterARewrite_RefusesWithoutSendingTheTurn

          - id: AgentKitAgentsCopilot-CopilotProviderSession-EndsOnATurnItCouldNotRecord
            title: >-
              The session shall accept no further turn, and shall send none, once a turn it handed to
              the Copilot runtime could not be recorded, naming the original failure as the reason it
              will not be used again.
            justification: |
              Handing the prompt over is the dividing line. Past it the runtime may hold a turn the
              engine's transcript does not — a send that failed is as uncertain as a turn that came
              back wrong, because this session cannot tell whether the prompt arrived — and on a first
              turn the seeded conversation record has been consumed either way and will not be sent
              again. Neither is recoverable by taking another turn on that session, and a host that
              responds to a refusal by retrying — the ordinary response to an invalid-operation
              failure — would send a real turn against a conversation the engine may no longer
              describe, running the application's tools with their real side effects, once per
              attempt.

              Ending the session rather than only the turn is the honest consequence, and the engine
              already has an answer for a session it cannot use: seed a replacement from its own
              transcript, which is the state known to be good. Naming the original failure rather than
              inventing a fresh one is what lets an application act on the cause instead of on the
              symptom, and the rule is one rule for two causes — this and the runtime rewriting
              history — because the consequence of each is identical.
            tests:
              - CopilotProviderSession_Send_AfterATurnItCouldNotRecord_RefusesWithoutSending
              - CopilotProviderSession_Send_ChannelFails_EndsTheSessionAndHandsNothingBack

          - id: AgentKitAgentsCopilot-CopilotProviderSession-RefusesASilentSession
            title: >-
              The session shall refuse a turn in which the runtime went idle without producing an
              assistant message, naming the runtime's own error when one was reported.
            justification: |
              The runtime's wait returns nothing when a session goes idle without answering, which
              happens when the turn failed rather than when the model had nothing to say. Recording an
              empty answer would present a runtime failure as an unhelpful model, and the engine would
              seed the next session from a turn that never happened. Naming the reported error is what
              lets an application act on the failure rather than only observe it - and the error named
              must be this turn's, since an error carried over from an earlier turn would name the
              wrong cause in the one message whose purpose is to name the right one. Each turn
              therefore begins by discarding the last one's reported error, and a turn that failed
              ends the session, so no later turn can inherit either.
            tests:
              - CopilotProviderSession_Send_NoAssistantMessage_ThrowsNamingTheRuntimeError
              - CopilotProviderSession_Send_NoAssistantMessageAndNoError_ThrowsSayingSo

          - id: AgentKitAgentsCopilot-CopilotProviderSession-RejectsInvalidArguments
            title: >-
              The session shall reject a missing message, a canceled turn and a turn on a released
              session, sending nothing to the runtime in each case.
            justification: |
              A missing message is a defect in the composing application, refused where it was
              written. A canceled turn must cost no call at all, so no message reaches the runtime
              that the engine's transcript does not record. A released session refuses rather than
              reconnecting, because the engine releases a session precisely to discard the
              conversation the provider held.
            tests:
              - CopilotProviderSession_Send_NullMessage_Throws
              - CopilotProviderSession_Send_Canceled_SendsNothing
              - CopilotProviderSession_Dispose_Twice_IsPermittedAndRejectsLaterTurns

          - id: AgentKitAgentsCopilot-CopilotProviderSession-ReleasesItsSessionNotTheClient
            title: >-
              The session shall release the Copilot session it owns when it is released, shall not
              dispose the Copilot client, and shall permit repeated release.
            justification: |
              The ownership split is the contract this package already records and must not regress:
              the host constructs, starts and disposes the client, and every session a rotation
              creates is AgentKit's. A session that disposed the client would break the next rotation
              on a client the host still believes it owns. Repeated release is permitted because a
              rotation and an application's own release may both reach the same session.
            tests:
              - CopilotProviderSession_Dispose_DisposesTheRuntimeSession_AndNotTheClient
              - CopilotProviderSession_Dispose_Twice_IsPermittedAndRejectsLaterTurns

          - id: AgentKitAgentsCopilot-CopilotProviderSession-HonorsAWindowCeilingDownwardOnly
            title: >-
              The session shall account against a host-stated window ceiling where one is lower than
              the runtime's reported limit, and shall ignore one that is higher.
            justification: |
              The runtime's limit is what the conversation may actually reach, so accounting against
              a larger figure would have the engine believe it has room the provider will not give
              and rotate too late - which loses material rather than merely costing money. Taking the
              smaller of the two makes the setting unable to do harm however it is misused.

              Lowering it is worth offering because a model reasons less reliably across a very long
              context than across a consolidated record of the same material, so a host may prefer to
              rotate sooner. It is also the only way a rotation can be reached on a provider whose
              smallest window is larger than any conversation a test would produce - without it the
              engine's behavior on this runtime would be unobservable.

              It is not a cost control, and the documentation says so, because the opposite is the
              natural assumption. Measured against the runtime, a repeated prompt is served almost
              entirely from cache from the second turn onward, and rotating discards that cached
              prefix and adds a summarizer call. Setting a ceiling costs more, not less.
            tests:
              - CopilotProviderSession_CurrentUsage_StatedCeilingBelowTheRuntimes_LowersTheWindow
              - CopilotProviderSession_CurrentUsage_StatedCeilingAboveTheRuntimes_IsIgnored
