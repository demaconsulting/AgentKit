---
# Software Unit Requirements for CopilotProviderSessionFactory
#
# These requirements describe the design-level behavior of the CopilotProviderSessionFactory unit.

sections:
  - title: AgentKitAgentsCopilot Requirements
    sections:
      - title: CopilotProviderSessionFactory Requirements
        requirements:
          - id: AgentKitAgentsCopilot-CopilotProviderSessionFactory-CreatesSeededSessions
            title: >-
              The factory shall create one Copilot session per seed, registering the session observer
              on the configuration before the session is created, and shall back each session with a
              model the application names or the runtime's default when it names none.
            justification: |
              A rotation asks for a replacement session and expects one that already holds the
              conversation so far. The observer must be registered on the configuration rather than on
              the session afterwards because the SDK installs a configuration's handler before the
              create request is issued — which is the only arrangement under which the very first
              turn's occupancy reading and tool traffic are seen at all. The model choice is the
              application's for the same reason it is on the agent path: which model backs a session
              materially changes how reliably it uses its tools, and an application with no opinion
              gets the runtime's own default.
            tests:
              - CopilotProviderSessionFactory_CreateAsync_RegistersTheObserverBeforeCreation
              - CopilotProviderSessionFactory_BuildSessionConfig_ModelIsCarriedOrLeftToTheRuntime

          - id: AgentKitAgentsCopilot-CopilotProviderSessionFactory-SeedsHistoryIntoTheSystemMessage
            title: >-
              The factory shall render a seeded history as a labeled record appended to the session's
              system message after the instructions and fenced by fixed delimiters, shall render a
              seeded tool call and its result as labeled lines carrying their identifier rather than
              under any role, and shall add no record when the seed carries no history.
            justification: |
              Copilot's session configuration carries no history or messages field of any kind, so a
              rotation that must seed a rewritten history has to put it somewhere else. The system
              message is the only channel the runtime offers that exists at session-creation time, is
              carried verbatim, and has no role vocabulary. That last property is decisive: the class
              of defect that shipped on the stateless path was a seeded tool result rendered under a
              role a provider's wire mapping silently discards, and here it is unrepresentable,
              because the record is text in the instructions channel and no provider can drop part of
              it without dropping the instructions. The instructions come first and unchanged, so a
              session seeded with no history is configured exactly as the agent path would configure
              it, and a record fence around nothing would tell the model a conversation had happened
              when none had.
            tests:
              - CopilotProviderSessionFactory_BuildSessionConfig_SeedsHistoryAfterTheInstructions
              - CopilotProviderSessionFactory_BuildSessionConfig_SeedWithoutHistory_CarriesInstructionsOnly
              - CopilotProviderSessionFactory_BuildSessionConfig_BareSeed_CarriesNoSystemMessage
              - CopilotProviderSessionFactory_BuildSessionConfig_HistoryWithoutInstructions_CarriesTheRecord
              - CopilotProviderSessionFactory_BuildSessionConfig_SeededToolResult_IsRenderedAsALabeledRecord

          - id: AgentKitAgentsCopilot-CopilotProviderSessionFactory-DerivesAllowListFromSeededTools
            title: >-
              The factory shall derive each session's allow-list from the same collection it publishes
              as the session's tools, and shall build every session with the runtime's skills disabled
              and its custom instructions skipped.
            justification: |
              A session the engine drives is exactly as exposed to the runtime's built-in tools,
              skills and discovered instructions as an agent is, so it receives exactly the same
              confinement — and receives it from the same code, because a second allow-list derivation
              is the drift this design exists to prevent. Every session a rotation creates is built
              this way, so a long conversation cannot become less confined the longer it runs.
            tests:
              - CopilotProviderSessionFactory_BuildSessionConfig_AvailableToolsDerivedFromSeededTools
              - CopilotProviderSessionFactory_BuildSessionConfig_SuppressesSkillsAndCustomInstructions

          - id: AgentKitAgentsCopilot-CopilotProviderSessionFactory-DefaultSafePermissions
            title: >-
              The factory shall install the default-safe permission handler on every session it
              creates, approving exactly the seeded tools by name and rejecting every other request.
            justification: |
              A session created here is driven by AgentKit's session engine rather than by the host
              turn by turn, so there is no host present to adjudicate a permission prompt and the
              default must be safe without asking. No host-supplied handler is accepted on this path:
              a host that wants a policy of its own composes an agent, where that choice is offered.
              Every built-in request is rejected because none of them is one of the seeded tools.
            tests:
              - CopilotProviderSessionFactory_BuildSessionConfig_InstallsTheDefaultSafePermissionHandler
              - AgentKitAgentsCopilot_Session_BuiltInToolRequest_IsRejectedOnTheSessionPath

          - id: AgentKitAgentsCopilot-CopilotProviderSessionFactory-DisablesRuntimeCompaction
            title: >-
              The factory shall create every session with the Copilot runtime's own infinite-session
              compaction disabled.
            justification: |
              The runtime compacts its own sessions by default, at a threshold of the same order as
              AgentKit's rotation threshold and against the same occupancy signal. Left on, both
              compactors would act on one conversation: the runtime would rewrite history underneath a
              session whose transcript the engine believes it owns, and the occupancy the engine reads
              afterwards would move for reasons it cannot see. The engine is the one compactor on this
              path, so the runtime's is switched off on every session a rotation creates rather than
              on the first one only.
            tests:
              - CopilotProviderSessionFactory_BuildSessionConfig_DisablesTheRuntimesOwnCompaction
              - AgentKitAgentsCopilot_Session_RuntimeCompactionIsDisabledOnEverySessionItBuilds

          - id: AgentKitAgentsCopilot-CopilotProviderSessionFactory-LeavesNothingUnowned
            title: >-
              The factory shall reject a missing client, a missing channel opener and a missing seed,
              shall open no session for a creation that was already canceled, and shall release a
              session it opened but could not hand to a provider session.
            justification: |
              Between the create request returning and the provider session taking ownership there is
              a window in which the runtime holds a session nothing references, and a cancellation
              arriving in that window would otherwise discard the only handle to it — the same window
              the compacting session guards when it adopts a replacement. A missing client or seed is
              a defect in the composing application, refused where it was written; a creation that was
              already canceled costs no session at all, so a canceled rotation leaves nothing behind
              on the runtime.
            tests:
              - CopilotProviderSessionFactory_Constructor_NullClient_Throws
              - CopilotProviderSessionFactory_Constructor_NullOpener_Throws
              - CopilotProviderSessionFactory_CreateAsync_NullSeed_Throws
              - CopilotProviderSessionFactory_CreateAsync_Canceled_OpensNothing
              - CopilotProviderSessionFactory_CreateAsync_CanceledWhileOpening_ReleasesTheOpenedSession
