---
# Software Unit Requirements for CopilotTurnChannel
#
# These requirements describe the design-level behavior of the CopilotTurnChannel unit.

sections:
  - title: AgentKitAgentsCopilot Requirements
    sections:
      - title: CopilotTurnChannel Requirements
        requirements:
          - id: AgentKitAgentsCopilot-CopilotTurnChannel-CarriesOneRuntimeSession
            title: >-
              The turn channel shall present one Copilot session as the operations AgentKit needs of
              it — name the session, take a turn carrying a prompt and any attachments, and release the
              session — and shall be injectable, so everything built on it can be exercised without a
              live Copilot runtime.
            justification: |
              The SDK's session type is sealed with a non-public constructor and no virtual members,
              and its client type is sealed, so neither can be faked, subclassed or constructed in a
              test. Without an injectable seam the whole adapter — the seeding, the usage arithmetic,
              the refusals and the ownership discipline — would ship with no automated evidence at
              all, on the one provider this repository's CI can reach but cannot authenticate. The
              seam is one small interface and a production implementation that forwards a turn, owns
              one release and opens each session through one confining protocol, which is the smallest
              surface that makes everything above it reachable. Its correctness is established by the
              units built on it, which are exercised against a channel that replays the runtime's own
              event types. The tests listed below are therefore tests of those units: they show the
              seam is sufficient and is used correctly, and nothing reaches the production channel
              itself beyond its release policy and its opening protocol, which are tested with the
              runtime's steps supplied as delegates.
            tests:
              - CopilotProviderSession_Send_Answer_IsReturnedAndRecordedOnce
              - CopilotProviderSessionFactory_CreateAsync_RegistersTheObserverBeforeCreation
              - CopilotSummarizer_Consolidate_RunsOutOfTheSessionBeingCompacted
              - CopilotAgent_Run_DataContent_IsSentAsABlobAttachment
              - CopilotAgent_Run_FirstRun_CreatesAConfinedSessionAndRecordsItsId

          - id: AgentKitAgentsCopilot-CopilotTurnChannel-OwnsTheSessionNotTheClient
            title: >-
              The turn channel shall release the Copilot session it opened and shall not dispose the
              Copilot client, and its release shall not fail for a session the runtime declined to
              delete.
            justification: |
              The ownership contract this package records must not regress: the host starts and
              disposes the Copilot runtime, whose client every session shares, and every session a
              rotation creates is AgentKit's.
              Releasing a session alone is documented to preserve its state on disk so it can be
              resumed later, which is the wrong outcome for a rotated session — a long conversation
              would leave one preserved session behind per rotation — so the runtime is also asked to
              delete it. That request is best-effort: release runs on a rotation's failure paths and
              on the caller's own release, and a housekeeping call that could not be made is not a
              reason to fail either of them. The tests listed below run against the scripted channel,
              so they show the units above the seam release exactly one session and never the client;
              that the production channel's release and delete take effect on a live runtime is not
              among them.
            tests:
              - CopilotProviderSession_Dispose_DisposesTheRuntimeSession_AndNotTheClient
              - CopilotSummarizer_Consolidate_Fails_DisposesTheSession
              - CopilotSessionChannel_Release_DeletingChannel_DetachesThenDeletes
              - CopilotSessionChannel_Release_FailingSteps_DoNotThrow

          - id: AgentKitAgentsCopilot-CopilotTurnChannel-CallerGovernsTheDeadline
            title: >-
              The turn channel shall place no timeout of its own on a turn, leaving the caller's
              cancellation token as the turn's only deadline.
            justification: |
              The SDK applies a sixty-second timeout to a turn it is told no timeout for, which a
              tool-using research turn exceeds routinely — and the resulting failure would read as a
              model or tool fault rather than as a deadline nobody chose. The session contract already
              carries a cancellation token and the compacting session already flows it, so the
              application governs the deadline rather than this library inventing a number or offering
              a configuration knob nobody asked for.

              No automated test can falsify this. The tests listed below assert that a
              pre-canceled turn reaches the channel not at all, which would hold equally against a
              channel that passed the SDK's sixty-second default — the very defect this requirement
              exists to prevent. That the production channel states an infinite timeout, and that the
              SDK treats it as no deadline, was established by reading the SDK's own implementation
              and is reviewed rather than measured; the verification chapter carves it out of its own
              acceptance criteria for the same reason.
            tests:
              - CopilotProviderSession_Send_Canceled_SendsNothing
              - CopilotSummarizer_Consolidate_Canceled_OpensNothing

          - id: AgentKitAgentsCopilot-CopilotTurnChannel-RetainsAgentSessions
            title: >-
              The turn channel shall release an agent conversation's session without deleting it, so
              the conversation stays resumable, while still deleting the sessions the session engine
              and the summarizer release.
            justification: |
              An agent's conversation continues on its next run, possibly on another agent instance
              given the serialized session, so deleting its runtime session on release would discard
              the conversation the caller still holds. A rotated or consolidation session is finished
              with by definition, and keeping it would leave one preserved session behind per
              rotation. An agent run made without a conversation is finished with in the same way,
              so it uses the deleting channel too. The two outcomes are therefore chosen when a
              channel is opened, and an agent conversation's is the one that keeps.
            tests:
              - CopilotSessionChannel_Release_RetainedChannel_DetachesWithoutDeleting
              - CopilotSessionChannel_Release_DeletingChannel_DetachesThenDeletes
              - CopilotAgent_Run_AfterEveryRun_ReleasesTheSessionAndKeepsItResumable

          - id: AgentKitAgentsCopilot-CopilotTurnChannel-ResumesARecordedSession
            title: >-
              The turn channel shall reopen a recorded Copilot session by its identifier under a
              configuration supplied for the resumption, and shall be injectable on that path too.
            justification: |
              An agent resumes its conversation's runtime session on every run after the first. The
              resumption must carry a configuration of its own, because the runtime applies it to the
              session it reopens, and it must be reachable through the same seam as creation so the
              agent's resumption can be exercised without a live runtime.
            tests:
              - CopilotAgent_Run_LaterRun_ResumesTheRecordedSessionWithTheSameConfinement

          - id: AgentKitAgentsCopilot-CopilotTurnChannel-ClosesAmbientMcpServersAndPlugins
            title: >-
              The production channel shall, before creating or resuming a session, disable every MCP
              server the runtime discovers; after creating or resuming it, shall clear the session's
              installed plugins and disable every MCP server still enabled; and shall refuse and
              release the session, deleting a created one and keeping a resumed one, if any MCP server
              remains enabled.
            tags: [security]
            justification: |
              The runtime starts MCP servers from ambient configuration — the data directory's
              configuration, the workspace, installed plugins, the built-in servers, a managed
              catalog, and a signed-in account — and Empty mode does not stop them. The
              custom allow-list keeps their tools from the model, but a started server still runs a
              process with the user's environment and identity and can contribute instructions to the
              system prompt, so each is disabled rather than filtered. The session options take only
              exact server names, so the names come from the runtime's own discovery, and naming them
              before creation is what keeps them from starting at all. Servers the runtime's MCP
              discovery returns are named in the session's disabled servers before the session
              exists, so the runtime does not start or authenticate them. The SDK documents that
              discovery as covering the user, workspace, plugin and builtin sources; measured against
              the live runtime, a server in the runtime's data directory is reported and kept from
              executing this way. A server from a source it cannot enumerate before creation, such as a
              managed catalog or a signed-in account, may start, and authenticate, while the session is
              created. The seal disables every server the session's MCP configuration lists before any
              turn runs, and the session is refused if one stays enabled: that contains such a server,
              it does not prevent it. The listing is not complete — measured against the live runtime,
              it does not report the built-in GitHub server even while that server is connected — so
              the seal is defense in depth rather than proof that no server runs, and the built-in
              server is kept from starting by name instead. Installed plugins — which can
              contribute servers, hooks, skills and agents — can be cleared only once the session
              exists, so the session is sealed afterwards: its
              plugins are cleared, every server it still reports enabled is disabled for that session,
              and the result is verified. A server the runtime keeps enabled refuses the session
              rather than letting a run continue with a channel open; a created session nothing has
              recorded is deleted, while a resumed session is only detached, because refusing to
              continue a conversation must not destroy it. These steps need the live client and
              session, which the configuration builders do not have, so they live on the one path
              every production opener and resumer shares.
            tests:
              - CopilotSessionChannel_Open_AmbientMcpServers_AreDisabledBeforeTheSessionIsCreated
              - CopilotSessionChannel_Open_DiscoveryFails_OpensNothing
              - CopilotSessionChannel_Open_SealFails_AbandonsTheSessionAndRethrows
              - CopilotSessionChannel_Seal_ClearsInstalledPluginsFirst
              - CopilotSessionChannel_Seal_ServerStillEnabledAfterCreation_IsDisabledThenVerified
              - CopilotSessionChannel_Seal_ServerThatStaysEnabled_RefusesNamingIt
              - CopilotSessionChannel_NoInstalledPluginsPatch_ReplacesTheListWithAnEmptyOne
