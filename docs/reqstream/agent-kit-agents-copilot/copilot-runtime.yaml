---
# Software Unit Requirements for CopilotRuntime
#
# These requirements describe the design-level behavior of the CopilotRuntime unit: the Copilot
# runtime AgentKit starts, confines and owns, and the options a host may give it.

sections:
  - title: AgentKitAgentsCopilot Requirements
    sections:
      - title: CopilotRuntime Requirements
        requirements:
          - id: AgentKitAgentsCopilot-CopilotRuntime-ForcesEmptyMode
            title: >-
              The runtime shall run its Copilot client in Empty mode, whatever options the host
              supplies.
            tags: [security]
            justification: |
              Empty mode is the SDK's defaulting strategy that supplies none of the coding-agent
              defaults, keeps credentials in the data directory rather than the system keychain and
              removes the host environment context. A host cannot select another mode, because no
              option that selects a mode is expressible. The user's Copilot CLI sign-in, whose token
              lives in the system keychain, is obtained by a separate short-lived helper runtime
              rather than by relaxing this mode, which the SDK does not allow.
            tests:
              - CopilotRuntime_BuildClientOptions_ForcesEmptyMode

          - id: AgentKitAgentsCopilot-CopilotRuntime-SpawnsTheSelectedRuntime
            title: >-
              The runtime shall run, as a child process connected over its standard input and output,
              the installed Copilot CLI by default — the CLI the host names, or else the one discovery
              finds — or, only when the host chooses it, the Copilot runtime provisioned into the
              application's output, with the same mode, environment and data directory for either; it
              shall not let the host's environment choose the executable, and shall offer no way to
              choose runtime arguments, in-process hosting, a TCP connection or an external runtime.
            tags: [security]
            justification: |
              The installed CLI keeps a host application small, because the provisioned runtime adds
              several hundred megabytes to every output folder, while the provisioned runtime remains
              for a machine without a suitable CLI. Which executable runs is the host's code choice,
              never the ambient environment: every Copilot CLI shell sets a runtime-path variable, so
              honoring it would let the shell, not the application, choose the binary a confined
              runtime runs. A child process is the only hosting whose environment the library can
              decide: an in-process runtime receives the whole host environment, and an external
              runtime's mode, data directory and environment are not the library's to set. Arbitrary
              runtime arguments, such as an approve-all switch or an additional MCP configuration,
              could widen what reaches the model, so they are not expressible. The confinement is the
              same code path for both executables, so choosing one never weakens it.
            tests:
              - CopilotRuntime_BuildClientOptions_Bundled_SpawnsTheProvisionedRuntimeOverStdio
              - CopilotRuntime_BuildClientOptions_InstalledCli_SpawnsTheResolvedCliOverStdio
              - CopilotRuntimeOptions_Constructor_Defaults_InstalledCliWithNoPath
              - CopilotRuntime_ResolveLaunch_Bundled_SkipsDiscoveryAndTheVersionProbe
              - CopilotRuntime_ResolveLaunch_ExplicitPath_WinsOverDiscovery
              - CopilotRuntime_ResolveLaunch_SupportedCli_CarriesPathAndVersion
              - CopilotRuntime_ResolveLaunch_CopilotCliPathVariable_IsIgnored

          - id: AgentKitAgentsCopilot-CopilotRuntime-RefusesAnUnsupportedCli
            title: >-
              The runtime shall refuse, before any runtime process starts, an installed Copilot CLI the
              host named that does not exist, a machine on which no CLI is found, and a CLI whose
              version is older than the minimum the library supports, and shall explain a runtime the
              SDK refuses for its protocol version as a CLI too old or too new for the library, keeping
              the SDK's error.
            justification: |
              An installed CLI changes independently of the library, so it can be too old, or newer than
              the library supports. Checking before a runtime starts turns a handshake failure that tells
              the user to update the SDK into a refusal that names the CLI, its version and the remedy.
              A CLI whose output names no version is left to the SDK's handshake, which fails closed,
              and that failure is explained the same way.
            tests:
              - CopilotRuntime_ResolveLaunch_ExplicitPathMissing_IsRefused
              - CopilotRuntime_ResolveLaunch_NothingFound_IsRefusedWithInstallGuidance
              - CopilotRuntime_ResolveLaunch_TooOldCli_IsRefusedBeforeAnyClientExists
              - CopilotRuntime_ResolveLaunch_NoVersionReported_DefersToTheHandshake
              - CopilotRuntime_StartClient_ProtocolMismatchOlderServer_IsExplainedAsTooOld
              - CopilotRuntime_StartClient_ProtocolMismatchNewerServer_IsExplainedAsTooNew

          - id: AgentKitAgentsCopilot-CopilotRuntime-ReportsTheRuntimeVersion
            title: >-
              The runtime shall report the installed CLI it runs, or none for the bundled runtime, and
              the version and protocol version the started runtime reports.
            justification: |
              With the installed CLI the version that runs is the machine's, not the library's, so a
              host needs to log or show it to diagnose behavior; the started runtime's own report is the
              version that actually runs, rather than one the CLI downloaded but does not use.
            tests:
              - CopilotRuntime_Properties_ReportTheLaunchAndTheStatus
              - CopilotRuntime_VerifyStarted_Authenticated_ReturnsTheStatus

          - id: AgentKitAgentsCopilot-CopilotRuntime-RefusesAnUnauthenticatedRuntime
            title: >-
              The runtime shall refuse a runtime that started but is not signed in to GitHub, reporting
              the runtime's own status, what each sign-in source found, in order, and every way to sign
              the runtime in.
            justification: |
              A runtime that is not signed in would otherwise be discovered only when the first turn
              fails. Refusing at start, with each source's finding listed, shows which source was
              expected to apply and why it did not, and the remedies make the fix immediate.
            tests:
              - CopilotRuntime_VerifyStarted_Unauthenticated_IsRefusedWithSignInGuidance

          - id: AgentKitAgentsCopilot-CopilotRuntime-UsesTheResolvedSignIn
            title: >-
              The runtime shall start the Copilot runtime with the token and GitHub host the sign-in
              resolution chose — a host the host's environment chose given as the normalized bare
              host name — and with neither changed from the host's environment when the resolution
              chose no host and leaves the sign-in to the runtime.
            tags: [security]
            justification: |
              The token reaches the runtime only through the SDK's own token option, which keeps it
              out of the data directory and makes the runtime ignore ambient sign-ins, and the host
              only through COPILOT_GH_HOST, one of the pass-through variables, so the runtime's
              confinement is the same whichever source signs it in.
            tests:
              - CopilotRuntime_BuildClientOptions_SignInPlan_CarriesTheTokenAndHost
              - CopilotRuntime_BuildClientOptions_NoTokenOrHost_LeavesTheEnvironmentUnchanged

          - id: AgentKitAgentsCopilot-CopilotRuntime-ReportsHowItSignedIn
            title: >-
              The runtime shall report the sign-in source the started runtime used, classified from the
              runtime's own report, and the GitHub host and login it signed in as.
            justification: |
              Several sources can sign the runtime in, on different hosts, and the account decides which
              models and policies apply, so a host needs to log or show which one was used.
            tests:
              - CopilotRuntime_Properties_ReportTheSignIn

          - id: AgentKitAgentsCopilot-CopilotRuntime-SuppliesTheSessionSignIn
            title: >-
              The runtime shall give a session it is about to open a token provider that asks the
              host's token provider when the runtime was started with one, and shall leave the session's
              GitHub options untouched otherwise.
            justification: |
              A session asks the provider for its own token so the runtime can refresh it before it
              expires; the SDK refuses a session whose provider fails rather than signing it in another
              way, so a provider failure is never hidden.
            tests:
              - CopilotRuntime_ApplySessionSignIn_SetsTheProviderOnlyWhenTheRuntimeHasOne

          - id: AgentKitAgentsCopilot-CopilotRuntime-WithholdsCopilotEnvironment
            title: >-
              The runtime shall start the Copilot runtime with the host's environment minus every
              variable whose name begins with COPILOT_ or GITHUB_COPILOT_, except a documented set
              that carries only credentials, network settings or a switch that turns telemetry off.
            tags: [security]
            justification: |
              The Copilot runtime reads hundreds of such variables, among them approve-all switches,
              directories of instructions, skills, hooks and plugins, provider rerouting and a runtime
              path override that every Copilot CLI shell sets. Any of them would reach a confined
              session without the composing application having chosen it, so none passes. The
              pass-through set lets authentication and network settings keep working; none of its members can
              add capability to a session. Every other host variable, such as the search path, the
              home and temporary folders and proxy settings, is kept. The installed CLI's version check
              runs that CLI too, so it gets the same environment.
            tests:
              - CopilotRuntime_ResolveLaunch_ProbesUnderTheWithheldEnvironment
              - CopilotRuntime_BuildRuntimeEnvironment_RemovesCopilotConfigurationVariables
              - windows@CopilotRuntime_BuildRuntimeEnvironment_MixedCaseOnWindows_IsRemoved
              - CopilotRuntime_BuildRuntimeEnvironment_KeepsHostVariablesAndThePassThroughSet
              - CopilotRuntime_PassThroughVariables_AreTheDocumentedSet
              - CopilotRuntime_BuildClientOptions_CarriesTheWithheldEnvironment

          - id: AgentKitAgentsCopilot-CopilotRuntime-OwnsACleanDataDirectory
            title: >-
              The runtime shall keep its state in a data directory it created, creating a missing or
              empty directory and marking it with a versioned marker file it never overwrites,
              reusing a directory whose marker is a regular file holding exactly what it writes, and
              refusing a path that names a file, a non-empty directory without the marker, or one
              whose marker is a link, a directory or other content, and refusing a new or empty
              directory found populated once its marker is written, before any runtime reads it.
            tags: [security]
            justification: |
              Empty mode alone still runs an MCP server that the data directory configures, and a
              shared directory, such as a Copilot CLI home, can also hold installed plugins, user
              hooks and trusted folders. A directory the library created holds none of those to begin
              with. Reusing a directory the library marked lets conversations persist across restarts.
              A directory another tool populated is refused rather than inspected, because a list of
              files to object to would go stale with every runtime release. A marker is trusted only
              as a regular file with exactly the expected bytes, so an entry that merely has the
              marker's name is not mistaken for one. The marker guards against reusing a foreign
              directory by mistake; it is not a security boundary against a process that can already
              write to the directory, which keeping the directory private to the application addresses.
              A directory found to hold anything besides the marker just written is refused and the
              marker removed, so a writer that populates a newly created path before it is marked does
              not have its content adopted; content written after that check is not caught, which is
              why the directory must stay private.
            tests:
              - CopilotRuntime_PrepareDataDirectory_Missing_IsCreatedAndMarked
              - CopilotRuntime_PrepareDataDirectory_Empty_IsMarked
              - CopilotRuntime_PrepareDataDirectory_Marked_IsAcceptedWithRuntimeContent
              - CopilotRuntime_PrepareDataDirectory_UnmarkedNonEmpty_IsRefused
              - CopilotRuntime_PrepareDataDirectory_PathIsAFile_IsRefused
              - CopilotRuntime_PrepareDataDirectory_Fresh_WritesExactlyTheVersionedMarker
              - CopilotRuntime_PrepareDataDirectory_MarkerWithOtherContent_IsRefusedAsInvalid
              - CopilotRuntime_PrepareDataDirectory_MarkerOversized_IsRefusedAsInvalid
              - CopilotRuntime_PrepareDataDirectory_MarkerIsADirectory_IsRefusedAsInvalid
              - CopilotRuntime_PrepareDataDirectory_MarkerIsASymbolicLink_IsRefusedAsInvalid
              - CopilotRuntime_MarkDataDirectory_MarkerWrittenConcurrentlyValid_IsAcceptedNotOverwritten
              - CopilotRuntime_MarkDataDirectory_MarkerWrittenConcurrentlyInvalid_IsRefusedNotOverwritten
              - CopilotRuntime_PrepareDataDirectory_MissingPopulatedBeforeMarking_IsRefusedAndLeftUnmarked
              - CopilotRuntime_PrepareDataDirectory_EmptyPopulatedBeforeMarking_IsRefusedAndLeftUnmarked
              - CopilotRuntime_MarkDataDirectory_MarkerWrittenConcurrentlyValidWithContent_IsAccepted
              - CopilotRuntime_MarkDataDirectory_ReEnumerationAndDeleteFail_LeavesInvalidMarker

          - id: AgentKitAgentsCopilot-CopilotRuntime-OffersOnlyNeutralOptions
            title: >-
              The runtime shall accept from the host only a data directory, a GitHub token or a GitHub
              token provider, a GitHub host, whether the user's Copilot CLI sign-in may be used, a log
              level, a logger, a runtime source and a fully qualified installed CLI path, and shall
              leave every client-level channel of injected capability unset.
            tags: [security]
            justification: |
              Plugin directories, extensions, installation and model-request handlers, a session
              filesystem and test options could each hand a confined agent capability its host never
              reviewed, or move state out of the data directory the library owns. Authentication and
              host-side diagnostics cannot widen what reaches the model, so they remain the host's to
              set, and so does the choice of runtime executable, which runs under the same confinement
              either way. A blank token is treated as none, so the signed-in user is used, a blank
              host as none, so the sign-in source decides it, and a blank CLI path as none, so
              discovery chooses. A GitHub token provider lets a host that refreshes its tokens never
              hand the runtime an expired one; it supplies tokens only, so it cannot widen what reaches
              the model either.
            tests:
              - CopilotRuntime_BuildClientOptions_LeavesEveryCapabilityChannelUnset
              - CopilotRuntime_BuildClientOptions_CarriesTokenLogLevelAndLogger
              - CopilotRuntimeOptions_GitHubHost_IsNormalized
              - CopilotRuntimeOptions_SignInOptions_DefaultAndKeepTheirValues
              - CopilotGitHubToken_Constructor_ValidatesAndRedacts
              - CopilotRuntimeOptions_Constructor_BlankToken_IsNull
              - CopilotRuntimeOptions_Constructor_BlankCliPath_IsNull
              - CopilotRuntimeOptions_Constructor_FullyQualifiedCliPath_IsKept
              - CopilotRuntimeOptions_Constructor_RelativeDataDirectory_IsResolvedToAFullPath

          - id: AgentKitAgentsCopilot-CopilotRuntime-ExplainsAMissingRuntime
            title: >-
              The runtime shall, when the Copilot runtime fails to start, report the runtime's own
              error and the cause that fits what it launched — for the bundled runtime, that if it was
              not found the host application must reference the Copilot SDK directly so it is
              provisioned; for an installed CLI, the CLI and its version and no package-reference
              advice — and the sources the runtime authenticates from, keeping a redacted copy of the
              original failure, its type name, message and stack trace, as the cause, so no exception
              in the chain carries a token the sign-in knows, and shall quote the runtime's error with
              every token the sign-in knows and any text shaped like a GitHub token redacted.
            justification: |
              The SDK provisions its runtime only into a project that references it directly, and the
              AgentKit library deliberately ships none, so a host that opted into the bundled runtime
              but relies on the library's reference alone has no runtime to start. The runtime's own
              error names a missing file and not the remedy. For an installed CLI that advice would
              mislead, so the CLI that failed is named instead. Because the host's COPILOT_ variables
              are withheld, the explanation says which sign-in sources apply, in order, so an
              authentication failure can be traced. The runtime's error may quote a token it was
              given, which must not reach a message built to be shown or logged, nor an inner
              exception a log or crash report prints whole.
            tests:
              - CopilotRuntime_StartClient_FailedStart_ExplainsTheMissingRuntimeAndKeepsTheCause
              - CopilotRuntime_StartClient_InstalledCliFailure_DoesNotBlameTheSdkReference
              - CopilotRuntime_StartClient_Succeeds_DoesNotThrow
              - CopilotRuntime_StartClient_FailureQuotingASignInToken_IsRedacted

          - id: AgentKitAgentsCopilot-CopilotRuntime-PassesCancellationThrough
            title: >-
              The runtime shall propagate a canceled start that carries no cause and nothing to redact
              unchanged, and shall rebuild any other canceled start as a cancellation of the same kind
              where the base class library allows, keeping its token, with a redacted message and the
              redacted copy as its cause.
            tags: [security]
            justification: |
              A cancellation is the caller's own decision, not a fault to explain; wrapping it would
              defeat the caller's handling of cancellation. A cancellation can still carry the
              runtime's text in its message or cause, so one that does is rebuilt like any relayed
              failure, keeping its kind and token so the caller's handling is unchanged.
            tests:
              - CopilotRuntime_StartClient_Canceled_PropagatesUnchanged
              - CopilotRuntime_StartClient_CanceledCarryingASecret_IsRebuiltRedacted

          - id: AgentKitAgentsCopilot-CopilotRuntime-LeavesNoRuntimeBehind
            title: >-
              The runtime shall release its Copilot client when the start fails or is canceled, and
              shall release it once when the runtime is disposed, after which it can no longer be used
              and nothing built on it starts the runtime again.
            justification: |
              A start that fails after the runtime process was launched must not leave that process
              running with nothing holding it. Whoever started the runtime disposes it, and an
              agent, provider-session factory or summarizer built on it never does; disposing twice is
              harmless, and a runtime used after disposal fails rather than reaching a stopped client.
              The SDK restarts a disposed client on demand - its start, create, resume and delete
              calls all reconnect a client that is not running - so an agent, provider-session factory
              or summarizer that reached the client after disposal would bring the runtime the host
              had stopped back to life. Each open, resume and release therefore reads the client from
              the runtime and fails with the runtime's disposal before the SDK is reached.
            tests:
              - CopilotRuntime_StartOwned_FailedStart_DisposesTheClient
              - CopilotRuntime_StartOwned_Canceled_DisposesTheClient
              - CopilotRuntime_StartOwned_Succeeds_ReturnsTheClientUndisposed
              - CopilotRuntime_DisposeAsync_IsIdempotentAndClientIsThenUnavailable
              - CopilotAgentFactory_Create_RuntimeDisposedAfterCreation_RunsFailWithoutStartingTheRuntime
              - CopilotProviderSessionFactory_CreateAsync_RuntimeDisposedAfterConstruction_FailsWithoutStartingTheRuntime
              - CopilotSummarizer_ConsolidateAsync_RuntimeDisposedAfterConstruction_FailsWithoutStartingTheRuntime
              - CopilotSessionChannel_OpenersOnADisposedRuntime_FailWithoutStartingTheRuntime

          - id: AgentKitAgentsCopilot-CopilotRuntime-DeletesAKeptConversation
            title: >-
              The runtime shall let the host delete a conversation the runtime kept, by its session
              identifier, refusing a missing or blank identifier and a disposed runtime, without
              exposing the runtime's client.
            justification: |
              An agent keeps its conversation in the data directory so it can resume, and deleting it
              is the host's decision. The runtime's client is never handed out, because a host that
              could reach it could open a session outside the confinement, so the one session
              operation a host needs is offered on the runtime itself.
            tests:
              - CopilotRuntime_DeleteSessionAsync_BlankSessionId_Throws
              - CopilotRuntime_DeleteSessionAsync_AfterDisposal_Throws

          - id: AgentKitAgentsCopilot-CopilotRuntime-RelaysDeletionFailuresRedacted
            title: >-
              The runtime shall relay a failure the runtime or SDK raises while deleting a session as a
              new exception of the same kind with a redacted message and the redacted copy as its
              cause, and a clean cancellation unchanged.
            tags: [security]
            justification: |
              The runtime reports a session it does not hold, or a deletion it fails, through the SDK's
              own exception, whose message and RPC error data AgentKit cannot vouch for and whose type
              a host does not reference. Relaying it as a new exception of a base class library type,
              redacted and with only a redacted copy as its cause, keeps tokens out of the host's
              hands on this path as on every other relayed path.
            tests:
              - CopilotRuntime_DeleteSessionAsync_RuntimeFailureQuotingASecret_IsRelayedRedacted
              - CopilotRuntime_DeleteSessionAsync_CleanCancellation_PassesUnchanged

          - id: AgentKitAgentsCopilot-CopilotRuntime-RelaysStatusReadFailuresRedacted
            title: >-
              The runtime shall relay a failure the runtime or the SDK raises while it reads a started
              runtime's status or authentication status as a new exception of the same kind with a
              redacted message and the redacted copy as its cause, and a clean cancellation or
              disposal unchanged.
            tags: [security]
            justification: |
              The status reads are the last step of a start, and a read that fails raises the SDK's
              own exception, whose message and RPC error data AgentKit cannot vouch for and whose
              type a host does not reference. Relaying it as on every other relayed path keeps tokens
              out of the exception StartAsync throws; a clean cancellation or disposal keeps its token
              and object name.
            tests:
              - CopilotRuntime_VerifyStarted_ReadFailureQuotingASecret_IsRelayedRedacted
              - CopilotRuntime_VerifyStarted_CleanCancellation_PassesUnchanged

          - id: AgentKitAgentsCopilot-CopilotRuntime-RejectsInvalidOptions
            title: >-
              The runtime shall reject missing options, a missing, blank or invalid data directory, an
              undefined runtime source, an installed CLI path that is not fully qualified, names a
              batch file (.cmd or .bat), or is given with the bundled runtime, a GitHub host that is not
              an https host without a path, query, user name or port, without quoting the value, and a
              GitHub token given together with a GitHub token provider, as programming errors.
            justification: |
              A runtime with no data directory could not be confined to one the library owns; a
              relative CLI path would make the executable depend on the current directory at start;
              Windows runs a batch file through cmd.exe, so the CLI, probed and spawned without a
              shell, would run under one; a CLI path for the bundled runtime is a contradiction the
              host must resolve; a host with a path or port is not a GitHub host, and a rejected URL
              may carry a user name and password, so it is not quoted; and with both a token and a
              token provider one of them would be silently ignored. Each defect is surfaced where the
              composing application wrote it.
            tests:
              - CopilotRuntime_StartAsync_NullOptions_Throws
              - CopilotRuntimeOptions_Constructor_BlankDataDirectory_Throws
              - CopilotRuntimeOptions_Constructor_InvalidDataDirectory_ThrowsNamingTheParameter
              - CopilotRuntimeOptions_Constructor_UndefinedSource_Throws
              - CopilotRuntimeOptions_Constructor_RelativeCliPath_Throws
              - CopilotRuntimeOptions_Constructor_BatchFileCliPath_Throws
              - CopilotRuntimeOptions_Constructor_CliPathWithBundled_Throws
              - CopilotRuntimeOptions_InvalidGitHubHost_Throws
              - CopilotRuntimeOptions_TokenAndProvider_Throws
