---
# Software Unit Requirements for CopilotAgentFactory
#
# These requirements describe the design-level behavior of the CopilotAgentFactory unit.

sections:
  - title: AgentKitAgentsCopilot Requirements
    sections:
      - title: CopilotAgentFactory Requirements
        requirements:
          - id: AgentKitAgentsCopilot-CopilotAgentFactory-DerivesAllowList
            title: >-
              The factory shall assign the supplied tools as the session's tools and derive the
              session's allow-list from the same collection, using the session-config
              agent-construction path, and shall not install the image-promoting decorator.
            justification: |
              The available-tools list is the allow-list that suppresses the runtime's built-in
              tools. Deriving it and the published tool set from one collection, in one place, makes
              the two impossible to drift apart. Only the session-config agent-construction path
              carries an allow-list, so it is the path used; the tool-list path would publish tools
              without suppressing anything. The derivation is reached from both callers of this
              factory, so the tests that falsify it live with them rather than being copied here; the
              verification chapter names them and says where they are. The image-promoting decorator
              is deliberately absent: the
              Copilot runtime already delivers images from tool results to the model, so promoting
              them onto a user message would duplicate content the model already received. A future
              maintainer should not add it here.
            tests:
              - AgentKitAgentsCopilot_BuildSessionConfig_AvailableToolsDerivedFromSuppliedTools
              - CopilotProviderSessionFactory_BuildSessionConfig_AvailableToolsDerivedFromSeededTools

          - id: AgentKitAgentsCopilot-CopilotAgentFactory-DefaultPermissionHandler
            title: >-
              The factory shall, when the host supplies no handler, install a permission handler
              that approves a request only when it names one of the supplied tools and rejects every
              other request.
            justification: |
              The untrained user cannot adjudicate a permission prompt, so the default is safe
              without asking: a supplied custom tool requested by its exact name is approved, and
              everything else — an unlisted custom tool, and every built-in request, none of which is
              a supplied custom tool — is rejected. The allow-list is captured once, so the handler
              cannot approve a name the session did not publish. The handler is reached from both
              callers of this factory, so the tests that invoke it live with them rather than being
              copied here; the verification chapter names them and says where they are.
            tests:
              - AgentKitAgentsCopilot_DefaultPermissionHandler_SuppliedTool_IsApproved
              - AgentKitAgentsCopilot_DefaultPermissionHandler_UnlistedCustomTool_IsRejected
              - AgentKitAgentsCopilot_DefaultPermissionHandler_BuiltInTool_IsRejected
              - CopilotProviderSessionFactory_BuildSessionConfig_InstallsTheDefaultSafePermissionHandler

          - id: AgentKitAgentsCopilot-CopilotAgentFactory-HostHandlerOverride
            title: >-
              The factory shall install a host-supplied permission handler unchanged in place of the
              default.
            justification: |
              A host with its own permission policy must be able to govern the session itself. When
              a handler is supplied it is the one installed on the session, so the host's policy
              replaces the safe default rather than layering over it.
            tests:
              - CopilotAgentFactory_BuildSessionConfig_HostHandler_IsInstalled

          - id: AgentKitAgentsCopilot-CopilotAgentFactory-WithholdsInjectedCapability
            title: >-
              The factory shall build every session with the runtime's skills disabled and its
              custom instructions skipped.
            justification: |
              Skills and custom instructions are channels through which the runtime injects
              capability and direction the composing application never attached and the untrained
              user cannot adjudicate. A confined agent must receive only what its host gave it, so
              both channels are closed on every session the factory builds rather than left at
              whatever the runtime defaults to. Either one silently reverting to the permissive
              value would widen the agent without changing anything the host wrote, so both are
              asserted rather than assumed.
            tests:
              - CopilotAgentFactory_BuildSessionConfig_InjectedCapability_IsWithheld

          - id: AgentKitAgentsCopilot-CopilotAgentFactory-RejectsNullClient
            title: >-
              The factory shall reject a missing Copilot client as a programming error.
            justification: |
              An agent with no client to run on cannot be built, so an absent client is a defect in
              the composing application surfaced where the host wrote it rather than at the first
              session.
            tests:
              - CopilotAgentFactory_Create_NullClient_Throws

          - id: AgentKitAgentsCopilot-CopilotAgentFactory-RejectsInvalidToolList
            title: >-
              The factory shall reject a tool list that is missing, empty, contains a null entry, or
              carries two tools of the same name.
            justification: |
              An empty tool list would produce an empty allow-list, and two tools sharing a name
              would make both the published tool set and the derived allow-list ambiguous. Each is a
              defect in the host, refused where the application composed its tools rather than
              discovered from a model's behavior later.
            tests:
              - CopilotAgentFactory_BuildSessionConfig_NullTools_Throws
              - CopilotAgentFactory_BuildSessionConfig_EmptyTools_Throws
              - CopilotAgentFactory_BuildSessionConfig_NullToolEntry_Throws
              - CopilotAgentFactory_BuildSessionConfig_DuplicateToolNames_Throws

          - id: AgentKitAgentsCopilot-CopilotAgentFactory-CarriesInstructions
            title: >-
              The factory shall carry supplied instructions onto the session's system message, and
              shall leave the session with no system message when no instructions are supplied.
            justification: |
              A confined agent is governed by the instructions its host gives it, so those
              instructions are carried onto the session's system message. When a host supplies none,
              the factory adds no system message of its own, leaving the session as the runtime would
              default it.
            tests:
              - CopilotAgentFactory_BuildSessionConfig_Instructions_CarriedOnSystemMessage

          - id: AgentKitAgentsCopilot-CopilotAgentFactory-SelectsModel
            title: >-
              The factory shall back the session with a model the host names, and shall leave the
              choice of model to the runtime when the host names none.
            justification: |
              Which model backs an agent materially changes how reliably it uses its tools and how
              accurately it reads an image, so the application author — not the library — must make
              that choice. The choice must be reachable without going around the factory, because a
              host that built a session itself to reach the setting would lose the derived
              allow-list, the withheld skills and custom instructions, and the default-safe
              permission handler, producing an agent that denies every tool call. A host with no
              opinion names nothing and gets the runtime's own default, so the choice adds nothing
              an existing application must now account for.
            tests:
              - CopilotAgentFactory_BuildSessionConfig_Model_CarriedOnSession
              - CopilotAgentFactory_BuildSessionConfig_NoModel_LeavesSessionModelAtDefault

          - id: AgentKitAgentsCopilot-CopilotAgentFactory-OneConfinementPath
            title: >-
              The factory shall confine every Copilot session this package builds — for an agent, for
              a compacting session, and for a consolidation — through one derivation of the
              allow-list, and shall accept an empty tool list only on the session-engine path.
            justification: |
              The safety property of this package is that a published tool set and the allow-list that
              suppresses the runtime's built-ins cannot drift apart. A second builder with its own
              derivation is exactly that drift, so every path ends in the same block: the tools and
              the allow-list are assigned from one collection, the skill and custom-instruction
              channels are closed, and a permission handler is installed. The one rule the two paths
              disagree about is emptiness. An agent publishing no tools is a defect in its host and is
              still refused; a consolidation must run on a session offering nothing, which produces an
              empty allow-list and a handler that approves nothing — the strongest confinement this
              factory can express rather than the weakest.
            tests:
              - CopilotAgentFactory_BothPaths_DeriveTheSameConfinement
              - CopilotAgentFactory_BuildEngineSessionConfig_EmptyTools_ProducesAnEmptyAllowList
              - CopilotAgentFactory_BuildSessionConfig_EmptyTools_Throws
              - CopilotAgentFactory_BuildEngineSessionConfig_DuplicateToolNames_Throws

          - id: AgentKitAgentsCopilot-CopilotAgentFactory-LeavesTheAgentPathsCompactionAlone
            title: >-
              The factory shall raise the Copilot runtime's own compaction threshold clear of the
              session engine's rotation point on every session built for that engine, and shall leave
              the runtime's compaction untouched on every session built for a plain agent.
            justification: |
              A session the engine drives has an AgentKit compactor behind it, and two compactors
              reading the same occupancy signal would fight: the runtime would rewrite history
              underneath a session whose transcript the engine believes it owns. A plain agent has no
              AgentKit compactor behind it, so changing the runtime's there would remove the only
              protection that session has when its window fills. The asymmetry is therefore deliberate
              and is asserted on both paths, so that neither can be "tidied" into the other without a
              test saying so.

              The threshold is what the engine path raises, because the threshold is the setting the
              runtime honors. Measured against SDK 1.0.11, a session created with the infinite-session
              flag set false compacted as soon as its threshold was crossed, exactly as one created
              with the flag true did. The flag is still set and states the intent, but nothing depends
              on it; the assertion that carries this requirement is the one on the threshold.
            tests:
              - CopilotAgentFactory_BuildSessionConfig_LeavesTheRuntimesCompactionUntouched
              - CopilotAgentFactory_BuildEngineSessionConfig_HoldsTheRuntimesCompactionWellAboveRotation
