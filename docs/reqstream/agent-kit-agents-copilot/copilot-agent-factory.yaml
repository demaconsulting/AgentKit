---
# Software Unit Requirements for CopilotAgentFactory
#
# These requirements describe the design-level behavior of the CopilotAgentFactory unit.

sections:
  - title: AgentKitAgentsCopilot Requirements
    sections:
      - title: CopilotAgentFactory Requirements
        requirements:
          - id: AgentKitAgentsCopilot-CopilotAgentFactory-DerivesAllowList
            title: >-
              The factory shall assign the supplied tools as the session's tool definitions and
              derive the session's allow-list from the same collection, qualifying every entry as a
              custom tool, and shall not install the image-promoting decorator.
            justification: |
              The available-tools list is the allow-list that suppresses the runtime's built-in
              tools. Deriving it and the published tool set from one collection, in one place, makes
              the two impossible to drift apart. Every entry is qualified as a custom tool because,
              measured against the live runtime, a bare name also admits a built-in tool that carries
              the same name; the qualifier is what makes the allow-list name only the tools the
              application supplied. The derivation is reached from both callers of this factory, so
              the tests that falsify it live with them rather than being copied here; the
              verification chapter names them and says where they are. The image-promoting decorator
              is deliberately absent: the Copilot runtime already delivers images from tool results
              to the model, so promoting them onto a user message would duplicate content the model
              already received. A future maintainer should not add it here.
            tests:
              - AgentKitAgentsCopilot_BuildSessionConfig_AvailableToolsDerivedFromSuppliedTools
              - CopilotProviderSessionFactory_BuildSessionConfig_AvailableToolsDerivedFromSeededTools
              - CopilotAgentFactory_BuildSessionConfig_AllowListIsSourceQualified

          - id: AgentKitAgentsCopilot-CopilotAgentFactory-DefaultPermissionHandler
            title: >-
              The factory shall, when the host supplies no handler, install a permission handler
              that approves a request only when it names one of the supplied tools and rejects every
              other request.
            justification: |
              The untrained user cannot adjudicate a permission prompt, so the default is safe
              without asking: a supplied custom tool requested by its exact name is approved, and
              everything else — an unlisted custom tool, and every built-in request, none of which is
              a supplied custom tool — is rejected. The allow-list is captured once, so the handler
              cannot approve a name the session did not publish. The handler is reached from both
              callers of this factory, so the tests that invoke it live with them rather than being
              copied here; the verification chapter names them and says where they are.
            tests:
              - AgentKitAgentsCopilot_DefaultPermissionHandler_SuppliedTool_IsApproved
              - AgentKitAgentsCopilot_DefaultPermissionHandler_UnlistedCustomTool_IsRejected
              - AgentKitAgentsCopilot_DefaultPermissionHandler_BuiltInTool_IsRejected
              - CopilotProviderSessionFactory_BuildSessionConfig_InstallsTheDefaultSafePermissionHandler

          - id: AgentKitAgentsCopilot-CopilotAgentFactory-HostHandlerOverride
            title: >-
              The factory shall install a host-supplied permission handler unchanged in place of the
              default.
            justification: |
              A host with its own permission policy must be able to govern the session itself. When
              a handler is supplied it is the one installed on the session, so the host's policy
              replaces the safe default rather than layering over it.
            tests:
              - CopilotAgentFactory_BuildSessionConfig_HostHandler_IsInstalled

          - id: AgentKitAgentsCopilot-CopilotAgentFactory-WithholdsInjectedCapability
            title: >-
              The factory shall build every session with every channel of runtime-injected
              capability closed: skills and built-in skills, custom instructions and their on-demand
              discovery, repository hooks, host git operations, memory and the cross-session store,
              built-in and discovered sub-agents, extensions, configuration discovery, tool search,
              the schedule tool, image generation, the host environment context in the system prompt,
              experimental features, embedding retrieval, and the runtime's built-in GitHub MCP
              server.
            justification: |
              Each of these is a channel through which the runtime injects capability or direction
              the composing application never attached and the untrained user cannot adjudicate. A
              confined agent must receive only what its host gave it, so every channel is closed
              explicitly on every session the factory builds, so the confinement does not depend on
              the client's mode, which the SDK offers no way to read back. The host environment
              context names the working directory, the operating system, the git root, a directory
              listing and the available tools; Empty mode removes it client-side, and the factory
              removes it through the system message's section overrides so it is removed in any mode.
              Experimental features could add behavior the host never chose, and embedding retrieval
              draws context from a cache shared across sessions. The built-in GitHub MCP server is
              disabled outright rather than merely filtered, because measured against the live
              runtime it is started and authenticated with the user's GitHub identity for every
              session even in the runtime's empty mode; every other MCP server, and the session's
              installed plugins, are closed by the production turn channel, which needs the live
              session to do it.
              Any one channel silently reverting to the permissive value would widen the agent
              without changing anything the host wrote, so each is asserted rather than assumed.
            tests:
              - CopilotAgentFactory_BuildSessionConfig_InjectedCapability_IsWithheld
              - CopilotAgentFactory_BuildSessionConfig_GitHubMcpServer_IsDisabled
              - CopilotAgentFactory_BuildSessionConfig_ImageGeneration_IsDisabled
              - CopilotAgentFactory_BuildSessionConfig_EnvironmentContext_IsRemoved
              - CopilotAgentFactory_BuildSessionConfig_ExperimentalModeAndEmbeddingRetrieval_AreOff

          - id: AgentKitAgentsCopilot-CopilotAgentFactory-RejectsNullClient
            title: >-
              The factory shall reject a missing Copilot client as a programming error.
            justification: |
              An agent with no client to run on cannot be built, so an absent client is a defect in
              the composing application surfaced where the host wrote it rather than at the first
              session.
            tests:
              - CopilotAgentFactory_Create_NullClient_Throws

          - id: AgentKitAgentsCopilot-CopilotAgentFactory-RejectsInvalidToolList
            title: >-
              The factory shall reject a tool list that is missing, empty, contains a null entry, or
              carries two tools of the same name.
            justification: |
              An empty tool list would produce an empty allow-list, and two tools sharing a name
              would make both the published tool set and the derived allow-list ambiguous. Each is a
              defect in the host, refused where the application composed its tools rather than
              discovered from a model's behavior later.
            tests:
              - CopilotAgentFactory_BuildSessionConfig_NullTools_Throws
              - CopilotAgentFactory_BuildSessionConfig_EmptyTools_Throws
              - CopilotAgentFactory_BuildSessionConfig_NullToolEntry_Throws
              - CopilotAgentFactory_BuildSessionConfig_DuplicateToolNames_Throws

          - id: AgentKitAgentsCopilot-CopilotAgentFactory-CarriesInstructions
            title: >-
              The factory shall carry supplied instructions as the content of the session's system
              message, and shall add no content of its own when no instructions are supplied.
            justification: |
              A confined agent is governed by the instructions its host gives it, so those
              instructions are the content of the session's system message, which the runtime
              appends to its own prompt. When a host supplies none, the factory adds no content of
              its own. The system message always exists, because it also carries the confinement's
              removal of the host environment context, so the instructions are set on that message
              rather than replacing it.
            tests:
              - CopilotAgentFactory_BuildSessionConfig_Instructions_CarriedOnSystemMessage

          - id: AgentKitAgentsCopilot-CopilotAgentFactory-SelectsModel
            title: >-
              The factory shall back the session with a model the host names, and shall leave the
              choice of model to the runtime when the host names none.
            justification: |
              Which model backs an agent materially changes how reliably it uses its tools and how
              accurately it reads an image, so the application author — not the library — must make
              that choice. The choice must be reachable without going around the factory, because a
              host that built a session itself to reach the setting would lose the derived
              allow-list, the withheld skills and custom instructions, and the default-safe
              permission handler, producing an agent that denies every tool call. A host with no
              opinion names nothing and gets the runtime's own default, so the choice adds nothing
              an existing application must now account for.
            tests:
              - CopilotAgentFactory_BuildSessionConfig_Model_CarriedOnSession
              - CopilotAgentFactory_BuildSessionConfig_NoModel_LeavesSessionModelAtDefault

          - id: AgentKitAgentsCopilot-CopilotAgentFactory-OneConfinementPath
            title: >-
              The factory shall confine every Copilot session this package builds — for an agent,
              created or resumed, for a compacting session, and for a consolidation — through one
              derivation of the allow-list, and shall accept an empty tool list only on the
              session-engine path.
            justification: |
              The safety property of this package is that a published tool set and the allow-list that
              suppresses the runtime's built-ins cannot drift apart. A second builder with its own
              derivation is exactly that drift, so every path ends in the same block: the tools and
              the allow-list are assigned from one collection, the skill and custom-instruction
              channels are closed, and a permission handler is installed. The one rule the two paths
              disagree about is emptiness. An agent publishing no tools is a defect in its host and is
              still refused; a consolidation must run on a session offering nothing, which produces an
              empty allow-list and a handler that approves nothing — the strongest confinement this
              factory can express rather than the weakest.
            tests:
              - CopilotAgentFactory_BothPaths_DeriveTheSameConfinement
              - CopilotAgentFactory_BuildResumeSessionConfig_DerivesTheSameConfinement
              - CopilotAgentFactory_BuildEngineSessionConfig_EmptyTools_ProducesAnEmptyAllowList
              - CopilotAgentFactory_BuildSessionConfig_EmptyTools_Throws
              - CopilotAgentFactory_BuildEngineSessionConfig_DuplicateToolNames_Throws

          - id: AgentKitAgentsCopilot-CopilotAgentFactory-LeavesTheAgentPathsCompactionAlone
            title: >-
              The factory shall raise the Copilot runtime's own compaction threshold clear of the
              session engine's rotation point on every session built for that engine, and shall leave
              the runtime's compaction untouched on every session built for a plain agent.
            justification: |
              A session the engine drives has an AgentKit compactor behind it, and two compactors
              reading the same occupancy signal would fight: the runtime would rewrite history
              underneath a session whose transcript the engine believes it owns. A plain agent has no
              AgentKit compactor behind it, so changing the runtime's there would remove the only
              protection that session has when its window fills. The asymmetry is therefore deliberate
              and is asserted on both paths, so that neither can be "tidied" into the other without a
              test saying so.

              The threshold is what the engine path raises, because the threshold is the setting the
              runtime honors. Measured against the live runtime, a session created with the
              infinite-session flag set false compacted as soon as its threshold was crossed, exactly
              as one created with the flag true did. The flag is still set and states the intent, but nothing depends
              on it; the assertion that carries this requirement is the one on the threshold.
            tests:
              - CopilotAgentFactory_BuildSessionConfig_LeavesTheRuntimesCompactionUntouched
              - CopilotAgentFactory_BuildEngineSessionConfig_HoldsTheRuntimesCompactionWellAboveRotation

          - id: AgentKitAgentsCopilot-CopilotAgentFactory-DisablesLargeOutputDiversion
            title: >-
              The factory shall switch off the runtime's diversion of a large tool result to a
              temporary file on every session it builds.
            justification: |
              Left at its default, the runtime replaces a tool result over its size threshold with a
              notice naming a temporary file the result was saved to. A confined agent has no tool
              that can read that file — measured against the live runtime, the model asked for the
              built-in viewer, was refused, and failed the task — so the result is lost exactly when
              it is largest. AgentKit's tools already bound their own output, so the diversion protects
              nothing they need and is switched off.
            tests:
              - CopilotAgentFactory_BuildSessionConfig_LargeOutputDiversion_IsDisabled

          - id: AgentKitAgentsCopilot-CopilotAgentFactory-PinsManualPermissionMode
            title: >-
              The factory shall set every session's permission mode to the mode in which every
              permission request is put to the session's handler.
            justification: |
              The runtime has modes in which it approves tool, path and URL requests without asking
              the handler, or lets a client approve them itself. Either would bypass the default-deny
              handler without anything the factory configured changing. Pinning the manual mode keeps
              the handler the only authority over what a session may do, whatever mode ambient
              configuration or policy would otherwise choose.
            tests:
              - CopilotAgentFactory_BuildSessionConfig_PermissionMode_IsPinnedToManual

          - id: AgentKitAgentsCopilot-CopilotAgentFactory-RefusesBuiltInToolNames
            title: >-
              The factory shall refuse, before any session exists, a supplied tool that carries the
              name of one of the Copilot runtime's built-in tools on any supported platform, compared
              without regard to case, naming the tool and asking for it to be renamed.
            justification: |
              The runtime refuses to create a session that registers a custom tool under a built-in's
              name unless the tool is marked as overriding the built-in, and AgentKit never marks it
              so: an override would silently replace the runtime's tool with the application's under a
              name the model already associates with other behavior. Left to the runtime, the
              collision surfaces only at the first run, as a remote error. The built-in set depends on
              the platform, so the union is refused, and an application composed on one platform does
              not fail later on another.
            tests:
              - CopilotAgentFactory_BuildSessionConfig_BuiltInToolName_Throws
              - CopilotAgentFactory_BuildEngineSessionConfig_BuiltInToolName_Throws

          - id: AgentKitAgentsCopilot-CopilotAgentFactory-CarriesWorkingDirectory
            title: >-
              The factory shall give every session a working directory the host names, and shall
              leave the working directory to the runtime when the host names none.
            justification: |
              In-process hosting has no client-level working directory, so unless the factory offers
              the setting a host cannot set one at all without configuring a session by hand, which
              would forfeit the confinement. The working directory grants nothing — what the agent
              may read or write is decided by its tools' own path policy — but it anchors the session
              where the host intends. A host that names none gets the runtime's default.
            tests:
              - CopilotAgentFactory_BuildSessionConfig_WorkingDirectory_IsCarriedOrLeftToTheRuntime

          - id: AgentKitAgentsCopilot-CopilotAgentFactory-ConfinesResumedSessions
            title: >-
              The factory shall build the configuration an agent resumes a recorded session with
              carrying the same confinement, model, working directory and instructions as the
              configuration the session was created with.
            justification: |
              The runtime applies a resume's configuration to the session it reopens, so a resume
              built without the allow-list, the closed channels and the permission handler would hand
              an existing conversation the runtime's defaults — every built-in tool, and permission
              requests no handler answers. A resumed session is therefore confined afresh rather than
              trusted to remember.
            tests:
              - CopilotAgentFactory_BuildResumeSessionConfig_DerivesTheSameConfinement

          - id: AgentKitAgentsCopilot-CopilotAgentFactory-EnablesStreamingOnTheAgentPath
            title: >-
              The factory shall turn on the runtime's token streaming for every session it builds for
              an agent, and shall leave it off for the sessions it builds for the session engine.
            justification: |
              An agent's caller reads a run as it happens, so the agent's sessions stream the model's
              text as it is produced. The engine and the summarizer take only a turn's final answer,
              so streaming there would add events and nothing else.
            tests:
              - CopilotAgentFactory_BuildSessionConfig_AgentPath_EnablesStreaming
