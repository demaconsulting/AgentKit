---
# Software System Requirements for AgentKit Tools
#
# These requirements describe the externally visible behavior of the library
# from the perspective of its consumers, without specifying implementation details.

sections:
  - title: AgentKitTools Requirements
    requirements:
      - id: AgentKitTools-Composition-BuiltOnCoreContract
        title: >-
          The library shall present the tool families it provides to an application through the
          AgentKitCore tool-pack composition contract, composed into one policy-governed tool
          list, and shall contribute no tools where no family has been attached.
        tags: [system]
        justification: |
          AgentKitTools is a general-purpose collection of guarded tool families; an application
          must attach them the same way it attaches any other AgentKit pack — one ToolPackBuilder,
          one access policy — not through a composition path this package invents. Proving the
          empty composition is well defined and yields no tools fixes the integration surface
          before any family is added and keeps the package a peer of other capability packages
          rather than a layer they depend on.
        tests:
          - AgentKitTools_SystemComposition_EmptyBuilder_ContributesNoTools

      - id: AgentKitTools-TextFileFamily-GuardedTextFileAccess
        title: >-
          The library shall provide a text file family that searches, reads, creates and edits the
          contents of text files under the access policy the composing application supplies,
          interpreting the paths a model states as relative to the workspace, paging a read to a
          line-numbered window, editing by exact content match and by captured line range,
          publishing every tool under one family prefix and refusing rather than throwing when the
          policy does not permit a request.
        tags: [system, security]
        justification: |
          Reading and editing the contents of text files is the capability an agent needs most
          often and the one an operator is least willing to grant unconditionally. Providing it as
          one policy-governed family means an application grants file-content access in a single,
          auditable step, with containment applied to every request rather than to whichever tool
          happened to remember to check. A model states a path the way a person does — a bare file
          name — so the family must read it that way, or an operator's correctly configured agent
          is refused every legitimate request. Paging a read lets a model work with a file larger
          than a single result; editing by exact content match lets it change one line without
          rewriting the file; and a cut always captures what it removes so every deletion is
          recoverable. Refusing rather than throwing keeps a denied request from ending the
          agent's turn.
        children:
          - AgentKitTools-TextFile-FamilyComposition
          - AgentKitTools-TextFile-GuardedConstruction
          - AgentKitTools-TextFile-PolicyGoverned
          - AgentKitTools-TextFile-NavigationAndPaging
          - AgentKitTools-TextFile-ContentEditing
          - AgentKitTools-TextFile-DenialsAreResults
          - AgentKitTools-TextFile-ObservesPolicyLimits
        tests:
          - AgentKitTools_SystemComposition_TextFilePack_ContributesTheTextFileFamily

      - id: AgentKitTools-FileFamily-GuardedFileManagement
        title: >-
          The library shall provide a type-agnostic file family that lists, copies, moves and
          deletes files of any type under the access policy the composing application supplies,
          judging each endpoint by the policy decision that matches it, refusing to overwrite an
          existing destination unless overwrite is explicitly permitted, deleting only a single
          file and never a directory, publishing every tool under one family prefix and refusing
          rather than throwing when the policy does not permit a request.
        tags: [system, security]
        justification: |
          Managing the files an agent works with — listing what exists, copying, moving and
          deleting — is the same operation whatever a file holds, so it belongs to a family that
          treats a file as an entity rather than as a kind of content. Providing it as one
          policy-governed family means an application grants file management in a single, auditable
          step, with containment applied to every endpoint. Refusing to clobber a destination and
          refusing to delete a directory make the two most dangerous, least reversible operations
          impossible to perform by accident; recovery from a mistaken change is source control,
          which is why an agent should be run in a repository. This family replaces the listing the
          text family used to provide, so listing is now type-agnostic rather than wearing a text
          prefix.
        children:
          - AgentKitTools-File-FamilyComposition
          - AgentKitTools-File-GuardedConstruction
          - AgentKitTools-File-PolicyGoverned
          - AgentKitTools-File-DenialsAreResults
          - AgentKitTools-File-SafeMutation
        tests:
          - AgentKitTools_SystemComposition_FilePack_ContributesTheFileFamily

      - id: AgentKitTools-MarkdownFamily-GuardedMarkdownOutline
        title: >-
          The library shall provide a markdown family that reports the heading structure of a
          Markdown file as sections carrying a level, a title and a 1-based line range under the
          access policy the composing application supplies, publishing every tool under one family
          prefix and refusing rather than throwing when the policy does not permit a request.
        tags: [system, security]
        justification: |
          A model that means to read or remove a section of a Markdown document needs to know where
          the section is. Reporting each section's line range composes directly into the text
          family's read and cut tools, so the markdown family provides only the outline the text
          family cannot supply on its own rather than duplicating reading or editing. Providing it
          as one policy-governed family keeps containment applied to every request, and owning the
          markdown family prefix is why a sample demonstrating custom tools uses a different prefix.
        children:
          - AgentKitTools-Markdown-FamilyComposition
          - AgentKitTools-Markdown-GuardedConstruction
          - AgentKitTools-Markdown-PolicyGoverned
          - AgentKitTools-Markdown-Outline
        tests:
          - AgentKitTools_SystemComposition_MarkdownPack_ContributesTheMarkdownFamily

      - id: AgentKitTools-ImageFamily-GuardedImageAccess
        title: >-
          The library shall provide an image family that reads images and PDF documents under the
          access policy the composing application supplies, interpreting the paths a model states
          as relative to the workspace, publishing every tool under one family
          prefix, delivering the content to the caller rather than a serialized copy of it, and
          registering the family only for a host that declares it can present visual content to a
          model.
        tags: [system, security]
        justification: |
          Handing a model an image is the capability a vision-enabled agent needs and the one that
          fails most silently when it is done wrong: a tool whose content is serialized to JSON
          delivers no image, and the model then confidently describes a picture it never received.
          Providing it as one policy-governed family means an application grants image access in a
          single, auditable step, with containment applied to every request and the content
          delivered intact through the guarded construction path. A model states a path the way a
          person does, and the name it holds is usually one a text file listing reported
          relatively, so the family reads names the same way its sibling family does. Gating the
          family behind the
          vision capability keeps a model that cannot see from ever being offered a tool whose
          result it could only fabricate around, and the composition withholds the family by never
          asking the pack for its tools rather than by offering them and refusing later.
        children:
          - AgentKitTools-Image-FamilyComposition
          - AgentKitTools-Image-CapabilityGated
          - AgentKitTools-Image-GuardedConstruction
          - AgentKitTools-Image-PolicyGoverned
          - AgentKitTools-Image-DenialsAreResults
          - AgentKitTools-Image-ObservesPolicyLimits
        tests:
          - AgentKitTools_SystemComposition_ImagePack_ContributesTheImageFamily
          - AgentKitTools_SystemComposition_ImagePackWithoutVision_ContributesNoTools

      - id: AgentKitTools-TodoFamily-AgentTaskList
        title: >-
          The library shall provide a todo family that lets an agent record the steps of a piece of
          multi-step work, advance and close each step, and drop a step that is no longer part of
          the work, holding one flat ordered list per agent that no other agent can read or write,
          publishing every tool under one family prefix and refusing rather than throwing when a
          request cannot be honored.
        tags: [system]
        justification: |
          An agent working through several phases either writes the plan down or carries it in its
          own memory, and memory is where a phase goes missing without either the agent or the user
          being able to see that it happened. A written list is also how a person follows what an
          agent is doing while it is doing it. The list is deliberately flat and one per agent: a
          tree, a dependency edge and a replace-the-whole-list tool were each built and measured
          against live models and each was either unused or paid for without being used, while
          delegation already expresses the hierarchy a tree was meant to carry. Binding the list to
          one agent is what keeps a delegated agent's short checklist from replacing the long one
          its parent is working through. The family only works when the application instructs the
          agent to use it, which is a measured finding rather than an assumption, so that
          instruction is published with the family rather than left to be rediscovered.
        children:
          - AgentKitTools-Todo-FamilyComposition
          - AgentKitTools-Todo-GuardedConstruction
          - AgentKitTools-Todo-PerAgentList
          - AgentKitTools-Todo-TaskLifecycle
          - AgentKitTools-Todo-DenialsAreResults
          - AgentKitTools-Todo-InstructionRequired
        tests:
          - AgentKitTools_SystemComposition_TodoPack_ContributesTheTodoFamily

      - id: AgentKitTools-AgentFamily-GuardedDelegation
        title: >-
          The library shall provide an agent family that delegates a task to another agent the
          composing application has registered by name, giving that agent instructions the
          application wrote, a tool set composed from the application's own packs against the
          child's own state, and an access policy no wider than the delegating agent's, bounding
          how deep a chain of delegated agents may run, registering the family only for a host that
          declares it can start a further agent, and refusing rather than throwing when a request
          cannot be honored.
        tags: [system, security]
        justification: |
          Delegation is how an agent keeps a long job within one context window, and it is also the
          most direct route by which an agent could acquire authority its operator never granted.
          Registering named profiles is what closes that route: the model chooses which agent to
          start, and the application decides what each of those agents is. A parent that could
          author its own child's instructions could tell that child to ignore the rules the
          application configured. A child's tools are composed from the application's packs against
          the child's own policy rather than filtered from the parent's list, because filtering a
          parent-bound list hands the child the parent's own per-composition state — the defect that
          lets a sub-agent's short checklist replace its parent's long one, made twice in one file
          while trying to prevent it. Narrowing-only grants keep containment a one-way ratchet, the
          depth ceiling keeps a chain of agents from spending a host's budget invisibly, and gating
          the family behind a host declaration keeps an application that cannot start a second agent
          from ever being offered the tool.
        children:
          - AgentKitTools-Agent-FamilyComposition
          - AgentKitTools-Agent-CapabilityGated
          - AgentKitTools-Agent-GuardedConstruction
          - AgentKitTools-Agent-ApplicationAuthoredProfiles
          - AgentKitTools-Agent-ChildIsolation
          - AgentKitTools-Agent-PolicyNarrowingOnly
          - AgentKitTools-Agent-DepthBounded
          - AgentKitTools-Agent-DenialsAreResults
        tests:
          - AgentKitTools_SystemComposition_AgentPack_ContributesTheAgentFamily
          - AgentKitTools_SystemComposition_AgentPackWithoutDelegation_ContributesNoTools
          - AgentKitTools_SystemComposition_DelegatedAgent_KeepsItsOwnTaskList
