---
# Software System Requirements for AgentKit Tools
#
# These requirements describe the externally visible behavior of the library
# from the perspective of its consumers, without specifying implementation details.

sections:
  - title: AgentKitTools Requirements
    requirements:
      - id: AgentKitTools-Composition-BuiltOnCoreContract
        title: >-
          The library shall present the tool families it provides to an application through the
          AgentKitCore tool-pack composition contract, composed into one policy-governed tool
          list, and shall contribute no tools where no family has been attached.
        tags: [system]
        justification: |
          AgentKitTools is a general-purpose collection of guarded tool families; an application
          must attach them the same way it attaches any other AgentKit pack — one ToolPackBuilder,
          one access policy — not through a composition path this package invents. Proving the
          empty composition is well defined and yields no tools fixes the integration surface
          before any family is added and keeps the package a peer of other capability packages
          rather than a layer they depend on.
        tests:
          - AgentKitTools_SystemComposition_EmptyBuilder_ContributesNoTools

      - id: AgentKitTools-PolicyDerivedPublication
        title: >-
          The library shall offer an agent only those tools the access policy the application
          supplied could permit to succeed, so that a policy permitting no writing anywhere
          presents no tool whose only outcome would be a refusal, while a policy permitting
          writing in any location presents every tool, and a delegated agent is offered only what
          its own narrowed policy could permit.
        tags: [system, security]
        justification: |
          An application already decides which families an agent receives; what it could not
          previously decide is that a family stop advertising the parts of itself its own
          configuration forbids. A tool whose only possible outcome is a refusal is not free: it
          occupies the model's attention on every turn, it invites a request that can only fail,
          and a model that meets an unavoidable refusal commonly retries it in another form rather
          than taking the path that works — so an agent configured to read is measurably worse off
          being shown the ability to edit than not being shown it. Making the offered set the
          intersection of what a family provides and what the configuration could permit turns the
          list of tools into a truthful statement of what the agent can do, which is the same
          reason a family the host cannot support is never offered at all rather than offered and
          refused later. The question must be asked of the whole configuration rather than of one
          location, or the common read-wide, write-narrow arrangement would lose its editing tools
          the moment its writable location sat outside the workspace. Families whose work touches
          no governed location are unaffected, and no family infers permission to write from
          permission to read. Because a delegated agent is composed against its own narrowed
          configuration, the same rule reaches every depth without a delegating family doing
          anything, and a tool named for a child that its configuration cannot support is absent
          rather than an error — which is what makes a child restricted to reading genuinely
          read-only in what it is offered, not merely in what it is permitted.
        children:
          - AgentKitCore-PathPolicy-WriteGrantVisible
          - AgentKitTools-TextFile-WriteToolsRequireAWriteGrant
          - AgentKitTools-File-WriteToolsRequireAWriteGrant
          - AgentKitTools-Image-Pack-PublishedUnderEveryPolicy
          - AgentKitTools-Markdown-Pack-PublishedUnderEveryPolicy
          - AgentKitTools-Memory-Pack-PublishedUnderEveryPolicy
          - AgentKitTools-Todo-Pack-PublishedUnderEveryPolicy
          - AgentKitTools-Agent-Pack-PublishedUnderEveryPolicy
        tests:
          - AgentKitTools_SystemComposition_ReadOnlyPolicy_PublishesOnlyTheToolsThePolicyCanPermit
          - AgentKitTools_SystemComposition_ReadOnlyWorkspaceWithWritableSession_PublishesEveryTool
          - AgentKitTools_SystemComposition_DelegatedAgentWithReadOnlyProfile_ReceivesOnlyReadTools

      - id: AgentKitTools-TextFileFamily-GuardedTextFileAccess
        title: >-
          The library shall provide a text file family that searches, reads, creates and edits the
          contents of text files under the access policy the composing application supplies,
          interpreting the paths a model states as relative to the workspace, paging a read to a
          line-numbered window, editing by exact content match and by captured line range, setting a
          file's whole content with the content it displaces captured for recovery,
          offering the editing tools only where the policy could permit them to succeed,
          publishing every tool under one family prefix and refusing rather than throwing when the
          policy does not permit a request.
        tags: [system, security]
        justification: |
          Reading and editing the contents of text files is the capability an agent needs most
          often and the one an operator is least willing to grant unconditionally. Providing it as
          one policy-governed family means an application grants file-content access in a single,
          auditable step, with containment applied to every request rather than to whichever tool
          happened to remember to check. A model states a path the way a person does — a bare file
          name — so the family must read it that way, or an operator's correctly configured agent
          is refused every legitimate request. Paging a read lets a model work with a file larger
          than a single result; editing by exact content match lets it change one line without
          rewriting the file; setting a file's whole content lets it produce a document outright
          rather than assembling it by repeated edits; and every operation that destroys content —
          a cut of a range, an overwrite of everything — captures what it destroys first, so nothing
          the family removes is unrecoverable. Refusing rather than throwing keeps a denied request
          from ending the agent's turn.
        children:
          - AgentKitTools-TextFile-FamilyComposition
          - AgentKitTools-TextFile-GuardedConstruction
          - AgentKitTools-TextFile-PolicyGoverned
          - AgentKitTools-TextFile-NavigationAndPaging
          - AgentKitTools-TextFile-ContentEditing
          - AgentKitTools-TextFile-DenialsAreResults
          - AgentKitTools-TextFile-ObservesPolicyLimits
        tests:
          - AgentKitTools_SystemComposition_TextFilePack_ContributesTheTextFileFamily

      - id: AgentKitTools-FileFamily-GuardedFileManagement
        title: >-
          The library shall provide a type-agnostic file family that lists, copies, moves and
          deletes files of any type, and creates, moves and recursively deletes the directories
          that hold them, under the access policy the composing application supplies,
          judging each endpoint by the policy decision that matches it, refusing to overwrite an
          existing destination unless overwrite is explicitly permitted, never replacing a
          directory, deleting only a single
          file and never a directory through its single-file deletion, bounding a recursive
          deletion so that it never follows a link out of the directory it was given and never
          exceeds the configured entry ceiling, offering the tools that change the file system
          only where
          the policy could permit them to succeed, publishing every tool under one family prefix
          and refusing rather than throwing when the policy does not permit a request.
        tags: [system, security]
        justification: |
          Managing the files an agent works with — listing what exists, copying, moving and
          deleting — is the same operation whatever a file holds, so it belongs to a family that
          treats a file as an entity rather than as a kind of content; and the directory structure
          those files live in belongs to the same family, because it is the container rather than
          the content. Providing it as one
          policy-governed family means an application grants file management in a single, auditable
          step, with containment applied to every endpoint. Refusing to clobber a destination,
          never replacing a directory, and
          refusing to delete a directory through the single-file deletion make the most dangerous,
          least reversible operations
          impossible to perform by accident; recovery from a mistaken change is source control,
          which is why an agent should be run in a repository. The one operation whose reach is
          not stated by the request itself — removing a directory with everything beneath it — is
          bounded by a link guard and an entry ceiling, so a mistake is survivable and observable
          rather than total. This family replaces the listing the
          text family used to provide, so listing is now type-agnostic rather than wearing a text
          prefix.
        children:
          - AgentKitTools-File-FamilyComposition
          - AgentKitTools-File-DirectoryManagement
          - AgentKitTools-File-RecursiveDeletionIsBounded
          - AgentKitTools-File-GuardedConstruction
          - AgentKitTools-File-PolicyGoverned
          - AgentKitTools-File-DenialsAreResults
          - AgentKitTools-File-SafeMutation
        tests:
          - AgentKitTools_SystemComposition_FilePack_ContributesTheFileFamily

      - id: AgentKitTools-MarkdownFamily-GuardedMarkdownOutline
        title: >-
          The library shall provide a markdown family that reports the heading structure of a
          Markdown file as sections carrying a level, a title and a 1-based line range under the
          access policy the composing application supplies, publishing every tool under one family
          prefix and refusing rather than throwing when the policy does not permit a request.
        tags: [system, security]
        justification: |
          A model that means to read or remove a section of a Markdown document needs to know where
          the section is. Reporting each section's line range composes directly into the text
          family's read and cut tools, so the markdown family provides only the outline the text
          family cannot supply on its own rather than duplicating reading or editing. Providing it
          as one policy-governed family keeps containment applied to every request, and owning the
          markdown family prefix is why a sample demonstrating custom tools uses a different prefix.
        children:
          - AgentKitTools-Markdown-FamilyComposition
          - AgentKitTools-Markdown-GuardedConstruction
          - AgentKitTools-Markdown-PolicyGoverned
          - AgentKitTools-Markdown-Outline
        tests:
          - AgentKitTools_SystemComposition_MarkdownPack_ContributesTheMarkdownFamily

      - id: AgentKitTools-ImageFamily-GuardedImageAccess
        title: >-
          The library shall provide an image family that reads images and PDF documents under the
          access policy the composing application supplies, reporting the pixel dimensions of an
          image it can establish them for, returning a rectangular region of one named in pixels
          and refusing a region that is not wholly inside it, trimming an image to the region its
          own content occupies when the caller names no region at all, writing that region to a
          destination a read-write grant permits when the caller names one, interpreting the
          paths a model states
          as relative to the workspace, offering every one of its tools under every policy
          including one that permits no writing, publishing every tool under one family
          prefix, delivering the content to the caller rather than a serialized copy of it, and
          registering the family only for a host that declares it can present visual content to a
          model.
        tags: [system, security]
        justification: |
          Handing a model an image is the capability a vision-enabled agent needs and the one that
          fails most silently when it is done wrong: a tool whose content is serialized to JSON
          delivers no image, and the model then confidently describes a picture it never received.
          Providing it as one policy-governed family means an application grants image access in a
          single, auditable step, with containment applied to every request and the content
          delivered intact through the guarded construction path. A model states a path the way a
          person does, and the name it holds is usually one a text file listing reported
          relatively, so the family reads names the same way its sibling family does. Gating the
          family behind the
          vision capability keeps a model that cannot see from ever being offered a tool whose
          result it could only fabricate around, and the composition withholds the family by never
          asking the pack for its tools rather than by offering them and refusing later. A model
          can see a picture but cannot measure one, so the family states an image's pixel
          dimensions alongside the content: without them the model has no coordinate space in
          which to reason about any part of the image it is looking at. It also cannot examine
          part of a picture closely — a detail occupying a hundredth of a large image is, at the
          resolution a provider receives, effectively invisible — so the family returns the
          region the model names at full resolution: inline when the model wants to examine it,
          or written to a destination the model names when it wants an artifact it can reference.
          The destination is admitted by the policy's write decision, independently of the read
          that admitted the image, so one call exercises both grants an application configured
          and a read-wide, write-narrow policy stays meaningful. Dimension reporting and region
          extraction are one
          capability rather than two: a region request the model cannot aim is a region request
          it will aim wrongly. A region that does not fit is refused rather than quietly reduced,
          because a reduced region answers a different question while reporting success and the
          model cannot detect the substitution. Deciding an image's decode cost from what its
          header declares, before any pixel data exists, is what stops a model provoking a
          quarter of a gigabyte of allocation from a file of a few hundred kilobytes. The family
          also trims an image to the region its own content occupies, because the region a model
          most often wants is the one it cannot name: it can see that a screenshot or a slide
          export is mostly margin without being able to measure where the margin stops, so any
          rectangle it stated would be a guess. That trim takes its background from the image's
          own border rather than assuming one, so a dark, colored or transparent margin works as
          well as a white one, and it refuses an image that is entirely background rather than
          returning the whole picture — which would again answer a different question while
          reporting success.
        children:
          - AgentKitTools-Image-FamilyComposition
          - AgentKitTools-Image-CapabilityGated
          - AgentKitTools-Image-GuardedConstruction
          - AgentKitTools-Image-PolicyGoverned
          - AgentKitTools-Image-DimensionReporting
          - AgentKitTools-Image-RegionExtraction
          - AgentKitTools-Image-ContentTrimming
          - AgentKitTools-Image-RegionDestination
          - AgentKitTools-Image-DecodeBounded
          - AgentKitTools-Image-DenialsAreResults
          - AgentKitTools-Image-ObservesPolicyLimits
          - AgentKit-OTS-CanvasNet-HeaderProbe
          - AgentKit-OTS-CanvasNet-Decode
          - AgentKit-OTS-CanvasNet-Crop
          - AgentKit-OTS-CanvasNet-Encode
          - AgentKit-OTS-CanvasNet-DecodeFeasibility
        tests:
          - AgentKitTools_SystemComposition_ImagePack_ContributesTheImageFamily
          - AgentKitTools_SystemComposition_ImagePackWithoutVision_ContributesNoTools

      - id: AgentKitTools-TodoFamily-AgentTaskList
        title: >-
          The library shall provide a todo family that lets an agent record the steps of a piece of
          multi-step work, advance and close each step, and drop a step that is no longer part of
          the work, holding one flat ordered list per agent that no other agent can read or write,
          publishing every tool under one family prefix and refusing rather than throwing when a
          request cannot be honored.
        tags: [system]
        justification: |
          An agent working through several phases either writes the plan down or carries it in its
          own memory, and memory is where a phase goes missing without either the agent or the user
          being able to see that it happened. A written list is also how a person follows what an
          agent is doing while it is doing it. The list is deliberately flat and one per agent: a
          tree, a dependency edge and a replace-the-whole-list tool were each built and measured
          against live models and each was either unused or paid for without being used, while
          delegation already expresses the hierarchy a tree was meant to carry. Binding the list to
          one agent is what keeps a delegated agent's short checklist from replacing the long one
          its parent is working through. The family only works when the application instructs the
          agent to use it, which is a measured finding rather than an assumption, so that
          instruction is published with the family rather than left to be rediscovered.
        children:
          - AgentKitTools-Todo-FamilyComposition
          - AgentKitTools-Todo-GuardedConstruction
          - AgentKitTools-Todo-PerAgentList
          - AgentKitTools-Todo-TaskLifecycle
          - AgentKitTools-Todo-DenialsAreResults
          - AgentKitTools-Todo-InstructionRequired
        tests:
          - AgentKitTools_SystemComposition_TodoPack_ContributesTheTodoFamily

      - id: AgentKitTools-MemoryFamily-AgentMemory
        title: >-
          The library shall provide a memory family that lets an agent file what it has learned as
          a short embedded descriptor with a richer never-embedded detail payload and its provenance,
          recall the closest memories to a question whole, correct a memory's details without
          re-embedding it, revise its subject and its source together, and forget it, declining
          within the filing call to store a descriptor too close to one the store already holds and
          reporting that non-storage as structured data,
          publishing every tool under one family prefix and refusing rather than
          throwing when a request cannot be honored.
        tags: [system]
        justification: |
          An agent that has read something can answer from it only while it is still holding it,
          and a long job is exactly the case where it no longer is. A searchable record of what it
          learned is the difference between an agent that answers from evidence and one that
          answers from whatever survived its context window. The family's shape is measured rather
          than assumed: five configurations over a seventeen-document technical corpus all
          plateaued at the same answer accuracy, so the simplest design that reaches the ceiling is
          the one that ships. Within that plateau coarser granularity was monotonically better, so
          a memory is roughly one document or section; a graph of links between memories was built
          twice, produced 530 correctly wired links, and never once contributed to a correct
          answer, so there is none. Embedding only a short descriptor and returning a richer
          payload beside it separates findability from sufficiency, which a single text cannot do.
          Near-duplicate detection is arithmetic because every attempt to have the model notice a
          contradiction by judgement failed while the arithmetic caught a 12-psi against an 18-psi
          statement at 0.965 cosine, and its outcome is structured because the same outcome in
          prose was followed by the model asserting it had stored the fact. That check reads the
          store and then writes to it within one filing call, so it is scoped to that call rather
          than across calls in flight together; it is a backstop under a model that mostly revises
          in place, not a uniqueness guarantee over the store. Revision takes
          provenance as a parameter because a revision that silently kept the original source made
          memories cite documents they no longer reflected. Which embedding backend, which
          persistence and which thresholds are used are all the application author's decisions,
          because this library guarantees the mechanism and the author governs the settings.
        children:
          - AgentKitTools-Memory-FamilyComposition
          - AgentKitTools-Memory-GuardedConstruction
          - AgentKitTools-Memory-DescriptorPayloadModel
          - AgentKitTools-Memory-NearDuplicateDetection
          - AgentKitTools-Memory-CorrectionWithoutStaleProvenance
          - AgentKitTools-Memory-Forgetting
          - AgentKitTools-Memory-DenialsAreResults
          - AgentKitTools-Memory-AuthorGovernedConfiguration
          - AgentKitTools-Memory-PerCompositionMemories
          - AgentKitTools-Memory-InstructionRequired
        tests:
          - AgentKitTools_SystemComposition_MemoryPack_ContributesTheMemoryFamily

      - id: AgentKitTools-AgentFamily-GuardedDelegation
        title: >-
          The library shall provide an agent family that delegates a task to another agent the
          composing application has registered by name, giving that agent instructions the
          application wrote, a tool set composed from the application's own packs against the
          child's own state, and an access policy no wider than the delegating agent's, bounding
          how deep a chain of delegated agents may run, registering the family only for a host that
          declares it can start a further agent, and refusing rather than throwing when a request
          cannot be honored.
        tags: [system, security]
        justification: |
          Delegation is how an agent keeps a long job within one context window, and it is also the
          most direct route by which an agent could acquire authority its operator never granted.
          Registering named profiles is what closes that route: the model chooses which agent to
          start, and the application decides what each of those agents is. A parent that could
          author its own child's instructions could tell that child to ignore the rules the
          application configured. A child's tools are composed from the application's packs against
          the child's own policy rather than filtered from the parent's list, because filtering a
          parent-bound list hands the child the parent's own per-composition state — the defect that
          lets a sub-agent's short checklist replace its parent's long one, made twice in one file
          while trying to prevent it. Narrowing-only grants keep containment a one-way ratchet, the
          depth ceiling keeps a chain of agents from spending a host's budget invisibly, and gating
          the family behind a host declaration keeps an application that cannot start a second agent
          from ever being offered the tool.
        children:
          - AgentKitTools-Agent-FamilyComposition
          - AgentKitTools-Agent-CapabilityGated
          - AgentKitTools-Agent-GuardedConstruction
          - AgentKitTools-Agent-ApplicationAuthoredProfiles
          - AgentKitTools-Agent-ChildIsolation
          - AgentKitTools-Agent-PolicyNarrowingOnly
          - AgentKitTools-Agent-DepthBounded
          - AgentKitTools-Agent-DenialsAreResults
        tests:
          - AgentKitTools_SystemComposition_AgentPack_ContributesTheAgentFamily
          - AgentKitTools_SystemComposition_AgentPackWithoutDelegation_ContributesNoTools
          - AgentKitTools_SystemComposition_DelegatedAgent_KeepsItsOwnTaskList
