---
# Software System Requirements for AgentKit Tools
#
# These requirements describe the externally visible behavior of the library
# from the perspective of its consumers, without specifying implementation details.

sections:
  - title: AgentKitTools Requirements
    requirements:
      - id: AgentKitTools-Composition-BuiltOnCoreContract
        title: >-
          The library shall present the tool families it provides to an application through the
          AgentKitCore tool-pack composition contract, composed into one policy-governed tool
          list, and shall contribute no tools where no family has been attached.
        tags: [system]
        justification: |
          AgentKitTools is a general-purpose collection of guarded tool families; an application
          must attach them the same way it attaches any other AgentKit pack — one ToolPackBuilder,
          one access policy — not through a composition path this package invents. Proving the
          empty composition is well defined and yields no tools fixes the integration surface
          before any family is added and keeps the package a peer of other capability packages
          rather than a layer they depend on.
        tests:
          - AgentKitTools_SystemComposition_EmptyBuilder_ContributesNoTools

      - id: AgentKitTools-TextFileFamily-GuardedTextFileAccess
        title: >-
          The library shall provide a text file family that reads, writes and lists text files
          under the access policy the composing application supplies, interpreting the paths a
          model states as relative to the workspace, publishing every tool under
          one family prefix and refusing rather than throwing when the policy does not permit a
          request.
        tags: [system, security]
        justification: |
          Reading, writing and listing text files is the capability an agent needs most often and
          the one an operator is least willing to grant unconditionally. Providing it as one
          policy-governed family means an application grants file access in a single, auditable
          step, with containment applied to every request rather than to whichever tool happened
          to remember to check. A model states a path the way a person does — a bare file name —
          so the family must read it that way, or an operator's correctly configured agent is
          refused every legitimate request. Refusing rather than throwing keeps a denied request
          from ending the agent's turn, so a model that asks for the wrong file learns why and
          can ask again.
        children:
          - AgentKitTools-TextFile-FamilyComposition
          - AgentKitTools-TextFile-GuardedConstruction
          - AgentKitTools-TextFile-PolicyGoverned
          - AgentKitTools-TextFile-DenialsAreResults
          - AgentKitTools-TextFile-ObservesPolicyLimits
        tests:
          - AgentKitTools_SystemComposition_TextFilePack_ContributesTheTextFileFamily

      - id: AgentKitTools-ImageFamily-GuardedImageAccess
        title: >-
          The library shall provide an image family that reads images and PDF documents under the
          access policy the composing application supplies, interpreting the paths a model states
          as relative to the workspace, publishing every tool under one family
          prefix, delivering the content to the caller rather than a serialized copy of it, and
          registering the family only for a host that declares it can present visual content to a
          model.
        tags: [system, security]
        justification: |
          Handing a model an image is the capability a vision-enabled agent needs and the one that
          fails most silently when it is done wrong: a tool whose content is serialized to JSON
          delivers no image, and the model then confidently describes a picture it never received.
          Providing it as one policy-governed family means an application grants image access in a
          single, auditable step, with containment applied to every request and the content
          delivered intact through the guarded construction path. A model states a path the way a
          person does, and the name it holds is usually one a text file listing reported
          relatively, so the family reads names the same way its sibling family does. Gating the
          family behind the
          vision capability keeps a model that cannot see from ever being offered a tool whose
          result it could only fabricate around, and the composition withholds the family by never
          asking the pack for its tools rather than by offering them and refusing later.
        children:
          - AgentKitTools-Image-FamilyComposition
          - AgentKitTools-Image-CapabilityGated
          - AgentKitTools-Image-GuardedConstruction
          - AgentKitTools-Image-PolicyGoverned
          - AgentKitTools-Image-DenialsAreResults
          - AgentKitTools-Image-ObservesPolicyLimits
        tests:
          - AgentKitTools_SystemComposition_ImagePack_ContributesTheImageFamily
          - AgentKitTools_SystemComposition_ImagePackWithoutVision_ContributesNoTools
