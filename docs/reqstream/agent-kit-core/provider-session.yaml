---
# Software Unit Requirements for ProviderSession
#
# These requirements describe the design-level behavior of the ProviderSession unit.

sections:
  - title: AgentKitCore Requirements
    sections:
      - title: ProviderSession Requirements
        requirements:
          - id: AgentKitCore-ProviderSession-AdapterInterface
            title: >-
              The unit shall define the whole interface between the compaction engine and a provider
              adapter as a seed carrying instructions, tools and history, and a minimal session and
              factory.
            justification: |
              The seed is the whole interface between the engine and an adapter: the engine never
              touches a provider's API, it produces a seed and an adapter turns it into whatever its
              provider requires. That is what keeps the engine provider-agnostic and lets it be tested
              against a fake. The seed copies its lists so an adapter holding it across a rotation cannot
              observe a later mutation.
            tests:
              - ProviderSessionSeed_Construct_CopiesToolsAndHistory

          - id: AgentKitCore-ProviderSession-RecordsWhatATurnProduced
            title: >-
              The unit shall record what one turn against a provider produced, ending with the answer
              exactly once whether or not the adapter supplied intervening entries.
            justification: |
              The answer is always the last entry and is recorded exactly once - as the only entry when
              none were supplied, and after the supplied ones when they were - so that every consumer
              records the same conversation. An adapter that has already ended with the answer is not
              made to strip it, so either adapter style yields exactly one copy.
            tests:
              - ProviderTurn_Construct_NoEntries_RecordsAnswerAlone
              - ProviderTurn_Construct_RecordsAnswerExactlyOnce

          - id: AgentKitCore-ProviderSession-AnswersForItsOwnWindow
            title: >-
              The unit shall require every provider session to answer how much of its provider's
              context window it occupies and out of how much, without contacting the provider to do
              so.
            justification: |
              Rotation happens when the window is filling, which is the one thing this library needs a
              token count for, and the adapter is the only place that can answer honestly for its
              provider: some publish both figures, some report occupancy against a window the adapter
              was told once where the provider was configured, and an adapter for a provider that
              reveals nothing estimates and owns that choice. Making the question part of the contract
              rather than an optional extra is what gives the engine a single path - it asks one
              question and believes the answer, instead of testing for a capability, falling back to
              its own estimate against a separately configured window, and checking a figure's
              provenance before it could use it. The answer reports what the last exchange already
              revealed, so reading it is free and cannot fail.
            tests:
              - InMemoryProviderSession_Usage_ReportsItsOwnWindowAndSplit
              - CompactingAgentSession_Usage_IsTheProviderSessionsOwnFigure

          - id: AgentKitCore-ProviderSession-RejectsMalformedSeedOrTurn
            title: >-
              The unit shall reject a null tool or history list, a null entry within one, a null
              response text, and a malformed pairing identifier.
            justification: |
              Rejecting a null entry at the seam rather than leaving an adapter to discover it
              mid-construction is what keeps a failure attributed to the composition rather than the
              provider. A tool call or result requires a non-blank identifier and any other kind of
              entry refuses one, so a call can always be paired with its result.
            tests:
              - ProviderSessionSeed_Construct_NullArguments_Throw
              - ProviderTurn_Construct_NullArguments_Throw
              - TranscriptEntry_Construct_ValidatesPairingIdentifier
