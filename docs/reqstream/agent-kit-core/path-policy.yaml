---
# Software Unit Requirements for PathPolicy
#
# These requirements describe the design-level behavior of the PathPolicy unit.

sections:
  - title: AgentKitCore Requirements
    sections:
      - title: PathPolicy Requirements
        requirements:
          - id: AgentKitCore-PathPolicy-WorkingDirectoryRequired
            title: >-
              A path policy shall require a working directory when it is created, by every
              construction path it offers, and shall report it as a normalized absolute location.
            justification: |
              The working directory is the single anchor a relative path is resolved against, and
              nothing else — it carries no permission. It is required rather than defaulted because
              the only value available to default to is the process working directory, a
              process-global any code can change and every agent in the process shares, yet one
              application may run several agents or sub-agents each needing a different anchor. A
              missing working directory is therefore a programming error the constructor rejects
              rather than a value it guesses. Normalizing it once at creation keeps every later
              comparison a comparison between locations spelled the same way.
            tests:
              - PathPolicy_Constructor_MissingWorkingDirectory_ThrowsArgumentException
              - PathPolicy_WorkingDirectory_SpelledWithRelativeSegments_IsReportedNormalized

          - id: AgentKitCore-PathPolicy-GrantsValidated
            title: >-
              A path policy shall accept zero or more access grants, rejecting a null grant
              collection and a null grant within it, and shall permit nothing when granted nothing.
            justification: |
              An empty grant set is a valid, fully-confined policy that permits nothing; its denials
              say so plainly. A null collection or a null grant, by contrast, is a programming error
              that would leave a half-built policy, so both are rejected at construction so a policy
              cannot be used before it is whole.
            tests:
              - PathPolicy_Constructor_NullGrants_ThrowsArgumentNullException
              - PathPolicy_Constructor_NullGrantEntry_ThrowsArgumentNullException
              - PathPolicy_Constructor_EmptyGrants_IsValidAndPermitsNothing

          - id: AgentKitCore-PathPolicy-OrthogonalWorkingDirectory
            title: >-
              A path policy shall keep the working directory and the grants orthogonal: the working
              directory shall anchor a relative request whether or not it is itself granted, and
              being the anchor shall confer no access.
            tags: [security]
            justification: |
              Addressing and permission are two different ideas. The working directory says where a
              bare name resolves; a grant says a location may be read, or read and written. An
              application folder may anchor relative paths while granting nothing, and a relative
              name then resolves against it correctly and is then correctly denied — coherent, not a
              special case. There is no implicit access: the application grants the working directory
              whatever permission it should have, exactly as it grants any other location.
            tests:
              - PathPolicy_WorkingDirectoryGrantedReadWrite_RelativeRequestsSucceed
              - PathPolicy_WorkingDirectoryGrantedReadOnly_RelativeWriteDenied
              - PathPolicy_WorkingDirectoryGrantedNothing_RelativeReadDenied_NamesNoLocations
              - PathPolicy_UngrantedWorkingDirectory_RelativeReadDenied_EnumeratesElsewhere

          - id: AgentKitCore-PathPolicy-RelativePathAgainstWorkingDirectory
            title: >-
              A path policy shall interpret a relative request against its working directory and not
              against the location the host process is running from, and shall continue to accept an
              absolute request.
            tags: [security]
            justification: |
              A model asks for a file by name. Measuring that name from the process working directory
              refuses every legitimate request while looking, from the outside, like a containment
              decision; an agent was observed to be refused an existing file nine times before giving
              up. The absolute form remains accepted because a host that composes paths itself still
              relies on it, and it remains subject to the same containment decision.
            tests:
              - PathPolicy_TryResolveRead_DotSlashFileName_ResolvesBeneathTheAnchor
              - PathPolicy_TryResolveRead_NestedRelativePath_ResolvesBeneathTheAnchor
              - PathPolicy_TryResolveRead_RelativePath_IsNotResolvedAgainstTheProcessDirectory
              - PathPolicy_TryResolveRead_AbsolutePathInsideRoot_ReturnsRealPath
              - PathPolicy_TryResolveWrite_BareFileName_ResolvesBeneathTheAnchor

          - id: AgentKitCore-PathPolicy-OmittedPathMeansWorkingDirectory
            title: >-
              A path policy shall treat an omitted, empty, whitespace or placeholder request as
              denoting its working directory, and shall raise no exception for any path a caller
              supplies.
            justification: |
              A model exploring a workspace for the first time has no name to supply, and what it
              sends instead — no argument, an empty one, or the word its own runtime prints for
              absence — is a question the library can answer. Reading any of those as a file name
              refuses a request that was well formed in every way the model could tell. Recognizing
              them in the single decision point rather than in each tool keeps every entry point in
              agreement.
            tests:
              - PathPolicy_TryResolveRead_OmittedPath_ResolvesToTheAnchor
              - PathPolicy_TryResolveRead_PlaceholderPath_ResolvesToTheAnchor

          - id: AgentKitCore-PathPolicy-GrantPermissionModel
            title: >-
              A path policy shall permit a read when any grant permits it and a write only when a
              read-write grant permits it.
            justification: |
              The read-wide, write-narrow configuration only means anything if a read-only grant can
              never authorize a write. A read is permitted by a grant of either level; a write is
              permitted only by a read-write grant. Reading widely while writing narrowly is
              therefore expressed as two grants of different levels rather than one combined setting.
            tests:
              - PathPolicy_TryResolveWrite_ReadableButNotWritablePath_ReturnsDenial
              - PathPolicy_TwoGrants_CrossLocationTask_ReadOnlyReadsAndReadWriteWrites
              - PathPolicy_WorkingDirectoryGrantedReadOnly_RelativeWriteDenied

          - id: AgentKitCore-PathPolicy-DenyEscapedPath
            title: >-
              A path policy shall deny a request whose normalized location lies outside every
              permitted location, whether the request was stated absolutely or relatively.
            tags: [security]
            justification: |
              This is the decision the whole library exists to make. A request carrying parent
              segments can name a location outside a permitted one while still reading as
              contained, so the decision must be made on the normalized location. Accepting
              relative requests must not weaken that: a relative path is made absolute against the
              working directory before the same normalization and the same containment test are
              applied, so a relative escape and an absolute one reach the same decision.
            tests:
              - PathPolicy_TryResolveRead_NaivePrefixCheckWouldPass_StillDenied
              - PathPolicy_TryResolveRead_RelativeParentTraversal_ReturnsDenial
              - PathPolicy_TryResolveRead_AbsolutePathOutsideRoot_ReturnsDenial

          - id: AgentKitCore-PathPolicy-RealPathReported
            title: >-
              A path policy shall report the real location of a permitted path to the caller.
            justification: |
              A caller that performs the operation on the requested text rather than on the approved
              location would reopen the gap the policy just closed. Handing back the real location
              makes the approved location the obvious thing to act on.
            tests:
              - PathPolicy_TryResolveRead_PermittedPath_ReturnsRealPath
              - PathPolicy_TryResolveWrite_BareFileName_ResolvesBeneathTheAnchor

          - id: AgentKitCore-PathPolicy-EnumerationFiltered
            title: >-
              A path policy shall exclude from directory enumeration every file whose location it
              would deny, shall list every file it would permit — including a file the platform
              reports as hidden — and shall enumerate its working directory when no directory is
              named.
            justification: |
              Listing is how an agent discovers what it may work on. A listing that is broader than
              what access permits discloses files the operator withheld; one that is narrower hides
              work the agent was asked to do, and a model that cannot see a file it may still write
              is invited to invent a path and write to the wrong target. On Unix the platform
              reports every dot-prefixed name as hidden, so excluding hidden entries would silently
              withhold `.github`, `.gitignore` and everything beneath a dot-prefixed directory;
              excluding a name is the author's decision, made through a grant's deny patterns. A
              request naming no directory is the first question an agent asks about a workspace it
              has not seen, and answering it with the working directory is what keeps that question
              from becoming a refusal.
            tests:
              - PathPolicy_EnumerateFiles_PermittedFiles_AreListed
              - PathPolicy_EnumerateFiles_DeniedPatternFile_IsNotListed
              - PathPolicy_EnumerateFiles_HiddenDotPrefixedFile_IsListed
              - PathPolicy_EnumerateFiles_DeniedDirectory_ReturnsEmpty
              - PathPolicy_EnumerateFiles_OmittedDirectory_ListsTheAnchor
              - PathPolicy_EnumerateFiles_RelativeDirectory_ListsThatDirectory

          - id: AgentKitCore-PathPolicy-DenialResult
            title: >-
              A path policy shall report a refused request as a returned denial and shall not throw.
            justification: |
              A model that receives an exception cannot continue its turn, whereas a model that
              receives a denial can choose a permitted path. Refusals are expected traffic in agent
              operation, not exceptional conditions.
            tests:
              - PathPolicy_TryResolveRead_DeniedPath_ReturnsFalseWithoutThrowing
              - PathPolicy_TryResolveWrite_ReadableButNotWritablePath_ReturnsDenial

          - id: AgentKitCore-PathPolicy-UnresolvablePathDenied
            title: >-
              A path policy shall deny a request whose location cannot be determined.
            justification: |
              A model can supply text that no platform can interpret as a path. Denying what
              cannot be understood is the fail-safe reading and keeps the non-throwing contract
              intact for input the model controls.
            tests:
              - PathPolicy_TryResolveRead_MalformedPath_ReturnsDenial

          - id: AgentKitCore-PathPolicy-DenialDisclosesAndEnumerates
            title: >-
              A denial reported by a path policy shall state as its headline reason whether the
              path matches a protected pattern, lies inside a permitted location that no grant
              permits this access to, or lies outside every permitted location; shall echo the
              caller's request; shall state the
              canonical (normalized) absolute location the request was interpreted as, with `.` and
              `..` collapsed, when and only when the request was relative, and shall enumerate the
              permitted locations with their access levels, or state that none are permitted.
            justification: |
              The earlier host-path-disclosure rule is deliberately dropped. Telling a confined model
              the complete, truthful map of where it may work is worth more than concealing paths it
              is already confined to. A denial therefore states, in order: what was asked for, echoed
              verbatim; what it was interpreted as, but only when a relative request was actually
              joined to the working directory, so an interpretation that did not occur is never
              reported and the interpretation is never reported on its own; and the permitted
              locations, each with its access level, so the model can re-address a request rather than
              guess. This makes a silent wrong-target impossible to miss. The interpreted location
              must name a place the model can navigate to, so it is reported with `.` and `..`
              collapsed; a location that cannot be normalized is reported as-interpreted rather than
              raising, keeping the non-throwing contract. The headline reason is distinguished
              three ways rather than two because a write into a file inside a granted read-only
              location is neither a protected-pattern hit nor outside every permitted location;
              headlining it as a location denial states something untrue and contradicts the
              `(read-only)` grant listed beneath it, which is precisely the distinction between
              "wrong place" and "right place, wrong permission" the denial exists to make.
            tests:
              - PathPolicy_TryResolveWrite_InsideReadOnlyGrant_DenialHeadlineNamesThePermission
              - PathPolicy_TryResolveRead_RelativeDenial_EchoesInterpretsAndEnumerates
              - PathPolicy_TryResolveRead_AbsoluteDenial_HasNoInterpretationClause
              - PathPolicy_TryResolveRead_BareSegmentUnderEmptyGrants_ProducesTheWorkedExample
              - PathPolicy_TryResolveRead_OmittedDenial_EchoesAStandIn
              - PathPolicy_TryResolveRead_RelativeParentTraversalDenial_InterpretedPathIsNormalized
              - PathPolicy_TryResolveRead_DotSlashDenial_InterpretedPathIsNormalized
              - PathPolicy_TryResolveRead_NestedTraversalDenial_InterpretedPathIsNormalized
              - PathPolicy_TryResolveRead_PlainRelativeDenial_InterpretedPathReportedVerbatim
              - PathPolicy_TryResolveRead_InterpretedPathNormalizationThrows_StillDeniesAndDiscloses
              - PathPolicy_TryResolveWrite_AliasToReadOnlyGrant_DeniedWithoutInterpretationClause

          - id: AgentKitCore-PathPolicy-DialectMirroring
            title: >-
              A path policy shall report, for any result path a tool emits, whether that path should
              be named relative to the working directory or absolutely, emitting relative only when
              the request was not absolute, the working directory is granted, and the result lies
              within it.
            justification: |
              A tool's output is a demonstration the model imitates, so a result is named in the
              dialect of the request that produced it: absolute in, absolute out; relative in,
              relative out. A relative name is emitted only when it can truthfully name a location the
              model can reach — the working directory must itself be granted, and the result must lie
              within it. A request with no path at all establishes the dialect, and a result outside
              the anchor is emitted absolutely because a relative name could not name it, making the
              switch visible.
            tests:
              - PathPolicy_EmitRelative_MirrorsTheCallerAndTheResultLocation
              - PathPolicy_EmitRelative_UngrantedAnchor_IsAlwaysAbsolute

          - id: AgentKitCore-PathPolicy-DiscoveryLocations
            title: >-
              A path policy shall report the distinct locations a discovery listing enumerates, one
              per grant, substituting the working directory for an unrestricted grant.
            justification: |
              A discovery listing — one made with no directory named — covers every location the
              agent may read. A rooted grant contributes its location; an unrestricted grant, having
              no bounded location to walk, contributes the working directory so the anchor's contents
              are still shown. Reporting the locations once, deduplicated, lets a listing group each
              under a single absolute header without duplicating the grant model.
            tests:
              - PathPolicy_DiscoveryRoots_ListOneLocationPerGrant

          - id: AgentKitCore-PathPolicy-LastSegmentAlias
            title: >-
              A path policy shall resolve a bare segment equal to exactly one grant's final path
              segment to that grant, and shall not alias a bare segment matching two or more grants,
              denying it instead with those locations enumerated.
            tags: [security]
            justification: |
              Accepting a grant's final folder name as an input alias lets a model name a granted
              location it saw under an absolute header. The alias is applied only as a fallback,
              after the working-directory interpretation, and only when nothing by that name exists
              in the working directory (see AgentKitCore-PathPolicy-AliasIsFallback). Aliasing an
              ambiguous segment to one of several same-named locations, by contrast, is the silent
              wrong-target failure this model exists to prevent — undetectable if the chosen
              location is writable — so ambiguity is refused rather than guessed. The refusal
              enumerates every same-named location, which is perfectly predictable and hands the
              model the absolute form it needs.
            tests:
              - PathPolicy_TryResolveRead_LastSegmentAlias_ResolvesToTheGrant
              - PathPolicy_TryResolveRead_AmbiguousAlias_IsNotAliased_EnumeratesBoth

          - id: AgentKitCore-PathPolicy-AliasIsFallback
            title: >-
              A path policy shall interpret a bare relative segment against the working directory
              first, using the grant alias only as a fallback when that interpretation does not
              resolve to an existing path, so the working-directory interpretation wins whenever it
              names a real location.
            tags: [security]
            justification: |
              The working directory is the documented mechanism for interpreting a relative path;
              that is its entire purpose in the model. The grant alias is an ergonomic courtesy for
              input a model guessed at, and a courtesy must never override the documented mechanism.
              Under an alias-wins ordering an agent asking for a bare segment naming a folder inside
              its own working directory could silently receive a different granted location's
              contents that happened to share the final folder name — containment held, both being
              granted, yet the wrong data was returned silently, the exact failure class this model
              exists to eliminate. Interpreting against the working directory first, and considering
              the alias only when nothing by that name exists there, confines the alias to inputs
              that could not have been a real relative path. Ambiguity is unaffected: a bare segment
              matching two or more grants is still refused with those locations enumerated.
            tests:
              - PathPolicy_TryResolveRead_WorkingDirectorySubfolderShadowsSameNamedGrant

          - id: AgentKitCore-PathPolicy-CarriesLimits
            title: >-
              A path policy shall carry the resource ceilings the tools it governs observe,
              defaulting to the library's documented ceilings when none are supplied and rejecting a
              missing set of ceilings, by every construction path it offers.
            justification: |
              Ceilings that ride with the policy mean every tool a host attaches observes one budget
              rather than each inventing its own. Defaulting rather than requiring them keeps the
              two-argument construction working, while rejecting an explicitly missing set prevents a
              caller from expressing "unbounded" by accident.
            tests:
              - PathPolicy_Constructor_NoLimits_UsesDefaultLimits
              - PathPolicy_Constructor_CustomLimits_ExposesSuppliedLimits
              - PathPolicy_Constructor_NullLimits_ThrowsArgumentNullException
