---
# Software Unit Requirements for ToolLimits
#
# These requirements describe the design-level behavior of the ToolLimits unit.

sections:
  - title: AgentKitCore Requirements
    sections:
      - title: ToolLimits Requirements
        requirements:
          - id: AgentKitCore-ToolLimits-Defaults
            title: >-
              Tool limits shall provide a documented default for every ceiling, so that a host
              that configures nothing still operates within a bounded budget.
            justification: |
              A host that has not thought about ceilings is the common case, and it is exactly the
              case in which an unbounded tool result exhausts the model's context window. Shipping
              a published default for every ceiling means the safe configuration is the one a host
              gets by doing nothing.
            tests:
              - ToolLimits_Default_AllCeilings_MatchPublishedDefaults
              - ToolLimits_Constructor_NoArguments_MatchesDefault

          - id: AgentKitCore-ToolLimits-Customization
            title: >-
              Tool limits shall permit a host to replace any individual ceiling while retaining
              the documented default for every other ceiling.
            justification: |
              A host normally has an opinion about one ceiling and none about the rest. Forcing it
              to restate all of them invites a transcription error that silently widens a ceiling
              nobody intended to change.
            tests:
              - ToolLimits_Constructor_SingleCeilingOverridden_RetainsOtherDefaults
              - ToolLimits_Constructor_AllCeilingsSupplied_ExposesSuppliedValues

          - id: AgentKitCore-ToolLimits-RejectNegative
            title: >-
              Tool limits shall reject a negative ceiling as a programming error, while
              permitting a ceiling of zero as the means of disabling an operation.
            justification: |
              A negative ceiling has no meaning and would be interpreted differently by every tool
              that consulted it. Zero, by contrast, is the expressible way for a host to turn an
              operation off entirely — an agent forbidden to delegate — so the two must not be
              rejected together.
            tests:
              - ToolLimits_Constructor_NegativeMaxReadBytes_ThrowsArgumentOutOfRangeException
              - ToolLimits_Constructor_NegativeMaxResultCharacters_ThrowsArgumentOutOfRangeException
              - ToolLimits_Constructor_NegativeMaxBinaryBytes_ThrowsArgumentOutOfRangeException
              - ToolLimits_Constructor_NegativeMaxAgentDepth_ThrowsArgumentOutOfRangeException
              - ToolLimits_Constructor_NegativeMaxImagePixels_ThrowsArgumentOutOfRangeException
              - ToolLimits_Constructor_NegativeMaxDeleteEntries_ThrowsArgumentOutOfRangeException
              - ToolLimits_Constructor_ZeroCeiling_IsAccepted

          - id: AgentKitCore-ToolLimits-DelegationDepth
            title: >-
              Tool limits shall carry the ceiling on how deep a chain of delegated agents may run,
              counted from a root agent at depth zero.
            tags: [security]
            justification: |
              Delegation depth is a budget of the same kind as the content ceilings beside it: a
              host sets it once and every tool observes it. Holding it here rather than as a
              constant on whichever tool happens to delegate means a host configures all of its
              agent's budgets in one place, and means the ceiling cannot be quietly different
              between two families. An agent that can delegate can delegate to something that
              delegates, so an unbounded chain spends the host's money and time in a way no single
              agent's transcript reveals.
            tests:
              - ToolLimits_Default_AllCeilings_MatchPublishedDefaults
              - ToolLimits_Constructor_AllCeilingsSupplied_ExposesSuppliedValues

          - id: AgentKitCore-ToolLimits-DeleteCeiling
            title: >-
              Tool limits shall carry, with the other ceilings, a bound on how many entries one
              removal may take, defaulting to a published value, overridable by the host, and
              settable to zero to forbid recursive removal entirely.
            tags: [security]
            justification: |
              Removing a directory with everything beneath it is the one tool operation whose
              reach is not stated by the request itself, so its bound belongs with the other
              budgets a host sets once and every tool observes, not as a constant on whichever
              tool happens to recurse. Holding it here means a refusal names a number the host
              chose, a host on a workspace of a few hundred files can lower it, and a host doing
              large build-output housekeeping can raise it. What the ceiling buys is honest and
              limited: it bounds the damage a mistake does in a single call so the outcome is
              survivable and observable, and it does not pretend to bound an agent that intends
              the destruction and could remove a tree one file at a time. Zero is the expressible
              way for a host to attach the family and withhold the capability entirely.
            tests:
              - ToolLimits_Default_AllCeilings_MatchPublishedDefaults
              - ToolLimits_Constructor_AllCeilingsSupplied_ExposesSuppliedValues
              - ToolLimits_Constructor_ZeroCeiling_IsAccepted

          - id: AgentKitCore-ToolLimits-DecodeCeiling
            title: >-
              Tool limits shall carry the ceiling on how many pixels a tool may decode from one
              image, counted from the dimensions that image declares.
            tags: [security]
            justification: |
              A ceiling on a file's size does not bound what decoding that file costs. A
              compressed image well inside the binary ceiling can declare far more pixels than its
              size suggests, and a decoded pixel buffer costs four bytes per pixel whatever
              encoding the file itself used — so an image of 8192 by 8192 pixels is 67,108,864
              pixels and 268,435,456 bytes, a quarter of a gigabyte, reachable from a file of a
              few hundred kilobytes. Bounding the pixel count is the only control that closes
              that gap, and counting it from the dimensions an image declares is what lets a tool
              decide before it allocates anything. Holding the ceiling here rather than as a
              constant on whichever tool decodes means a host configures all of its budgets in one
              place, a refusal names a number the host chose rather than an implementation detail,
              and a host on a constrained container can lower it while a host doing high-resolution
              document work can raise it.
            tests:
              - ToolLimits_Default_AllCeilings_MatchPublishedDefaults
              - ToolLimits_Constructor_AllCeilingsSupplied_ExposesSuppliedValues
