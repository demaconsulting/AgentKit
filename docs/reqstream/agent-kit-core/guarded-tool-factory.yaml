---
# Software Unit Requirements for GuardedToolFactory
#
# These requirements describe the design-level behavior of the GuardedToolFactory unit.

sections:
  - title: AgentKitCore Requirements
    sections:
      - title: GuardedToolFactory Requirements
        requirements:
          - id: AgentKitCore-GuardedToolFactory-SelectiveMarshalling
            title: >-
              A tool created by the guarded factory shall deliver text, content and sequences of
              content to the runtime in the form the tool returned them, and shall deliver any
              other result as serialized JSON, for a tool whose declared return type is an
              object.
            justification: |
              The underlying function factory decides whether to serialize a result by the
              delegate's declared return type, and a tool returning a union of a refusal, text,
              content or data is necessarily declared to return an object. Without the guard a
              returned image is flattened into a data URI inside JSON, the provider never
              recognizes an attachment, and the model states that it can see the image and then
              fabricates a description of it — a silent failure with confidently wrong output.
              Preserving every result indiscriminately is not the remedy either: a tool returning
              structured data was then handed to the provider as a raw object it reported back by
              its compiler-generated type name and could not read. Selecting by shape keeps the
              first property and removes the second failure.
            tests:
              - GuardedToolFactory_Create_DelegateDeclaredReturningObject_BinaryResultIsNotJsonSerialized
              - GuardedToolFactory_Create_DelegateDeclaredReturningObject_CaptionedImageSurvivesAsContentList
              - GuardedToolFactory_Create_DelegateDeclaredReturningObject_DenialSurvivesAsString
              - GuardedToolFactory_Create_DelegateDeclaredReturningObject_AnonymousObjectIsSerializedToJsonElement
              - GuardedToolFactory_Create_DelegateDeclaredReturningObject_StructuredResultIsSerializedToJsonElement
              - GuardedToolFactory_Create_DelegateDeclaredReturningObject_NullResultIsPassedThrough

          - id: AgentKitCore-GuardedToolFactory-GuardAlwaysApplied
            title: >-
              The guarded factory shall apply the selective result-delivery guard to every tool
              it creates, irrespective of whether the tool is synchronous or asynchronous and
              irrespective of its parameters.
            justification: |
              A guard a tool author can forget is a guard that will be forgotten. Constructing the
              factory options internally, and applying them to every shape of delegate, is what
              makes the guard impossible to omit rather than merely recommended.
            tests:
              - GuardedToolFactory_Create_SynchronousDelegate_ResultIsStillPassedThrough
              - GuardedToolFactory_Create_ParameterizedDelegate_ResultIsStillPassedThrough

          - id: AgentKitCore-GuardedToolFactory-NameValidated
            title: >-
              The guarded factory shall validate the tool name against the naming convention
              before creating the tool, and the created tool shall carry that name.
            justification: |
              With no name supplied the underlying factory derives a compiler-generated identifier
              from the delegate, which is meaningless to a model and unstable across
              recompilation. Validating at the factory is also what makes the naming convention
              unavoidable, because a tool built any other way is not a supported tool.
            tests:
              - GuardedToolFactory_Create_UnprefixedName_ThrowsArgumentException
              - GuardedToolFactory_Create_ReservedName_ThrowsArgumentException
              - GuardedToolFactory_Create_ValidName_IsCarriedByTheCreatedTool

          - id: AgentKitCore-GuardedToolFactory-DescriptionRequired
            title: >-
              The guarded factory shall require a non-empty description, which the created tool
              shall carry, so that the model is never offered a tool it cannot interpret.
            justification: |
              The name and the description are the model's only means of choosing between tools.
              The underlying factory defaults an absent description to the empty string rather
              than failing, so the requirement has to be enforced here or not at all.
            tests:
              - GuardedToolFactory_Create_EmptyDescription_ThrowsArgumentException
              - GuardedToolFactory_Create_Description_IsCarriedByTheCreatedTool

          - id: AgentKitCore-GuardedToolFactory-RejectMissingDelegate
            title: >-
              The guarded factory shall reject a missing tool implementation as a programming
              error.
            justification: |
              There is nothing to guard and nothing for the model to invoke, so an absent
              implementation is a defect in the tool author's code and is surfaced immediately.
            tests:
              - GuardedToolFactory_Create_NullDelegate_ThrowsArgumentNullException

          - id: AgentKitCore-GuardedToolFactory-OversizedResolvedWithoutRetention
            title: >-
              A tool built by the guarded factory and composed without retention of large outputs
              shall replace an output its tool declared oversized with exactly the refusal the tool
              supplied, and shall deliver every other result unchanged.
            justification: |
              Retention of large outputs is opt-in. A host that has not opted in must observe exactly
              the refusals it always did, and an internal marker must never reach a provider, which
              could not read it.
            tests:
              - GuardedToolFactory_Create_OversizedMarkerWithoutRetention_ReturnsTheIdenticalRefusal
              - GuardedToolFactory_Create_OversizedTextWithoutRetention_IsPassedThroughUnchanged

          - id: AgentKitCore-GuardedToolFactory-MetadataPreserved
            title: >-
              A tool built by the guarded factory shall carry the same name, description, parameter
              and return schemas, serializer options, underlying method and additional properties
              the underlying function factory would have given it, and shall answer a service lookup
              for itself.
            justification: |
              Every provider adapter reads a tool's name, description and schema to publish it, and
              some consumers read its method or properties. The tool returned by the factory resolves
              oversized outputs on the way out, and that must change nothing a consumer can observe
              about the tool itself.
            tests:
              - GuardedToolFactory_Create_ConstructedTool_PreservesEveryPieceOfMetadata

          - id: AgentKitCore-GuardedToolFactory-AsGuardedBoundsText
            title: >-
              The guarded factory shall bound any function, including one it did not build, so that
              a result whose text exceeds the result-character ceiling is refused as too large,
              naming the tool, the size and the ceiling, rather than delivered.
            tags: [security]
            justification: |
              The library's own tools bound their results internally, so a tool an application
              wrote itself, or took from another library, reached the provider unbounded: a 300-row
              report returned 6,350 characters against a 1,500-character limit. An application
              must be able to apply one set of ceilings to every tool it hands an agent. Refusing
              rather than truncating keeps the result honest, as the library's own tools do.
            tests:
              - GuardedToolFactory_AsGuarded_OversizedTextResult_IsRefusedWithSizeAndLimit

          - id: AgentKitCore-GuardedToolFactory-AsGuardedBoundsBinary
            title: >-
              A function bounded by the guarded factory shall refuse a result whose binary content
              exceeds the binary-byte ceiling in total, naming the bytes and the ceiling.
            tags: [security]
            justification: |
              An image or document a foreign tool returns is delivered to the provider whole, and its
              size is a cost the application must be able to cap exactly as it caps the library's
              own image tools.
            tests:
              - GuardedToolFactory_AsGuarded_OversizedBinaryResult_IsRefused

          - id: AgentKitCore-GuardedToolFactory-AsGuardedSerializesStructured
            title: >-
              A function bounded by the guarded factory shall measure and deliver a structured result
              as the JSON document the function's own serializer options produce, shall enumerate a
              single-pass sequence of content exactly once, and shall deliver a result within the
              ceilings unchanged.
            justification: |
              A structured result reaches the provider as JSON text, so that text is what the ceiling
              must judge; measuring the object any other way would admit a result the provider then
              receives oversized. A sequence enumerated once to measure and again by the provider's
              adapter would arrive empty or altered. A result within the ceilings must be untouched,
              or bounding a tool would change what a well-behaved tool delivers.
            tests:
              - GuardedToolFactory_AsGuarded_OversizedStructuredResult_IsSerializedThenRefused
              - GuardedToolFactory_AsGuarded_SinglePassSequence_IsEnumeratedOnce
              - GuardedToolFactory_AsGuarded_ResultWithinLimits_IsUnchanged

          - id: AgentKitCore-GuardedToolFactory-AsGuardedPreservesMetadata
            title: >-
              A function bounded by the guarded factory shall carry the name, description, schema and
              serializer options of the function it bounds and shall answer a service lookup through
              it, and bounding a function the factory already bounded shall replace its ceilings
              rather than add a second set.
            justification: |
              A provider publishes a tool by its name, description and schema, and agent runtimes
              detect that a call needs approval by looking up the approval wrapper as a service, so
              bounding must change neither. Re-bounding a tool to adjust its ceilings must take
              effect; stacking would leave the earlier ceilings in force beneath the new ones.
            tests:
              - GuardedToolFactory_AsGuarded_PreservesNameDescriptionSchema
              - GuardedToolFactory_AsGuarded_ApprovalRequiredInner_DiscoverableThroughGetService
              - GuardedToolFactory_AsGuarded_OnGuardedFunction_ReplacesLimitsWithoutDoubleWrapping

          - id: AgentKitCore-GuardedToolFactory-AsGuardedDefersToRetention
            title: >-
              A function bounded by the guarded factory and then composed with retention of large
              outputs shall have an oversized text result retained for paging instead of refused.
            justification: |
              Retention exists so oversized output is kept rather than lost. A composition that opts
              in must get that behavior for a bounded foreign tool exactly as for the library's own
              tools; the binary ceiling still refuses, because retention keeps text only.
            tests:
              - GuardedToolFactory_AsGuarded_ThenRetentionWrap_RetainsInsteadOfRefusing

          - id: AgentKitCore-GuardedToolFactory-AsGuardedRejectsMissingArguments
            title: >-
              The guarded factory shall reject bounding a missing function, or bounding by missing
              ceilings, as a programming error.
            justification: |
              Either omission is a defect in the composing application, reported where it was written
              rather than at the first tool call.
            tests:
              - GuardedToolFactory_AsGuarded_NullFunctionOrLimits_Throws
