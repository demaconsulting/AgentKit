---
# Software Unit Requirements for ToolOutputSpill
#
# These requirements describe the design-level behavior of the ToolOutputSpill unit, which
# composes retention of large tool outputs into a tool list.

sections:
  - title: AgentKitCore Requirements
    sections:
      - title: ToolOutputSpill Requirements
        requirements:
          - id: AgentKitCore-ToolOutputSpill-ThresholdIsResultCeiling
            title: >-
              A composition retaining large outputs shall return a result within the result ceiling
              with its content unchanged - a structured result as the JSON document it serializes
              to - and shall retain a textual result exceeding it, returning
              in its place a preview no longer than the ceiling that names the reference, the source
              tool, the output's size, and both reader tools.
            justification: |
              The result ceiling already states how much of the context window one result may
              spend; reusing it keeps one budget with one meaning. Naming the reference and the
              readers in a successful result is the designed recourse, so the model can read the
              part it needs rather than guess how to narrow a refused request.
            tests:
              - ToolOutputSpill_Apply_ResultWithinCeiling_IsReturnedUnchanged
              - ToolOutputSpill_Apply_OversizedText_ReturnsBoundedPreviewNamingReferenceAndReaders

          - id: AgentKitCore-ToolOutputSpill-PreviewComposition
            title: >-
              The preview shall show numbered lines from the head and the tail of the output with the
              omitted range marked, shall state which lines it shows and whether lines were wrapped,
              and shall fit with its header within the result ceiling, delivering the header alone
              when the preview size leaves room for no line.
            justification: |
              The head of an output usually says what it is and the tail how it finished. Numbering
              lines exactly as the file reader does lets the model page without learning a new
              shape. Stating the lines shown, including a preview holding only tail lines, tells the
              model exactly what it has not seen. The reference is the result, so it is delivered
              even when the preview size admits no line.
            tests:
              - ToolOutputSpill_Apply_OversizedText_PreviewShowsNumberedHeadAndTail
              - ToolOutputSpill_Apply_WrappedOutput_HeaderNotesTheWrapping
              - ToolOutputSpill_Apply_PreviewIsClampedToTheCeilingAndZeroPreviewDeliversTheHeader
              - ToolOutputSpill_Apply_TailOnlyPreview_HeaderNamesTheTailLines

          - id: AgentKitCore-ToolOutputSpill-MinimumResultCeiling
            title: >-
              Composing retention shall reject a result ceiling below 1,000 characters, so that every
              preview a retaining composition returns, whatever the tool name, reference, sizes and
              wrapping its header carries, fits within the result ceiling.
            tags: [reliability]
            justification: |
              The preview's header names the reference, and the reference is the result. A ceiling
              too small for the header would make every retained output either an over-ceiling
              result a provider may refuse or a lost one, so it is a configuration mistake reported
              when the composition is made. With tool names bounded at 64 characters the header,
              omission marker and line break are at most 531 characters, which 1,000 covers with room
              for preview lines and for every fixed reader result. A composition that does not
              retain is unaffected.
            tests:
              - ToolOutputSpill_Apply_ResultCeilingBelowMinimum_ThrowsArgumentException
              - ToolOutputSpill_MinimumResultCharacters_CoversTheWorstCaseHeader
              - ToolOutputSpill_Apply_MinimumCeiling_EveryPreviewFitsAcrossWorstCaseHeaders

          - id: AgentKitCore-ToolOutputSpill-TextualResultsRetained
            title: >-
              A composition retaining large outputs shall retain an oversized string, JSON document,
              text content or sequence of text content, measuring a JSON document - a JSON string
              included - by its JSON text, retaining a JSON string as its decoded text and indenting
              any other JSON document for paging, from any tool in the composition including one not
              built by the guarded factory.
            justification: |
              Hosts write their own tools, and an oversized custom result is exactly what would
              otherwise reach a provider unbounded. A JSON string reaches a chat adapter as quoted,
              escaped JSON, so measuring its decoded text would let an over-ceiling result through;
              its JSON text never under-counts. The retained copy is what the model pages by line and
              searches literally, so a JSON string is retained decoded and structured data indented:
              escaped or compact JSON is one line a model cannot page.
            tests:
              - ToolOutputSpill_Apply_OversizedStructuredResult_IsRetainedIndented
              - ToolOutputSpill_Apply_OversizedTextContentList_IsRetained
              - ToolOutputSpill_Apply_ToolNotBuiltByTheFactory_IsRetainedToo
              - ToolOutputSpill_Apply_JsonString_IsMeasuredByItsJsonTextAndRetainedDecoded

          - id: AgentKitCore-ToolOutputSpill-StructuredResultsSerialized
            title: >-
              A composition retaining large outputs shall serialize a result that is not absent,
              text, a JSON document or content to a JSON document with its tool's serializer options,
              exactly as the guarded factory does, delivering that document when it fits within the
              result ceiling and retaining it when it exceeds it, and shall fail the invocation when
              the result cannot be serialized, as the guarded factory does.
            tags: [reliability]
            justification: |
              A function not built by the guarded factory may return structured data as it is - a
              record, an anonymous object, a collection, a number, a byte array. Every provider then
              sends it as JSON text, but each adapter serializes it with options of its own, so
              without serialization here it would reach the provider unmeasured and unbounded.
              Serializing it as the guarded factory does measures it as the JSON delivered, retains it
              when oversized, and delivers a hand-built tool's result in the same form as a
              factory-built tool's. A byte array is sent as a base64 JSON string, not as an
              attachment, so it is measured as that string. A value that cannot be serialized is a
              defect in the tool, reported as the guarded factory reports it rather than passed on
              unmeasured.
            tests:
              - ToolOutputSpill_Apply_OversizedStructuredObjectFromHandBuiltFunction_IsRetained
              - ToolOutputSpill_Apply_StructuredResultFromHandBuiltFunction_IsDeliveredAsTheJsonTheGuardedFactoryDelivers
              - ToolOutputSpill_Apply_StructuredResult_IsSerializedWithTheFunctionsOwnOptions
              - ToolOutputSpill_Apply_ScalarResultsFromHandBuiltFunction_AreDeliveredAsTheirJson
              - ToolOutputSpill_Apply_ByteArrayFromHandBuiltFunction_IsMeasuredAndRetainedAsItsBase64Json
              - ToolOutputSpill_Apply_UnserializableResult_FailsTheInvocationAsTheGuardedFactoryDoes

          - id: AgentKitCore-ToolOutputSpill-SequenceEnumeratedOnce
            title: >-
              A composition retaining large outputs shall enumerate a tool's sequence of content at
              most once, delivering the parts it enumerated when the sequence is not retained.
            tags: [reliability]
            justification: |
              A tool may return a single-pass or lazily produced sequence. Enumerating it to measure
              it and again in the provider's adapter would deliver it empty or altered, so the parts
              enumerated once are what is delivered; a list or array is delivered as the very
              instance the tool returned.
            tests:
              - ToolOutputSpill_Apply_SinglePassSequence_IsEnumeratedOnce

          - id: AgentKitCore-ToolOutputSpill-BinaryNeverRetained
            title: >-
              A composition retaining large outputs shall pass binary content and any other content
              that is not text, any sequence of content containing it, and an absent result - null or
              an undefined JSON element - through with their content unchanged.
            justification: |
              Content other than text has no single text form to measure - each adapter renders it
              differently - and binary content is meaningless as numbered lines; a captioned image
              must reach the provider as the image it is. The library's own tools bound binary
              content by its own ceiling. An absent result carries nothing to retain and must reach
              the runtime exactly as without retention.
            tests:
              - ToolOutputSpill_Apply_BinaryContent_PassesThroughUnchanged
              - ToolOutputSpill_Apply_NullResult_PassesThrough
              - ToolOutputSpill_Apply_UndefinedJsonElement_PassesThrough
              - ToolOutputSpill_Apply_NonTextContentFromHandBuiltFunction_PassesThroughUnchanged

          - id: AgentKitCore-ToolOutputSpill-DeclaredOversizedRetained
            title: >-
              A composition retaining large outputs shall retain an output a tool declared oversized,
              whatever its measured size, without claiming in the preview that it exceeds a result
              ceiling it fits within.
            justification: |
              A tool that measures its result against a ceiling of its own decides when it is
              oversized; the composition honors that decision rather than second-guessing it. The
              preview then states the tool's declaration, because a size comparison the output fails
              would tell the model something false.
            tests:
              - ToolOutputSpill_Apply_OversizedMarker_IsRetained

          - id: AgentKitCore-ToolOutputSpill-OverRetentionCeilingRefused
            title: >-
              A composition retaining large outputs shall refuse an output larger than the
              per-output retention ceiling, giving the tool's own refusal when the tool declared the
              output oversized and otherwise a refusal naming the retention ceiling and stating the
              output's size as it would be retained, and shall never truncate it.
            tags: [reliability]
            justification: |
              Retention is bounded, and an output too large to retain must still be answered
              honestly. A truncated output would hide what the model never knew to ask for. The
              ceiling is measured on the retained form - line endings normalized, long lines
              wrapped, structured data indented - so that is the size the refusal states; the size
              the tool returned may be smaller and would contradict the limit it is said to exceed.
            tests:
              - ToolOutputSpill_Apply_MarkerOverRetentionCeiling_ReturnsTheToolsRefusal
              - ToolOutputSpill_Apply_PlainOutputOverRetentionCeiling_IsRefusedNamingTheCeiling
              - ToolOutputSpill_Apply_OutputOverRetentionCeilingOnceRetained_ReportsTheRetainedSize

          - id: AgentKitCore-ToolOutputSpill-ReadersAppendedNotRetained
            title: >-
              A composition retaining large outputs shall append the read and search tools after the
              supplied tools, preserve each supplied tool's metadata, and never retain a reader's own
              result.
            justification: |
              The readers are the recourse the preview names, so they must be present wherever a
              preview can appear. A reader's result is bounded and refused when over the ceiling, so
              a page can never become yet another reference.
            tests:
              - ToolOutputSpill_Apply_Tools_AreFollowedByTheReaders
              - ToolOutputSpill_Apply_ReaderResults_AreNeverRetained

          - id: AgentKitCore-ToolOutputSpill-IsolatedPerApplication
            title: >-
              Each composition retaining large outputs shall have its own store, and composing
              retention shall not alter the tools it was composed from.
            tags: [security]
            justification: |
              One composition must not be able to read another's outputs, and a tool list composed
              without retention must keep behaving as it did.
            tests:
              - ToolOutputSpill_Apply_TwoApplications_DoNotShareReferencesOrAlterTheSuppliedTools

          - id: AgentKitCore-ToolOutputSpill-RejectsInvalidLists
            title: >-
              Composing retention shall reject a missing list or ceilings, a null tool, two tools of
              one name, a tool whose name carries the reserved tool_output prefix, and a tool whose
              name is longer than 64 characters.
            justification: |
              Each is a mistake in the composing application. A tool named like a reader would be
              indistinguishable from the readers the composition appends. A name longer than any
              provider accepts can only come from a hand-built function, and the name is part of
              every preview header, so it must be bounded for the header to be.
            tests:
              - ToolOutputSpill_Apply_InvalidLists_Throw
              - ToolOutputSpill_Apply_ToolNameLongerThanTheLimit_ThrowsArgumentException
