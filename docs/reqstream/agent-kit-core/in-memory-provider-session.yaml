---
# Software Unit Requirements for InMemoryProviderSession
#
# These requirements describe the design-level behavior of the InMemoryProviderSession unit.

sections:
  - title: AgentKitCore Requirements
    sections:
      - title: InMemoryProviderSession Requirements
        requirements:
          - id: AgentKitCore-InMemoryProviderSession-ContactsNothing
            title: >-
              The unit shall provide an in-memory provider session that answers from a supplied
              responder, holds its history in memory, and records nothing for a canceled turn.
            justification: |
              The compaction engine's promise is only believable if it can be exercised end to end
              without a live model, which is neither deterministic nor repeatable in a build. The
              in-memory session answers from a responder and holds its seeded history plus everything
              since. A canceled turn leaves it exactly as it was, with no ghost message, matching the
              rule the compacting session applies to its own transcript.
            tests:
              - InMemoryProviderSession_Send_AnswersAndRecords
              - InMemoryProviderSession_CanceledTurn_RecordsNothing

          - id: AgentKitCore-InMemoryProviderSession-RecordsRotationEvidence
            title: >-
              The unit shall make disposal observable and record every session its factory created, so
              a rotation test can assert what was created and released.
            justification: |
              Rotation creates a replacement and disposes the previous session, and both halves have to
              be observable for the behavior to be verifiable at all: a test asserts how many sessions
              were created, that the earlier ones were disposed, and what the newest was seeded with.
            tests:
              - InMemoryProviderSession_Dispose_IsObservable
              - InMemoryProviderSessionFactory_Create_RecordsSessions

          - id: AgentKitCore-InMemoryProviderSession-RefusesMalformedUse
            title: >-
              The unit shall refuse a null seed or responder, a window that is not positive, a
              responder that returns nothing, and a turn sent after disposal.
            justification: |
              This session is part of the public surface, not a test fixture, so an application author
              exercising the engine against it can make every one of these mistakes. Each is refused
              where it is written rather than being discovered later as an incoherent session: a
              window of zero would have the engine believe the session was full before it had said
              anything, a responder returning nothing would leave a message no turn ever answered, and
              a turn after disposal would be answered by a session the owner has already released.
            tests:
              - InMemoryProviderSession_Construct_NullArgument_Throws
              - InMemoryProviderSession_Construct_NonPositiveWindow_Throws
              - InMemoryProviderSession_Send_ResponderReturnsNull_Throws
              - InMemoryProviderSession_Send_AfterDispose_Throws

          - id: AgentKitCore-InMemoryProviderSession-AnswersForItsOwnWindow
            title: >-
              The unit shall answer for its own window as every adapter does, reporting what its
              history occupies out of the window it was given.
            justification: |
              A provider session is the one place that can say how full it is and out of how much, so
              the in-memory one computes both from its seeded history and the window it was
              constructed with and reports them as a provider's own figures, with the conversation
              broken out as a provider that distinguishes the two does. That is the shape a real
              adapter has, which is what makes exercising the engine against this session meaningful
              rather than a rehearsal of a path no adapter takes.
            tests:
              - InMemoryProviderSession_Usage_ReportsItsOwnWindowAndSplit
