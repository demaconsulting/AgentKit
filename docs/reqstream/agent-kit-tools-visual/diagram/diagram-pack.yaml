---
# Software Unit Requirements for DiagramPack
#
# These requirements describe the design-level behavior of the DiagramPack unit.

sections:
  - title: AgentKitToolsVisual Requirements
    sections:
      - title: Diagram Requirements
        sections:
          - title: DiagramPack Requirements
            requirements:
              - id: AgentKitToolsVisual-Diagram-Pack-FamilyPrefix
                title: >-
                  The diagram pack shall declare the family prefix diagram, exposed as a constant on
                  the pack and reported through the pack contract.
                justification: |
                  The prefix is the family's identity, and the composition refuses two packs
                  claiming one. Publishing it as a constant lets an application or a test name the
                  family without a literal that could drift from the names the tools carry.
                tests:
                  - DiagramPack_FamilyPrefix_Constant_IsDiagram
                  - DiagramPack_FamilyPrefix_Contract_ReportsTheDeclaredConstant

              - id: AgentKitToolsVisual-Diagram-Pack-PreviewFollowsHost
                title: >-
                  The diagram pack shall require the vision capability in image preview and no
                  capability in text preview, defaulting to image preview, and shall offer a way to
                  create a pack whose preview is image preview exactly when the host declares the
                  vision capability.
                tags: [security]
                justification: |
                  Image preview returns pictures, which only a host that can present them can use;
                  text preview returns words, which every host can. Choosing the mode from the same
                  capabilities the application declares on its builder keeps a pack from being
                  withheld for a capability it does not need, or offered where its result would be
                  invisible.
                tests:
                  - DiagramPack_RequiredCapabilities_FollowThePreviewMode
                  - DiagramPack_For_HostCapabilities_ChoosesThePreviewMode

              - id: AgentKitToolsVisual-Diagram-Pack-RegistersHelpAndRenderTools
                title: >-
                  The diagram pack shall create the help tool followed by the render tool, with no
                  null element.
                justification: |
                  The render tool's failures name help topics, so the two are created together in
                  the one place the prefix is claimed. A null element would fail the composition
                  for a reason no caller could act on.
                tests:
                  - DiagramPack_CreateTools_Policy_CreatesTheHelpAndRenderTools

              - id: AgentKitToolsVisual-Diagram-Pack-ToolsCarryFamilyPrefix
                title: >-
                  Every tool the diagram pack creates shall carry the declared family prefix followed
                  by an underscore.
                justification: |
                  The collision check a composition performs is only meaningful if the declared
                  prefix is true of the names the pack publishes.
                tests:
                  - DiagramPack_CreateTools_Policy_CreatesTheHelpAndRenderTools

              - id: AgentKitToolsVisual-Diagram-Pack-TextPreviewRenderRequiresWriteGrant
                title: >-
                  The diagram pack shall withhold the render tool in text preview when the access
                  policy permits no writing anywhere, and shall publish the help tool, and the render
                  tool in image preview, under every policy.
                tags: [security]
                justification: |
                  In text preview the render tool must save the picture, so under a policy that
                  permits no writing its only outcome would be a refusal, and the AgentKit packs
                  withhold such a tool. The help tool touches no file, and image preview returns the
                  picture without writing, so both succeed under every policy; image preview's
                  optional save is answered by the ordinary refusal naming the writable locations.
                tests:
                  - DiagramPack_CreateTools_ReadOnlyPolicy_WithholdsTheTextPreviewRenderTool

              - id: AgentKitToolsVisual-Diagram-Pack-RequiresPolicy
                title: >-
                  The diagram pack shall reject an absent access policy as a programming error rather
                  than creating tools governed by nothing.
                tags: [security]
                justification: |
                  A family created without a policy would save pictures and resolve references with no
                  confinement while appearing correctly composed. Failing where the mistake was made
                  reports it to the developer who can fix it.
                tests:
                  - DiagramPack_CreateTools_NullPolicy_ThrowsArgumentNullException

              - id: AgentKitToolsVisual-Diagram-Pack-PolicyGovernsCreatedTools
                title: >-
                  The access policy supplied to the diagram pack shall govern every tool the pack
                  creates.
                tags: [security]
                justification: |
                  An application configures one policy and expects every attached tool to obey it.
                tests:
                  - DiagramPack_CreateTools_SuppliedPolicy_GovernsTheRenderTool

              - id: AgentKitToolsVisual-Diagram-Pack-AcceptsOptions
                title: >-
                  The diagram pack shall accept a preview mode and options, applying the defaults
                  when none are given, and shall refuse an undefined preview mode and a smallest
                  preview side above the largest render side at construction.
                justification: |
                  A host bounds the drawings and chooses the languages once, on the pack. A value the
                  pack cannot apply is refused where it was given, so every accepted option is
                  applied as stated.
                tests:
                  - DiagramPack_Constructor_Options_AreApplied
                  - DiagramPack_Constructor_InvalidArguments_AreRefused

              - id: AgentKitToolsVisual-Diagram-Pack-InstructionsOffered
                title: >-
                  The diagram pack shall offer a short instruction paragraph naming the offered
                  languages and the draw, look and fix loop for its preview mode, and shall not add it
                  to any tool or instructions itself.
                justification: |
                  An application may want its agent told how to use the family, and the pack knows
                  the languages and the mode. The application's instructions are its own, so the
                  paragraph is offered for the application to place, never injected.
                tests:
                  - DiagramPack_Instructions_NameTheLanguagesAndFollowThePreviewMode
                  - DiagramPack_Instructions_AreNotInjectedIntoTheTools

              - id: AgentKitToolsVisual-Diagram-Pack-WarmUp
                title: >-
                  The diagram pack shall offer an optional warm-up that draws a sample of each
                  offered language, leaving the pack able to draw afterwards.
                justification: |
                  The first drawing of each language in a process pays for loading its library. A
                  host that would rather pay that at start-up calls the warm-up; the pack never calls
                  it itself.
                tests:
                  - DiagramPack_WarmUpAsync_Pack_CompletesAndTheRenderToolStillDraws
