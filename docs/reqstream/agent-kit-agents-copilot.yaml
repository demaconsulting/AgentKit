---
# Software System Requirements for AgentKit Copilot Agents
#
# These requirements describe the externally visible behavior of the library
# from the perspective of its consumers, without specifying implementation details.
#
# They are the mechanisms of one product capability, AgentKit-Provider-GitHubCopilot
# (docs/reqstream/agent-kit.yaml), which links every one of them as a child. They
# therefore carry no 'system' tag: the capability is the root, and a mechanism here that
# stops contributing to it is reported as an orphan rather than standing on its own.

sections:
  - title: AgentKitAgentsCopilot Requirements
    requirements:
      - id: AgentKitAgentsCopilot-ToolSuppression-AllowListDerived
        title: >-
          The library shall withhold the capability the Copilot runtime injects, suppressing the
          runtime's tools by deriving a source-qualified session allow-list from the same tool
          collection it publishes to the session, so the published tools and the allow-list cannot
          diverge, refusing a supplied tool named like a built-in, and withholding from the model, on
          every session it builds, every other channel of injected capability that the session's
          options and the live session can reach — including every MCP server the session lists,
          which is disabled before any turn runs, the session's installed plugins and the host
          environment context — while running every session on a runtime the library starts in Empty
          mode, on a data directory it owns, with the host's COPILOT_ and GITHUB_COPILOT_ variables
          withheld apart from an allow-listed credential, network and telemetry-off set.
        tags: [security]
        justification: |
          Copilot arrives as a complete agent runtime carrying its own tools — shell, fetch, file
          reading and writing, and more — and its own channels for injecting further capability and
          direction. Supplying an application's own tools is not enough: unless the built-ins are
          suppressed, a document assistant silently retains command execution. The session's
          available-tools list is an allow-list, so the library derives it from the same collection
          it assigns as the session's tools. Deriving both from one collection makes the published
          tool set and the allow-list impossible to drift apart, which is the safety property of the
          whole package. Each allow-list entry is qualified as a custom tool because, measured against
          the live runtime, a bare name also admits a built-in tool that carries the same name; for the
          same reason a supplied tool may not carry a built-in's name at all. Tools are not the only
          channel: the runtime's skills, discovered instructions, hooks, memory, sub-agents,
          extensions, installed plugins, MCP servers and the host environment context it writes into
          the system prompt would attach capability and direction the composing application never
          granted, so those channels are withheld on every session for the same reason the built-in
          tools are suppressed. They are withheld per session as well as by the runtime's mode, so
          the confinement does not rest on the mode alone; and MCP servers are disabled rather than
          merely filtered out of the allow-list, because Empty mode does not itself stop ambient MCP
          servers — measured against the live runtime, it starts the built-in GitHub server on the
          first turn and runs a server its data directory configures — and a server that is started
          runs a process with the user's environment and can contribute instructions even when none
          of its tools is allowed.

          On the runtime the library owns, before any session exists, the built-in GitHub MCP server
          is named disabled, so it is not started or authenticated; no user-configured server can
          exist in a fresh data directory, and one added later is found by the runtime's discovery
          and disabled before the session is created; workspace MCP configuration is not loaded,
          because configuration discovery is off and the data directory trusts no folder, and a
          workspace server that discovery reports is disabled as well; and no plugin is installed in
          a fresh data directory, nor can plugin directories be configured. Those sources are
          prevented. Servers from a managed catalog or a signed-in account follow organization policy
          and the account; the SDK cannot enumerate them before a session exists, so one may start,
          and authenticate, while the session is created. The library then disables every server the
          session's MCP configuration lists, before any turn runs, and refuses the session if one
          stays enabled: that contains such a server, it does not prevent it. The session's
          configuration listing is not complete — it does not report the built-in GitHub server even
          while that server runs — so this post-create seal is defense in depth, not proof of absence.
          In every case, no MCP tool is on a session's allow-list.
        children:
          - AgentKitAgentsCopilot-CopilotAgentFactory-DerivesAllowList
          - AgentKitAgentsCopilot-CopilotAgentFactory-WithholdsInjectedCapability
          - AgentKitAgentsCopilot-CopilotAgentFactory-OneConfinementPath
          - AgentKitAgentsCopilot-CopilotAgentFactory-RefusesBuiltInToolNames
          - AgentKitAgentsCopilot-CopilotProviderSessionFactory-DerivesAllowListFromSeededTools
          - AgentKitAgentsCopilot-CopilotTurnChannel-ClosesAmbientMcpServersAndPlugins
          - AgentKitAgentsCopilot-Runtime-OwnedAndConfined
        tests:
          - AgentKitAgentsCopilot_BuildSessionConfig_AvailableToolsDerivedFromSuppliedTools
          - AgentKitAgentsCopilot_Session_BuiltInToolRequest_IsRejectedOnTheSessionPath
          - AgentKitAgentsCopilot_BuildSessionConfig_BuiltInToolName_IsRefused
          - AgentKitAgentsCopilot_EverySession_AmbientMcpServersAreClosed

      - id: AgentKitAgentsCopilot-PermissionHandler-DefaultSafe
        title: >-
          The library shall install, when the host supplies none, a permission handler that
          approves exactly the supplied tools by name and rejects every other request, shall
          install a host-supplied handler verbatim when one is given, and shall put every
          permission request to the installed handler.
        tags: [security]
        justification: |
          The target user is not qualified to adjudicate a security prompt, so the default must be
          safe without asking: it approves a request only when it names one of the supplied tools
          and rejects everything else, including every built-in tool, none of which is one of the
          supplied custom tools. A host that has its own policy may supply a handler, which the
          library installs unchanged — replacing the default rather than composing with it, so a host
          that supplies one takes on default-deny itself. Default-safe with host override keeps the
          untrained-user case correct while leaving a capable host in control. The runtime has modes
          that approve requests without asking any handler, so every session is pinned to the mode
          that asks; otherwise ambient configuration could bypass the handler without anything the
          library configured changing.
        children:
          - AgentKitAgentsCopilot-CopilotAgentFactory-DefaultPermissionHandler
          - AgentKitAgentsCopilot-CopilotAgentFactory-HostHandlerOverride
          - AgentKitAgentsCopilot-CopilotAgentFactory-PinsManualPermissionMode
          - AgentKitAgentsCopilot-CopilotProviderSessionFactory-DefaultSafePermissions
        tests:
          - AgentKitAgentsCopilot_DefaultPermissionHandler_SuppliedTool_IsApproved
          - AgentKitAgentsCopilot_DefaultPermissionHandler_UnlistedCustomTool_IsRejected
          - AgentKitAgentsCopilot_DefaultPermissionHandler_BuiltInTool_IsRejected

      - id: AgentKitAgentsCopilot-AgentConstruction-Validated
        title: >-
          The library shall build a Microsoft Agent Framework agent on a Copilot runtime the library
          owns and a supplied tool list without taking ownership of the runtime, rejecting a missing
          runtime and a malformed tool list — including one naming a tool like a runtime built-in — and carrying the
          supplied instructions, the supplied choice of model and the supplied working directory.
        justification: |
          The host starts and disposes the Copilot runtime, so the agent takes no ownership of it —
          whoever started the runtime disposes it. The agent accepts only a runtime the library
          started, never a client the host built, because the confinement depends on the client's
          mode, data directory and environment, none of which can be read back from a client. A
          missing runtime or a malformed tool list is a defect in the host, refused where the host
          wrote it. Supplied instructions are carried onto the
          session so a confined agent is governed as the host intended, and so is a supplied choice
          of model: which model backs an agent materially changes how reliably it uses its tools and
          how accurately it reads an image, so the application author must be able to make that
          choice through the library rather than around it — going around it means building a
          session by hand and losing the suppression and the default-safe permission handler. A host
          that expresses no choice gets the runtime's own default, so the capability adds nothing an
          existing application must account for. The library sets no working directory on the runtime
          process, so the working directory is offered here for the same reason as the model: a host
          must not have to go around the library to set it.
        children:
          - AgentKitAgentsCopilot-CopilotAgentFactory-RejectsNullRuntime
          - AgentKitAgentsCopilot-CopilotAgentFactory-RejectsInvalidToolList
          - AgentKitAgentsCopilot-CopilotAgentFactory-RefusesBuiltInToolNames
          - AgentKitAgentsCopilot-CopilotAgentFactory-CarriesInstructions
          - AgentKitAgentsCopilot-CopilotAgentFactory-SelectsModel
          - AgentKitAgentsCopilot-CopilotAgentFactory-CarriesWorkingDirectory
          - AgentKitAgentsCopilot-CopilotProviderSessionFactory-CarriesWorkingDirectory
        tests:
          - CopilotAgentFactory_Create_NullRuntime_Throws
          - AgentKitAgentsCopilot_BuildSessionConfig_BuiltInToolName_IsRefused

      - id: AgentKitAgentsCopilot-SessionAdapter-CarriesACoreSession
        title: >-
          The library shall carry an AgentKit session over the GitHub Copilot runtime, seeding a
          fresh Copilot session with the instructions, tools and history a rotation produces, sending
          each message as one turn, recording the turn's tool calls and results as identified pairs,
          abandoning a session whose conversation it can no longer account for, and owning and
          releasing each Copilot session it creates without ever disposing the runtime.
        justification: |
          The compaction engine is the reason a long-running agent behaves the same way on every
          provider, and until now it had one adapter, for the stateless chat-client family. Copilot
          exposes no chat-client abstraction at all, so the engine could not run on the one provider
          this project's continuous integration can reach — which meant the engine's behavior against
          a provider the team can actually run was never exercised. This requirement closes that gap.
          Seeding is the hard part, because Copilot's session configuration carries no history field
          of any kind: the history a rotation produces is rendered as a labeled record and carried on
          the session's first message, prepended to the message the engine was already sending, so a
          rotation still costs exactly one request and a rotated session is briefed rather than
          replayed. Ownership follows the contract the package already records:
          the host owns the runtime, and every session a rotation creates is AgentKit's, released on
          every path including failure. A session that can no longer describe the conversation the
          runtime holds is abandoned rather than reused, because the engine's own answer to such a
          session — seed a replacement from the transcript — is the only recovery that is sound.
        children:
          - AgentKitAgentsCopilot-CopilotProviderSession-SendsOneTurnPerMessage
          - AgentKitAgentsCopilot-CopilotProviderSession-RecordsToolTraffic
          - AgentKitAgentsCopilot-CopilotProviderSession-RejectsInvalidArguments
          - AgentKitAgentsCopilot-CopilotProviderSession-ReleasesItsSessionNotTheClient
          - AgentKitAgentsCopilot-CopilotProviderSession-RefusesASilentSession
          - AgentKitAgentsCopilot-CopilotProviderSession-EndsOnATurnItCouldNotRecord
          - AgentKitAgentsCopilot-CopilotProviderSessionFactory-CreatesSeededSessions
          - AgentKitAgentsCopilot-CopilotProviderSessionFactory-RendersTheSeededHistoryAsALabeledRecord
          - AgentKitAgentsCopilot-CopilotProviderSessionFactory-LeavesNothingUnowned
          - AgentKitAgentsCopilot-CopilotSessionObserver-RecordsTheTurnsWork
          - AgentKitAgentsCopilot-CopilotSessionObserver-RecordsToolOutcomes
          - AgentKitAgentsCopilot-CopilotSessionObserver-RemembersTheRuntimesError
          - AgentKitAgentsCopilot-CopilotTurnChannel-CarriesOneRuntimeSession
          - AgentKitAgentsCopilot-CopilotTurnChannel-OwnsTheSessionNotTheClient
          - AgentKitAgentsCopilot-CopilotTurnChannel-CallerGovernsTheDeadline
        tests:
          - AgentKitAgentsCopilot_Session_AnswersAndReportsTheRuntimesOccupancy
          - AgentKitAgentsCopilot_Session_RotatesOnTheRuntimesUsage_AndSeedsTheReplacement

      - id: AgentKitAgentsCopilot-SessionAdapter-OccupancyFromTheRuntime
        title: >-
          The library shall take both the occupancy and the context window of a Copilot session from
          the runtime's own reporting, shall never require an application to state a window, and
          shall refuse a turn the runtime answered without reporting its usage.
        justification: |
          Rotation happens when the window is filling, which is the one thing the session engine
          needs a token count for. Every other adapter has to be told its window because the
          abstraction it sits on publishes none; Copilot reports its occupancy, its limit and the
          conversation's own share with every turn, so asking an application for a figure the
          provider already knows would create a second source of truth for one fact — precisely what
          the engine's single-reading design retired. Passing the conversation's share through rather
          than inferring it keeps every threshold comparison in the runtime's own tokens. A turn
          answered with no reading at all is refused rather than estimated around, because an absent
          figure means something an application can see and fix.

          An application may set a ceiling on the window accounted against, which only ever lowers
          it. That is not a second source of truth: the runtime's figure still governs, and a
          ceiling above it is ignored. It buys answer quality on a very long conversation, and it is
          what makes a rotation reachable at all on a runtime whose smallest window is larger than
          any conversation a test would produce.
        children:
          - AgentKitAgentsCopilot-CopilotSessionObserver-HoldsTheLatestUsageReading
          - AgentKitAgentsCopilot-CopilotSessionObserver-AnswersWhetherThisTurnReportedUsage
          - AgentKitAgentsCopilot-CopilotProviderSession-ReportsTheRuntimesUsage
          - AgentKitAgentsCopilot-CopilotProviderSession-ZeroBeforeTheFirstTurn
          - AgentKitAgentsCopilot-CopilotProviderSession-RefusesUnreportedUsage
          - AgentKitAgentsCopilot-CopilotProviderSession-HonorsAWindowCeilingDownwardOnly
        tests:
          - AgentKitAgentsCopilot_Session_AnswersAndReportsTheRuntimesOccupancy

      - id: AgentKitAgentsCopilot-SelfCompaction-HeldClearOfRotation
        title: >-
          The library shall create every Copilot session its own session engine drives with the
          runtime's compaction threshold raised clear of the engine's rotation point, shall leave the
          runtime's compaction untouched on the plain agent path, and shall refuse further turns on a
          session the runtime compacted, truncated, cleared or rewound anyway.
        justification: |
          The Copilot runtime compacts its own sessions by default, at a threshold of the same order
          as AgentKit's rotation threshold and against the same occupancy signal. Two compactors
          acting on one conversation is not a theoretical conflict: the runtime would rewrite history
          underneath a session whose transcript the engine believes it owns, and the occupancy the
          engine reads afterwards would move for reasons it cannot see — so the engine would seed a
          replacement from a history the provider no longer holds.

          Asking the runtime to stop does not work. Measured against the live runtime, a session created
          with the infinite-session flag set false compacted as soon as its threshold was crossed,
          identically to one created with the flag true; a session whose threshold was not crossed
          did not compact whatever the flag said. The threshold is the honored setting, so it is the
          one relied on. The flag is still set, because it states the intent and costs nothing if the
          runtime ever begins honoring it, but nothing depends on it.

          The threshold is raised rather than merely left alone because the runtime's default of 0.80
          sits a tenth of the window above the engine's rotation at 0.70, and one turn returning a
          large tool result can cross that gap in a single step. It is not raised to 1.0: the
          runtime's last-resort behavior is worth keeping, and a session that sees a compaction or
          truncation announced refuses the next turn — before it is sent as well as after one
          returns — so the outcome is diagnosable rather than silent either way. That refusal is also
          what makes it safe to carry a rotation's record on the conversation channel: the runtime
          could in principle discard it, but it cannot do so quietly.

          The asymmetry is deliberate: a plain Copilot agent has no AgentKit compactor behind it, so
          changing the runtime's would remove protection rather than prevent a conflict.
        children:
          - AgentKitAgentsCopilot-CopilotProviderSessionFactory-HoldsRuntimeCompactionClearOfRotation
          - AgentKitAgentsCopilot-CopilotSessionObserver-DetectsRewrittenHistory
          - AgentKitAgentsCopilot-CopilotProviderSession-RefusesARewrittenHistory
          - AgentKitAgentsCopilot-CopilotAgentFactory-LeavesTheAgentPathsCompactionAlone
        tests:
          - AgentKitAgentsCopilot_Session_RuntimeCompactionIsHeldClearOfRotationOnEverySessionItBuilds

      - id: AgentKitAgentsCopilot-Consolidation-OutOfSession
        title: >-
          The library shall consolidate session history on a separate, short-lived, tool-free Copilot
          session, using the consolidation prompt the library publishes, and shall release that
          session on every path.
        justification: |
          Compaction cannot happen without a summarizer, so a provider AgentKit carries a session for
          but ships no summarizer for is a provider on which compaction quietly never happens. The
          consolidation runs outside the session being compacted because a consolidation sent through
          the live conversation would spend the very context it exists to reclaim and would itself
          count toward the occupancy that triggered the rotation. The session it runs on carries no
          tools, because a consolidation is a pure function from material to a record of it and a
          tool that could act would be acting outside everything the conversation's own confinement
          was reasoned about.
        children:
          - AgentKitAgentsCopilot-CopilotSummarizer-SendsTheConsolidationPrompt
          - AgentKitAgentsCopilot-CopilotSummarizer-CarriesNoTools
          - AgentKitAgentsCopilot-CopilotSummarizer-RunsOutsideTheCompactedSession
          - AgentKitAgentsCopilot-CopilotSummarizer-EmptyAnswerIsAnEmptyRecord
          - AgentKitAgentsCopilot-CopilotSummarizer-ReleasesItsSession
        tests:
          - AgentKitAgentsCopilot_Session_RotatesOnTheRuntimesUsage_AndSeedsTheReplacement

      - id: AgentKitAgentsCopilot-Agent-RunsConversations
        title: >-
          The library's agent shall run a conversation on the Copilot runtime that continues across
          runs and across agent instances given the serialized conversation, confined identically on
          every run, streaming what the runtime produces, delivering inline data the caller attaches,
          and releasing every runtime session it opens without disposing the runtime.
        justification: |
          The Copilot SDK ships no Agent Framework agent, and the adapter that once supplied one does
          not support the current SDK, so the library supplies the agent itself. An application that
          hands a user an agent expects a conversation, not a sequence of unrelated questions: a
          later run must remember an earlier one, a conversation must survive a restart through the
          Agent Framework's own session serialization, and every run must be confined exactly as the
          first was, because the runtime applies each resumption's configuration afresh. A caller
          reading a run as it happens needs the text, the tool traffic and the usage streamed. Agent
          sessions are not disposable, so the runtime session a run opens is released when the run
          ends — kept rather than deleted, so the conversation stays resumable.
        children:
          - AgentKitAgentsCopilot-CopilotAgent-OpensOrResumesPerRun
          - AgentKitAgentsCopilot-CopilotAgent-ReleasesAfterEveryRun
          - AgentKitAgentsCopilot-CopilotAgent-StreamsUpdates
          - AgentKitAgentsCopilot-CopilotAgent-ReturnsTheStreamAsOneResponse
          - AgentKitAgentsCopilot-CopilotAgent-DeliversDataContentAsAttachments
          - AgentKitAgentsCopilot-CopilotAgent-SerializesTheSession
          - AgentKitAgentsCopilot-CopilotAgent-SerializesRunsOnASession
          - AgentKitAgentsCopilot-CopilotAgent-ReportsRuntimeErrors
          - AgentKitAgentsCopilot-CopilotAgent-RejectsForeignSessions
          - AgentKitAgentsCopilot-CopilotTurnChannel-RetainsAgentSessions
          - AgentKitAgentsCopilot-CopilotTurnChannel-ResumesARecordedSession
          - AgentKitAgentsCopilot-CopilotAgentFactory-ConfinesResumedSessions
          - AgentKitAgentsCopilot-CopilotAgentFactory-EnablesStreamingOnTheAgentPath
        tests:
          - AgentKitAgentsCopilot_Agent_RunsAndStreamsOnTheRuntime
          - AgentKitAgentsCopilot_Agent_SerializedSession_ResumesUnderTheSameConfinement

      - id: AgentKitAgentsCopilot-ToolResults-DeliveredInline
        title: >-
          The library shall deliver a tool's result to the model inline on every Copilot session it
          builds, however large the result is.
        justification: |
          Left at its default, the Copilot runtime replaces a large tool result with the path of a
          temporary file it saved the result to. A confined agent has no tool that can read that file,
          so the result would be lost exactly when it is largest — measured against the live runtime,
          the model asked for the built-in viewer, was refused, and failed its task. AgentKit's tools
          bound their own output, so the diversion protects nothing they need.
        children:
          - AgentKitAgentsCopilot-CopilotAgentFactory-DisablesLargeOutputDiversion
        tests:
          - AgentKitAgentsCopilot_EverySession_DeliversToolResultsInline

      - id: AgentKitAgentsCopilot-RuntimeStartup-Diagnosable
        title: >-
          The library shall report a Copilot runtime that cannot start — no installed CLI found, a CLI
          too old or too new for the library, a CLI whose version cannot be read, a bundled runtime
          that was not provisioned, or a runtime that is not signed in, listing what each sign-in
          source found — with the runtime's own error
          where there is one and the likely cause and remedy, and shall pass a canceled start through
          as a cancellation, unchanged unless it carries a cause or a token to redact.
        justification: |
          Each of these failures otherwise surfaces as an error that names neither the cause nor the
          remedy: a missing file, an SDK handshake failure that tells the user to update the SDK, or
          a first turn that fails for lack of credentials. A host author can lose hours to any of
          them. The installed CLI changes independently of the library, so its version is the
          commonest cause, and the refusal says how to check the version the library runs and how to
          upgrade each installation. The bundled runtime is provisioned only when the application
          references the SDK directly. Because the library withholds the host's Copilot configuration
          variables from the runtime, an ambient runtime-path override, set by every Copilot CLI
          shell, can no longer be the cause.
        children:
          - AgentKitAgentsCopilot-CopilotRuntime-ExplainsAMissingRuntime
          - AgentKitAgentsCopilot-CopilotRuntime-RefusesAnUnsupportedCli
          - AgentKitAgentsCopilot-CopilotRuntime-RefusesAnUnauthenticatedRuntime
          - AgentKitAgentsCopilot-CopilotRuntime-PassesCancellationThrough
          - AgentKitAgentsCopilot-CopilotCli-ReportsWhereItLooked
          - AgentKitAgentsCopilot-CopilotCli-RequiresTheMinimumVersion
          - AgentKitAgentsCopilot-CopilotCli-ExplainsAProbeThatFails
          - AgentKitAgentsCopilot-CopilotSignIn-ReportsWhatEachSourceFound
        tests:
          - AgentKitAgentsCopilot_Runtime_FailedStart_IsExplained
          - AgentKitAgentsCopilot_Runtime_UnsupportedCli_IsRefusedWithUpgradeGuidance
          - AgentKitAgentsCopilot_Runtime_Unauthenticated_IsRefusedWithSignInGuidance
          - AgentKitAgentsCopilot_Runtime_NoSourceSignsIn_RefusalListsWhatEachSourceFound

      - id: AgentKitAgentsCopilot-Runtime-InstalledCliByDefault
        title: >-
          The library shall run the GitHub Copilot CLI installed on the machine as the Copilot runtime
          by default — the CLI the host names, or one it finds where the usual installation methods
          put it, passing over editor launchers — accepting only a CLI at least the minimum version
          the library supports, and shall run the runtime the Copilot SDK bundles instead only when
          the host chooses it, under the same confinement either way.
        tags: [security]
        justification: |
          The runtime the SDK bundles adds several hundred megabytes to every output folder of every
          application, for a program most users of a Copilot application already have installed.
          Running the installed CLI keeps an application small; the bundled runtime stays available
          for a machine without a suitable CLI. The installed CLI's version is the machine's, not the
          library's, and the SDK accepts exactly one protocol version, so the version that will run is
          read first and an older CLI is refused with how to upgrade it. Which executable runs is the
          host's choice, never the ambient environment, and either executable runs in Empty mode, as a
          child process with the host's Copilot variables withheld, on the data directory the library
          owns, so the choice never changes what reaches the model. How the runtime signs in does not
          depend on which executable runs (see AgentKitAgentsCopilot-Runtime-SignsInAsTheUser).
        children:
          - AgentKitAgentsCopilot-CopilotRuntime-SpawnsTheSelectedRuntime
          - AgentKitAgentsCopilot-CopilotRuntime-RefusesAnUnsupportedCli
          - AgentKitAgentsCopilot-CopilotRuntime-ReportsTheRuntimeVersion
          - AgentKitAgentsCopilot-CopilotCli-FindsTheInstalledCli
          - AgentKitAgentsCopilot-CopilotCli-SkipsLaunchers
          - AgentKitAgentsCopilot-CopilotCli-ReadsTheVersionTheRuntimeRuns
          - AgentKitAgentsCopilot-CopilotCli-StopsWhatTheProbeStarted
          - AgentKitAgentsCopilot-CopilotCli-RequiresTheMinimumVersion
        tests:
          - AgentKitAgentsCopilot_Runtime_DefaultsToTheInstalledCli
          - AgentKitAgentsCopilot_Runtime_UnsupportedCli_IsRefusedWithUpgradeGuidance
          - AgentKitAgentsCopilot_Runtime_ClientOptionsAreConfined

      - id: AgentKitAgentsCopilot-ToolOutput-ReadersPublishedAndPermitted
        title: >-
          The library shall publish the reader tools of a tool list composed with retention of large
          outputs on every Copilot session it builds, name each in the session's source-qualified
          allow-list, approve each through the default permission handler, and hand the runtime the
          very tools that retain an oversized output and page it back, with the runtime's own
          diversion of large tool results left switched off.
        tags: [security]
        justification: |
          On Copilot the runtime, not this library, invokes the tools, and it can invoke only what is
          published, allow-listed and permitted. A reader missing from any of the three would leave a
          preview naming a tool the model cannot call. The runtime's own diversion of a large result
          to a temporary file stays off whether or not retention is composed: the file would be
          unreadable to a confined agent, whereas a retained output is reached through readers that
          take a reference and no path. Retention lives in the tools themselves, so it is the
          large-output mechanism on Copilot exactly as on every other provider, and what the runtime
          delivers inline is the tool's bounded preview.
        children:
          - AgentKitAgentsCopilot-CopilotAgentFactory-DerivesAllowList
          - AgentKitAgentsCopilot-CopilotAgentFactory-DefaultPermissionHandler
          - AgentKitAgentsCopilot-CopilotAgentFactory-DisablesLargeOutputDiversion
          - AgentKitAgentsCopilot-CopilotAgentFactory-OneConfinementPath
        tests:
          - AgentKitAgentsCopilot_ToolOutput_ReadersArePublishedAllowListedAndApproved
          - AgentKitAgentsCopilot_ToolOutput_ConfiguredToolsDeliverPreviewAndPage

      - id: AgentKitAgentsCopilot-Runtime-OwnedAndConfined
        title: >-
          The library shall start, confine and own the Copilot runtime every agent, provider session
          and summarizer runs on — the installed Copilot CLI or the bundled runtime alike — in Empty
          mode, as a child process with the host's COPILOT_ and
          GITHUB_COPILOT_ variables withheld apart from an allow-listed credential, network and telemetry-off set, on
          a data directory the library owns — and shall accept no client a host built.
        tags: [security]
        justification: |
          The confinement a Copilot session needs is only partly a property of the session. The rest
          belongs to the client: its mode, its data directory and its runtime's environment decide
          which MCP servers, plugins and configuration exist before any session option is read, and
          the SDK offers no way to read any of them back from a client. Measured against the live
          runtime, Empty mode alone still starts the built-in GitHub MCP server on the first turn and
          runs an MCP server that its data directory configures, and the SDK's default in-process
          hosting gives the runtime the host's whole environment, including variables that redirect
          the runtime or switch on approvals. A guarantee about what reaches the model therefore holds
          only on a client the library built itself, so the library builds it, offers only options
          that cannot widen what reaches the model, and removes every way to supply a client of the
          host's. The opt-in live suite shows the effect per source: probe servers configured in the
          runtime's data directory or in a trusted workspace are never executed through the library,
          while the same probes do execute without it.
        children:
          - AgentKitAgentsCopilot-CopilotRuntime-ForcesEmptyMode
          - AgentKitAgentsCopilot-CopilotRuntime-SpawnsTheSelectedRuntime
          - AgentKitAgentsCopilot-CopilotRuntime-WithholdsCopilotEnvironment
          - AgentKitAgentsCopilot-CopilotRuntime-OwnsACleanDataDirectory
          - AgentKitAgentsCopilot-CopilotRuntime-OffersOnlyNeutralOptions
          - AgentKitAgentsCopilot-CopilotRuntime-LeavesNoRuntimeBehind
          - AgentKitAgentsCopilot-CopilotRuntime-DeletesAKeptConversation
          - AgentKitAgentsCopilot-CopilotRuntime-RejectsInvalidOptions
          - AgentKitAgentsCopilot-CopilotAgentFactory-RejectsNullRuntime
        tests:
          - AgentKitAgentsCopilot_Runtime_ClientOptionsAreConfined
          - AgentKitAgentsCopilot_Runtime_ForeignDataDirectory_IsRefused

      - id: AgentKitAgentsCopilot-Runtime-SignsInAsTheUser
        title: >-
          The library shall sign the Copilot runtime in from, in order, a token or token provider the
          host supplies, a GitHub token in the environment, the user's Copilot CLI sign-in unless the
          host turns it off, and the runtime's own fallbacks, using the GitHub host that belongs to the
          source used, and shall take nothing from the user's Copilot CLI configuration but the
          signed-in account's host and login.
        tags: [security]
        justification: |
          A user signed in only with the Copilot CLI expects an application built on it to work, and
          a user whose GitHub CLI and Copilot CLI are signed in on different hosts expects the Copilot
          account; before this, such a runtime was refused or signed in to another host without
          notice. The order follows the Copilot CLI's own, so the runtime signs in as copilot would in
          the same shell, and lets a deliberate per-process token win over an ambient per-user
          sign-in. Sharing only the account entry keeps the user's MCP servers, hooks, agents, skills,
          plugins, instructions, settings and history out of a confined agent: the confined runtime's
          mode, environment and data directory are unchanged, and it receives only a token and a host.
        children:
          - AgentKitAgentsCopilot-CopilotSignIn-OrdersTheSources
          - AgentKitAgentsCopilot-CopilotSignIn-KeepsTheHostWithTheSource
          - AgentKitAgentsCopilot-CopilotSignIn-RefusesAnInvalidEnvironmentHost
          - AgentKitAgentsCopilot-CopilotSignIn-ReusesTheCopilotCliSignIn
          - AgentKitAgentsCopilot-CopilotSignIn-SharesOnlyTheAccountEntry
          - AgentKitAgentsCopilot-CopilotSignIn-FallsThroughOnFailure
          - AgentKitAgentsCopilot-CopilotSignIn-AsksTheHostsTokenProvider
          - AgentKitAgentsCopilot-CopilotRuntime-UsesTheResolvedSignIn
          - AgentKitAgentsCopilot-CopilotRuntime-ReportsHowItSignedIn
          - AgentKitAgentsCopilot-CopilotRuntime-SuppliesTheSessionSignIn
          - AgentKitAgentsCopilot-CopilotRuntime-OffersOnlyNeutralOptions
          - AgentKitAgentsCopilot-CopilotTurnChannel-AppliesTheHostsTokenProvider
          - AgentKit-OTS-MicrosoftCopilotSDK-GitHubAuthentication
        tests:
          - AgentKitAgentsCopilot_Runtime_SignIn_FollowsTheSourceOrderWithTheSourcesHost

      - id: AgentKitAgentsCopilot-Runtime-KeepsTokensOutOfFailures
        title: >-
          The library shall put no token the runtime's sign-in knows, and no text shaped like a GitHub
          token, in any exception it raises or keeps as a cause: the runtime's start failure and its
          redacted cause, a session error that fails an agent's run, a turn the runtime or the SDK
          fails on an agent, a provider session or a consolidation, a session the runtime or the SDK
          fails to create or resume for an agent, a provider session or a consolidation, a session the
          host asks the runtime to delete, a canceled start's cause, a provider session's refusals,
          and a model listing failure and its redacted cause.
        tags: [security]
        justification: |
          An exception is built to be shown, logged and attached to crash reports, which print its
          whole chain. The runtime and the SDK may quote any token they were given in their own error
          text, so every place AgentKit composes or keeps such text redacts it, and a runtime or SDK
          failure kept as a cause is a redacted copy rather than the original. A relayed runtime or
          SDK failure is a new exception of the same base class library type with a redacted message
          and a redacted copy as its cause; only a cancellation or disposal carrying nothing to
          redact passes unchanged. The conversation content the model already received is left as
          the runtime produced it: rewriting it would make the transcript disagree with the
          runtime's conversation.
        children:
          - AgentKitAgentsCopilot-CopilotSignIn-ReportsWhatEachSourceFound
          - AgentKitAgentsCopilot-CopilotSignIn-KeepsOnlyARedactedCause
          - AgentKitAgentsCopilot-CopilotSignIn-RelaysFailuresRedacted
          - AgentKitAgentsCopilot-CopilotRuntime-ExplainsAMissingRuntime
          - AgentKitAgentsCopilot-CopilotRuntime-RelaysDeletionFailuresRedacted
          - AgentKitAgentsCopilot-CopilotRuntime-PassesCancellationThrough
          - AgentKitAgentsCopilot-CopilotAgent-ReportsRuntimeErrors
          - AgentKitAgentsCopilot-CopilotProviderSession-RefusesASilentSession
          - AgentKitAgentsCopilot-CopilotProviderSession-EndsOnATurnItCouldNotRecord
          - AgentKitAgentsCopilot-CopilotSummarizer-KeepsTokensOutOfFailures
          - AgentKitAgentsCopilot-CopilotProviderSessionFactory-KeepsTokensOutOfOpenFailures
          - AgentKitAgentsCopilot-CopilotModelCatalog-ReadsTheServiceThroughTheRuntime
        tests:
          - AgentKitAgentsCopilot_Runtime_FailureQuotingAToken_ReachesNoException

      - id: AgentKitAgentsCopilot-ModelCatalog-ListsTheServicesModels
        title: >-
          The library shall describe the models the Copilot service offers the signed-in user —
          what each can do, whether it is enabled, the efforts and context tiers it accepts, its
          largest window, its billing and the notices the service attaches — as a model catalog an
          application filters and validates against.
        justification: |
          An application with a model picker on Copilot needs the service's own list for the
          signed-in user, which only the runtime AgentKit owns can read. The service's description
          needs interpretation before it is useful — tiers arrive as billing, tool calling is never
          reported, the automatic choice is listed beside real models — and that interpretation is
          Copilot-specific, so it ships with this package.
        children:
          - AgentKitAgentsCopilot-CopilotModelCatalog-ReadsTheServiceThroughTheRuntime
          - AgentKitAgentsCopilot-CopilotModelCatalog-TreatsUnreportedToolCallingAsSupported
          - AgentKitAgentsCopilot-CopilotModelCatalog-ReportsVisionOnlyWhenTheServiceDoes
          - AgentKitAgentsCopilot-CopilotModelCatalog-DerivesTiersFromBilling
          - AgentKitAgentsCopilot-CopilotModelCatalog-KeepsTheServicesEfforts
          - AgentKitAgentsCopilot-CopilotModelCatalog-UsabilityFollowsPolicy
          - AgentKitAgentsCopilot-CopilotModelCatalog-SurfacesTheServicesNotices
          - AgentKitAgentsCopilot-CopilotModelCatalog-OmitsTheAutomaticChoice
          - AgentKit-OTS-MicrosoftCopilotSDK-ModelListing
        tests:
          - AgentKitAgentsCopilot_ModelSelection_AgentRunsOnTheSelectedModelAndSettings

      - id: AgentKitAgentsCopilot-ModelSelection-AppliedToEverySession
        title: >-
          The library shall run every Copilot session an agent, a compacting session or a
          summarizer creates on the model, reasoning effort and context tier the user chose, locked
          for the life of the session, shall treat a chosen window as a ceiling on what a compacting
          session accounts against, and shall refuse a chosen setting a path cannot apply.
        justification: |
          The user's choice is made once, before the session starts, and must hold on every
          session the conversation runs on — created, resumed, rotated or consolidating. Copilot
          applies effort and tier per session, so the choice is applied where each session is
          configured, and nothing is sent for what the user did not choose. Only a compacting
          session accounts against a window, and the runtime takes no output limit, so a window
          chosen for the agent or the summarizer, or an output limit chosen anywhere, is refused
          rather than dropped.
        children:
          - AgentKitAgentsCopilot-CopilotAgentFactory-AppliesASelection
          - AgentKitAgentsCopilot-CopilotAgentFactory-RefusesAnAmbiguousSelection
          - AgentKitAgentsCopilot-CopilotAgentFactory-RefusesWhatItCannotApply
          - AgentKitAgentsCopilot-CopilotProviderSessionFactory-AppliesASelection
          - AgentKitAgentsCopilot-CopilotProviderSessionFactory-RefusesAnAmbiguousSelection
          - AgentKitAgentsCopilot-CopilotSummarizer-AppliesASelection
          - AgentKitAgentsCopilot-CopilotSummarizer-RefusesWhatItCannotApply
          - AgentKit-OTS-MicrosoftCopilotSDK-InferenceOptions
        tests:
          - AgentKitAgentsCopilot_ModelSelection_AgentRunsOnTheSelectedModelAndSettings
