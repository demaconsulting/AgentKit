---
# Software System Requirements for AgentKit Copilot Agents
#
# These requirements describe the externally visible behavior of the library
# from the perspective of its consumers, without specifying implementation details.

sections:
  - title: AgentKitAgentsCopilot Requirements
    requirements:
      - id: AgentKitAgentsCopilot-ToolSuppression-AllowListDerived
        title: >-
          The library shall withhold the capability the Copilot runtime injects, suppressing the
          runtime's tools by deriving the session allow-list from the same tool collection it
          publishes to the session, so the published tools and the allow-list cannot diverge, and
          closing the runtime's skill and custom-instruction channels on every session it builds.
        tags: [system, security]
        justification: |
          Copilot arrives as a complete agent runtime carrying its own tools — shell, fetch, file
          reading and writing, and more — and its own channels for injecting further capability and
          direction. Supplying an application's own tools is not enough: unless the built-ins are
          suppressed, a document assistant silently retains command execution. The session's
          available-tools list is an allow-list, so the library derives it from the same collection
          it assigns as the session's tools. Deriving both from one collection makes the published
          tool set and the allow-list impossible to drift apart, which is the safety property of the
          whole package. Deriving the allow-list also requires the session-config construction path,
          which is the only one that carries an allow-list at all. Tools are not the only channel:
          the runtime's skills and its discovered custom instructions would attach capability and
          direction the composing application never granted, so those channels are closed on every
          session for the same reason the built-in tools are suppressed.
        children:
          - AgentKitAgentsCopilot-CopilotAgentFactory-DerivesAllowList
          - AgentKitAgentsCopilot-CopilotAgentFactory-WithholdsInjectedCapability
          - AgentKitAgentsCopilot-CopilotAgentFactory-OneConfinementPath
          - AgentKitAgentsCopilot-CopilotProviderSessionFactory-DerivesAllowListFromSeededTools
        tests:
          - AgentKitAgentsCopilot_BuildSessionConfig_AvailableToolsDerivedFromSuppliedTools
          - AgentKitAgentsCopilot_Session_BuiltInToolRequest_IsRejectedOnTheSessionPath

      - id: AgentKitAgentsCopilot-PermissionHandler-DefaultSafe
        title: >-
          The library shall install, when the host supplies none, a permission handler that
          approves exactly the supplied tools by name and rejects every other request, and shall
          install a host-supplied handler verbatim when one is given.
        tags: [system, security]
        justification: |
          The target user is not qualified to adjudicate a security prompt, so the default must be
          safe without asking: it approves a request only when it names one of the supplied tools
          and rejects everything else, including every built-in tool, none of which is one of the
          supplied custom tools. A host that has its own policy may supply a handler, which the
          library installs unchanged. Default-safe with host override keeps the untrained-user case
          correct while leaving a capable host in control.
        children:
          - AgentKitAgentsCopilot-CopilotAgentFactory-DefaultPermissionHandler
          - AgentKitAgentsCopilot-CopilotAgentFactory-HostHandlerOverride
          - AgentKitAgentsCopilot-CopilotProviderSessionFactory-DefaultSafePermissions
        tests:
          - AgentKitAgentsCopilot_DefaultPermissionHandler_SuppliedTool_IsApproved
          - AgentKitAgentsCopilot_DefaultPermissionHandler_UnlistedCustomTool_IsRejected
          - AgentKitAgentsCopilot_DefaultPermissionHandler_BuiltInTool_IsRejected

      - id: AgentKitAgentsCopilot-AgentConstruction-Validated
        title: >-
          The library shall build a Microsoft Agent Framework agent from a Copilot client and a
          supplied tool list without taking ownership of the client, rejecting a missing client, a
          malformed tool list, and carrying the supplied instructions and the supplied choice of
          model.
        tags: [system]
        justification: |
          The host constructs, starts, and disposes the Copilot client, so the library takes no
          ownership of it and builds the agent with client ownership left to the host — whoever
          created the client disposes it. A missing client or a malformed tool list is a defect in
          the host, refused where the host wrote it. Supplied instructions are carried onto the
          session so a confined agent is governed as the host intended, and so is a supplied choice
          of model: which model backs an agent materially changes how reliably it uses its tools and
          how accurately it reads an image, so the application author must be able to make that
          choice through the library rather than around it — going around it means building a
          session by hand and losing the suppression and the default-safe permission handler. A host
          that expresses no choice gets the runtime's own default, so the capability adds nothing an
          existing application must account for.
        children:
          - AgentKitAgentsCopilot-CopilotAgentFactory-RejectsNullClient
          - AgentKitAgentsCopilot-CopilotAgentFactory-RejectsInvalidToolList
          - AgentKitAgentsCopilot-CopilotAgentFactory-CarriesInstructions
          - AgentKitAgentsCopilot-CopilotAgentFactory-SelectsModel
        tests:
          - CopilotAgentFactory_Create_NullClient_Throws

      - id: AgentKitAgentsCopilot-BuiltOnCopilotSdk
        title: >-
          The library shall present the agent it builds as a Microsoft.Agents.AI AIAgent
          constructed from a GitHub Copilot CopilotClient through the SDK's session-config
          agent-construction path and permission RPC.
        tags: [system]
        justification: |
          The library does not implement an agent runtime; it adapts the GitHub Copilot SDK's
          CopilotClient, SessionConfig, session-config agent-construction path, and permission RPC
          into a Microsoft Agent Framework AIAgent. The requirement records the repository's reliance
          on that off-the-shelf SDK and links its OTS requirements to the system root; see OTS
          Integration Design (docs/design/ots.md).
        children:
          - AgentKit-OTS-MicrosoftAgentsAIGitHubCopilot-SessionConfig
          - AgentKit-OTS-MicrosoftAgentsAIGitHubCopilot-AsAIAgent
          - AgentKit-OTS-MicrosoftAgentsAIGitHubCopilot-PermissionRpc
          - AgentKit-OTS-MicrosoftAgentsAIGitHubCopilot-SessionLifecycle
          - AgentKit-OTS-MicrosoftAgentsAIGitHubCopilot-SessionEvents
        tests:
          - AgentKitAgentsCopilot_BuildSessionConfig_AvailableToolsDerivedFromSuppliedTools

      - id: AgentKitAgentsCopilot-SessionAdapter-CarriesACoreSession
        title: >-
          The library shall carry an AgentKit session over the GitHub Copilot runtime, seeding a
          fresh Copilot session with the instructions, tools and history a rotation produces, sending
          each message as one turn, recording the turn's tool calls and results as identified pairs,
          and owning and releasing each Copilot session it creates without ever disposing the client.
        tags: [system]
        justification: |
          The compaction engine is the reason a long-running agent behaves the same way on every
          provider, and until now it had one adapter, for the stateless chat-client family. Copilot
          exposes no chat-client abstraction at all, so the engine could not run on the one provider
          this project's continuous integration can reach — which meant the engine's behavior against
          a provider the team can actually run was never exercised. This requirement closes that gap.
          Seeding is the hard part, because Copilot's session configuration carries no history field
          of any kind: the history a rotation produces is rendered as a labeled record into the
          session's system message, the only channel the runtime offers that exists at
          session-creation time, is carried verbatim, and has no role vocabulary in which part of it
          could be silently discarded. Ownership follows the contract the package already records:
          the host owns the client, and every session a rotation creates is AgentKit's, released on
          every path including failure.
        children:
          - AgentKitAgentsCopilot-CopilotProviderSession-SendsOneTurnPerMessage
          - AgentKitAgentsCopilot-CopilotProviderSession-RecordsToolTraffic
          - AgentKitAgentsCopilot-CopilotProviderSession-RejectsInvalidArguments
          - AgentKitAgentsCopilot-CopilotProviderSession-ReleasesItsSessionNotTheClient
          - AgentKitAgentsCopilot-CopilotProviderSession-RefusesASilentSession
          - AgentKitAgentsCopilot-CopilotProviderSessionFactory-CreatesSeededSessions
          - AgentKitAgentsCopilot-CopilotProviderSessionFactory-SeedsHistoryIntoTheSystemMessage
          - AgentKitAgentsCopilot-CopilotProviderSessionFactory-LeavesNothingUnowned
          - AgentKitAgentsCopilot-CopilotSessionObserver-RecordsTheTurnsWork
          - AgentKitAgentsCopilot-CopilotSessionObserver-RecordsToolOutcomes
          - AgentKitAgentsCopilot-CopilotSessionObserver-RemembersTheRuntimesError
          - AgentKitAgentsCopilot-CopilotTurnChannel-CarriesOneRuntimeSession
          - AgentKitAgentsCopilot-CopilotTurnChannel-OwnsTheSessionNotTheClient
          - AgentKitAgentsCopilot-CopilotTurnChannel-CallerGovernsTheDeadline
        tests:
          - AgentKitAgentsCopilot_Session_AnswersAndReportsTheRuntimesOccupancy
          - AgentKitAgentsCopilot_Session_RotatesOnTheRuntimesUsage_AndSeedsTheReplacement

      - id: AgentKitAgentsCopilot-SessionAdapter-OccupancyFromTheRuntime
        title: >-
          The library shall take both the occupancy and the context window of a Copilot session from
          the runtime's own reporting, shall never require an application to state a window, and
          shall refuse a turn the runtime answered without reporting its usage.
        tags: [system]
        justification: |
          Rotation happens when the window is filling, which is the one thing the session engine
          needs a token count for. Every other adapter has to be told its window because the
          abstraction it sits on publishes none; Copilot reports its occupancy, its limit and the
          conversation's own share with every turn, so asking an application for a figure the
          provider already knows would create a second source of truth for one fact — precisely what
          the engine's single-reading design retired. Passing the conversation's share through rather
          than inferring it keeps every threshold comparison in the runtime's own tokens. A turn
          answered with no reading at all is refused rather than estimated around, because an absent
          figure means something an application can see and fix.

          An application may set a ceiling on the window accounted against, which only ever lowers
          it. That is not a second source of truth: the runtime's figure still governs, and a
          ceiling above it is ignored. It buys answer quality on a very long conversation, and it is
          what makes a rotation reachable at all on a runtime whose smallest window is larger than
          any conversation a test would produce.
        children:
          - AgentKitAgentsCopilot-CopilotSessionObserver-HoldsTheLatestUsageReading
          - AgentKitAgentsCopilot-CopilotProviderSession-ReportsTheRuntimesUsage
          - AgentKitAgentsCopilot-CopilotProviderSession-ZeroBeforeTheFirstTurn
          - AgentKitAgentsCopilot-CopilotProviderSession-RefusesUnreportedUsage
          - AgentKitAgentsCopilot-CopilotProviderSession-HonorsAWindowCeilingDownwardOnly
        tests:
          - AgentKitAgentsCopilot_Session_AnswersAndReportsTheRuntimesOccupancy

      - id: AgentKitAgentsCopilot-SelfCompaction-Disabled
        title: >-
          The library shall create every Copilot session its own session engine drives with the
          runtime's infinite-session compaction disabled, shall leave the runtime's compaction
          untouched on the plain agent path, and shall refuse further turns on a session the runtime
          compacted or truncated anyway.
        tags: [system]
        justification: |
          The Copilot runtime compacts its own sessions by default, at a threshold of the same order
          as AgentKit's rotation threshold and against the same occupancy signal. Two compactors
          acting on one conversation is not a theoretical conflict: the runtime would rewrite history
          underneath a session whose transcript the engine believes it owns, and the occupancy the
          engine reads afterwards would move for reasons it cannot see — so the engine would seed a
          replacement from a history the provider no longer holds. The engine is the one compactor on
          the sessions it drives, so the runtime's is switched off there. The asymmetry is
          deliberate: a plain Copilot agent has no AgentKit compactor behind it, so disabling the
          runtime's would remove protection rather than prevent a conflict. Whether the runtime
          honors the request cannot be established without a live connection, so the request is not
          trusted on its own — the runtime announces its own compaction and truncation, and a session
          that sees either refuses the next turn, which makes a silent divergence a diagnosable
          failure.
        children:
          - AgentKitAgentsCopilot-CopilotProviderSessionFactory-DisablesRuntimeCompaction
          - AgentKitAgentsCopilot-CopilotSessionObserver-DetectsRewrittenHistory
          - AgentKitAgentsCopilot-CopilotProviderSession-RefusesARewrittenHistory
          - AgentKitAgentsCopilot-CopilotAgentFactory-LeavesTheAgentPathsCompactionAlone
        tests:
          - AgentKitAgentsCopilot_Session_RuntimeCompactionIsDisabledOnEverySessionItBuilds

      - id: AgentKitAgentsCopilot-Consolidation-OutOfSession
        title: >-
          The library shall consolidate session history on a separate, short-lived, tool-free Copilot
          session, using the consolidation prompt the library publishes, and shall release that
          session on every path.
        tags: [system]
        justification: |
          Compaction cannot happen without a summarizer, so a provider AgentKit carries a session for
          but ships no summarizer for is a provider on which compaction quietly never happens. The
          consolidation runs outside the session being compacted because a consolidation sent through
          the live conversation would spend the very context it exists to reclaim and would itself
          count toward the occupancy that triggered the rotation. The session it runs on carries no
          tools, because a consolidation is a pure function from material to a record of it and a
          tool that could act would be acting outside everything the conversation's own confinement
          was reasoned about.
        children:
          - AgentKitAgentsCopilot-CopilotSummarizer-SendsTheConsolidationPrompt
          - AgentKitAgentsCopilot-CopilotSummarizer-CarriesNoTools
          - AgentKitAgentsCopilot-CopilotSummarizer-RunsOutsideTheCompactedSession
          - AgentKitAgentsCopilot-CopilotSummarizer-EmptyAnswerIsAnEmptyRecord
          - AgentKitAgentsCopilot-CopilotSummarizer-ReleasesItsSession
        tests:
          - AgentKitAgentsCopilot_Session_RotatesOnTheRuntimesUsage_AndSeedsTheReplacement
