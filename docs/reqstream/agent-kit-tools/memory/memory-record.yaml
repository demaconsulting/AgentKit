---
# Software Unit Requirements for MemoryRecord

sections:
  - title: AgentKitTools Requirements
    sections:
      - title: Memory Requirements
        sections:
          - title: MemoryRecord Requirements
            requirements:
              - id: AgentKitTools-Memory-Record-DescriptorPayloadSplit
                title: >-
                  A memory shall carry an identifier, a descriptor, a detail payload, provenance
                  and the vector its descriptor produced, and shall report each of them unchanged.
                justification: |
                  The descriptor is the only text embedded and the details are never searched, so
                  the two must be separate fields rather than one text a reader has to split.
                  Holding the vector beside the descriptor means near-duplicate detection and
                  recall both read an already-computed value rather than re-embedding stored
                  text, which is what makes the duplicate check nearly free.
                tests:
                  - MemoryRecord_Constructor_StatedValues_AreHeldUnchanged

              - id: AgentKitTools-Memory-Record-Provenance
                title: >-
                  A memory shall permit an absent source document and an absent source locator.
                justification: |
                  A memory whose source is unknown is a real memory. Requiring provenance would
                  either block filing what a model legitimately read or invite it to invent a
                  citation, and an invented citation is worse than an honest absence.
                tests:
                  - MemoryRecord_Constructor_AbsentProvenance_IsPermitted

              - id: AgentKitTools-Memory-Record-Immutability
                title: >-
                  A memory shall be immutable, and shall support being re-stated with one part
                  replaced and every other part carried across unchanged.
                justification: |
                  A store must be able to hand a memory out without any caller being able to
                  mutate what the store holds. Re-statement with one part replaced is how an
                  update changes details without disturbing the descriptor, the provenance or the
                  vector, and doing it in one expression makes a half-applied update
                  unrepresentable.
                tests:
                  - MemoryRecord_With_ReplacesOnePartAndKeepsTheRest

              - id: AgentKitTools-Memory-Record-Match
                title: >-
                  A search result shall carry the memory found and the cosine similarity of that
                  one comparison as separate values.
                justification: |
                  The score is a property of a comparison, not of the memory: the same memory
                  scores differently against every query. Folding the score into the memory would
                  make it look like something the store knows about the memory itself, and would
                  put a number into the record that a later recall would silently contradict.
                tests:
                  - MemoryMatch_Constructor_CarriesTheMemoryAndItsSimilarity
