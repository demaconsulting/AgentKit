---
# Software Unit Requirements for FilePack

sections:
  - title: AgentKitTools Requirements
    sections:
      - title: File Requirements
        sections:
          - title: FilePack Requirements
            requirements:
              - id: AgentKitTools-File-Pack-FamilyPrefix
                title: >-
                  The pack shall publish the family prefix file as a constant and through the
                  contract.
                justification: |
                  The prefix is what keeps the family's names from colliding with another library's,
                  and publishing it both ways keeps the constant and the contract from drifting.
                tests:
                  - FilePack_FamilyPrefix_IsPublishedAsConstantAndContract

              - id: AgentKitTools-File-Pack-NoCapabilityRequired
                title: >-
                  The pack shall require no host capability.
                justification: |
                  Managing files asks nothing of the host, so every composition receives the family.
                tests:
                  - FilePack_RequiredCapabilities_IsNone

              - id: AgentKitTools-File-Pack-RegistersFourTools
                title: >-
                  The pack shall create its four tools — list, copy, move and delete — in a fixed,
                  documented order, whenever the access policy permits writing in any location.
                justification: |
                  The order a model sees the tools in is observable, so it is fixed rather than
                  incidental. Any location being writable is enough: an agent that may write only a
                  session location outside the workspace still receives every management tool,
                  because every one of them could succeed there.
                tests:
                  - FilePack_CreateTools_WriteGrantingPolicy_RegistersListCopyMoveDeleteInOrder
                  - FilePack_CreateTools_ReadOnlyWorkspaceWithWritableSession_PublishesEveryTool

              - id: AgentKitTools-File-Pack-SuppressesWriteToolsWithoutAWriteGrant
                title: >-
                  The pack shall withhold copying, moving and deleting when the access policy
                  permits no writing anywhere, offering only listing.
                tags: [security]
                justification: |
                  Copying, moving and deleting each change the file system, so under a
                  configuration that permits no writing anywhere every one of them could only
                  answer a refusal. Withholding them is what stops an agent spending turns on a
                  capability that cannot work and keeps the tools it is offered a truthful
                  statement of what it can do. Listing is never withheld: it needs only permission
                  to read in order to report what exists, and consults the write decision solely to
                  mark a reported location as writable, so it stays fully useful and leaves the
                  agent able to discover what it may read.
                tests:
                  - FilePack_CreateTools_ReadOnlyPolicy_PublishesOnlyTheListTool
                  - FilePack_CreateTools_ReadOnlyWorkspaceWithWritableSession_PublishesEveryTool

              - id: AgentKitTools-File-Pack-ToolsCarryFamilyPrefix
                title: >-
                  Every tool the pack creates shall carry a valid, family-prefixed name and a
                  description.
                justification: |
                  The prefix-collision check the builder performs depends on this being true.
                tests:
                  - FilePack_CreateTools_EveryTool_CarriesAValidatedNameAndDescription

              - id: AgentKitTools-File-Pack-RequiresPolicy
                title: >-
                  The pack shall require a policy to create its tools.
                tags: [security]
                justification: |
                  A missing policy is a programming error in the composing application, named at the
                  point it was made.
                tests:
                  - FilePack_CreateTools_NullPolicy_ThrowsArgumentNullException
