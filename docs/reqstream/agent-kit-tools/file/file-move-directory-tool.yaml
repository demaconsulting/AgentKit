---
# Software Unit Requirements for FileMoveDirectoryTool

sections:
  - title: AgentKitTools Requirements
    sections:
      - title: File Requirements
        sections:
          - title: FileMoveDirectoryTool Requirements
            requirements:
              - id: AgentKitTools-File-MoveDirectoryTool-ToolName
                title: >-
                  The move-directory tool shall be published under the name file_move_directory,
                  exposed as a constant, and shall carry a description.
                justification: |
                  The name is the only handle a model has on the tool, and a description is the
                  only basis it has for choosing it.
                tests:
                  - FileMoveDirectoryTool_ToolName_Constant_IsTheFamilyQualifiedName

              - id: AgentKitTools-File-MoveDirectoryTool-GuardedConstruction
                title: >-
                  The move-directory tool shall be constructed only through the guarded
                  construction path with an access policy supplied at construction.
                tags: [security]
                justification: |
                  Requiring the policy at construction makes an unguarded move-directory tool
                  impossible to build.
                tests:
                  - FileMoveDirectoryTool_Create_NullPolicy_ThrowsArgumentNullException

              - id: AgentKitTools-File-MoveDirectoryTool-MovesDirectory
                title: >-
                  The move-directory tool shall move a permitted directory, with everything
                  beneath it, to a permitted destination, addressed by the relative names a model
                  sends.
                justification: |
                  Relocating a directory with its contents is the tool's reason to exist, and the
                  names it accepts are the bare names a listing reported.
                tests:
                  - FileMoveDirectoryTool_Move_PermittedTree_MovesItWithEverythingBeneathIt

              - id: AgentKitTools-File-MoveDirectoryTool-Renames
                title: >-
                  The move-directory tool shall rename a directory when the destination lies in
                  the same parent, and shall state that in the description a model reads.
                justification: |
                  A rename is the same operation with a destination that happens to share the
                  source's parent, so a second tool for it would cost tokens on every request
                  forever and leave the model choosing between two names for one act. A
                  capability a model cannot discover is one the library does not really offer,
                  which is why the declaration has to carry it.
                tests:
                  - FileMoveDirectoryTool_Move_DestinationInTheSameParent_RenamesTheDirectory

              - id: AgentKitTools-File-MoveDirectoryTool-NoClobber
                title: >-
                  The move-directory tool shall refuse any destination that already exists,
                  leaving both the source and the destination unchanged.
                justification: |
                  Replacing a directory is a recursive destruction of an unbounded tree performed
                  under a verb a model reads as moving. Offering an overwrite would smuggle the
                  most dangerous operation in the family past both of the controls built for it —
                  the entry ceiling and the link guard — neither of which a move applies. The
                  capability is not lost, only made explicit: the destination is removed first, in
                  a call that says what it does and reports its scale.
                tests:
                  - FileMoveDirectoryTool_Move_ExistingDestination_ReturnsDenialAndLeavesBoth

              - id: AgentKitTools-File-MoveDirectoryTool-RefusesMoveIntoItself
                title: >-
                  The move-directory tool shall refuse a destination that lies inside the
                  directory being moved, leaving the directory unchanged, including a destination
                  that is a genuine child whose name begins with two dots.
                justification: |
                  Moving a directory into itself is not an operation the file system can honor,
                  and leaving it to fail part way through would produce exactly the half-moved
                  tree the family's other guards exist to prevent. The containment test is made of
                  path segments rather than string prefixes in both directions: a sibling merely
                  sharing the source's name prefix is not a child, and a real child named "..foo"
                  — for which the framework's relative-path answer begins with two dots — is not
                  an escape. Testing only the first two characters would let that real child slip
                  past this refusal and fail later with an opaque file-system error the model
                  cannot act on.
                tests:
                  - FileMoveDirectoryTool_Move_DestinationInsideTheSource_ReturnsDenialAndLeavesTheTree
                  - FileMoveDirectoryTool_Move_DestinationIsAChildNamedWithLeadingDots_IsTreatedAsInsideTheSource

              - id: AgentKitTools-File-MoveDirectoryTool-EndpointThroughALinkIsRefused
                title: >-
                  The move-directory tool shall refuse a source or a destination whose resolved
                  location is reached through a link lying between that location and the root of
                  the deepest grant that both contains and permits it, naming the offending
                  component as the request spelled it, moving nothing, and leaving what the link
                  points at intact.
                tags: [security]
                justification: |
                  Path resolution in this library is lexical and documented as such, so a path
                  naming a link inside a permitted location satisfies the write decision however
                  far outside that location the link actually leads. Moving a tree out of a
                  location reached that way takes content from where nothing was granted; moving a
                  tree into one places a whole tree there. Both are the same destruction the
                  recursive-deletion link guard exists to prevent, and the same predicate is
                  applied here so there is one rule rather than two. Both endpoints are classified
                  because a guard on one alone would leave the other open. The grant root itself,
                  and everything above it, is deliberately not classified: an application author
                  who roots a grant at a link has made that choice, while a link inside the grant
                  has been vetted by nobody. The grant that bounds the walk is one that actually
                  permits the endpoint rather than one that merely encloses it, because a grant
                  whose denied patterns reject the path authorized nothing and would otherwise
                  hide a link above itself. This narrows what a caller may spell only where the
                  blast radius is a whole tree — directory creation through a link writes outside
                  the grant but destroys nothing and is deliberately left alone.

                  The classification is a pre-flight check over paths and claims nothing more: the
                  endpoints are judged as they stand when the request is judged, before anything
                  is moved. A process able to write inside a location the operator already granted
                  can replace a component between that check and the move, and re-checking would
                  only move the window rather than close it, because portable .NET offers no
                  handle-relative, no-follow directory move. The guarantee is therefore stated as
                  what it is rather than implied to be a race-resistant control.
                tests:
                  - FileMoveDirectoryTool_Move_SourceReachedThroughALink_ReturnsDenialAndLeavesTheTargetIntact
                  - FileMoveDirectoryTool_Move_DestinationReachedThroughALink_ReturnsDenialAndLeavesTheTargetIntact

              - id: AgentKitTools-File-MoveDirectoryTool-EveryEntryIsPolicyJudged
                title: >-
                  The move-directory tool shall consult the write decision for every entry the
                  move would relocate — where it stands and where it would land — not only for
                  the two paths the request named, refusing the whole request and moving nothing
                  when any entry is one the policy does not permit this agent to write, and
                  naming that entry as the request spelled it.
                tags: [security]
                justification: |
                  A directory move relocates the whole subtree, while the two write decisions
                  judge two paths. A grant permits a location and may exclude names within it, so
                  ReadWrite(root, ["*.key"]) permits root/drafts and refuses
                  root/drafts/secret.key: a move judged by the named paths alone relocates
                  content the policy excludes, and lands it at a path the policy was never asked
                  about. That is a containment violation reached without any link and without any
                  mistake by the model, and it is the same defect as the link escapes by a third
                  route — the tool validated the path it was named rather than what the operation
                  touches.

                  Both ends are asked because they are different questions and a policy may
                  answer them differently. Asking only where an entry stands would place content
                  where the operator permitted none; asking only where it would land would let a
                  tree be taken from where the policy withholds it. The landing location is the
                  one no request ever names, so nothing else in the tool would have asked about
                  it. The walk and the predicate are the ones the recursive deletion uses, so the
                  two tools cannot drift into two notions of what an operation touches. Unlike
                  the deletion there is no partial state to reason about, because the framework
                  move is one call, so the check is purely pre-flight and refusing costs the
                  request nothing but a metadata-only walk.
                tests:
                  - FileMoveDirectoryTool_Move_SourceHoldingAnEntryThePolicyWithholds_ReturnsDenialAndLeavesTheTree
                  - FileMoveDirectoryTool_Move_DestinationWouldHoldAnEntryThePolicyWithholds_ReturnsDenialAndLeavesTheTree

              - id: AgentKitTools-File-MoveDirectoryTool-PolicyGoverned
                title: >-
                  The move-directory tool shall judge both endpoints by the write decision, so a
                  read-only directory cannot be moved out of its location and no directory can be
                  moved into a location that may only be read.
                tags: [security]
                justification: |
                  A move takes the directory away from its source and creates it at its
                  destination, so it needs write permission at both. Judging the source first is
                  what keeps a read-only grant genuinely read-only, and judging the destination is
                  what stops a write-narrow configuration being widened by a verb.
                tests:
                  - FileMoveDirectoryTool_Move_ReadOnlySource_ReturnsDenialAndLeavesItInPlace
                  - FileMoveDirectoryTool_Move_ReadOnlyDestination_ReturnsDenialAndLeavesItInPlace

              - id: AgentKitTools-File-MoveDirectoryTool-MissingSource
                title: >-
                  The move-directory tool shall report a source that is missing, or that names a
                  file rather than a directory, as a plain fact that names no other tool.
                justification: |
                  A denial states a fact and never prescribes a remedy; naming another tool to run
                  is a prescription the refusal must not make. Distinguishing the two mistakes
                  lets a model correct the one it actually made.
                tests:
                  - FileMoveDirectoryTool_Move_MissingSource_ReturnsDenialNamingNoTool
                  - FileMoveDirectoryTool_Move_SourceIsAFile_ReturnsDenialAndLeavesTheFile
