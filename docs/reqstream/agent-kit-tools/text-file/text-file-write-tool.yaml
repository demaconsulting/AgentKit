---
# Software Unit Requirements for TextFileWriteTool

sections:
  - title: AgentKitTools Requirements
    sections:
      - title: TextFile Requirements
        sections:
          - title: TextFileWriteTool Requirements
            requirements:
              - id: AgentKitTools-TextFile-WriteTool-ToolName
                title: >-
                  The write tool shall be published under the name text_file_write, exposed as a
                  constant, and shall carry a description that names the sibling tools for creating
                  a new file and for editing within existing content, and states where displaced
                  content is recoverable from, that only the most recent overwrite is kept there,
                  and that only a write not interleaved with another write of the same file is
                  captured at all.
                justification: |
                  The name is the only handle a model has on the tool. The description carries more
                  weight here than for any sibling, because an agent that reaches for this tool to
                  make a small edit destroys the rest of the file: naming the create and replace
                  tools is how a model is steered to the narrower operation it actually wants. A
                  denial never prescribes a remedy, so the description is also the only place the
                  recovery path and its two honest limits can be stated.
                tests:
                  - TextFileWriteTool_ToolName_Constant_IsTheFamilyQualifiedName
                  - TextFileWriteTool_Create_ConstructedTool_CarriesTheToolNameAndADescriptionNamingItsSiblings

              - id: AgentKitTools-TextFile-WriteTool-GuardedConstruction
                title: >-
                  The write tool shall be constructed only through the guarded construction path
                  with an access policy and the family's recovery buffer supplied at construction.
                tags: [security]
                justification: |
                  Requiring the policy at construction makes an unguarded write tool impossible to
                  build, and requiring the buffer at construction makes a write tool that could
                  destroy content without capturing it impossible to build.
                tests:
                  - TextFileWriteTool_Create_NullArguments_ThrowArgumentNullException

              - id: AgentKitTools-TextFile-WriteTool-SetsContent
                title: >-
                  The write tool shall set a file's content to the supplied text, creating the file
                  when it is absent and replacing its content when it is present, treating empty
                  content as a legitimately empty file, and shall report whether the file was
                  created or replaced together with the resulting line count.
                justification: |
                  Making a file's content be a given text is the tool's reason to exist, and one
                  name doing it in both cases is what removes a mode switch a model would otherwise
                  have to reason about. A model cannot see the file, so "created" and "replaced"
                  must be distinguished for it. The line count is reported for the same reason the
                  create tool reports it: a model that goes on to address the file by line number
                  would otherwise have to read it back first.
                tests:
                  - TextFileWriteTool_Write_AbsentFile_CreatesItAndReportsItWasCreated
                  - TextFileWriteTool_Write_ExistingFile_ReplacesTheContentAndReportsItWasReplaced
                  - TextFileWriteTool_Write_EmptyContent_EmptiesTheFileAndReportsZeroLines

              - id: AgentKitTools-TextFile-WriteTool-CapturesPreviousContent
                title: >-
                  The write tool shall capture a file's previous content verbatim into the family's
                  recovery buffer before replacing it, into a slot distinct from the one a cut or
                  copy defaults to, so the displaced content can be restored by a sequential
                  caller; it shall capture
                  nothing when the file was absent or held no content, and shall say in each case
                  whether anything was captured.
                justification: |
                  A wholesale overwrite destroys more in one call than any other operation in the
                  family, and the family's invariant is that nothing it destroys sequentially is
                  unrecoverable
                  through the recovery buffer. Capturing the content verbatim rather than
                  reconstructing it is what makes the restoration byte-exact, so a trailing newline
                  and carriage returns survive. The capture must not land where a cut or copy
                  defaults to, because a model part-way through a move is holding a fragment there
                  and a capture it never asked for would destroy an edit in flight. Capturing
                  nothing when there is nothing to lose avoids leaving a slot that restores nothing
                  while reporting success, and avoids displacing a genuine earlier capture. Because
                  one fixed slot holds displaced content, only the most recent overwrite is
                  recoverable, and the tool states that limit rather than implying an unbounded undo
                  history. The guarantee is scoped in a second way, and stated just as plainly:
                  reading the file, capturing what was read and writing the new content are three
                  steps that nothing serializes against another writer, so two concurrent writes to
                  the same file can both read the same content and the write that lands first can be
                  destroyed without ever having been captured. Cross-tool locking is deliberately
                  not introduced for one tool — the library coordinates concurrent access nowhere
                  else, an agent's tool calls are sequential, and a delegated sub-agent composes its
                  own buffers — so the promise is scoped to sequential writes instead of being made
                  with an unstated exception.
                tests:
                  - TextFileWriteTool_Write_ExistingFile_CapturesThePreviousContentVerbatim
                  - TextFileWriteTool_Write_ExistingFile_LeavesTheDefaultBufferUntouched
                  - TextFileWriteTool_Write_AbsentFile_CapturesNothingAndSaysSo
                  - TextFileWriteTool_Write_PreviouslyEmptyFile_CapturesNothingAndSaysSo
                  - TextFileWriteTool_Write_SecondOverwrite_ReplacesTheCapturedContent

              - id: AgentKitTools-TextFile-WriteTool-PolicyGoverned
                title: >-
                  The write tool shall consult the write decision alone, refusing to write in a
                  read-only location or outside a permitted location and leaving any file there
                  unchanged.
                tags: [security]
                justification: |
                  A path a read-only grant permits is not thereby writable, which is what makes a
                  read-wide, write-narrow configuration real. Because this tool replaces everything
                  in a file, a write access inferred from read access would be the most destructive
                  mistake the family could make.
                tests:
                  - TextFileWriteTool_Write_ReadOnlyLocation_ReturnsDenialAndLeavesTheFileUnchanged
                  - TextFileWriteTool_Write_PathOutsideThePolicy_ReturnsDenialAndWritesNothing

              - id: AgentKitTools-TextFile-WriteTool-CreatesNoDirectory
                title: >-
                  The write tool shall refuse a path naming a directory, and shall refuse a path
                  whose parent directory does not exist rather than creating one.
                justification: |
                  Writing over a directory is not a meaningful operation, and silently creating a
                  directory tree is a side effect the operator never asked for that would, on a
                  mistyped path, scatter directories an agent then believes are real.
                tests:
                  - TextFileWriteTool_Write_DirectoryPath_ReturnsDenial
                  - TextFileWriteTool_Write_MissingParentDirectory_ReturnsDenialAndCreatesNoDirectory

              - id: AgentKitTools-TextFile-WriteTool-RefusesNonTextTarget
                title: >-
                  The write tool shall refuse to replace a file whose content is not text, leaving
                  it unchanged and capturing nothing, and shall state the fact without prescribing a
                  remedy or naming another tool.
                justification: |
                  Binary content does not survive a text round trip, so a captured binary file would
                  not restore — the family's recoverability promise would be false in exactly the
                  case where the destruction is total. Refusing is therefore the only reading
                  consistent with the invariant. The refusal states the fact and stops, because a
                  denial that prescribed a remedy was measured pushing a model into a destructive
                  workaround a user had forbidden.
                tests:
                  - TextFileWriteTool_Write_BinaryFile_ReturnsDenialAndLeavesItUnchanged
                  - TextFileWriteTool_Write_Denial_PrescribesNoRemedy

              - id: AgentKitTools-TextFile-WriteTool-MalformedRequest
                title: >-
                  The write tool shall return a refusal rather than throwing when the path or the
                  content argument is absent, and shall write no file in either case.
                justification: |
                  A malformed request comes from the model; an exception at a tool call would end the
                  agent's turn. Absent content is malformed, while empty content is not — emptying a
                  file is a real outcome an agent may legitimately want.
                tests:
                  - TextFileWriteTool_Write_MissingPathOrContent_ReturnsDenialWithoutThrowing
