---
# Software Unit Requirements for TextFilePack

sections:
  - title: AgentKitTools Requirements
    sections:
      - title: TextFile Requirements
        sections:
          - title: TextFilePack Requirements
            requirements:
              - id: AgentKitTools-TextFile-Pack-FamilyPrefix
                title: >-
                  The pack shall publish the family prefix text_file as a constant and through the
                  contract.
                justification: |
                  The prefix is what keeps the family's names from colliding with another library's,
                  and publishing it both ways keeps the constant and the contract from drifting.
                tests:
                  - TextFilePack_FamilyPrefix_Constant_IsTextFile
                  - TextFilePack_FamilyPrefix_Contract_ReportsTheDeclaredConstant

              - id: AgentKitTools-TextFile-Pack-NoCapabilityRequired
                title: >-
                  The pack shall require no host capability.
                justification: |
                  Text file access asks nothing of the host, so every composition receives the
                  family.
                tests:
                  - TextFilePack_RequiredCapabilities_Pack_RequiresNoHostCapability

              - id: AgentKitTools-TextFile-Pack-RegistersEightTools
                title: >-
                  The pack shall create its eight tools — search, read, create, write, replace, cut,
                  copy and paste — in a fixed, documented order, with no null entry, whenever the
                  access policy permits writing in any location.
                justification: |
                  The order a model sees the tools in is observable, so it is fixed rather than
                  incidental. It descends in scope through the three editing tools — bring a file
                  into existence, set its whole content, change part of its content — so the two
                  tools a write is most easily confused with sit either side of it. Any location
                  being writable is enough: an agent that may write only a session location outside
                  the workspace still receives every editing tool, because every one of them could
                  succeed there.
                tests:
                  - TextFilePack_CreateTools_WriteGrantingPolicy_CreatesTheEightToolsInOrder
                  - TextFilePack_CreateTools_ReadOnlyWorkspaceWithWritableSession_PublishesEveryTool
                  - TextFilePack_CreateTools_Policy_ReturnsNoNullTool

              - id: AgentKitTools-TextFile-Pack-SuppressesWriteToolsWithoutAWriteGrant
                title: >-
                  The pack shall withhold every tool that can act only by writing when the access
                  policy permits no writing anywhere, offering only searching, reading and
                  copying a range of lines, in their usual relative order.
                tags: [security]
                justification: |
                  Creating a file, setting its whole content, replacing text within it, cutting a
                  range out of it and pasting a range into it each require permission to write, so
                  under a configuration that permits no writing anywhere every one of them could
                  only answer a refusal. Withholding them is what stops an agent spending turns on
                  a capability that cannot work and keeps the tools it is offered a truthful
                  statement of what it can do. Searching and reading need only permission to read.
                  Copying a range needs only permission to read the file it copies from, by the
                  same decision that keeps it usable from a read-only location, so it is offered
                  too — even though the holding area it fills has no consumer while pasting is
                  withheld, because whether the configuration permits writing at all is a
                  question the pack can answer and whether a tool is useful is not. A configuration
                  granting nothing at all withholds the same five, so it is
                  not a case the rule overlooks — though the three it does offer then refuse every
                  path, since nothing resolves under a configuration that grants nothing. That is
                  not gated in turn, because a grant permits reading or reading and writing and
                  there is no write-only level: permission to write always carries permission to
                  read, so a reading tool is unusable only where nothing whatever is granted. The
                  surviving tools keep their usual relative
                  order, so a model meets a shortened family rather than a rearranged one.
                tests:
                  - TextFilePack_CreateTools_ReadOnlyPolicy_PublishesOnlyTheNonWritingTools
                  - TextFilePack_CreateTools_NoGrants_PublishesOnlyTheNonWritingTools
                  - TextFilePack_CreateTools_ReadOnlyWorkspaceWithWritableSession_PublishesEveryTool

              - id: AgentKitTools-TextFile-Pack-ToolsCarryFamilyPrefix
                title: >-
                  Every tool the pack creates shall carry the family prefix it declares.
                justification: |
                  The prefix-collision check the builder performs depends on this being true.
                tests:
                  - TextFilePack_CreateTools_EveryTool_CarriesTheFamilyPrefix

              - id: AgentKitTools-TextFile-Pack-RequiresPolicy
                title: >-
                  The pack shall require a policy to create its tools.
                tags: [security]
                justification: |
                  A missing policy is a programming error in the composing application, named at the
                  point it was made.
                tests:
                  - TextFilePack_CreateTools_NullPolicy_ThrowsArgumentNullException

              - id: AgentKitTools-TextFile-Pack-PolicyGovernsCreatedTools
                title: >-
                  The policy the composer supplies shall govern the tools the pack creates.
                tags: [security]
                justification: |
                  No tool in the family can observe a different policy from the one the composition
                  supplied.
                tests:
                  - TextFilePack_CreateTools_SuppliedPolicy_GovernsTheCreatedTools

              - id: AgentKitTools-TextFile-Pack-SharedBuffer
                title: >-
                  The write, cut and paste tools one composition produces shall share one buffer, so
                  a range a cut removed and content a write displaced are both recoverable through
                  the paste tool, and two separate compositions shall not share buffer slots.
                justification: |
                  A buffer allocated per composition gives the destructive tools and the paste tool
                  a shared clipboard while keeping two independently composed tool sets isolated.
                  Sharing it with the write tool is what extends the family's recoverability promise
                  from a removed range to a wholesale overwrite.
                tests:
                  - TextFilePack_CreateTools_CutAndPaste_ShareOneBufferPerComposition
                  - TextFilePack_CreateTools_WriteAndPaste_ShareOneBufferPerComposition
                  - TextFilePack_CreateTools_TwoCompositions_DoNotShareBufferSlots
