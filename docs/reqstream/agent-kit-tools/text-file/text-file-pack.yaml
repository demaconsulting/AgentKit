---
# Software Unit Requirements for TextFilePack
#
# These requirements describe the design-level behavior of the TextFilePack unit.

sections:
  - title: AgentKitTools Requirements
    sections:
      - title: TextFile Requirements
        sections:
          - title: TextFilePack Requirements
            requirements:
              - id: AgentKitTools-TextFile-Pack-FamilyPrefix
                title: >-
                  The text file pack shall declare the family prefix text_file, exposed as a
                  constant on the pack and reported through the pack contract.
                justification: |
                  The prefix is the family's identity: two packs claiming one prefix would
                  publish tools a model cannot tell apart, which the composition refuses.
                  Publishing it as a constant as well as through the contract lets an
                  application or a test name the family without a literal that could drift from
                  the names the tools actually carry.
                tests:
                  - TextFilePack_FamilyPrefix_Constant_IsTextFile
                  - TextFilePack_FamilyPrefix_Contract_ReportsTheDeclaredConstant

              - id: AgentKitTools-TextFile-Pack-NoCapabilityRequired
                title: >-
                  The text file pack shall require no host capability.
                justification: |
                  Reading and writing text asks nothing of the model or the application beyond
                  what every host already provides, so gating the family behind a declaration
                  would exclude hosts for no reason and force operators to discover a setting
                  before ordinary file access works.
                tests:
                  - TextFilePack_RequiredCapabilities_Pack_RequiresNoHostCapability

              - id: AgentKitTools-TextFile-Pack-RegistersThreeTools
                title: >-
                  The text file pack shall create the read, write and list tools, in that order,
                  with no null element.
                justification: |
                  The order a model sees its tools in is observable, so it must be the family's
                  stated order rather than an incidental one. A null element would fail the
                  composition at build time for a reason no caller could act on, so the pack
                  honors the contract it is judged against.
                tests:
                  - TextFilePack_CreateTools_Policy_CreatesTheReadWriteAndListTools
                  - TextFilePack_CreateTools_Policy_ReturnsNoNullTool

              - id: AgentKitTools-TextFile-Pack-ToolsCarryFamilyPrefix
                title: >-
                  Every tool the text file pack creates shall carry the declared family prefix
                  followed by an underscore.
                justification: |
                  The collision check a composition performs when a pack is added is only
                  meaningful if the pack's declaration is true of the names it later publishes.
                  A tool published outside its declared family would escape that protection and
                  could collide with another library's name.
                tests:
                  - TextFilePack_CreateTools_EveryTool_CarriesTheFamilyPrefix

              - id: AgentKitTools-TextFile-Pack-RequiresPolicy
                title: >-
                  The text file pack shall reject an absent access policy as a programming error
                  rather than creating tools governed by nothing.
                tags: [security]
                justification: |
                  A family created without a policy would hand an agent unrestricted file access
                  while appearing to be correctly composed. Failing at the line that made the
                  mistake reports it to the developer who can fix it, rather than to a model that
                  cannot.
                tests:
                  - TextFilePack_CreateTools_NullPolicy_ThrowsArgumentNullException

              - id: AgentKitTools-TextFile-Pack-PolicyGovernsCreatedTools
                title: >-
                  The access policy supplied to the text file pack shall govern every tool the
                  pack creates.
                tags: [security]
                justification: |
                  An application configures one policy and expects every tool it attached to obey
                  it. A tool that quietly observed a different policy from its neighbor would
                  make the configured containment unverifiable, which is the same as not having
                  it.
                tests:
                  - TextFilePack_CreateTools_SuppliedPolicy_GovernsTheCreatedTools
