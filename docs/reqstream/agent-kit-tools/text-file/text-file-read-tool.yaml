---
# Software Unit Requirements for TextFileReadTool

sections:
  - title: AgentKitTools Requirements
    sections:
      - title: TextFile Requirements
        sections:
          - title: TextFileReadTool Requirements
            requirements:
              - id: AgentKitTools-TextFile-ReadTool-ToolName
                title: >-
                  The read tool shall be published under the name text_file_read, exposed as a
                  constant on the unit that defines it, and shall carry a description.
                justification: |
                  The name is the only handle a model has on the tool, and a description is the only
                  basis it has for choosing this tool over another.
                tests:
                  - TextFileReadTool_ToolName_Constant_IsTheFamilyQualifiedName
                  - TextFileReadTool_Create_ConstructedTool_CarriesTheToolNameAndADescription

              - id: AgentKitTools-TextFile-ReadTool-GuardedConstruction
                title: >-
                  The read tool shall be constructed only through the guarded construction path with
                  an access policy supplied at construction, and shall deliver its result unserialized.
                tags: [security]
                justification: |
                  Without the guard the result is serialized to JSON before a provider sees it, and
                  requiring the policy at construction makes an unguarded read tool impossible to
                  build.
                tests:
                  - TextFileReadTool_Create_NullPolicy_ThrowsArgumentNullException
                  - TextFileReadTool_Read_PermittedFile_ResultIsPlainTextNotJsonElement

              - id: AgentKitTools-TextFile-ReadTool-RelativePath
                title: >-
                  The read tool shall read a file named relative to the workspace root, and shall
                  report the file's path in the caller's dialect.
                justification: |
                  A model asks for a file by the bare name a listing reported, so that name must be
                  directly usable, and the header must echo it in the same dialect.
                tests:
                  - TextFileReadTool_Read_BareFileName_ReturnsTheFileContents

              - id: AgentKitTools-TextFile-ReadTool-DenyOutsideRoot
                title: >-
                  The read tool shall refuse a request whose location lies outside the permitted
                  read location, without disclosing the file's content.
                tags: [security]
                justification: |
                  Judging the request against the permitted locations keeps an agent inside what
                  its operator granted, and a refused read must disclose nothing of the content.
                tests:
                  - TextFileReadTool_Read_PathOutsideTheReadRoot_ReturnsDenial

              - id: AgentKitTools-TextFile-ReadTool-RangedPaging
                title: >-
                  The read tool shall return only the requested window of lines when startLine and
                  lineCount are supplied, clamping a window that runs past the end of the file to the
                  file's true total.
                justification: |
                  Paging is what lets a model work with a file larger than a single result; the
                  window it asks for is the window it receives, bounded honestly by the file's size.
                tests:
                  - TextFileReadTool_Read_RangedWindow_ReturnsOnlyThoseLines
                  - TextFileReadTool_Read_LineCountPastEndOfFile_ClampsToTheTotal

              - id: AgentKitTools-TextFile-ReadTool-LineNumbered
                title: >-
                  The read tool shall open its result with a 'path lines A-B of N' header and prefix
                  each line with its 1-based number and a delimiter that is not part of the content.
                justification: |
                  The header lets a model learn how far a file extends beyond the window it received,
                  and the numbered prefix — clearly not content — lets it address a line while
                  keeping the raw text available for an exact-match edit.
                tests:
                  - TextFileReadTool_Read_PermittedFile_ReturnsNumberedContentWithHeader

              - id: AgentKitTools-TextFile-ReadTool-PastEndOfFile
                title: >-
                  The read tool shall return an honest empty window naming the true total when the
                  start line is past the end of the file, and shall report an empty file as zero
                  lines rather than as a refusal.
                justification: |
                  Paging too far is a fact about the request, not a malformed one, and an empty file
                  is a legitimate result; reporting either as a refusal would tell the model
                  something untrue.
                tests:
                  - TextFileReadTool_Read_StartLinePastEndOfFile_ReturnsEmptyWindowNamingTotal
                  - TextFileReadTool_Read_EmptyFile_ReturnsZeroLineHeaderNotDenial

              - id: AgentKitTools-TextFile-ReadTool-MissingOrDirectory
                title: >-
                  The read tool shall refuse a missing file and a directory with a plain fact that
                  names no other tool.
                justification: |
                  A denial states a fact and never prescribes a remedy; a directory has no text and a
                  missing file has none, so the refusal states that and names no tool to run.
                tests:
                  - TextFileReadTool_Read_MissingFile_ReturnsDenialNamingNoTool
                  - TextFileReadTool_Read_DirectoryPath_ReturnsDenialNamingNoTool

              - id: AgentKitTools-TextFile-ReadTool-MalformedRequest
                title: >-
                  The read tool shall return a refusal rather than throwing when the path is omitted,
                  empty or whitespace, or when a paging argument is out of its domain.
                justification: |
                  A malformed request comes from the model, so the model is the one that must be told
                  how to correct it; an exception at a tool call ends the agent's turn.
                tests:
                  - TextFileReadTool_Read_MissingPathArgument_ReturnsDenialWithoutThrowing
                  - TextFileReadTool_Read_InvalidStartLine_ReturnsDenialWithoutThrowing

              - id: AgentKitTools-TextFile-ReadTool-BinaryRefused
                title: >-
                  The read tool shall refuse a file whose content is binary rather than text,
                  reporting it as unsupported media and redirecting to the image tool where the type
                  is one it can read, while still reading a byte-order-marked text file.
                justification: |
                  Decoding a binary file as text injects a wall of replacement characters into the
                  model's context; content-based detection keeps a legitimately encoded UTF-16 or
                  UTF-32 file, which carries NUL bytes yet decodes correctly, from being misclassified.
                tests:
                  - TextFileReadTool_Read_BinaryImageFile_ReturnsDenialRedirectingToImageRead
                  - TextFileReadTool_Read_BinaryNonImageFile_ReturnsDenialWithoutRedirect
                  - TextFileReadTool_Read_Utf16BomTextFile_ReturnsTheFileContents

              - id: AgentKitTools-TextFile-ReadTool-ReadCeiling
                title: >-
                  The read tool shall page a file larger than the policy's read ceiling when a
                  window is requested, materializing only the requested window, and shall refuse an
                  unranged read of such a file with a refusal that names the file's total line count
                  and directs the model to page with startLine and lineCount.
                justification: |
                  A large file is only useful if the model can reach the line it needs; the read
                  ceiling bounds the bytes materialized for a window rather than gating the whole
                  file, so paging still works. An unranged read asks for the whole file as one
                  window, which cannot fit — but naming the total line count and the paging arguments
                  gives the model a way forward rather than a dead end.
                tests:
                  - TextFileReadTool_Read_RangedWindowInLargeFile_ReturnsThatWindowNotADenial
                  - TextFileReadTool_Read_RangedWindowNearEndOfLargeFile_ReturnsTailWindow
                  - TextFileReadTool_Read_UnrangedLargeFile_ReturnsDenialNamingRecourseAndTotal
                  - TextFileReadTool_Read_LineLargerThanTheReadCeiling_ReturnsDenialNamingRecourse

              - id: AgentKitTools-TextFile-ReadTool-ResultCeiling
                title: >-
                  The read tool shall refuse to return a window exceeding the policy's result ceiling
                  rather than returning a truncated part of it.
                justification: |
                  What a tool may read and what it may return are different budgets, and truncating
                  would hand the model a silently incomplete document.
                tests:
                  - TextFileReadTool_Read_TextBeyondTheResultCeiling_ReturnsDenialRatherThanTruncated
