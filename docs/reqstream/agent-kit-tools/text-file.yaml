---
# Software Subsystem Requirements for the TextFile tool family
#
# These requirements describe the behavior of the TextFile subsystem as a whole,
# decomposing the system-level text file family requirement into the behavior each
# of its units provides.

sections:
  - title: AgentKitTools Requirements
    sections:
      - title: TextFile Requirements
        requirements:
          - id: AgentKitTools-TextFile-FamilyComposition
            title: >-
              The text file family shall publish seven content tools — search, read, create, replace,
              cut-lines, copy-lines and paste-lines — under the text_file family prefix, and shall
              require no host capability.
            justification: |
              An application attaches a capability as one pack rather than as a handful of
              individually registered tools, so the family must be the unit of attachment.
              Publishing every tool under one prefix keeps this family's names from colliding with
              those of any other library an application combines, and requiring no host capability
              means ordinary text file access works without an operator declaring anything first.
            children:
              - AgentKitTools-TextFile-SearchTool-ToolName
              - AgentKitTools-TextFile-ReadTool-ToolName
              - AgentKitTools-TextFile-CreateTool-ToolName
              - AgentKitTools-TextFile-ReplaceTool-ToolName
              - AgentKitTools-TextFile-CutTool-ToolName
              - AgentKitTools-TextFile-CopyTool-ToolName
              - AgentKitTools-TextFile-PasteTool-ToolName
              - AgentKitTools-TextFile-Pack-FamilyPrefix
              - AgentKitTools-TextFile-Pack-NoCapabilityRequired
              - AgentKitTools-TextFile-Pack-RegistersSevenTools
              - AgentKitTools-TextFile-Pack-ToolsCarryFamilyPrefix
              - AgentKitTools-TextFile-Buffers-DefaultSlot
            tests:
              - TextFile_Family_ComposedThroughBuilder_PublishesTheSevenContentTools
              - TextFile_Family_HostDeclaringNoCapability_StillReceivesTheFamily

          - id: AgentKitTools-TextFile-GuardedConstruction
            title: >-
              Every tool in the text file family shall be constructed through the guarded
              construction path and shall take its access policy at construction, and the cut and
              paste tools shall share one buffer per composition.
            tags: [security]
            justification: |
              A tool built any other way has its result flattened into JSON before a provider sees
              it, and a tool that received its policy later — or not at all — could be attached to
              an agent while governed by nothing. Allocating one buffer per composition gives the
              cut/paste buffer exactly the lifetime of the tools and keeps two independently
              composed tool sets from sharing slots.
            children:
              - AgentKitTools-TextFile-SearchTool-GuardedConstruction
              - AgentKitTools-TextFile-ReadTool-GuardedConstruction
              - AgentKitTools-TextFile-CreateTool-GuardedConstruction
              - AgentKitTools-TextFile-ReplaceTool-GuardedConstruction
              - AgentKitTools-TextFile-CutTool-GuardedConstruction
              - AgentKitTools-TextFile-CopyTool-GuardedConstruction
              - AgentKitTools-TextFile-PasteTool-GuardedConstruction
              - AgentKitTools-TextFile-Pack-RequiresPolicy
              - AgentKitTools-TextFile-Pack-PolicyGovernsCreatedTools
              - AgentKitTools-TextFile-Pack-SharedBuffer
            tests:
              - TextFile_Family_EveryTool_CarriesAValidatedNameAndDescription
              - TextFile_Family_ToolResult_ReachesTheCallerUnserialized

          - id: AgentKitTools-TextFile-PolicyGoverned
            title: >-
              The text file family shall judge each request with the policy decision matching the
              operation — the read decision for search, read and copy, the write decision for create,
              replace, cut and paste — interpreting a path a model states relative to the
              workspace, and refusing a request that reaches outside a permitted location through a
              link.
            tags: [security]
            justification: |
              An operator commonly wants an agent that reads widely but writes into one working
              directory, and that configuration is meaningless unless each tool consults the rule
              belonging to the operation it performs. Copy mutates nothing, so it consults the read
              decision exactly as read does, permitting a copy from a read-only grant. Judging a
              request by the location it actually reaches, rather than by how its path was spelled,
              is what stops an agent from stepping outside the location its operator granted.
            children:
              - AgentKitTools-TextFile-ReadTool-RelativePath
              - AgentKitTools-TextFile-ReadTool-DenyOutsideRoot
              - AgentKitTools-TextFile-SearchTool-PolicyFiltered
              - AgentKitTools-TextFile-SearchTool-Scoped
              - AgentKitTools-TextFile-CreateTool-PolicyGoverned
              - AgentKitTools-TextFile-ReplaceTool-PolicyGoverned
              - AgentKitTools-TextFile-CutTool-PolicyGoverned
              - AgentKitTools-TextFile-CopyTool-PolicyGoverned
              - AgentKitTools-TextFile-PasteTool-PolicyGoverned
            tests:
              - TextFile_Family_ReadWideWriteNarrow_PermitsTheReadAndRefusesTheEdit
              - TextFile_Family_PathBeneathLinkOutsideRoot_IsRefusedByEveryTool

          - id: AgentKitTools-TextFile-NavigationAndPaging
            title: >-
              The text file family shall let a model navigate a file by line number — paging a read
              to a line-numbered window with a range header, and searching for a pattern with a
              grep-style listing — so a large file can be read and searched a region at a time.
            justification: |
              A file can be far larger than a single result, so a read must be pageable and its
              header must state the file's true total, and a search must report where matches are
              in a form that composes back into a read. Navigation by line number is the natural
              complement to editing by content: the model finds a region by number, then edits it
              by matched text.
            children:
              - AgentKitTools-TextFile-ReadTool-RangedPaging
              - AgentKitTools-TextFile-ReadTool-LineNumbered
              - AgentKitTools-TextFile-ReadTool-PastEndOfFile
              - AgentKitTools-TextFile-SearchTool-GrepOutput
              - AgentKitTools-TextFile-SearchTool-ContextLines
              - AgentKitTools-TextFile-SearchTool-Matching
              - AgentKitTools-TextFile-SearchTool-MaxMatches
              - AgentKitTools-TextFile-SearchTool-EmptyResult
            tests:
              - TextFile_Family_SearchReadEditLoop_WorksByRelativeNames

          - id: AgentKitTools-TextFile-ContentEditing
            title: >-
              The text file family shall edit a file's contents by creating a new file, replacing an
              exact unique match, and cutting, copying and pasting a range of lines, with every cut
              captured into a recoverable buffer, every copy captured while leaving its source
              byte-identical, and a cut/paste round-trip reproducing the file exactly.
            justification: |
              Editing one line of a file without rewriting the whole file is what makes an agent's
              edits precise and reviewable. A create refuses to clobber an existing file, a replace
              matches exactly once so an ambiguous edit is refused rather than misapplied, a cut
              always captures what it removes so every deletion is recoverable by pasting it back,
              and a copy captures a range for pasting without ever mutating its source.
            children:
              - AgentKitTools-TextFile-CreateTool-CreatesNew
              - AgentKitTools-TextFile-CreateTool-RefusesExisting
              - AgentKitTools-TextFile-ReplaceTool-UniqueMatch
              - AgentKitTools-TextFile-ReplaceTool-Ambiguity
              - AgentKitTools-TextFile-ReplaceTool-InsertAndDelete
              - AgentKitTools-TextFile-CutTool-CapturesAndRemoves
              - AgentKitTools-TextFile-CutTool-RangeValidation
              - AgentKitTools-TextFile-CopyTool-CapturesUnchanged
              - AgentKitTools-TextFile-CopyTool-RangeValidation
              - AgentKitTools-TextFile-PasteTool-RoundTrip
              - AgentKitTools-TextFile-PasteTool-EmptyBuffer
              - AgentKitTools-TextFile-Buffers-CaptureAndPaste
              - AgentKitTools-TextFile-Buffers-Replace
            tests:
              - TextFile_Family_SearchReadEditLoop_WorksByRelativeNames
              - TextFile_Family_LargeBlockDuplication_CopiesCreatesAndPastes

          - id: AgentKitTools-TextFile-DenialsAreResults
            title: >-
              The text file family shall report every refusal as a returned result that names its
              reason, and shall never throw at a model — a missing file, a directory, a binary file,
              a malformed request, an invalid expression or an empty buffer are all returned
              refusals.
            justification: |
              An exception raised while a model is calling a tool ends the agent's turn and strands
              it, whereas a returned refusal lets it read the reason and choose a permitted
              alternative. A refusal that redirects to a better tool turns a dead end into the next
              step.
            children:
              - AgentKitTools-TextFile-ReadTool-MissingOrDirectory
              - AgentKitTools-TextFile-ReadTool-MalformedRequest
              - AgentKitTools-TextFile-ReadTool-BinaryRefused
              - AgentKitTools-TextFile-CreateTool-MalformedRequest
              - AgentKitTools-TextFile-ReplaceTool-MissingFile
              - AgentKitTools-TextFile-PasteTool-MissingFile
              - AgentKitTools-TextFile-PasteTool-PopulatedSlotGuidance
              - AgentKitTools-TextFile-SearchTool-InvalidRegex
              - AgentKitTools-TextFile-Buffers-Validation
              - AgentKitTools-TextFile-Buffers-PopulatedSlots
            tests:
              - TextFile_Family_DeniedRequest_ReturnsAResultWithoutThrowing

          - id: AgentKitTools-TextFile-ObservesPolicyLimits
            title: >-
              The text file family shall observe the ceilings the access policy carries, refusing an
              oversized read or search result and naming the ceiling rather than returning truncated
              content.
            justification: |
              Everything a tool returns is spent out of the same finite context window the
              conversation must share, so the ceilings have to be honored. Truncating instead of
              refusing hands the model an incomplete document it has no way to detect; naming the
              ceiling lets it narrow the request instead.
            children:
              - AgentKitTools-TextFile-ReadTool-ReadCeiling
              - AgentKitTools-TextFile-ReadTool-ResultCeiling
              - AgentKitTools-TextFile-SearchTool-LargeFileSearchable
              - AgentKitTools-TextFile-SearchTool-BoundedResult
            tests:
              - TextFile_Family_ToolResult_ReachesTheCallerUnserialized
