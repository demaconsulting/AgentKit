---
# Software Unit Requirements for OllamaContextWindow
#
# These requirements describe the design-level behavior of the OllamaContextWindow unit.

sections:
  - title: AgentKitAgentsOllama Requirements
    sections:
      - title: OllamaContextWindow Requirements
        requirements:
          - id: AgentKitAgentsOllama-OllamaContextWindow-StatedWindowWins
            title: >-
              The unit shall report a window the application stated in preference to anything the
              server reported, and shall name it as stated.
            justification: |
              An application that states a window has usually done so because it knows something the
              server will not say - most often that the model was loaded with a smaller context
              length than it publishes. Believing the server over the application in that case would
              make the one flag that exists to correct a bad reading have no effect. Naming the
              figure as stated also keeps the account honest: nothing was measured.
            tests:
              - OllamaContextWindow_Select_StatedWindow_WinsOverWhatTheServerReports

          - id: AgentKitAgentsOllama-OllamaContextWindow-PrefersTheLengthTheServerEnforces
            title: >-
              The unit shall report the length the named model is loaded with in preference to the
              maximum that model publishes.
            justification: |
              The loaded length is the one the server will enforce; the published maximum is only
              what the model could be loaded with, and Ollama loads well below it by default. A
              session told the maximum would keep going until the server had already truncated the
              conversation, and nothing downstream could detect that. Preferring the loaded figure
              is the whole reason both are read rather than only one.
            tests:
              - OllamaContextWindow_Select_ModelLoaded_PrefersTheLengthTheServerEnforces

          - id: AgentKitAgentsOllama-OllamaContextWindow-MatchesAnUntaggedModelName
            title: >-
              The unit shall match a model named without a tag against the loaded model the server
              resolved that name to.
            justification: |
              A caller commonly names a model bare, and the server resolves that to the latest tag
              and reports the tagged name back. Comparing the two spellings literally would find no
              loaded model in the ordinary case and fall through to a published maximum or to the
              assumed default, which is exactly the silent downgrade this unit exists to avoid.
            tests:
              - OllamaContextWindow_Select_UntaggedModelName_MatchesTheLoadedLatestTag

          - id: AgentKitAgentsOllama-OllamaContextWindow-DoesNotBorrowAnotherModelsWindow
            title: >-
              The unit shall not report the loaded length of a model other than the one named.
            justification: |
              A server commonly holds several models loaded at once, each with its own context
              length. Reporting one model's window for another would produce a figure that looks
              measured, is specific, and is wrong - the worst of the available failures, because it
              carries the confidence of a reading. The named model's published maximum, or the
              assumed default, is the honest answer instead.
            tests:
              - OllamaContextWindow_Select_DifferentModelLoaded_DoesNotBorrowItsWindow

          - id: AgentKitAgentsOllama-OllamaContextWindow-ReadsThePublishedLength
            title: >-
              The unit shall report the context length a model publishes when the server reports
              that model as not loaded.
            justification: |
              A model that is not loaded has no enforced length to read, and the length it publishes
              is then the only figure the server offers. Falling past it to the conservative default
              would account a session against a fraction of a window the server would have honored,
              costing summarizer calls on every long conversation for a figure that was available
              all along. It is reported as the maximum it is, so a caller can see the server may
              load the model below it.
            tests:
              - OllamaContextWindow_Select_PublishedLengthAsJsonNumber_IsRead

          - id: AgentKitAgentsOllama-OllamaContextWindow-FallsThroughMetadataCarryingNoContextLength
            title: >-
              The unit shall fall through to the next source when a model's metadata carries no
              context length it can read for that model's architecture.
            justification: |
              Metadata that names an architecture but says nothing about its window, and metadata
              carrying a value that is not a token count - text, a fraction, a figure beyond the
              range one can hold - are both plausible responses rather than errors, and there is no
              window in either. Reporting zero, rounding, or reporting some neighboring metadata
              value as though it were a window would hand a session a figure it could not be
              accounted against; falling through to the conservative default is the only answer that
              remains usable.
            tests:
              - OllamaContextWindow_Select_MetadataWithoutAContextLength_FallsThrough
              - OllamaContextWindow_Select_PublishedLengthNotAUsableNumber_FallsThrough

          - id: AgentKitAgentsOllama-OllamaContextWindow-AssumesTheDefaultWhenNothingIsReported
            title: >-
              The unit shall report Ollama's own default context length, named as assumed, when
              nothing was stated and the server reported nothing usable.
            justification: |
              Something has to be returned, because a session cannot run without a window. The
              conservative figure is chosen because the two ways of being wrong are not
              symmetric - assuming less costs summarizer calls, assuming more loses history the
              provider has already discarded - and naming it as assumed is what stops a caller
              treating it as a measurement.
            tests:
              - OllamaContextWindow_Select_NothingReported_AssumesTheOllamaDefault

          - id: AgentKitAgentsOllama-OllamaContextWindow-ToleratesADeclinedQuery
            title: >-
              The unit shall report a window from the next source down when the server declines to
              answer a query.
            justification: |
              Both server queries are conveniences, and a server declines them for ordinary
              reasons - an older build, a proxy in front of it, a model that has never been
              pulled. An application that could not start because it could not read an optional
              number would be worse than one that says which number it assumed, so a declined
              query has to cost a rung of the ladder rather than the run. This is what makes the
              reading safe to call unconditionally where a provider is configured, which is the
              only place a caller can call it.
            tests:
              - OllamaContextWindow_ReadAsync_RunningModelsQueryFails_ReportsThePublishedMaximum
              - OllamaContextWindow_ReadAsync_ModelMetadataQueryFails_ReportsTheEnforcedLength
              - OllamaContextWindow_ReadAsync_NeitherQueryAnswers_AssumesTheOllamaDefault

          - id: AgentKitAgentsOllama-OllamaContextWindow-RejectsAMissingModelName
            title: >-
              The unit shall reject a request that names no model.
            justification: |
              Every figure below a stated window belongs to a particular model, so a request with no
              model names nothing to match a loaded model against. Refusing it where the composing
              application wrote it is better than matching nothing and quietly returning the assumed
              default, which would look like a server that had not answered.
            tests:
              - OllamaContextWindow_Select_NullModelName_Throws
