---
# Software Unit Requirements for the DocumentAssistant sample
#
# These requirements describe what the document-assistant sample must demonstrate to a reader about
# attaching AgentKit's shipped tool packs to an agent under a policy of granted locations.

sections:
  - title: AgentKitSamples Requirements
    sections:
      - title: DocumentAssistant Requirements
        requirements:
          - id: AgentKitSamples-DocumentAssistant-InstructionsNameBothGrantedLocations
            title: >-
              The sample shall demonstrate that the instructions it builds name both granted
              locations — the workspace and the separate session location — and the access each
              carries.
            justification: |
              An application that knows the two locations it granted says so, rather than leaving the
              agent to discover a session folder that may be empty and therefore unlisted. The
              demonstration builds the instructions for a read-write run and shows both absolute
              paths appear with the workspace stated as read-write.
            tests:
              - AgentComposition_BuildInstructions_WritableWorkspace_NamesBothLocationsWithAccess

          - id: AgentKitSamples-DocumentAssistant-InstructionsReflectReadOnlyGrant
            title: >-
              The sample shall demonstrate that a read-only workspace grant is reflected in the
              stated access level, with the session location still writable.
            justification: |
              Asymmetric read and write grants are a headline of the safety model, so the
              instructions must follow the grant rather than assert a fixed access level. The
              demonstration builds the instructions for a read-only run and shows the workspace is
              described as read-only while the session location stays read-write.
            tests:
              - AgentComposition_BuildInstructions_ReadOnlyWorkspace_StatesTheWorkspaceIsReadOnly

          - id: AgentKitSamples-DocumentAssistant-InstructionsAreBuiltPerRun
            title: >-
              The sample shall demonstrate that the instructions are a function of the run's granted
              locations rather than a fixed constant.
            justification: |
              Naming the locations is only honest if the text follows them: different grants must
              produce different instructions. The demonstration builds the instructions for two
              different pairs of locations and shows the results differ and name their own locations.
            tests:
              - AgentComposition_BuildInstructions_DifferentLocations_ProduceDifferentInstructions

          - id: AgentKitSamples-DocumentAssistant-InstructionsStateNoShellOrWeb
            title: >-
              The sample shall demonstrate that the instructions state truthfully that the agent has
              no shell, terminal, code-execution, or web tool.
            justification: |
              The tool-inventory demonstration — a reader asking the agent whether it has a shell —
              rests on the instructions describing the real capability set truthfully. The
              demonstration builds the instructions and shows the sentence denying those capabilities
              is present.
            tests:
              - AgentComposition_BuildInstructions_AnyRun_DeniesShellAndWebCapabilities

          - id: AgentKitSamples-DocumentAssistant-InstructionsKeepDiscoveryAndRefusalGuidance
            title: >-
              The sample shall demonstrate that the instructions request discovery through a
              no-argument listing and tell the agent to read a refusal rather than retry it.
            justification: |
              Discovery is how the sample demonstrates the addressing dialect, and reading a refusal
              rather than retrying it is how it demonstrates that a denial is a value the agent acts
              on. The demonstration builds the instructions and shows both pieces of guidance are
              present.
            tests:
              - AgentComposition_BuildInstructions_AnyRun_KeepsDiscoveryAndRefusalGuidance

          - id: AgentKitSamples-DocumentAssistant-InstructionsKeepPathDialectGuidance
            title: >-
              The sample shall demonstrate that the instructions explain the relative-versus-absolute
              path dialect: relative names for the workspace, an absolute path for the session
              location, and why a relative name cannot reach the session location.
            justification: |
              The path dialect is one of the safety-model behaviors the sample exists to make
              observable, so the guidance that describes it must survive in the instructions. The
              demonstration builds the instructions and shows the relative-name, absolute-path, and
              workspace-anchoring guidance are all present.
            tests:
              - AgentComposition_BuildInstructions_AnyRun_KeepsTheRelativeAndAbsoluteDialectGuidance
