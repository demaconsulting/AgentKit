---
# FileAssert document validation tests for AgentKit.
# Tests are tagged by document group to allow per-group execution during the build pipeline.
# Tags: api-docs, build-notes, code-quality, code-review, design, verification, user-guide, requirements.
#
# NOTE: build-notes through user-guide tests provide OTS evidence for Pandoc and WeasyPrint
# and run before ReqStream. The requirements tests run after ReqStream and validate the
# final outputs, but do not contribute to OTS requirements evidence.
#
# NOTE: api-docs tests provide OTS evidence for ApiMark and run in the build matrix job,
# immediately after the build that produces the generated API reference.

tests:

  # --- API REFERENCE ---
  # ApiMark generates the API reference from each shipped package's XML doc comments during the
  # build, into that project's generated/api folder. These tests assert the real generated output.

  - name: ApiMark_CoreApiIndex
    description: "AgentKit Core API reference index was generated by ApiMark"
    tags: [api-docs]
    files:
      - pattern: "src/DemaConsulting.AgentKit.Core/generated/api/api.md"
        count: 1
        text:
          - contains: "DemaConsulting.AgentKit.Core"

  - name: ApiMark_ToolsApiIndex
    description: "AgentKit Tools API reference index was generated by ApiMark"
    tags: [api-docs]
    files:
      - pattern: "src/DemaConsulting.AgentKit.Tools/generated/api/api.md"
        count: 1
        text:
          - contains: "DemaConsulting.AgentKit.Tools"

  - name: ApiMark_CopilotApiIndex
    description: "AgentKit Copilot adapter API reference index was generated by ApiMark"
    tags: [api-docs]
    files:
      - pattern: "src/DemaConsulting.AgentKit.Agents.Copilot/generated/api/api.md"
        count: 1
        text:
          - contains: "DemaConsulting.AgentKit.Agents.Copilot"

  - name: ApiMark_ChatClientApiIndex
    description: "AgentKit ChatClient adapter API reference index was generated by ApiMark"
    tags: [api-docs]
    files:
      - pattern: "src/DemaConsulting.AgentKit.Agents.ChatClient/generated/api/api.md"
        count: 1
        text:
          - contains: "DemaConsulting.AgentKit.Agents.ChatClient"

  - name: ApiMark_ExampleCodeRendered
    description: "ApiMark rendered a documented example as a fenced code block"
    tags: [api-docs]
    files:
      - pattern: >-
          src/DemaConsulting.AgentKit.Core/generated/api/DemaConsulting.AgentKit.Core/PathPolicy/EmitRelative.md
        count: 1
        text:
          - contains: "```csharp"

  - name: ApiMark_TransitionHazardDocumented
    description: "The path-model transition hazard survives into the generated API reference"
    tags: [api-docs]
    files:
      - pattern: >-
          src/DemaConsulting.AgentKit.Core/generated/api/DemaConsulting.AgentKit.Core/PathPolicy/PathPolicy.md
        count: 1
        text:
          - contains: "Transition hazard"

  # --- BUILD NOTES ---

  - name: Pandoc_BuildNotesHtml
    description: "Build Notes HTML was generated by Pandoc"
    tags: [build-notes]
    files:
      - pattern: "docs/build_notes/generated/build_notes.html"
        count: 1
        html:
          - query: "//head/title"
            count: 1
        text:
          - contains: "Build Notes"

  - name: WeasyPrint_BuildNotesPdf
    description: "Build Notes PDF was generated by WeasyPrint"
    tags: [build-notes]
    files:
      - pattern: "docs/generated/AgentKit Build Notes.pdf"
        count: 1
        pdf:
          metadata:
            - field: "Title"
              contains: "AgentKit"
            - field: "Author"
              contains: "DEMA Consulting"
            - field: "Subject"
              contains: "Build notes"
          pages:
            min: 1
          text:
            - contains: "Build Notes"

