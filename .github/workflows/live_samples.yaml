---
# Live Model Samples
#
# Exercises the runnable samples against a REAL model, which the ordinary CI pipeline
# deliberately does not do: every test in build.yaml is hermetic and offline, so nothing in
# the merge gate can tell whether an agent actually plans, files, recalls and delegates when a
# live model is behind it. This workflow answers that question, and it is kept separate for
# three reasons: it costs model quota, it is non-deterministic, and it needs a credential a
# pull request from a fork can never have.
#
# It NEVER runs on a pull request or an ordinary push. It runs when someone dispatches it, and
# on a weekly schedule. It cannot break the merge gate, because it is not part of it.
#
# When no credential is configured the workflow does not fail: it reports that it was skipped
# and exits successfully, so a fork or a repository without the secret sees a clean result
# rather than a red cross it can do nothing about.
#
# A second job runs the opt-in Copilot live suite (test/DemaConsulting.AgentKit.Agents.Copilot.LiveTests),
# which re-measures, against the real Copilot runtime, the properties the Copilot package's
# confinement depends on: which tools a session exposes, which names the runtime reserves for its
# built-ins, what the permission handler is asked, how large and image results are delivered, and
# whether an agent's conversation streams and resumes. The suite is outside AgentKit.slnx and is
# gated on AGENTKIT_COPILOT_LIVE_MODEL, so nothing else ever runs it.
#
# AgentKit runs the Copilot CLI installed on the machine by default, so both jobs install the
# standalone Copilot CLI release, verified against its checksums, and put it on PATH. The samples,
# and the installed-CLI variants of the live suite, are built with CopilotSkipCliDownload set, which
# proves they need no bundled runtime. The live suite runs as a matrix of three variants: the
# minimum CLI version AgentKit supports (COPILOT_CLI_VERSION below), the latest CLI release - the
# early warning for a CLI that has moved to a protocol this release of AgentKit does not speak - and
# the runtime Microsoft.Copilot.SDK bundles, the opt-in for hosts without a CLI. Only the bundled
# variant downloads the SDK's runtime; its extracted copy is cached, and the SDK skips the download
# when it finds a complete cached copy.

name: Live Model Samples

on:
  workflow_dispatch:
    inputs:
      model:
        description: 'Model to run the samples against (blank for the provider default)'
        required: false
        type: string
  schedule:
    - cron: '0 6 * * 2'  # 6AM UTC every Tuesday, a day after the weekly build

permissions:
  contents: read

env:
  # The minimum Copilot CLI version AgentKit supports (CopilotCli.MinimumVersion): the first CLI that
  # speaks the protocol of the referenced Microsoft.Copilot.SDK. Revisit together with that constant.
  COPILOT_CLI_VERSION: '1.0.113'

jobs:
  live-samples:
    name: Live Model Samples
    runs-on: ubuntu-latest

    env:
      # The Copilot runtime authenticates from the environment. A dedicated secret is used
      # rather than the automatic workflow token, because the automatic token is not a Copilot
      # credential and would fail in a way that looks like a broken sample.
      GH_TOKEN: ${{ secrets.COPILOT_GH_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # === CREDENTIAL CHECK ===
      # Decides, once, whether a live run is possible. Every later step is conditional on this,
      # so an unconfigured repository produces a successful, clearly explained no-op rather
      # than a failure.

      - name: Check for credentials
        id: credentials
        shell: bash
        run: |
          if [ -z "${GH_TOKEN}" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No COPILOT_GH_TOKEN secret is configured; skipping the live-model run."
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup dotnet
        if: steps.credentials.outputs.available == 'true'
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.x

      # Installs the standalone Copilot CLI release - the binary the install script and the
      # package managers install - verified against the release's published checksums, and puts it
      # on PATH, where AgentKit's discovery finds it exactly as on a user's machine. CLI_VERSION
      # empty means the latest release. The SDK starts the CLI with --no-auto-update, so the version
      # printed here is the version that runs.
      - name: Install the Copilot CLI
        if: steps.credentials.outputs.available == 'true'
        shell: bash
        env:
          # Downloading a public release needs only the workflow's own token.
          GH_TOKEN: ${{ github.token }}
          CLI_VERSION: ${{ env.COPILOT_CLI_VERSION }}
        run: |
          set -euo pipefail
          dir="${RUNNER_TEMP}/copilot-cli"
          mkdir -p "${dir}/download"
          tag=()
          if [ -n "${CLI_VERSION}" ]; then tag=("v${CLI_VERSION}"); fi
          gh release download "${tag[@]}" --repo github/copilot-cli \
            --pattern 'copilot-linux-x64.tar.gz' --pattern 'SHA256SUMS.txt' --dir "${dir}/download"
          (cd "${dir}/download" && sha256sum --check --ignore-missing SHA256SUMS.txt)
          tar -xzf "${dir}/download/copilot-linux-x64.tar.gz" -C "${dir}"
          chmod +x "${dir}/copilot"
          echo "${dir}" >> "${GITHUB_PATH}"
          "${dir}/copilot" --no-auto-update --version

      - name: Build samples
        if: steps.credentials.outputs.available == 'true'
        run: >
          dotnet build
          --configuration Release
          --property:CopilotSkipCliDownload=true
          samples/research-assistant/DemaConsulting.AgentKit.Samples.ResearchAssistant.csproj
          samples/document-assistant/DemaConsulting.AgentKit.Samples.DocumentAssistant.csproj

      # === RESEARCH ASSISTANT ===
      # Two research turns on one session, because the behavior under test spans turns: a plan
      # made in the first and a contradiction raised in the second. The question is then asked
      # with --recall-question rather than as a third --prompt, deliberately: a third prompt
      # shares the session with the turns that read the documents, so it can answer correctly
      # without recalling anything, and in measured runs it did exactly that. The recall turn
      # runs on a fresh session with the memory tools and no reading tool at all, so a correct
      # answer can only have come through memory_recall. The offline embedding backend is used
      # deliberately — this job exists to exercise the MODEL, and a second live service would
      # only add a second way for it to fail for reasons that have nothing to do with AgentKit.

      - name: Run research-assistant against a live model
        if: steps.credentials.outputs.available == 'true'
        timeout-minutes: 25
        run: >
          dotnet run --no-build --configuration Release
          --project samples/research-assistant --
          --corpus samples/research-assistant/workspace
          --notes "${{ runner.temp }}/research-notes"
          --transcript "${{ runner.temp }}/research-transcript.txt"
          ${{ inputs.model && format('--model {0}', inputs.model) || '' }}
          --prompt "Plan a review of every document in the corpus and carry the plan out.
          Delegate the reading of 01-initial-spec.md to a child agent, and record what you learn."
          --prompt "Now read 02-field-revision.md and correct anything you recorded that it supersedes."
          --recall-question "What is the relief valve set to, and which document is your source for that?"

      # Asserts on the tool names the run actually emitted, not on the model's prose. Prose
      # varies between runs; a tool name does not. Each assertion below corresponds to a claim
      # the sample makes about itself, and a claim that cannot be checked is not asserted:
      # nothing here asserts WHICH correction tool was chosen, because the sample's own
      # instruction is the only lever on that and its adherence has not been measured.
      - name: Assert the agent planned, remembered and delegated
        if: steps.credentials.outputs.available == 'true'
        shell: bash
        run: |
          transcript="${{ runner.temp }}/research-transcript.txt"
          if [ ! -s "${transcript}" ]; then
            echo "::error::No tool calls were recorded; the agent used no tools at all."
            exit 1
          fi

          echo "Tool calls recorded:"
          sort "${transcript}" | uniq -c | sort -rn

          failed=0
          for tool in todo_set memory_file memory_recall agent_run; do
            if ! grep -qx "${tool}" "${transcript}"; then
              echo "::error::The agent never called ${tool}."
              failed=1
            fi
          done

          # A correction was asked for in the second turn, so exactly one of the two correction
          # tools must have been used. Which one is right depends on the source, and that is the
          # author's instruction rather than a guarantee, so both are accepted here and the
          # choice is reported for a human to read.
          if grep -qx "memory_revise" "${transcript}"; then
            echo "::notice::The correction was made with memory_revise (the instructed tool for a changed source)."
          elif grep -qx "memory_update" "${transcript}"; then
            echo "::warning::The correction was made with memory_update, which retains the original provenance."
          else
            echo "::error::The agent made no correction at all after being shown the superseding document."
            failed=1
          fi

          # The notes folder is the sample's only writable location, so an empty one means the
          # read-write half of the path policy was granted and never exercised. Three earlier
          # live runs left it empty; the instructions now require it, so this is now checkable.
          notes="${{ runner.temp }}/research-notes"
          if [ -z "$(ls -A "${notes}" 2>/dev/null)" ]; then
            echo "::error::The agent wrote nothing into its notes folder."
            failed=1
          else
            echo "Notes written:"
            ls -l "${notes}"
          fi

          exit "${failed}"

      # === DOCUMENT ASSISTANT ===
      # A far smaller check on the other consumption sample: that a composed tool set still
      # reaches a live model and produces an answer from a real file.

      - name: Run document-assistant against a live model
        if: steps.credentials.outputs.available == 'true'
        timeout-minutes: 10
        run: >
          dotnet run --no-build --configuration Release
          --project samples/document-assistant --
          --workspace samples/document-assistant/workspace
          --session "${{ runner.temp }}/document-session"
          ${{ inputs.model && format('--model {0}', inputs.model) || '' }}
          --prompt "Read welcome.txt and summarize it in one sentence."

      # === ARTIFACTS ===
      # The transcript and whatever the agent wrote are uploaded so a non-deterministic run can
      # be read after the fact, which is the only way to understand why one behaved differently
      # from another.

      - name: Upload live run artifacts
        if: always() && steps.credentials.outputs.available == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: live-samples
          path: |
            ${{ runner.temp }}/research-transcript.txt
            ${{ runner.temp }}/research-notes/
            ${{ runner.temp }}/document-session/
          if-no-files-found: warn

  live-copilot-suite:
    name: Live Copilot Suite (${{ matrix.runtime }})
    runs-on: ubuntu-latest

    strategy:
      # Each variant is evidence on its own; one failing must not hide the others' results.
      fail-fast: false
      matrix:
        runtime: [installed-minimum, installed-latest, bundled]

    env:
      # The same dedicated Copilot credential the samples job uses; the runtime reads it from the
      # environment when the client authenticates as the logged-in user.
      GH_TOKEN: ${{ secrets.COPILOT_GH_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # === CREDENTIAL CHECK ===
      # As in the samples job: an unconfigured repository gets a successful, explained no-op.

      - name: Check for credentials
        id: credentials
        shell: bash
        run: |
          if [ -z "${GH_TOKEN}" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No COPILOT_GH_TOKEN secret is configured; skipping the live Copilot suite."
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup dotnet
        if: steps.credentials.outputs.available == 'true'
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.x

      # Installs the standalone Copilot CLI release - the binary the install script and the
      # package managers install - verified against the release's published checksums, and puts it
      # on PATH, where AgentKit's discovery finds it exactly as on a user's machine. CLI_VERSION
      # empty means the latest release. The SDK starts the CLI with --no-auto-update, so the version
      # printed here is the version that runs.
      - name: Install the Copilot CLI
        if: steps.credentials.outputs.available == 'true' && matrix.runtime != 'bundled'
        shell: bash
        env:
          # Downloading a public release needs only the workflow's own token.
          GH_TOKEN: ${{ github.token }}
          CLI_VERSION: ${{ matrix.runtime == 'installed-minimum' && env.COPILOT_CLI_VERSION || '' }}
        run: |
          set -euo pipefail
          dir="${RUNNER_TEMP}/copilot-cli"
          mkdir -p "${dir}/download"
          tag=()
          if [ -n "${CLI_VERSION}" ]; then tag=("v${CLI_VERSION}"); fi
          gh release download "${tag[@]}" --repo github/copilot-cli \
            --pattern 'copilot-linux-x64.tar.gz' --pattern 'SHA256SUMS.txt' --dir "${dir}/download"
          (cd "${dir}/download" && sha256sum --check --ignore-missing SHA256SUMS.txt)
          tar -xzf "${dir}/download/copilot-linux-x64.tar.gz" -C "${dir}"
          chmod +x "${dir}/copilot"
          echo "${dir}" >> "${GITHUB_PATH}"
          "${dir}/copilot" --no-auto-update --version

      - name: Cache the bundled Copilot runtime
        if: steps.credentials.outputs.available == 'true' && matrix.runtime == 'bundled'
        uses: actions/cache@v6
        with:
          path: test/DemaConsulting.AgentKit.Agents.Copilot.LiveTests/obj/Release/net10.0/copilot-cli
          key: copilot-cli-live-${{ runner.os }}-${{ hashFiles('test/DemaConsulting.AgentKit.Agents.Copilot.LiveTests/*.csproj') }}

      # The installed variants build without the bundled runtime, proving they need none; the
      # bundled variant builds with it.
      - name: Build the live Copilot suite
        if: steps.credentials.outputs.available == 'true'
        run: >
          dotnet build
          test/DemaConsulting.AgentKit.Agents.Copilot.LiveTests
          --configuration Release
          ${{ matrix.runtime != 'bundled' && '--property:CopilotSkipCliDownload=true' || '' }}

      # === LIVE SUITE ===
      # Runs sequentially in one collection. AGENTKIT_COPILOT_LIVE_MODEL both opts the run in and
      # names the model; a cheap one is the default because the scenarios assert on the runtime's
      # events and metadata, not on the quality of the model's prose. AGENTKIT_COPILOT_LIVE_RUNTIME
      # selects the runtime source; the installed variants name no CLI path, so discovery finds the
      # CLI installed above on PATH, as it would on a user's machine.

      - name: Run the live Copilot suite
        if: steps.credentials.outputs.available == 'true'
        timeout-minutes: 30
        env:
          AGENTKIT_COPILOT_LIVE_MODEL: ${{ inputs.model || 'claude-haiku-5.5' }}
          AGENTKIT_COPILOT_LIVE_RUNTIME: ${{ matrix.runtime == 'bundled' && 'bundled' || 'installed' }}
          AGENTKIT_COPILOT_LIVE_LOG_DIRECTORY: ${{ github.workspace }}/artifacts/live
        run: >
          dotnet test
          --project test/DemaConsulting.AgentKit.Agents.Copilot.LiveTests
          --configuration Release
          --no-build
          --report-trx
          --results-directory artifacts/live

      # === ARTIFACTS ===
      # The TRX and the run's log are the verification evidence the live suite produces.

      - name: Upload live suite results
        if: always() && steps.credentials.outputs.available == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: live-copilot-suite-${{ matrix.runtime }}
          path: artifacts/live/
          if-no-files-found: warn
