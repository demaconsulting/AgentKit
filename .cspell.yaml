---
# Spell-Checking
#
# PURPOSE:
# - Maintain professional documentation and code quality
# - Catch spelling errors before publication
# - Support consistent technical terminology usage
# - Misspelled words should be fixed in the source
# - NEVER add a misspelled word to the 'words' list
# - PROPOSE only genuine technical terms/names as needed

version: "0.2"
language: en

# Project-specific technical terms and tool names
words:
  - apimark
  - docstats
  - inspectable
  - metacharacter
  - metacharacters
  - ordinally
  - pageable
  - pasteable
  - setext
  - unranged
  - upsert
  - upserts
  - wordcount
  - buildmark
  - DEMA
  - Dema
  - FileAssert
  - fileassert
  - GHCP
  - xunit
  - mklink
  - Pandoc
  - Qube
  - reqstream
  - reviewmark
  - Sarif
  - SARIF
  - sarifmark
  - sonarmark
  - svgz
  - sysml
  - ungranted
  - versionmark
  - Weasy
  - WeasyPrint
  - weasyprint
  - webp
  - netstandard
  - NTFS
  - APFS
  - Ollama
  - ONNX
  - qwen
  - nomic
  - postconditions
  - unserialized
  - yamlfix

# Exclude common build artifacts, dependencies, and vendored third-party code
ignorePaths:
  - "**/.git/**"
  - "**/node_modules/**"
  - "**/.venv/**"
  - "**/thirdparty/**"
  - "**/third-party/**"
  - "**/3rd-party/**"
  - "**/generated/**"
  - "**/AGENT_REPORT_*.md"
  - "**/.agent-logs/**"
  - "**/bin/**"
  - "**/obj/**"
  - package-lock.json
